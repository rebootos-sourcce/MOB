name: lookdev workbench acceptance
on:
  push:
    branches:
      - lookdev/p0-execution-20261014
    paths:
      - lookdev/workbench.html
      - .github/workflows/lookdev-workbench.yml
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lookdev/p0-execution-20261014
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright
        run: |
          npm install --prefix /tmp/lookdev-workbench-pw playwright@1.56.1
          /tmp/lookdev-workbench-pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Static integrity checks
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('lookdev/workbench.html','utf8');
          const ids=[...s.matchAll(/\\bid="([^"]+)"/g)].map(m=>m[1]);
          const dup=ids.filter((id,i)=>ids.indexOf(id)!==i);
          const areas=['Fonts / Typography','Logo / Wordmark','Colors','Icons','UI Elements','Copy Elements','Story','Taglines','Motion','Sound','Innovation'];
          if(dup.length) throw new Error('Duplicate IDs: '+[...new Set(dup)].join(', '));
          for(const area of areas) if(!s.includes('>'+area+'</button>')) throw new Error('Missing review area: '+area);
          if((s.match(/role="tab"[^>]*data-guide=/g)||[]).length!==11) throw new Error('Expected exactly 11 review tabs');
          if(!s.includes('lookahead:{activeArea:guideTitles[activeGuide]')) throw new Error('Review export payload missing');
          console.log(JSON.stringify({bytes:Buffer.byteLength(s),ids:ids.length,duplicateIds:0,reviewAreas:areas.length,exportPayload:true},null,2));
          NODE
      - name: Browser acceptance desktop and mobile
        env:
          NODE_PATH: /tmp/lookdev-workbench-pw/node_modules
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000},acceptDownloads:true});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            await page.goto('file://'+process.cwd()+'/lookdev/workbench.html',{waitUntil:'load'});
            await page.getByRole('tab',{name:'Colors'}).click();
            if(await page.locator('#guideHeading').innerText()!=='Colors') throw new Error('Colors tab did not activate');
            await page.locator('#reviewStatus').selectOption('approved');
            await page.locator('#reviewNote').fill('Browser acceptance note');
            await page.getByRole('tab',{name:'Motion'}).click();
            await page.getByRole('tab',{name:'Colors'}).click();
            if(await page.locator('#reviewStatus').inputValue()!=='approved') throw new Error('Review status did not persist across tabs');
            if(await page.locator('#reviewNote').inputValue()!=='Browser acceptance note') throw new Error('Review note did not persist across tabs');
            await page.locator('[data-color="#7de3e5"]').click();
            if(await page.locator('#accentName').innerText()!=='Cyan') throw new Error('Shared accent token did not update');
            await page.locator('#reduced').check();
            if(await page.locator('#motionLabel').innerText()!=='0.0×') throw new Error('Reduced-motion control did not apply');
            const downloadPromise=page.waitForEvent('download');
            await page.locator('#exportTop').click();
            const download=await downloadPromise; const path=await download.path();
            const payload=JSON.parse(fs.readFileSync(path,'utf8'));
            if(payload.lookahead.reviewAreas.length!==11) throw new Error('Export does not contain all 11 review areas');
            if(payload.lookahead.reviewAreas.find(x=>x.area==='Colors').status!=='approved') throw new Error('Export lost Colors review status');
            if(payload.lookahead.reviewAreas.find(x=>x.area==='Colors').note!=='Browser acceptance note') throw new Error('Export lost review note');
            await page.setViewportSize({width:390,height:844});
            await page.getByRole('tab',{name:'Innovation'}).click();
            if(await page.locator('#guideHeading').innerText()!=='Innovation') throw new Error('Mobile tab activation failed');
            const mobile=await page.evaluate(()=>({viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,tabCount:document.querySelectorAll('[data-guide]').length}));
            if(errors.length) throw new Error('Browser errors: '+errors.join('; '));
            if(mobile.tabCount!==11) throw new Error('Mobile tab count mismatch');
            console.log(JSON.stringify({desktop:'PASS',reviewStatePersistence:'PASS',sharedTokenControl:'PASS',reducedMotion:'PASS',jsonExport:'PASS',mobile:'PASS',mobileMetrics:mobile,pageErrors:errors},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
