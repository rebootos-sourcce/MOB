name: Import receipt source rebuild and regression
on:
  push:
    branches: [fix/architecture-import-receipt-20261126]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm install --no-audit --no-fund --no-save typescript@5.9.3
      - name: Build canonical products
        run: ./atuned_src/BUILD-engine.sh && ./atuned_src/BUILD.sh && ./funnel/BUILD-single.sh
      - name: Install pinned browser
        run: |
          npm install -g --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          root="$(npm root -g)"
          chrome="$(NODE_PATH="$root" node -e "console.log(require('playwright').chromium.executablePath())")"
          test -x "$chrome"
          echo "NODE_PATH=$root" >> "$GITHUB_ENV"
          echo "CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Required import security and receipt regressions
        run: |
          set -eo pipefail
          mkdir -p "$RUNNER_TEMP/gates"
          node tests/plan-selfgrant.js 2>&1 | tee "$RUNNER_TEMP/gates/plan-selfgrant.log"
          node tests/recordlink.js 2>&1 | tee "$RUNNER_TEMP/gates/recordlink.log"
          ATUNED_ALPHA_QUIZ_ONLY=1 node tests/golden.js 2>&1 | tee "$RUNNER_TEMP/gates/alpha-journey.log"
          node tools/floors.js plan-selfgrant recordlink alpha-journey
      - name: Publish only the verified candidate artifacts
        if: success() && github.ref == 'refs/heads/fix/architecture-import-receipt-20261126'
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/fix/architecture-import-receipt-20261126" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- engine.js source.html atuned-packed.html funnel/tokens.css funnel/dist/
          git rm .github/workflows/architecture-import-receipt-temp.yml
          git commit -m 'build: regenerate verified import receipt products'
          node tools/products.js --self-test && node tools/products.js
          git push origin HEAD:refs/heads/fix/architecture-import-receipt-20261126
