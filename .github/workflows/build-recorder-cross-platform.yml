name: Build MOB Recorder (macOS + Linux, verification only)

# Task #68: package.json declares mac (dmg + zip) and linux (AppImage + deb)
# build targets that have never actually been built once in CI — only the
# Windows portable EXE has a real, exercised pipeline. This workflow proves
# the other two targets actually build on real hosts; it does not publish a
# release (unsigned mac builds aren't notarized, and this repo has no
# Apple Developer credentials to sign with). See build-recorder.yml for the
# Windows build that does publish.

on:
  workflow_dispatch:
  push:
    branches: ['claude/quirky-pasteur-cpog96', 'main']
    paths: ['recorder/**', '.github/workflows/build-recorder-cross-platform.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist-script: dist:mac
            artifact-name: MOB-Recorder-macos
            artifact-glob: |
              recorder/dist/*.dmg
              recorder/dist/*.zip
          - os: ubuntu-latest
            dist-script: dist:linux
            artifact-name: MOB-Recorder-linux
            artifact-glob: |
              recorder/dist/*.AppImage
              recorder/dist/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recorder/package-lock.json

      - name: Install
        run: npm ci --no-fund

      - name: Lint
        run: npm run lint

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      # Task #71: this real macOS runner is what disproved the original
      # assumption here — ffmpeg-static's mac binary has NO VideoToolbox
      # encoders compiled in (a "Check ffmpeg has VideoToolbox compiled in"
      # step and two MOB_SMOKE_CODEC=h264_videotoolbox/hevc_videotoolbox
      # smoke runs used to live here, asserting the opposite; this run is
      # what caught that they were wrong). Real hardware encoding isn't
      # available through this app's actual ffmpeg dependency on macOS
      # today, so settings.js no longer defaults to it and there's nothing
      # VideoToolbox-specific left to verify here. Instead, prove the
      # degradation path a user with a stale h264_videotoolbox-codec
      # setting (e.g. from before this fix) would hit still produces a
      # valid recording via main.js's existing hardware-encoder-failed
      # fallback to libx264 — for real, on the same hardware that showed
      # the hardware path itself doesn't exist.
      - name: Smoke test falls back to libx264 when the requested codec is unavailable (macOS only)
        if: matrix.os == 'macos-latest'
        run: npm run smoke
        timeout-minutes: 3
        env:
          MOB_SMOKE_CODEC: h264_videotoolbox

      - name: Build (${{ matrix.dist-script }})
        run: npm run ${{ matrix.dist-script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 7
