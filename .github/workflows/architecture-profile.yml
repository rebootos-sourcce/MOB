name: Architecture baseline profiling
on:
  push:
    branches: [qa/architecture-performance-baseline-20261126]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned browser
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Measure committed products, no network from browser
        env:
          ARCHITECTURE_PROFILE_OUT: ${{ runner.temp }}/architecture-profile.json
        run: node tools/architecture-profile.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-profile
          path: ${{ runner.temp }}/architecture-profile.json
          if-no-files-found: warn
