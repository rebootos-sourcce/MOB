name: Hero Journey avatar validation
on:
  push:
    branches:
      - 'atunED/teachers-poles-ascent-alpha-2026-10-25'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the repository's pinned TypeScript toolchain
        run: npm ci --prefix atuned_funnel_system
      - name: Build host-free canonical engine
        run: sh ./atuned_src/BUILD-engine.sh
      - name: Check Hero Journey coordinates and milestones
        run: node tests/herojourney.js
      - name: Existing engine contract suite
        run: node tests/engine.js
      - name: Build complete app and its packaging
        run: PATH="$GITHUB_WORKSPACE/atuned_funnel_system/node_modules/.bin:$PATH" sh ./atuned_src/BUILD.sh
      - name: Verify the funnel's typed adapter suite
        run: npm test --prefix atuned_funnel_system
      - name: Install headless browser test runner
        run: |
          npm install --prefix atuned_funnel_system --no-save playwright
          ./atuned_funnel_system/node_modules/.bin/playwright install chromium
      - name: Exercise actual avatar in Chromium
        run: NODE_PATH="$GITHUB_WORKSPACE/atuned_funnel_system/node_modules" node tests/herojourney-ui.js
      - name: Confirm avatar modules exist in built product
        run: |
          grep -q 'function hjLocate' source.html
          grep -q 'function hjPanel' source.html
          grep -q 'function hjFigureHtml' source.html
          grep -q 'Hero' source.html
