name: One-shot isolated architecture candidate rebuild
on:
  push:
    branches: [integration/architecture-nine-p0-20261125]
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/integration/architecture-nine-p0-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm install --no-audit --no-fund --no-save typescript@5.9.3
      - name: Build canonical products from integrated source
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          ./atuned_src/BUILD-engine.sh && ./atuned_src/BUILD.sh && ./funnel/BUILD-single.sh
      - name: Commit tracked generated assets on candidate only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- engine.js source.html atuned-packed.html funnel/tokens.css funnel/dist/
          git rm -f .github/workflows/architecture-regen-temp.yml
          git commit -m 'build: regenerate combined architecture P0 products'
          node tools/products.js --self-test && node tools/products.js
          git push origin HEAD:refs/heads/integration/architecture-nine-p0-20261125
