name: Temporary version-correct assets for PR 226
on:
  push:
    branches: [fix/finalized-turn-draft-durability-2026-11-25]
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/fix/finalized-turn-draft-durability-2026-11-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm install --no-audit --no-fund --no-save typescript@5.9.3
      - name: Require complete history for build version
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          n="$(git rev-list --count HEAD)"
          test "$n" -gt 100
          echo "History-based build version: v$n"
      - run: ./atuned_src/BUILD-engine.sh && ./atuned_src/BUILD.sh && ./funnel/BUILD-single.sh
      - name: Commit canonical products and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- engine.js source.html atuned-packed.html funnel/tokens.css funnel/dist/
          git rm -f .github/workflows/atuned-regen-version-pr226-temp.yml
          git diff --cached --quiet && exit 1
          git commit -m 'build: restore history-based release version for PR 226'
          git push origin HEAD:refs/heads/fix/finalized-turn-draft-durability-2026-11-25
