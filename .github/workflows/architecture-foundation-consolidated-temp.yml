name: Architecture consolidated foundation verification
on:
  push:
    branches: [integration/architecture-foundation-consolidated-20261126]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          npm install --no-audit --no-fund --no-save typescript@5.9.3
          python3 -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Canonical build and required fast checks
        run: |
          set -euo pipefail
          ./atuned_src/BUILD-engine.sh && ./atuned_src/BUILD.sh && ./funnel/BUILD-single.sh
          mkdir -p "$RUNNER_TEMP/gates"
          node tools/records.js --gate 2>&1 | tee "$RUNNER_TEMP/gates/records.log"
          node tests/plan-selfgrant.js 2>&1 | tee "$RUNNER_TEMP/gates/plan-selfgrant.log"
          node tools/floors.js records plan-selfgrant
          python3 tools/workflow-lint.py && python3 tools/workflow-lint.py --self-test
          python3 .claude/skills/atuned-voice/check.py --objections
      - name: Commit candidate build artifacts only
        if: success() && github.ref == 'refs/heads/integration/architecture-foundation-consolidated-20261126'
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/integration/architecture-foundation-consolidated-20261126" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- engine.js source.html atuned-packed.html funnel/tokens.css funnel/dist/
          git rm .github/workflows/architecture-foundation-consolidated-temp.yml
          git commit -m 'build: regenerate consolidated foundation products'
          node tools/products.js --self-test && node tools/products.js
          git push origin HEAD:refs/heads/integration/architecture-foundation-consolidated-20261126
