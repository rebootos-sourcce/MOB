name: behavioral-score
on:
  pull_request:
    paths:
      - 'proto/sniffer/behavioral-catalog.json'
      - 'proto/sniffer/behavioral-score.js'
      - 'proto/sniffer/behavioral-score.test.js'
      - '.github/workflows/behavioral-score.yml'
  push:
    branches: [main]
    paths:
      - 'proto/sniffer/behavioral-catalog.json'
      - 'proto/sniffer/behavioral-score.js'
      - 'proto/sniffer/behavioral-score.test.js'
      - '.github/workflows/behavioral-score.yml'
permissions:
  contents: read
jobs:
  behavioral-score-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node proto/sniffer/behavioral-score.test.js
