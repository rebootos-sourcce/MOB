name: Build MOB Recorder (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['recorder-v*']
    branches: ['claude/quirky-pasteur-cpog96', 'main']
    paths: ['recorder/**', '.github/workflows/build-recorder.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recorder/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Build installer + portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version and tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "TAG=recorder-v$version-build${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: MOB-Recorder-windows
          path: |
            recorder/dist/*.exe
          if-no-files-found: error

      # The release is created empty first (a small, reliable API call), then
      # the ~100 MB EXEs are uploaded with explicit retries. Uploading them
      # through the release action has no retry and has failed mid-transfer.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MOB Recorder ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Windows 10/11 64-bit.

            **Download `MOB-Recorder-${{ steps.ver.outputs.version }}-portable.exe`** below and double-click it. No install needed.
            (`-setup.exe` is the installer version if you'd rather have a Start-menu entry.)

            The file is unsigned, so Windows SmartScreen will say "Windows protected your PC" the first time.
            Click **More info → Run anyway**.

      - name: Upload EXEs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          rc=0
          for f in dist/*.exe; do
            name=$(basename "$f")
            for attempt in 1 2 3 4; do
              echo "::group::Uploading $name (attempt $attempt)"
              if gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"; then
                echo "uploaded $name"
                echo "::endgroup::"
                break
              fi
              echo "attempt $attempt failed for $name"
              echo "::endgroup::"
              if [ "$attempt" -eq 4 ]; then
                echo "::error::gave up uploading $name"
                rc=1
              else
                sleep $((attempt * 15))
              fi
            done
          done
          exit $rc

      # A release with a missing or truncated download is worse than a failed
      # build, so assert the portable EXE is actually there at full size.
      - name: Verify download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "\(.name)\t\(.size)\t\(.state)"'
          local_size=$(stat -c%s dist/MOB-Recorder-*-portable.exe)
          remote_size=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name | endswith("-portable.exe")) | .size')
          echo "local=$local_size remote=$remote_size"
          if [ -z "$remote_size" ] || [ "$local_size" != "$remote_size" ]; then
            echo "::error::portable EXE missing or size mismatch on the release"
            exit 1
          fi
          echo "Download ready: https://github.com/$GITHUB_REPOSITORY/releases/latest"

      # Failed runs leave behind draft releases; clear them so the releases
      # page only shows real downloads.
      - name: Remove stale draft releases
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == true) | .id' | while read -r id; do
              echo "deleting draft release $id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
            done
