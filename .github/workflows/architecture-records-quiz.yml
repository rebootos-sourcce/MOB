name: Architecture records and partial-quiz verification
on:
  push:
    branches: [integration/architecture-nine-records-quiz-20261125]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify canonical records against the committed engine
        run: node tools/records.js --gate
      - name: Install pinned browser and build dependencies
        run: |
          npm install --no-audit --no-fund --no-save typescript@5.9.3
          npm install -g --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          root="$(npm root -g)"
          chrome="$(NODE_PATH="$root" node -e "console.log(require('playwright').chromium.executablePath())")"
          test -x "$chrome"
          echo "NODE_PATH=$root" >> "$GITHUB_ENV"
          echo "CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Rebuild and check products
        run: |
          ./atuned_src/BUILD-engine.sh && ./atuned_src/BUILD.sh && ./funnel/BUILD-single.sh
          node tools/products.js --self-test && node tools/products.js
      - name: Full funnel and incomplete-quiz regression
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p "$RUNNER_TEMP/gates"
          node tests/funnel.js 2>&1 | tee "$RUNNER_TEMP/gates/funnel.log"
          node tools/floors.js funnel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funnel-regression
          path: ${{ runner.temp }}/gates/
          if-no-files-found: warn
