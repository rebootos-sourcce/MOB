name: fetter-saboteur-evaluator
on:
  pull_request:
    paths:
      - 'proto/sniffer/bands.js'
      - 'proto/sniffer/behavioral-catalog.json'
      - 'proto/sniffer/fetter-saboteur-evaluator.js'
      - 'proto/sniffer/fetter-saboteur-evaluator.test.js'
      - 'proto/sniffer/fetter-saboteur-simulation.js'
      - 'proto/sniffer/fetter-saboteur-simulation.test.js'
      - '.github/workflows/fetter-saboteur-evaluator.yml'
  push:
    branches: [main]
    paths:
      - 'proto/sniffer/bands.js'
      - 'proto/sniffer/behavioral-catalog.json'
      - 'proto/sniffer/fetter-saboteur-evaluator.js'
      - 'proto/sniffer/fetter-saboteur-evaluator.test.js'
      - 'proto/sniffer/fetter-saboteur-simulation.js'
      - 'proto/sniffer/fetter-saboteur-simulation.test.js'
      - '.github/workflows/fetter-saboteur-evaluator.yml'
permissions:
  contents: read
jobs:
  evaluator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node proto/sniffer/fetter-saboteur-evaluator.test.js
      - run: node proto/sniffer/fetter-saboteur-simulation.test.js
