name: Temporary generated-assets repair for PR 225
# Branch-only, no secrets. Removes itself after committing the generated files.
on:
  push:
    branches: [fix/boot-fade-pending-clock-2026-11-25]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/fix/boot-fade-pending-clock-2026-11-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dependencies
        run: npm install --no-audit --no-fund --no-save typescript@5.9.3
      - name: Build canonical outputs
        run: ./atuned_src/BUILD-engine.sh && ./atuned_src/BUILD.sh && ./funnel/BUILD-single.sh
      - name: Commit generated outputs and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine.js source.html atuned-slim.html atuned-packed.html funnel/tokens.css funnel/dist/
          git rm -f .github/workflows/atuned-regen-pr225-temp.yml
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m 'build: regenerate canonical products for PR 225'
          git push origin HEAD:refs/heads/fix/boot-fade-pending-clock-2026-11-25
