name: Compass Unified Research Graph V1-V4
on:
  push:
    branches:
      - 'atuned/compass-foundation-closure-20261026'
  workflow_dispatch:
jobs:
  verify-unified-research-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V1 source-preserving 208-node graph and editor syntax
        run: node docs/data/compass/integration/v3/validate_unified_research_graph_v1.cjs
      - name: Fetch Deep Psyche branch for pinned-source verification (read-only)
        run: git fetch --no-tags --depth=1 origin atuned/deep-psyche-end-to-end-2026-10-26
      - name: Validate V2 357-node graph, all 187 Deep Psyche pairs and editor JavaScript
        run: node docs/data/compass/integration/v3/validate_unified_research_graph_v2.cjs
      - name: Validate V3 398-node graph, 861 edges, 26 scene routes and 39 teacher recipes
        run: node docs/data/compass/integration/v3/validate_unified_research_graph_v3.cjs
      - name: Validate V4 teacher record harmonization and 104 gameboard research analyses
        run: node docs/data/compass/integration/v4/validate_framework_research_harmonization_v4.cjs
      - name: Validate V3 shadow-law research overlay
        run: node docs/data/compass/integration/v2/validate_shadow_law_layer_evidence_v3.cjs
      - name: Verify baseline Compass foundation graph
        run: node docs/data/compass/integration/v1/validate_cross_layer.cjs
      - name: Verify all 26 scene release and ritual routes against actual existing engine functions
        run: node docs/data/compass/gameboard/v2/validate_gameboard_existing_routes_v2.cjs
      - name: Validate gameboard narrative and dynamic routing contract
        run: node docs/data/compass/gameboard/v1/validate_gameboard.cjs
      - name: Report static instance IDs and outstanding acceptance gates
        run: |
          node - <<'NODE'
          const g = require('./docs/data/compass/gameboard/v1/GAMEBOARD_MAP_V1.json');
          const releaseMissing = g.nodes.filter(x=>!x.releaseProtocolId).length;
          const ritualMissing = g.nodes.filter(x=>!x.becomingRitualId).length;
          const routes = require('./docs/data/compass/gameboard/v2/GAMEBOARD_EXISTING_RELEASE_RITUAL_BINDINGS_V2.json');
          console.log(JSON.stringify({scenes:g.nodes.length,dynamicReleaseEntrypoints:routes.stats.routedReleaseEntrypoints,dynamicRitualEntrypoints:routes.stats.routedBecomingEntrypoints,fixedProtocolInstancesNotPreallocated:releaseMissing,fixedRitualInstancesNotPreallocated:ritualMissing,browserEndToEndAcceptance:'NOT_CERTIFIED'},null,2));
          NODE
