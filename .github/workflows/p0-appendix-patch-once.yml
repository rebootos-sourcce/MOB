name: one-time P0 appendix patch (draft branch only)
on:
  push:
    branches:
      - lookdev/p0-execution-20261014
    paths:
      - .github/workflows/p0-appendix-patch-once.yml
      - lookdev/patch_appendix_navigation.mjs
      - lookdev/test_appendix_navigation.cjs
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[run-appendix-patcher]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lookdev/p0-execution-20261014
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install isolated Playwright runtime
        run: |
          npm install --prefix /tmp/lookdev-pw playwright@1.56.1
          /tmp/lookdev-pw/node_modules/.bin/playwright install --with-deps chromium
      - name: print bounded navigation event source diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines = Path("index.html").read_text(encoding="utf-8").splitlines()
          pats = re.compile(r"addEventListener\s*\(|data-target|scrollIntoView|scrollTo\s*\(|href\s*\^=|closest\s*\(|preventDefault\s*\(" , re.I)
          hits = [i for i, line in enumerate(lines) if pats.search(line)]
          shown = set()
          for i in hits:
              if not any(term in lines[i].lower() for term in ("click", "data-target", "scrollintoview", "scrollto", "href", "preventdefault", "closest")):
                  continue
              for j in range(max(0, i-2), min(len(lines), i+4)):
                  if j not in shown:
                      print(f"{j+1}: {lines[j][:600]}")
                      shown.add(j)
              print("---")
              if len(shown) >= 220:
                  break
          PY
      - name: apply guarded appendix patch and validate static targets
        run: |
          node lookdev/patch_appendix_navigation.mjs --apply
          node lookdev/patch_appendix_navigation.mjs --check
      - name: run appendix navigation browser acceptance at desktop and mobile
        env:
          NODE_PATH: /tmp/lookdev-pw/node_modules
        run: node lookdev/test_appendix_navigation.cjs
      - name: upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appendix-navigation-browser-proof
          path: lookdev-ci-artifacts/
          if-no-files-found: warn
      - name: commit only canonical source edit to draft branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          if git diff --cached --quiet; then
            echo "Guarded patch produced no source diff."
            exit 0
          fi
          git commit -m "fix: make appendix navigation targets unique"
          git push origin HEAD:refs/heads/lookdev/p0-execution-20261014
