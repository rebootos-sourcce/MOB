name: Deep Psyche Runtime Graph
on:
  push:
    branches:
      - 'atuned/deep-psyche-end-to-end-2026-10-26'
  pull_request:
    paths:
      - 'docs/data/ATUNED_DEEP_PSYCHOLOGICAL_RECORD_REGISTRY_v1.json'
      - 'proto/knowledge/src/**'
      - 'tests/deep-psyche-runtime.js'
      - '.github/workflows/deep-psyche-runtime.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate knowledge graph from current engine and Deep Psyche registry
        run: node proto/knowledge/src/gen-data.js
      - name: Existing knowledge template and link validation
        run: node proto/knowledge/src/validate-templates.js
      - name: Deep Psyche 147-record runtime integration and nerve traversal
        run: node tests/deep-psyche-runtime.js
      - name: Strict Deep Psyche completion audit (records unresolved gaps without failing job)
        if: always()
        run: node proto/knowledge/src/audit-deep-psychological-closure.js > deep-psyche-audit.json
      - name: Preserve audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-psyche-graph-audit
          path: deep-psyche-audit.json
