name: Voice audiobook feature-branch regeneration
on:
  push:
    branches:
      - feature/atuned-marin-listen-release-20261128
    paths:
      - .github/workflows/voice-regen-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/feature/atuned-marin-listen-release-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: npm install --no-audit --no-fund --no-save typescript@5.9.3
      - name: Rebuild from canonical MANIFEST source
        run: |
          set -euo pipefail
          ./atuned_src/BUILD-engine.sh
          ./atuned_src/BUILD.sh
          ./funnel/BUILD-single.sh
      - name: Commit derived outputs to draft branch only
        run: |
          set -euo pipefail
          git add -u -- engine.js source.html atuned-packed.html funnel/tokens.css funnel/dist
          if git diff --cached --quiet; then echo 'No generated output changed.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate audiobook short-line-safe app products'
          git push origin HEAD:feature/atuned-marin-listen-release-20261128
      - name: Verify generated product consistency after committing outputs
        run: node tools/products.js
