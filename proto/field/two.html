<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atmosphere</title>
<style>
:root{
 --bg:#0C0D12; --panel:#13151C; --panel-2:#181A22; --edge:#23262F;
 --ink:#EFEDE8; --dim:#94908A; --accent:#7EB8D4; --alarm:#FF2E1F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
 font:400 15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
 -webkit-font-smoothing:antialiased}
.wrap{max-width:1560px;margin:0 auto;padding:24px 16px 56px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:none;
 color:var(--dim);font-weight:600}
h1{font:600 26px/1.2 Inter,system-ui,sans-serif;margin:6px 0 2px;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13.5px;margin:0 0 20px;max-width:74ch}
.cols{display:grid;grid-template-columns:1fr 316px;gap:20px;align-items:start}
.stagewrap{min-width:0}
/* the focus control. it sets which layer is SHARP, it never removes a layer. */
.focus{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.focus button{appearance:none;background:var(--panel);color:var(--dim);
 border:1px solid var(--edge);border-radius:8px;
 min-height:44px;padding:0 15px;font:500 13px/1 Inter,system-ui,sans-serif;
 cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.focus button:hover{color:var(--ink);border-color:#31353f}
.focus button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);
 box-shadow:inset 0 0 0 1px var(--accent)}
.focus button svg{width:18px;height:18px;fill:none;stroke:currentColor;
 stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;aspect-ratio:1/1;width:100%;
 max-width:min(940px, calc(100vh - 330px));
 margin:0 auto;border-radius:14px;overflow:hidden;background:#0A0B10}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#far{filter:none;opacity:.9}
/* the caption rail. this is where the nine on canvas pills went. */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
 gap:1px;background:var(--edge);border:1px solid var(--edge);border-radius:10px;
 overflow:hidden;margin:14px 0 0}
.rings>div{background:var(--panel);padding:10px 12px}
.rings b{display:block;font:600 11px/1.3 Inter,system-ui,sans-serif;
 letter-spacing:.11em;text-transform:none;color:var(--dim);margin-bottom:4px}
.rings span{font-size:13px;font-variant-numeric:tabular-nums}
.rings em{font-style:normal;display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.rings>div[data-sharp="1"]{background:var(--panel-2);box-shadow:inset 2px 0 0 var(--accent)}
.rail{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;
 padding:12px 13px}
.card>b{display:block;font:600 11px/1.3 Inter,system-ui,sans-serif;
 letter-spacing:.12em;text-transform:none;color:var(--dim);margin-bottom:9px}
.q{display:flex;align-items:center;gap:10px;padding:5px 0}
.q .cr{position:relative;width:38px;height:38px;flex:0 0 38px}
.q .cr svg{position:absolute;inset:0}
.q .cr .gl{position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;font:600 11px/1 Inter,system-ui,sans-serif;letter-spacing:.04em}
.q .cr .gl svg{position:static;width:17px;height:17px;fill:none;
 stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.q .t{min-width:0}
.q .t i{font-style:normal;display:block;font-size:13.5px}
.q .t em{font-style:normal;display:block;color:var(--dim);font-size:11.5px}
.focusline{font-size:12.5px;color:var(--dim);line-height:1.5}
.focusline b{color:var(--ink);font-weight:600}
.lead{font-size:13px;line-height:1.5}
.lead b{display:block;font-size:14px;margin-bottom:2px}
.lead span{color:var(--dim)}
.plist{margin:0;padding:0;list-style:none;font-size:12.5px}
.plist li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:4px 0;
 border-top:1px solid var(--edge)}
.plist li:first-child{border-top:0}
.plist li span{color:var(--dim);font-variant-numeric:tabular-nums}
.foot{margin:26px 0 0;color:var(--dim);font-size:12px;line-height:1.7;
 border-top:1px solid var(--edge);padding-top:16px}
.foot code{font:400 11.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
 color:var(--ink);background:var(--panel-2);padding:1px 5px;border-radius:4px}
@media (max-width:1040px){
 .cols{grid-template-columns:1fr}
}
@media (max-width:640px){
 .wrap{padding:18px 16px 44px}
 h1{font-size:22px}
 .focus button{padding:0 12px;font-size:12.5px}
 .rings{grid-template-columns:1fr 1fr}
}
</style></head><body>
<div class="wrap">

 <h1>Atmosphere</h1>
 <p class="sub">The wheel that ships today, with two changes. Nothing is hidden
  to isolate a layer: the layer in focus is sharp and the rest go to distance,
  so depth does the work a toggle was doing. And every word comes off the
  drawing into the rail under it.</p>

   </div>

 g.lineWidth=Math.max(1.2,cr0*.05);
 g.strokeStyle=rgba(mixc(gc,[0,0,0],.45),a*.9);g.stroke();
 var sh=g.createRadialGradient(CX-cr0*.3,CY-cr0*.42,cr0*.04,CX-cr0*.1,CY-cr0*.15,cr0*.95);
 sh.addColorStop(0,rgba(mixc(gc,[255,255,255],.4),a*.45));
 sh.addColorStop(.55,rgba(gc,0));
 g.fillStyle=sh;g.beginPath();g.arc(CX,CY,cr0,0,TAU);g.fill();
 g.beginPath();g.arc(CX-cr0*.3,CY-cr0*.36,cr0*.24,0,TAU);
 g.fillStyle='rgba(255,255,252,'+(lerp(.28,.85,coh)*a).toFixed(2)+')';g.fill();
 return cr0;}

/* ---- 8. THE LEAD LINE. one focus, and it runs OUTSIDE the last ring so the
   word it points at is off the drawing. ---- */
function drawLead(a){
 var ang=HEAVY[4], col=bc(HEAVY[2]);
 var r0=R.shell*1.035+SEAT.filter(function(s){return s.b===HEAVY[2];})[0].load/10*(U*.20)+4;
 var r1=U*0.975;
 g.beginPath();
 g.moveTo(CX+Math.cos(ang)*r0,CY+Math.sin(ang)*r0);
 g.lineTo(CX+Math.cos(ang)*r1,CY+Math.sin(ang)*r1);
 g.strokeStyle=rgba(mixc(col,[255,255,255],.35),a*.9);
 g.lineWidth=1.4;g.stroke();
 g.beginPath();g.arc(CX+Math.cos(ang)*r1,CY+Math.sin(ang)*r1,4.5,0,TAU);
 g.strokeStyle=rgba(mixc(col,[255,255,255],.45),a);g.lineWidth=1.8;g.stroke();}

/* ============================================================
   THE PASS. Two contexts. Everything not in focus is drawn to the half
   resolution canvas and scaled up, which is the distance. The layer in focus
   is drawn sharp on top.
   ============================================================ */
var FRAMES=[], LASTMS=0, ENTER0=performance.now();
function enterFor(b){
 if(REDUCED)return 1;
 var i=BANDS.indexOf(b); if(i<0)i=0;
 var e=performance.now()-ENTER0-i*62;
 if(e<=0)return 0; if(e>=380)return 1;
 var k=e/380; return 1-Math.pow(1-k,3);}

function sharpness(layer){return FOCUS===layer?1:0;}
function frame(){
 var t0=performance.now();
 var t=REDUCED?0:(t0-T0)/1000;
 geom();
 /* --- the far pass. half resolution, everything out of focus. --- */
 g=fg;
 fg.setTransform(DPR*FAR,0,0,DPR*FAR,0,0);
 fg.clearRect(0,0,CW,CH);
 g.save();g.globalAlpha=0.44;drawWash(t*0.09);g.restore();
 if(!sharpness('chains'))    drawChains(0.62);
 if(!sharpness('patterns'))  drawBeads(0.55);
 if(!sharpness('charge'))  { drawShell(0.55,enterFor); }
 if(!sharpness('seats'))     drawSeats(0.50);
 /* --- the near pass. full resolution, the layer in focus, plus the core and
    the gates, which belong to the instrument at every focus. --- */
 g=ng;
 ng.setTransform(DPR,0,0,DPR,0,0);
 ng.clearRect(0,0,CW,CH);
 if(sharpness('chains'))    drawChains(1);
 if(sharpness('patterns')) {drawChains(0.18);drawBeads(1);}
 if(sharpness('charge'))     drawShell(1,enterFor);
 if(sharpness('seats'))      drawSeats(1);
 var cr0=drawCore(t,1);
 drawGates(cr0,1);
 if(sharpness('charge')||sharpness('seats'))drawLead(1);
 var ms=performance.now()-t0;
 FRAMES.push(ms); if(FRAMES.length>120)FRAMES.shift();
 LASTMS=ms;
 window.__FRAME_MS=FRAMES.slice();
 requestAnimationFrame(frame);}

/* ---- the focus control ---- */
function svgi(d){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+d+'"/></svg>';}
function drawFocus(){
 document.getElementById('focus').innerHTML=LAYERS.map(function(l){
  return '<button type="button" data-k="'+l.k+'" aria-pressed="'
   +(FOCUS===l.k?'true':'false')+'" title="'+l.d+'">'+svgi(l.ic)+l.nm+'</button>';}).join('');
 document.getElementById('focus').querySelectorAll('button').forEach(function(b){
  b.addEventListener('click',function(){FOCUS=b.dataset.k;drawFocus();drawRings();});});}

/* ---- the caption rail. the nine on canvas pills live here now. ---- */
var RINGDEF=[
 {k:'charge',  nm:'Addresses',  v:function(){return F.nL+' of 112 above the line';},
  e:function(){return F.nC+' of 112 carry something';}},
 {k:'patterns',nm:'Saboteurs',  v:function(){return F.sabs.length+' of 33 named';},
  e:function(){return 'plus the inferred clusters';}},
 {k:'chains',  nm:'Complexes',  v:function(){return F.cxs.length+' pairs';},
  e:function(){return 'two saboteurs in one family';}},
 {k:'chains',  nm:'Hyper',      v:function(){return F.hys.length+' of 16 families';},
  e:function(){return F.hys.length?F.hys[0][0]:'none formed';}},
 {k:'chains',  nm:'Character',  v:function(){return F.sups.length+' formed';},
  e:function(){return 'two hyper complexes, weight 5.6 of 10';}},
 {k:'seats',   nm:'Seats',      v:function(){return '7 of 7';},
  e:function(){return F.darkB+' carries most';}},
 {k:'charge',  nm:'Gates',      v:function(){return '6, all unread';},
  e:function(){return 'no story committed';}}];
function drawRings(){
 document.getElementById('rings').innerHTML=RINGDEF.map(function(r){
  return '<div data-sharp="'+(FOCUS===r.k?1:0)+'"><b>'+r.nm+'</b>'
   +'<span>'+r.v()+'</span><em>'+r.e()+'</em></div>';}).join('');}

/* ---- the right rail ---- */
function crEl(letters,pct,col,raw){
 var r=15.5,C2=TAU*r,off=C2*(1-clamp(pct,0,100)/100);
 return '<div class="q"><span class="cr" style="color:'+col+'">'
  +'<svg width="38" height="38" aria-hidden="true">'
  +'<circle cx="19" cy="19" r="'+r+'" fill="none" stroke="rgba(128,128,128,.22)" stroke-width="3"/>'
  +'<circle cx="19" cy="19" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="3" '
  +'stroke-linecap="round" stroke-dasharray="'+C2.toFixed(1)+'" '
  +'stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'
  +'<span class="gl">'+letters+'</span></span>'
  +'<span class="t"><i>'+raw+'</i><em>'+arguments[4]+'</em></span></div>';}
function drawRail(){
 var gc=cqRamp(F.CQ), gcs='rgb('+gc.join(',')+')';
 var lead=F.sabs[0];
 document.getElementById('rail').innerHTML=
 '<div class="card"><b>The three quotients</b>'
 +crEl('CQ',F.CQ,gcs,F.CQ.toFixed(1)+' of 100','coherence')
 +crEl('DQ',F.DQ/10.8*100,PAL[F.darkB],F.DQ.toFixed(2)+' of 10.8 possible here','shadow weight')
 +crEl('SQ',F.SQm*10,PAL.Solar,F.SQm.toFixed(2)+' of 10','mean charge above the line')
 +'</div>'
 +'<div class="card"><b>In focus</b><div class="focusline" id="fl"></div></div>'
 +'<div class="card"><b>The one address</b><div class="lead">'
 +'<b>'+HEAVY[1]+'</b><span>'+HEAVY[2]+' seat, SQ '+HEAVY[5].toFixed(2)+' of 10. '
 +'The lead line on the drawing points here.</span></div></div>'
 +'<div class="card"><b>Heaviest patterns</b><ul class="plist">'
 +F.sabs.slice(0,7).map(function(s){
   return '<li>'+s[0]+'<span>'+s[1].toFixed(2)+' of 10</span></li>';}).join('')
 +'</ul></div>'
 +'<div class="card"><b>The six gates</b><ul class="plist">'
 +F.gates.map(function(v){
   return '<li>'+v[1]+'<span>'+(v[3]>0?v[3]+'% of the story':'no story read')
    +'</span></li>';}).join('')
 +'</ul></div>'
 +'<div class="card"><b>Frame cost</b><div class="focusline" id="fps">measuring</div></div>';
 syncFocusLine();}
function syncFocusLine(){
 var l=LAYERS.filter(function(x){return x.k===FOCUS;})[0];
 var el=document.getElementById('fl');
 if(el)el.innerHTML='<b>'+l.nm+'.</b> '+l.d
  +' The other three layers are still drawn, at half resolution and lower '
  +'contrast, so the circuit stays whole.';}
var _df=drawFocus;
drawFocus=function(){_df();syncFocusLine();};

size();geom();drawFocus();drawRings();drawRail();
window.addEventListener('resize',function(){size();});
requestAnimationFrame(frame);
setInterval(function(){
 var el=document.getElementById('fps'); if(!el||!FRAMES.length)return;
 var s=FRAMES.slice().sort(function(a,b){return a-b;});
 el.innerHTML='<b>'+s[Math.floor(s.length*0.5)].toFixed(1)+' ms</b> median, '
  +s[Math.floor(s.length*0.95)].toFixed(1)+' ms at the 95th, over '
  +FRAMES.length+' frames at '+CW+' by '+CH+'.';},600);

document.getElementById('foot').innerHTML=
 'Profile <code>'+F.who+', '+F.age+', '+F.role+'</code>, computed headless from '
 +'<code>engine.js</code>. Coherence '+F.CQ.toFixed(1)+' of 100, '+F.nL
 +' of 112 addresses above the display line, '+F.sabs.length+' saboteurs, '
 +F.cxs.length+' complexes, '+F.hys.length+' hyper complex. '
 +'Chord width is the pattern weight and chord sag is susceptibility, which '
 +'runs 0.45 to 1.30 and is the one quantity in the geometry that varies per '
 +'connection. No text is drawn on the canvas.';
</script></body></html>
