/* SEAT COLOUR AS TEXT IS LIFTED, AND ONLY AS TEXT. Measured: the product's own
   Root, #D6524C, is 4.14 to 1 as small text on --panel and 4.28 as a journal
   mark. A twelve percent lift toward white holds every seat over 4.5. Rings,
   bars and spokes keep the token as it is. */
*{--ct:color-mix(in srgb,var(--c,#7EB8D4) 88%,#fff)}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font:400 14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---- the proposal frame, which is not part of any design ---- */
.proto{position:sticky;top:0;z-index:30;background:var(--proto);color:#16130A;font-weight:600;
 font-size:13px;padding:6px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proto span{font-weight:500;opacity:.85}
.mk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px 4px;max-width:1600px;margin:0 auto}
.mk .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mk .lbl{font-size:12.5px;color:var(--dim);margin-right:2px}
.mk button{font-size:13px;background:#171920;border:1px solid var(--edge-2);border-radius:999px;
 padding:0 14px;min-height:44px;cursor:pointer;color:var(--mid)}
.mk button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:#1B2229}
.mk button b{font-weight:600;color:var(--ink);margin-right:6px}
.mk .sp{flex:1 1 auto}
.mkidea{max-width:1600px;margin:0 auto;padding:4px 16px 0;color:var(--mid);font-size:13.5px}
.mkidea b{color:var(--ink);font-weight:600}

/* ---- the page ---- */
.app{display:grid;gap:16px;padding:12px 16px 20px;max-width:1600px;margin:0 auto;
 grid-template-columns:minmax(0,1fr) 430px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
#colm{display:none}
body[data-v="d"] .app{grid-template-columns:minmax(0,1fr) 372px 372px}
body[data-v="d"] #colm{display:flex}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r-m);padding:16px 18px;position:relative}
.eb{font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.01em}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:24px}
.tag{font-size:12px;color:var(--dim)}
.ring{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.6px solid var(--c,var(--accent));flex:0 0 auto}

/* ---- the pips, the rung drawn and never printed. Shipped shape. ---- */
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:5px;height:12px;border-radius:1px;border:1px solid var(--edge-2);transition:background .28s var(--ease-out),border-color .28s}
.pips i.ask{border-color:var(--c)}
.pips i.on{background:var(--c);border-color:var(--c)}

/* ---- prompt engine ---- */
.pe .pe-q{font-size:22px;line-height:1.32;font-weight:500;margin:8px 0 4px;color:var(--ink);max-width:40ch}
.pe .pe-q.quiet{font-size:15px;font-weight:400;color:var(--dim)}
.pe .pe-jog{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.pe .pe-jog li{font-size:14px;color:var(--mid);border:1px solid var(--edge-2);border-radius:999px;padding:6px 12px}
.pe .pe-note{font-size:13px;color:var(--dim);margin:4px 0 0}
.pe .pe-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.pe .pe-gauge{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.pe .pe-gauge .sn{color:var(--ct);font-weight:600}
.btn{background:var(--panel-2);border:1px solid var(--edge-2);border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer;font-size:14px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}

/* ---- journal ---- */
.jr .ed{position:relative;display:flex;min-height:300px;font-family:var(--sans);font-size:16px;line-height:1.75;font-weight:300}
.jr .ta,.jr .hl{flex:1 1 auto;min-height:300px;border:1px solid transparent;border-radius:var(--r-s);padding:18px 20px;
 font:inherit;letter-spacing:normal;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;margin:0}
.jr .hl{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:var(--sunk);border-color:var(--edge);color:var(--ink);z-index:0}
.jr .ta{position:relative;z-index:1;resize:none;background:transparent;color:transparent;caret-color:var(--ink);outline:none;overflow:auto;width:100%}
.jr .ta::placeholder{color:var(--dim)}
.jr .ta::selection{background:color-mix(in srgb,var(--accent) 34%,transparent)}
.jr .ed:focus-within .hl{border-color:var(--accent)}
/* A MARK NEVER CHANGES WEIGHT. The shipped mark is 600 on a 300 layer while
   the caret belongs to the 300 textarea above it: measured 12.8px of drift
   after five marks on one line. Colour, tint and a rule carry it here. */
.jr mark{color:var(--ct);background:color-mix(in srgb,var(--c) 15%,transparent);border-radius:3px;font-weight:inherit}
.jr mark.neg{background:none;color:var(--dim);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--c) 70%,transparent)}
.jr mark.coh{--c:var(--accent)}
.jr mark.new{animation:mk-in .6s var(--ease-out)}
@keyframes mk-in{from{background:color-mix(in srgb,var(--c) 55%,transparent)}}
.jr .bar{display:flex;align-items:center;gap:10px;margin-top:12px}
.jr .ct{font-size:13px;color:var(--dim);flex:1 1 auto}

/* ---- summary ---- */
.sm .sm-rows{margin-top:6px}
.sm .sm-row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--edge)}
.sm .sm-seat{font-size:13px;font-weight:600;color:var(--ct)}
.sm .sm-words{font-size:14px;line-height:1.45}
.sm .sm-words q{quotes:"\201C" "\201D"}
.sm .sm-er{display:block;font-size:12.5px;color:var(--dim)}
.sm .sm-route{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.sm .sm-route div{border-top:2px solid var(--c,var(--edge-2));padding-top:6px}
.sm .sm-route .eb{display:block}
.sm .sm-route b{font-weight:500;font-size:14px;color:var(--ct)}
.sm .sm-none{color:var(--dim);font-size:13.5px;margin:6px 0 0}

/* ---- imprints and the perceiving stage ---- */
.im .stage{position:relative;margin:10px -6px 0;border-radius:var(--r-s);background:var(--stage);overflow:hidden}
.im canvas{display:block;width:100%}
.im .strm{display:flex;flex-wrap:wrap;gap:4px 5px;margin:10px 0 0;min-height:24px;font-size:13px;line-height:1.35}
.im .strm span{color:var(--dim);transition:color .3s}
.im .strm span.hit{color:var(--ct);font-weight:500}
.im .strm span.neg{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--c)}
.im .strm span.mod{color:var(--mid);font-style:italic}
.im .strm span.mod sup{font-size:11px;font-style:normal;color:var(--dim)}
.im .strm span.coh{color:var(--accent)}
.im .strm span.last{border-bottom:1px solid var(--edge-2)}
.im .ctr{font-size:12.5px;color:var(--dim);margin-top:6px}
.im .grp{margin-top:12px}
.im .ghd{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;border-bottom:1px solid var(--edge);padding-bottom:4px}
.im .ghd b{color:var(--ct);font-weight:600}
.im .ghd em{font-style:normal;color:var(--dim)}
.im .ghd em.warn{color:var(--mid)}
.im .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.im .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:999px;
 padding:5px 11px 5px 8px;font-size:13.5px;min-height:32px}
.im .pill.inf{border-style:dashed}
.im .pill small{color:var(--mid);font-size:12px}
.im .pill.new{animation:pl-in .5s var(--ease-land)}
@keyframes pl-in{from{transform:scale(.6);opacity:0}}
#pv.alone .pv-hd{display:flex}
.pv-hd{display:none}

/* ---- the flight: a scored word travelling from the sentence to its seat ---- */
.flt{position:fixed;left:0;top:0;z-index:40;pointer-events:none;font:500 13px/1 var(--sans);color:var(--ct);
 background:color-mix(in srgb,var(--c) 18%,#0C0D12);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);
 border-radius:999px;padding:4px 8px;white-space:nowrap;will-change:transform,opacity}

/* ---- release, the shared skeleton. Each mockup restyles it wholly. ---- */
.rl{overflow:visible}
.rl .rl-hd{display:flex;align-items:center;gap:9px}
.rl .rl-hd h3{margin:0;font-size:17px;font-weight:600}
.rl .rl-lead{font-size:13.5px;color:var(--mid);margin:6px 0 0;max-width:46ch}
.rl .rl-opts{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.rl .rl-opt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rl .rl-opt .eb{width:72px}
.rl .seg{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--edge-2);background:transparent;cursor:pointer;font-size:13px;color:var(--mid)}
.rl .seg[aria-pressed="true"]{border-color:var(--rl-hi,var(--accent));color:var(--ink)}
.rl .rl-q{list-style:none;margin:14px 0 0;padding:0}
.rl .rq{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--edge)}
.rl .rq .nm{font-size:14.5px;font-weight:500}
.rl .rq .wt{font-size:13px;color:var(--mid);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rl .rq .wt b{color:var(--ink);font-weight:600}
.rl .rq .sub{grid-column:2/4;font-size:12.5px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.rl .rq .br{grid-column:2/4;height:5px;border-radius:3px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.rl .rq .br i{position:absolute;top:0;bottom:0;left:0;background:var(--c);border-radius:3px}
.rl .rq .br i.cut{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 5px);opacity:.9}
.rl .rq.new{animation:pl-in .5s var(--ease-land)}
.rl .rl-first{margin-top:12px;font-size:14px;line-height:1.5}
.rl .rl-first q{display:block;margin-top:3px;color:var(--ink);quotes:"\201C" "\201D"}
.rl .rl-cost{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 0}
.rl .rl-cost div{display:flex;flex-direction:column}
.rl .rl-cost b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.rl .rl-cost b small{font-size:12.5px;font-weight:400;color:var(--mid);margin-left:3px}
.rl .rl-go{width:100%;margin-top:14px;min-height:52px;border-radius:12px;border:0;cursor:pointer;font-size:16px;font-weight:600;
 background:var(--rl-go,var(--accent));color:var(--rl-on,var(--on-accent))}
.rl .rl-go:disabled{opacity:.4;cursor:default}
.rl .rl-none{color:var(--dim);font-size:13.5px;margin:12px 0 0}
.rl .rl-run{margin-top:10px}
.rl .rl-run .nd{font-size:22px;font-weight:600;color:var(--ct)}
.rl .rl-run .ch{font-size:12.5px;color:var(--dim)}
.rl .rl-run .ln{font-size:16px;line-height:1.5;margin:10px 0}
.rl .rl-run .pg{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.rl .rl-run .pg i{display:block;height:100%;background:var(--c);transition:width .4s var(--ease-out)}
.rl .rl-art{position:absolute;pointer-events:none}

/* ============================================================
   A. THE LISTENING RING. The Field, small, reading one entry.
   ============================================================ */
body[data-v="a"] .pe{background:transparent;border:0;border-top:1px solid var(--edge-2);border-radius:0;padding:14px 2px 4px}
body[data-v="a"] .pe .pe-q{font-size:24px}
body[data-v="a"] .jr{background:transparent;border:0;padding:0}
body[data-v="a"] .jr .hl{background:var(--sunk);border-color:transparent;box-shadow:inset 0 1px 0 rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04)}
body[data-v="a"] .jr .ed{font-size:17px}
body[data-v="a"] .jr mark{background:none;box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c) 75%,transparent);border-radius:0}
body[data-v="a"] .jr mark.neg{box-shadow:none}
body[data-v="a"] .sm{background:var(--panel-2);border-color:transparent}
body[data-v="a"] .im{background:var(--panel)}
/* the release sits on the Field's own stage with the Field's shells round it */
body[data-v="a"] .rl{background:var(--stage);border:0;margin:26px 22px 22px;box-shadow:0 0 0 1px rgba(255,255,255,.05)}
body[data-v="a"] .rl .rl-art{inset:-24px}
body[data-v="a"] .rl .rq{border-top-color:rgba(255,255,255,.06)}

/* ============================================================
   B. THE ROUTE. The Field's dashed trajectory, drawn through the body.
   ============================================================ */
body[data-v="b"] .pe{background:var(--panel-2);border-color:transparent;border-radius:var(--r-m) var(--r-m) 4px 4px;margin-bottom:-12px;padding-bottom:18px}
body[data-v="b"] .pe .pe-q{font-size:21px}
body[data-v="b"] .jr{border-radius:4px 4px var(--r-m) var(--r-m);background:var(--stage);border-color:rgba(255,255,255,.06)}
body[data-v="b"] .jr .hl{background:var(--stage);border-color:transparent}
body[data-v="b"] .jr .ed:focus-within .hl{border-color:transparent;box-shadow:inset 3px 0 0 var(--accent)}
body[data-v="b"] .sm{background:transparent;border:1px dashed var(--edge-2)}
body[data-v="b"] .rl{border:0;--glow:var(--accent);
 /* two lights. A strong one in the top 90px, where only the heading sits and
    its ink measures 7.18 to 1 on forty percent of the seat colour. A weaker one
    under the copy, capped where the copy still measures 5.7 to 1. */
 background:radial-gradient(70% 90px at 50% 0,color-mix(in srgb,var(--glow) 40%,transparent),transparent),
  radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--glow) calc(var(--lux,.3) * 60%),transparent),transparent 70%),#15171E;
 box-shadow:0 0 0 1px color-mix(in srgb,var(--glow) 40%,transparent),0 18px 60px -18px color-mix(in srgb,var(--glow) 50%,transparent)}
body[data-v="b"] .rl .rl-hd h3{font-size:20px}
body[data-v="b"] .rl .rl-lead,body[data-v="b"] .rl .eb{color:var(--mid)}
body[data-v="b"] .rl{--rl-go:var(--glow);--rl-on:#0B0C10;--rl-hi:var(--glow)}

/* ============================================================
   C. THE TRACE. An instrument's strip chart. The release is the one lit surface.
   ============================================================ */
body[data-v="c"] .pe{background:transparent;border:0;border-left:3px solid var(--accent);border-radius:0;padding:4px 0 4px 18px}
body[data-v="c"] .pe .pe-q{font-size:28px;font-weight:300;line-height:1.25}
body[data-v="c"] .pe .pe-q.quiet{font-size:16px}
body[data-v="c"] .jr .hl{background:
 repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.75em - 1px),rgba(255,255,255,.055) calc(1.75em - 1px),rgba(255,255,255,.055) 1.75em) 0 18px/100% 100% no-repeat,var(--sunk)}
body[data-v="c"] .jr mark{background:none;box-shadow:inset 0 -2px 0 var(--c);border-radius:0}
body[data-v="c"] .jr mark.neg{box-shadow:none}
body[data-v="c"] .sm .sm-row{grid-template-columns:92px minmax(0,1fr) auto}
body[data-v="c"] .sm .sm-hdr{display:grid}
.sm .sm-hdr{display:none;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;padding:8px 0 4px;border-bottom:1px solid var(--edge-2)}
body[data-v="c"] .rl{
 --ink:#16171C;--mid:#4E4C48;--dim:#605E59;--edge:rgba(20,23,28,.11);--edge-2:rgba(20,23,28,.18);
 --root:#9B4B47;--sacral:#8E6231;--solar:#7E6C29;--heart:#2A7A5C;--throat:#2C6F88;--eye:#4C5F9E;--crown:#6E5490;--accent:#2F6E92;
 background:#EDEBE6;color:var(--ink);border:0;box-shadow:0 30px 80px -30px rgba(237,235,230,.35),0 0 0 1px rgba(255,255,255,.6) inset;
 --rl-go:#16171C;--rl-on:#F3F2EE;--rl-hi:#16171C}
body[data-v="c"] .rl .rq .br{background:rgba(20,23,28,.08)}
body[data-v="c"] .rl *{--ct:var(--c)}
body[data-v="c"] .rl .rl-run .pg{background:rgba(20,23,28,.1)}

/* ============================================================
   D. THE BINS. The words it caught, stacked where they landed. The release is a dial.
   ============================================================ */
body[data-v="d"] .pe{background:transparent;border:0;padding:6px 0 0 44px}
body[data-v="d"] .pe::before{content:"";position:absolute;left:6px;top:14px;width:24px;height:24px;border-radius:50%;
 border:1.8px solid var(--accent);box-shadow:0 0 0 5px rgba(126,184,212,.12)}
body[data-v="d"] .jr{background:transparent;border:0;padding:0}
body[data-v="d"] .jr .ed{font-size:19px;line-height:1.7}
body[data-v="d"] .jr .hl{background:transparent;border-color:transparent;border-left:1px solid var(--edge-2);border-radius:0}
body[data-v="d"] .jr .ed:focus-within .hl{border-color:transparent;border-left-color:var(--accent)}
body[data-v="d"] .jr mark{background:none;border-radius:0}
body[data-v="d"] .sm{background:transparent;border:0;border-top:1px solid var(--edge-2);border-radius:0;padding:14px 2px}
body[data-v="d"] .rl{
 --edge:rgba(194,160,99,.16);--edge-2:rgba(194,160,99,.3);
 background:radial-gradient(90% 60% at 50% 30%,#241A0E,#17110A 70%);border:1px solid rgba(194,160,99,.42);
 box-shadow:inset 0 0 0 4px #17110A,inset 0 0 0 5px rgba(194,160,99,.18);
 --rl-go:var(--au);--rl-on:#15120E;--rl-hi:var(--au)}
body[data-v="d"] .rl .rl-hd h3{color:#E8D7B3}
body[data-v="d"] .rl .dial{display:flex;justify-content:center;margin:10px 0 2px}
.bins{display:flex;gap:4px;height:280px;margin-top:10px;align-items:stretch}
.bin{flex:0 0 14px;display:flex;flex-direction:column;border-radius:6px;background:rgba(255,255,255,.025);position:relative;
 transition:flex-grow .45s var(--ease-out),flex-basis .45s var(--ease-out);min-width:0;overflow:hidden}
.bin.on{flex:1 1 60px}
.bin .bhd{font-size:12px;font-weight:600;color:var(--ct);padding:6px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:clip}
.bin:not(.on) .bhd{writing-mode:vertical-rl;transform:rotate(180deg);padding:8px 0;align-self:center;opacity:.8}
.bin .bp{padding:4px 6px 0}
.bin .stk{flex:1 1 auto;display:flex;flex-direction:column-reverse;gap:4px;padding:6px;position:relative}
.bin .ch{font-size:12.5px;line-height:1.2;padding:5px 7px;border-radius:6px;color:var(--ct);
 background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent);
 overflow-wrap:anywhere}
.bin .ch.er{background:transparent;border-style:dashed;color:var(--dim)}
.bin .ch.new{animation:pl-in .45s var(--ease-land)}
.bin .askl{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--c) 70%,transparent)}
.bin::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--c);opacity:.5}
.notc{margin-top:10px;font-size:12.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.notc s{color:var(--mid);text-decoration-color:var(--c)}
.cohb{margin-top:6px;font-size:12.5px;color:var(--dim)}
.cohb span{color:var(--accent)}

/* ---- notes ---- */
.notes{max-width:1600px;margin:4px auto 40px;padding:0 16px;color:var(--mid);font-size:13.5px}
.notes h2{font-size:16px;color:var(--ink);margin:18px 0 6px;font-weight:600}
.notes p{max-width:92ch;margin:6px 0}
.notes table{border-collapse:collapse;width:100%;max-width:1100px;margin-top:6px}
.notes th,.notes td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--edge);vertical-align:top;font-size:13px}
.notes th{color:var(--dim);font-weight:600}
.notes td:first-child{color:var(--ink);white-space:nowrap}
.notes code{font-size:12.5px;color:var(--ink)}
.notes table{table-layout:fixed}
.notes td,.notes th{overflow-wrap:anywhere}
.notes th:nth-child(1){width:26%}.notes th:nth-child(3){width:26%}
/* THE JOURNAL STAYS WITH YOU while the eye goes down the rail. Only where the
   column fits the window, or its foot could never be reached. */
@media (min-width:761px) and (min-height:900px){#coll{position:sticky;top:40px}}

@media (max-width:1180px){

   WHERE AN ADDRESS REALLY SITS, WHERE THAT IS KNOWN.

   Every address on the Body page was placed by a hash of its number: a
   scattered spot on an oval round its seat's centre, with anatomy playing no
   part. In the head that oval is wider than the skull, so the clip to the
   silhouette hid 11 of the 12 3rd Eye addresses and 15 of the 21 Crown ones
   on every profile, however heavy they were (proto/anatomy-check, BZ).

   Ruled 26 September: place everything as close as it can, precision but
   feel, roughly the right spot. And a plexus branches, so more than two
   addresses may share one real place. So each row below is one real place
   and every address standing on it. The renderer spreads the ones sharing
   a place round it rather than stacking them, and an address in no row
   keeps the old placement, which is the honest answer for a place nobody
   has measured yet.

   The numbers are sources, not figure units, so they can be checked against
   where they came from.

   h   the head. Brain atlas centroids in MNI millimetres, [x, z]: x is the
       person's right, z is height. From the second anatomy pass (BQ, its
       measure_out.json, Harvard-Oxford, Juelich and Neuromorphometrics). A
       structure with two halves carries each half as its own point, measured
       from the same atlas labels split at the midline, because its whole
       centroid falls on the midline between them where no tissue is. The
       addresses of a row are dealt across its points in order.
   v   the torso. [vertebral level, offset from the midline in figure units],
       C1 counted 1 through the tailbone at 30, as the first and third passes
       sourced them (BI3a, BI3c).
   at  a seat's own centre, for an address with no anatomy to place.
   f   a place on one of the two reference charts the owner sent on 26
       September, carried onto this figure. [x, y] in figure units, the
       person's right side first, and c names the chart points it stands on.
       These are the one kind that is figure units, because a chart pixel means
       nothing without the chart, so proto/anatomy-ref/measure.js re-derives
       every f from its c on each run and fails if a row has drifted from it.

   research's own nesting table: a nerve at the structure it leaves from, a
   nucleus inside the structure that holds it, an axis at the middle of its
   two ends.

/* ============================================================
   THE BAND EDGE. Ruled: "a band edge is a ramp, not a cliff."

   The shipped rule, in core.js sabLevels and sab33Detect, was a three step
   staircase over a level ROUNDED TO AN INTEGER FIRST: full membership flat
   across the band, a half step at exactly one integer outside it, zero beyond.
   Two things follow from that and both are defects.

   The rounding means the spec's own example is not quite the bug. 6.9 and 7.1
   both round to 7, so they are in fact the same answer. The cliff is real and
   it sits at x.5, not at the band edge: 6.4 and 6.6 are different answers, and
   nothing about a body changes across a fifth of a point.

   And flat-inside cannot express "intensity peaks inside the band", which the
   spec states outright. A reading at the very edge of the band and a reading
   dead centre were the same number.

   EVERY WIDTH HAS A REASON. Measured with proto/sniffer/ramp.js, which checks
   itself against a known good case in both directions and refuses to run if
   either fails.

   SAB_EDGE 0.75   membership at the band edge. Not 1, because a peak needs
                   somewhere to fall to. Not lower, because the edge is inside
                   the band the canon states and must not read as half absent.
   SAB_BELOW 2     points under the low edge before membership reaches zero.
                   Two, so a reading ONE point under the band, which the spec
                   calls the normal condition of a reader, keeps half the
                   membership it would have had at the edge. One would put the
                   normal error at zero, which is the failure being fixed.
   SAB_ABOVE 3     points over the high edge before zero, wider than below on
                   the spec's own asymmetry, "tapers above it". The reason it
                   is asymmetric: the low edge is a threshold of PRESENCE and
                   under it the configuration has not formed, while the high
                   edge is a threshold of DISPLACEMENT and over it the
                   configuration HAS formed and is being overrun by a heavier
                   one. Evidence that decays is not evidence that never arrived.

   WHAT THE RAMP BUYS, AND WHAT IT DOES NOT. Stated plainly because the
   measurement did not say what this seat expected.

   It buys resolution. The largest move in confidence one tenth of a point of
   input can cause falls from 0.5000 to 0.0375, thirteen times finer. That is
   the whole of the "no practitioner reads a body to a tenth of a point"
   argument and it needs no cohort to establish.

   It buys steadiness. Mean absolute move in confidence under an off by one
   reading falls 9 to 15 percent.

   IT DOES NOT BUY SET AGREEMENT, and the first measurement said so: behind a
   hard floor the ramp scored 54.4 against the staircase's 58.8, WORSE. The
   finding is that a ramp inside the membership does nothing while the OUTPUT
   is still a cliff. The edge simply moved from the band to the floor. That is
   why sniffStory emits ranked confidence with no boolean firing set, and why
   this file carries no firing threshold at all.
   ============================================================ */
var SAB_EDGE=0.75, SAB_BELOW=2, SAB_ABOVE=3;
function sabMember(lvl,lo,hi){
 var m=(lo+hi)/2, h=(hi-lo)/2;
 if(lvl>=lo&&lvl<=hi) return h>0?1-(1-SAB_EDGE)*Math.abs(lvl-m)/h:1;
 if(lvl<lo)  return Math.max(0,SAB_EDGE*(1-(lo-lvl)/SAB_BELOW));
 return Math.max(0,SAB_EDGE*(1-(lvl-hi)/SAB_ABOVE));}

/* COMBINING THE FETTERS. The geometric mean, and the spec's own sentence is
   the argument: "a saboteur is a configuration of fetters at specific
   intensities. Break the co-mingling and the saboteur is gone." An arithmetic
   mean cannot go. On a three part row it averages 1, 1 and 0 to 0.67 and fires
   with one fetter entirely absent, and the shipped code used the arithmetic
   mean. It had no three part rows so it never showed; the port adds four, so
   this stopped being academic at the moment the table landed. */
function sabFetters(parts,L){
 var p=1;
 for(var i=0;i<parts.length;i++){
  var f=sabMember(L[parts[i][0]]||0,parts[i][1],parts[i][2]);
  if(f<=0) return 0;
  p*=f;}
 return Math.pow(p,1/parts.length);}

/* ============================================================
   SPECIFICITY. How much a row is worth once its fetters are read.

   TWO WEIGHTS, AND BOTH ARE DERIVED RATHER THAN TYPED.

   1. ARITY. A configuration naming one fetter is the least specific claim in
      the table and a configuration naming three is the most, so confidence
      scales with how much the row had to find. This is the same rule
      lexicon.js already applies to a bare axis noun taking its family floor:
      less specific evidence is worth less. It is also the fix for a defect the
      port introduced and this seat did not expect. The spec reduces Innocent
      to a single fetter, Fear 2 to 4, and a one part row beats a multi part row
      under ANY conjunctive combination because it has nothing to disagree with.
      Measured on the 14 stated profiles, Innocent reached the top three in 38.4
      percent of runs, which is the "fires on everything" shape the spec warns
      about, moved from Avoider onto Innocent by the port itself.

   2. AVOIDER, held low on the owner's ruling. The spec: "Avoider fires in 81
      percent of runs and costs 0.1 points. Weight it low or your sniffer will
      report Avoider on everything." The ruling is implemented. THE PREMISE IS
      NOT TRUE OF THIS POPULATION and it is raised rather than buried: measured
      on the ported bands over the 14 stated profiles, Avoider reaches the top
      three in 1.4 percent of runs, not 81. Whatever cohort produced 81 is not
      in this repository. The weight is applied because he ruled it; this seat
      reports that on the data here it suppresses a row that was already quiet,
      and that Innocent is the row his sentence actually describes.
   ============================================================ */
var SAB_ARITY={1:0.80,2:1.00,3:1.10};
var SABW={Avoider:0.55};
function sabWeight(nm,parts){
 return (SABW[nm]!==undefined?SABW[nm]:1)*(SAB_ARITY[parts.length]||1);}

/* THE CONFIDENCE, 0 to 1. Fetter membership times specificity, clamped,
   because a weight over 1 must not manufacture certainty. */
function sabConfidence(nm,parts,L){
 var f=sabFetters(parts,L);
 if(f<=0) return 0;
 return Math.max(0,Math.min(1,f*sabWeight(nm,parts)));}

const APC=[{"b":"Root","nv":"Coccygeal / Sacral Plexus (S4-Co1)","d":"Survival charge encodes in the coccygeal and sacral plexus because the body's primary question, am I safe?, routes through the lowest nerve roots. Scarcity, physical harm, and tribal rejection all converge here. Highest embodiment ratio in the system (27.7%). This layer is actively transitioning.","sub":[["Survival Fear",193,93],["Physical Body",114,2],["Financial Scarcity",82,0],["Tribal / Family",63,1],["Shelter / Stability",18,34]]},{"b":"Sacral","nv":"Sacral Plexus (S1-S3) / Hypogastric","d":"Creativity and desire encode in the sacral plexus because these are the body's generative functions at the nerve level. Suppressed creativity is a sacral nerve charge. The S1-S3 roots fire every time creative expression is blocked. Lowest embodiment ratio (2.6%). The creative suppression charge runs deeper than any other layer. The installation of coherent opposites has barely begun.","sub":[["Creativity Suppression",211,7],["Emotional Flow",197,5],["Pleasure / Guilt",135,1],["Sexual Identity",64,1],["Relationships / Intimacy",13,2]]},{"b":"Solar","nv":"Solar / Celiac Plexus (T5-T12)","d":"The celiac plexus is the most complex autonomic network outside the brain. Power, self-worth, shame, and will all encode here because this is where the body processes its relationship to the external world. The felt sense of \"can I handle this?\" is a celiac plexus response. 31.9% of total pattern load. Every major saboteur structure in the catalog has a Solar Plexus root node.","sub":[["Self-Worth / Inadequacy",366,56],["Willpower / Giving Up",330,1],["Power / Powerlessness",124,16],["Control / Chaos",118,6],["Anger / Rage",111,1],["Shame / Humiliation",92,1],["Responsibility Avoidance",68,5]]},{"b":"Heart","nv":"Cardiac Plexus / Vagus (T1-T4)","d":"The cardiac plexus receives vagal branches carrying relational information upward from the gut. Grief, love, abandonment, and forgiveness encode here because the heart conducts the information of relational experience through its nerve branches. 14.6% embodiment, the highest rate among the major clusters. When heart patterns clear, coherent opposites install effectively.","sub":[["Love / Fear of Love",122,11],["Forgiveness",84,7],["Connection / Isolation",25,16],["Abandonment / Rejection",23,2],["Grief / Loss",14,3]]},{"b":"Throat","nv":"Pharyngeal / Cervical Plexus (C1-C4)","d":"The cervical plexus innervates the structures of vocalization. Voice suppression is a cervical nerve charge, a literal nerve-level tightening around the mechanisms of speech every time the person was silenced, shamed for speaking, or punished for having a voice. 405 of 604 Throat patterns are Voice Suppression alone. The charge is not about confidence as a concept. It is about C1-C4 nerve roots firing at the moment of self-expression.","sub":[["Voice Suppression",405,5],["Self-Expression Blocks",38,26],["Public Speaking / Visibility",32,6],["Judgement Fear",17,0]]},{"b":"3rd Eye","nv":"Optic / Trigeminal / Cranial Nerves (CN II, V)","d":"The trigeminal nerve is the largest cranial nerve, with connections into the optic pathways. Decision paralysis and unclear direction are not thinking problems. They are trigeminal and optic nerve charges that fire when the person is about to commit to a direction. Vision/Direction carries 123 patterns, the dominant subcategory. The charge that keeps a person from seeing their next step has a specific cranial nerve address.","sub":[["Vision / Direction",123,9],["Perception / Reality",69,1],["Decision Paralysis",23,6],["Intuition Denial",17,2],["Overthinking / Mental Loops",9,0]]},{"b":"Crown","nv":"Pineal / Reticular Formation / Cranial Convergence","d":"\"I AM\" constructions encode at the crown because this is the convergence point of all cranial nerve inputs. Every belief about self, every self-limiting story, routes through the pineal and reticular formation. The crown is not a spiritual location. It is a nerve topology. 196 Identity/I Am patterns. Each one is a self-limiting I AM construction running as a retrieval command at the nerve level.","sub":[["Identity / I Am",196,17],["Existential Despair",106,9],["God / Source",56,1],["Surrender / Trust",14,4],["Purpose / Mission",14,0],["Ascension / Awakening",2,1]]}];

/* ============================================================
   THE KNOWLEDGE BASE. Definition, trigger and interrupt for the

   Keys are the name with a leading "the" stripped and lower

var KB_KEY=function(s){return String(s||'').replace(/^[Tt]he\s+/,'').toLowerCase().replace(/-/g,' ');};
var SABDEF={"negotiator":{"c":"S01","d":"Argues against your own intentions. Always sounds reasonable. Never says stop forever, says stop today. The fear of discomfort is mild enough to be rationalized away. The happiness available from the easier option is just high enough to make the rationalization feel earned. Together they produce the internal diplomat who can talk you out of anything, not through force, but through the perfectly reasonable argument that now is not the right moment. The most dangerous saboteur in the system because it sounds exactly like you.","t":"The moment between intending to do the necessary thing and beginning to do it. The pause.","i":"Begin the action before the internal dialogue completes. Remove the pause. The Negotiator only has power in the gap between intention and motion. Close the gap.","q":"I can start tomorrow. / Just this once. / I've earned a break."},"controller":{"c":"S02","d":"Hypervigilance at the level of outcomes. The foundation of the Type A pattern. Not a personality trait, a fear response that has been running so long it looks like a management style. The fear underneath: something will go wrong, someone will get hurt, or the situation will fall apart if I release my grip. Self-control registers as 10. Anything less registers as loss. The delta between perceived control and actual control is the zone of active saboteur behavior. Anger layers in as a do-as-I-say mechanism, authority used to close the control gap quickly. Entitlement provides the justification: it is not just that I need to control this. It is that I am right to. Competition drives the adversarial edge, not just winning but not-losing, which is a different frequency entirely.","t":"The moment control begins to slip. Uncertainty in outcomes. Others not performing to expectation. Delegation without confirmation. Silence where confirmation should be.","i":"Control is a belief held under pressure. The person fails control the same way a person fails a landing, only if they quit. Recognize that the need to be in control and the experience of being out of control are both charges, not conditions. Neither is real. Locate the fear underneath. Release the fear. The control behavior loses its substrate.","q":"If I don't control this, something will go wrong."},"victim":{"c":"S03","d":"Focuses on internal feelings and victim mentality for attention. Martyrdom.","t":"When accountability is required.","i":"Identify one thing within your control. Take one action on it.","q":"This keeps happening to me."},"perfectionist":{"c":"S04","d":"Continuous pressure to do better. Anxiety about imperfections in self and others.","t":"Before completion or release of work.","i":"Set a fixed completion time. Release at that time regardless of state.","q":"It is not good enough yet."},"pleaser":{"c":"S05","d":"Indirectly tries to gain acceptance by helping, pleasing, rescuing, or flattering.","t":"When there is potential for disapproval or when a boundary is needed.","i":"State a preference or limit once. Do not explain or apologize.","q":"My worth depends on making others happy."},"hyper achiever":{"c":"S06","d":"Dependent on constant performance for self-respect. Workaholic.","t":"When performance is not being measured or when rest is available.","i":"Rest without producing for one hour. No metrics.","q":"My worth is in my output."},"hyper rational":{"c":"S07","d":"Processes everything through logic. Impatient with emotional concerns.","t":"When emotional input is offered.","i":"Name the emotion present in the room before analyzing the problem.","q":"If I can't explain it, it isn't real."},"hyper vigilant":{"c":"S08","d":"Continuous anxiety about potential dangers. Constant risk management.","t":"When the environment changes or trust is required.","i":"Identify one thing that is safe. Hold that for 60 seconds.","q":"The threat is always just ahead."},"restless":{"c":"S09","d":"Constant search for new activities. Rarely at peace with the current moment.","t":"When the current situation becomes familiar or stable.","i":"Stay with the current thing for twice as long as the impulse to move suggests.","q":"The next thing will be better."},"stickler":{"c":"S10","d":"Perfectionism and need for order. Anxiety when standards are not met.","t":"When the environment or person deviates from the correct way.","i":"Identify one situation where your standard is serving your fear, not your values.","q":"There is a right way and a wrong way."},"judge":{"c":"S11","d":"Judges self and others. Replays past failures. The master saboteur, activates all others.","t":"When someone, including self, falls short of standard.","i":"Find one thing that is right about the situation being judged.","q":"Someone is responsible for this."},"deflector":{"c":"S12","d":"Does not own. Justification to avoid accountability.","t":"When direct accountability or personal disclosure is required.","i":"Stay with the direct question for 10 seconds before redirecting.","q":"If they knew the real me they would leave."},"dramatizer":{"c":"S13","d":"Amplifies the emotional intensity of situations to generate attention or movement.","t":"When intensity of feeling is present and an audience is available.","i":"Reduce the intensity of the next statement by half.","q":"My pain must be visible to matter."},"worrywart":{"c":"S14","d":"Runs continuous worst-case scenarios. Mistakes anxiety for planning.","t":"When the future is uncertain.","i":"Name the specific worst case. Name one action if it occurs.","q":"Worrying is preparation."},"loner":{"c":"S15","d":"Withdraws from contact as protection. Independence as defense, not a value. Fear of rejection co-mingling with shame of belonging at sufficient magnitude. The person does not experience themselves as afraid, they experience themselves as preferring solitude. Release the fear and sad nodes and the solitude remains if chosen, not if driven.","t":"When connection is available and would be beneficial.","i":"Make one direct request for connection.","q":"Needing others is weakness."},"people pleaser":{"c":"S16","d":"Approval-seeking at the expense of authenticity.","t":"When approval is uncertain or a boundary is needed.","i":"Identify the response that serves the relationship rather than the approval.","q":"If they don't like me I have failed."},"skeptic":{"c":"S17","d":"Defaults to distrust and doubt. Skepticism as protection against disappointment.","t":"When new information challenges the current model.","i":"Sit with the new information for 24 hours before dismissing it.","q":"Trust gets you hurt."},"dreamer":{"c":"S18","d":"Lives in possibility without building the bridge toward it. Avoids the friction of execution.","t":"When the gap between vision and current reality is visible.","i":"Identify one concrete step. Execute it today.","q":"Someday the conditions will be right."},"procrastinator":{"c":"S19","d":"Delays action on important tasks. Mistakes motion for progress.","t":"When the important task is clear and available.","i":"Begin. Not finish. Not plan. Begin. Three minutes.","q":"I work better under pressure."},"imposter":{"c":"S20","d":"Believes their competence is unearned and discoverable as fraud.","t":"When competence is being evaluated or recognition is offered.","i":"Identify one thing you know that the room does not. State it.","q":"They will find out I do not belong here."},"aggressor":{"c":"S21","d":"Uses anger and force to override resistance. Mistakes compliance for agreement.","t":"When authority is challenged or outcome is not proceeding as required.","i":"Pause 5 seconds. Name the fear underneath the anger before responding.","q":"Aggression gets results."},"martyr":{"c":"S22","d":"Sacrifices for others to generate obligation or moral authority.","t":"When sacrifice has been made and goes unrecognized.","i":"Identify whether the sacrifice was chosen or performed. If performed, stop.","q":"I give everything and receive nothing."},"cynic":{"c":"S23","d":"Undermines possibility through pre-emptive dismissal.","t":"When hope or enthusiasm is present in self or others.","i":"Identify one thing good about the situation being dismissed.","q":"Optimism is naive."},"manipulator":{"c":"S24","d":"Achieves outcomes indirectly through influence, withholding, or positioning.","t":"When the direct approach feels risky.","i":"State the actual need directly. Once. Without positioning.","q":"Direct requests make me vulnerable."},"overthinker":{"c":"S25","d":"Loops on decisions past the point of useful analysis.","t":"When a decision is required and the outcome is uncertain.","i":"Set a decision time limit. Decide at that limit. Do not extend it.","q":"More analysis will produce the right answer."},"escapist":{"c":"S26","d":"Uses pleasure, distraction, or movement to exit discomfort before it resolves.","t":"When the present moment is uncomfortable and an exit is available.","i":"Stay in the discomfort for two minutes. Name what is present.","q":"I just need to not feel this right now."},"avoider":{"c":"S33","d":"Declines the engagement before it can cost anything. Not fleeing discomfort the way the Escapist does, and not arguing the way the Negotiator does. Simply not present for it.","t":"When something asks to be dealt with and not dealing with it carries no immediate penalty.","i":"Name the thing being avoided out loud, then do the smallest piece of it.","q":"If I stay unaware, nothing can land on me."},"nihilist":{"c":"S27","d":"Removes the foundation of meaning as a pre-emptive strike against disappointment.","t":"When meaning is required to justify effort.","i":"Identify one action worth doing regardless of meaning. Do it.","q":"Nothing matters enough to sustain effort."},"innocent":{"c":"S28","d":"Maintains deliberate unawareness to avoid responsibility or conflict.","t":"When complexity, conflict, or moral weight is present.","i":"Name one thing you know that you are pretending not to know.","q":"I don't want to be involved."},"pessimist":{"c":"S29","d":"Pre-empts positive outcomes by building a case against them before they materialize.","t":"When a positive outcome is possible.","i":"Identify the best plausible case. Operate from that.","q":"It will not work out."},"catastrophizer":{"c":"S30","d":"Projects the worst possible outcome onto every uncertainty. Distinguishable from Worrywart by magnitude, Catastrophizer reaches existential threat from ordinary uncertainty.","t":"Any unresolved uncertainty.","i":"Describe the actual current situation without projection. Stay in the present tense.","q":"This will destroy everything."},"enabler":{"c":"S31","d":"Supports others' destructive patterns to maintain relationship or avoid conflict. Distinct from Pleaser: the Enabler supports behavior they recognize as harmful.","t":"When someone they care about is repeating a destructive pattern.","i":"Name what you see. Once. Without attachment to the response.","q":"If I say something they will leave."},"control freak":{"c":"S32","d":"The colloquial name for the Controller and Hyper-Vigilant composite at Type A intensity. Hypervigilance running on outcomes and on threat at the same time. The body is scanning forward (what could go wrong) and downward (am I in command of this) in continuous loop. Reads to other people as competence under pressure. Reads in the body as never landing. The same fear that drives Controller (something will go wrong if I release grip) and the same fear that drives Hyper-Vigilant (the threat is just ahead) co-mingle here at sufficient magnitude that they cannot be felt as separate. Distinct from Controller alone: Control Freak does not wait for the control gap to open before acting. Distinct from Hyper-Vigilant alone: Control Freak organizes the scan around its own agency, not around external monitoring. Type A is the social presentation. The somatic state is sustained sympathetic activation that the body has normalized as baseline.","t":"Any environment the person did not configure. Any outcome the person did not design. Any silence where confirmation should be.","i":"Lock the jaw, the shoulders, and the diaphragm for a count of five. Notice they were already locked. Release on the exhale. The drill shows the body can hold a state without scanning it. Repeat until the scan stops without being asked to.","q":"If I am not running this, no one is."}};
var DOMDEF={"knowledge":{"n":"I","c":"pattern recognition, codification, teaching, symbolic thinking. The person who reads before being asked to. Somatic knowledge is true knowledge, once it's in the body, deception doesn't work on you. You can feel the lie before it forms a word.","x":"over-intellectualization, false certainty, knowledge as a barrier rather than a bridge."},"communication":{"n":"II","c":"bridging, translation, precision of language, fast cognition. The connector, the person who translates between people, between ideas, between worlds.","x":"manipulation, inconsistency, information as leverage."},"power":{"n":"III","c":"physical courage, boundary enforcement, protection of what matters. Directed aggression at obstacles, not people.","x":"domination, violence without purpose, war as identity."},"imperium":{"n":"IV","c":"governance, structural authority, organizing chaos into function. sees how systems should be organized.","x":"domination, entitlement, autocracy."},"creation":{"n":"V","c":"building, executing, bringing vision into form. Always needed to make things. When you can't create it feels like disconnection, like the system is broken. Financial stress kills creativity not motivationally but anatomically: the survival charge consumes the current before it reaches the generative center. When the root clears, the sacral opens, the creative current flows again. Not as discipline. As a natural consequence of the channel being clear.","x":"perfectionism as paralysis, identity tied to output."},"dissolution":{"n":"VI","c":"deliberate dissolution, clearing what's false or finished, making space for what comes next. Sees what needs to end.","x":"destruction as identity, nihilism, chaos without rebuilding."},"love":{"n":"VII","c":"union, intimacy, the force that draws beings into genuine contact. Love as a state the person generates, not receives. Always knew what brings people together.","x":"codependency, possession, love as completion rather than addition."},"healing":{"n":"VIII","c":"directed intervention, active clearing, creating conditions in which restoration happens. Finds the broken thing in any room.","x":"rescuer complex, martyrdom, healing as identity."},"sacrifice":{"n":"IX","c":"voluntary descent, the chosen ordeal, sacrifice as the mechanism that produces insight unavailable any other way. The knowledge that comes from what was given up, not accumulated. The true utilization of experience: consume as much as possible, then don't hang onto the definitions. Words illuminate, they don't contain.","x":"suffering as identity, the descent without return."},"justice":{"n":"X","c":"discernment of what's real and what's false. Accountability without cruelty. Moral disorder doesn't just feel wrong, it triggers the nervous system. When truth is a 10, anything less is somatic. You can feel the lie before it forms a word. If you lie, you dysregulate your own nervous system.","x":"rigid judgment, self-righteousness, justice as control."},"trickster":{"n":"XI","c":"disruption of rigid patterns, revealing what's hidden through inversion, innovation through disorder. Sees the absurdity in what everyone else treats as fixed.","x":"deception as lifestyle, instability mistaken for freedom."},"nature":{"n":"XII","c":"alignment with biological truth, growth through patience rather than force. Thinks in cycles rather than straight lines.","x":"rejection of structure, naturalism as escape from complexity."},"mystery":{"n":"XIII","c":"navigation of the unseen, death and rebirth as structural realities. Can hold darkness without being consumed. Always drawn to what's hidden.","x":"obsession with shadow, nihilism, identity built on the margin."},"duty":{"n":"XIV","c":"right action regardless of personal cost. Loyalty to what's true, not what's comfortable. Does the right thing even when no one is watching.","x":"rigidity, losing self in obligation, duty performed for an audience."},"play":{"n":"XV","c":"the generative state of pure engagement. Awe. Creativity for its own sake. Not the absence of seriousness, the intelligence serious people miss. Always able to find what's alive in something.","x":"avoidance through play, irresponsibility, lightness that refuses depth."},"death":{"n":"XVI","c":"completion. Endings held cleanly. The threshold kept, the thread cut when the thread is finished, presence with what's dying without flinching. Releases what's done so renewal has room.","x":"morbidity, clinging that refuses every ending, or dealing endings as power."},"fate":{"n":"XVII","c":"reads the pattern and its timing. Knows what must unfold and when to move. Acts at the right moment without forcing the thread.","x":"fatalism, abdication of choice, reading the pattern as an excuse to never act."},"guardian":{"n":"XVIII","c":"the watch kept. A perimeter held so what's inside can live. Protection without possession, sanctuary without walls that strangle.","x":"overprotection that smothers, vigilance that never rests, walls against life itself."},"provision":{"n":"XIX","c":"the one who makes sure there's enough, and not only for today. Supply held against a season nobody can see yet. The granary, the harvest, the wage. Provides for, rather than trades with.","x":"worth measured only in what's furnished, hoarding dressed as prudence, the provider who can't be provided for."}};
var KB_RENAME={"descent":"Sacrifice","connection":"Love","exchange":"Communication","restoration":"Healing"};
var GLOSS=[{"t":"Address","d":"The specific location in the body’s energetic architecture where a pattern is resident. Every fetter, every tag, every limiting belief has an address. The release work operates at the address--not at the level of thought or behavior."},{"t":"Allostatic load","d":"The accumulated physiological cost of chronic stress responses. The body’s equivalent of compound interest on unresolved charge. The release work reduces allostatic load by addressing it at the address layer."},{"t":"Archetype","d":"One of 12 universal character templates, and the third rung on the native side of the stack. Domains express as the blueprint; the blueprint branches into archetypes. A separate rung from the blueprint rather than another name for it. Native and present before conditioning, which is why it isn't held in tissue and not released: the work changes where it's pointed, not what it is."},{"t":"Ascension","d":"No longer affected, triggered, or stimulated by the external environment, or by your own emotions. You've ascended emotions controlling you. The environment loses its grip because survival patterns are no longer running as commands. A state definition, not a threshold: it carries no release count. It's not a destination--an operating state."},{"t":"Attention","d":"The ability to focus awareness. Two types: nonfocused attention and focused attention. Attention is the steering; will is the force."},{"t":"Aura","d":"The field this model holds is generated by the state of the nervous system. Not measured by this instrument, and not measured by any instrument this product knows of. Ultraweak photon emission from living tissue is real and comes from reactive oxygen species; it has never been shown to carry nervous system state. Held here as a model of how presence is received, not as a reading."},{"t":"Awareness","d":"The aperture of perception of the soul."},{"t":"Biophoton field","d":"Ultraweak photon emission from living tissue. Real, measured in laboratories since the 1950s, and understood to come from reactive oxygen species rather than from nervous system state. This product names it as the physical thing it is and does not claim it carries the aura. Nothing in the engine reads it."},{"t":"Chakra","d":"A seat. In this model, the nonphysical field generated by a nerve plexus. Seven of them, root to crown. The seven count and the plexus correspondence are a modern Western reading: the source traditions give five, six, eight and more, and the welding of seats to nerve plexuses dates to 1927. Held because it is the vocabulary the work is done in, not because it has been measured."},{"t":"Charge","d":"Stored survival energy held at a node. Installed by a stress response that never finished. Felt as heat, pressure, tingling, or weight when accessed."},{"t":"Clair","d":"A perceptual channel beyond the five physical senses. Clairvoyance (seeing), clairaudience (hearing), clairsentience (feeling), claircognizance (knowing), and others. Soma fields fragment them; clearing soma allows them to operate in unison."},{"t":"Coherence","d":"Reduction of internal contradiction, computed rather than measured. The state in which intention, behavior, and nervous system response are aligned. CQ measures it."},{"t":"Replacement state","d":"The specific behavioral, emotional, and somatic expression of the quality a pattern suppresses--installed at the same address as the released charge. Not a generic positive. The exact quality the pattern is blocking."},{"t":"Consciousness","d":"Energy as information, perceived through two experiences. The macro is unbound and unfocused: infinite consciousness. The opposite pole is localized conscious awareness. Same thing, different aperture."},{"t":"CQ","d":"Coherence Quotient. The 21 Laws of Moral Integrity, each scored 0 to 10, summed out of 210. Nothing else enters it. It fills from 0 as the laws are answered, and the shadow never lowers it: the shadow pulls on expression instead."},{"t":"Distortion","d":"Intention read through loaded nodes. The signal is intact, the instrument is bent. Not a formula variable: distortion and SQ were the same reading under two names. It survives as a description of what happens to intention, not as a term that gets multiplied by anything."},{"t":"DQ","d":"Decoherence. The total shadow: the weight held at all 112 addresses, summed, out of the most they can hold. A high DQ means the system is consuming energy maintaining internal contradictions."},{"t":"Drag","d":"The combined load that reduces available willpower. Fetters, clenched muscles, inflammation, loaded nodes--all produce drag on the mind-body-spirit connection. Drag is why willpower feels like a limited resource."},{"t":"Earth Star","d":"Field node at the center point between the feet. Anchors the system to the planet."},{"t":"Ego","d":"Body consciousness. The mind attached to the physical, never present, toggling between thinking and feeling to navigate the world out of fear. The ego is the mask of our character. It's the total sum of DQ, all the SQ running, and all the patterns and awareness that come with body consciousness."},{"t":"Fetter","d":"A named conditional response pattern resident at a specific node address. One per physical node, and 112 addresses in all: the nodes in the body, plus four field nodes just outside it, two above the crown and two below the feet. Fires when matching input arrives, regardless of how long ago it was installed."},{"t":"Five paths","d":"Five primary orientations toward the work: Krishna (flow), Buddha (awareness), Christ (somatics), Rama (alignment), Lao Tzu (horizontal). All paths lead to the same Source. The Anchor Principle operates underneath all five."},{"t":"Hardened mask","d":"The layer of conditioning that doesn't clear with time, life change, or most therapeutic modalities. Requires active address-level release work. Distinguished from practice-maintained conditioning, which life change alone can clear."},{"t":"Hyper-complex","d":"One of 8 named clusters of saboteurs operating as a unified behavioral system. More severe than a single saboteur--a self-reinforcing architecture of patterns that maintain each other."},{"t":"Integrity","d":"The total sum of your coherence, which upregulates the nervous system. It does that by moving you through and maintaining moral structure. Integrity is a ship’s hull. A hole in the hull means the ship takes on water. Integrity has to be at a hundred percent for the hull, and for CQ, to hold. Measured as compliance with the 21 Laws of Moral Integrity."},{"t":"Intention","d":"The intended outcome. Part willpower, part desire, part motivation. Moving toward something registers as pleasure. If no outcome has been formed, avoidance takes the slot by default."},{"t":"Justification mechanic","d":"The body’s defense of its own installed patterns. Blame, deflection, rationalization--all are the tag’s immune response. The body defends the signal because the truth is too difficult to face. Narcissism is the justification mechanic at high intensity."},{"t":"Karma","d":"The results of your thoughts and physical actions put out into the world, and the cause-and-effect energy that comes back to you from those actions. It's cyclical, an echo. Its purpose is to come back so you can learn the lesson, overcome, and transmit the karma so it never comes back. Karma is cause and effect in interaction."},{"t":"Kosha","d":"A perceptual layer through which experience is filtered. Six layers: physical, energetic, mental, wisdom, bliss, and linguistic. Each transforms the signal passing through it."},{"t":"Kundalini","d":"The stored vital energy at the base of the spine. Rises root to crown when enough nodes are cleared for the channel to conduct."},{"t":"Letting go","d":"The release protocol. Runs two mechanics in sequence: (1) reducing charge at the address, (2) installing the replacement state while the address is open. Different from affirmation, which skips the first mechanic."},{"t":"Limiting belief","d":"A tag that compresses the full range of experience into a limited label. Every identification is a limiting belief by definition--not as a judgment but as a mechanism. The label is always smaller than the experience."},{"t":"Mask","d":"The accumulated distortion functioning as an identity construct. What most people call ‘their personality’--the conditioned firing of patterns stored at specific addresses. The mask isn't who you are."},{"t":"Memory","d":"The result of the vritti and identification. Sensory input and emotional input, once identified, stored in the body."},{"t":"Merkaba","d":"A geometric field structure used in the release protocol. Top spinning left, bottom spinning right. Opposing rotations distort the node’s current flow, creating conditions for release."},{"t":"Node","d":"An address in the body’s energetic architecture. The nodes in the body, and four field nodes just outside it: the Earth Star at the center point between the feet, the Sol Star just above the crown, and the Gaia Gateway below the Earth Star, and the Stellar Gateway above the Sol Star. 112 total."},{"t":"OJAS","d":"Sanskrit, meaning vigour. It isn't an acronym and there are no letters to expand; every instance spelled OJOS in earlier drafts was a transcription error that propagated. Vital energy in meditation, held as a cocoon of energy around you. It spins without you having to drive it, and it naturally stimulates the nervous system and releases stress from the body. The protocol developed for Stage 4 and Stage 5 nodes, the ones too dense or too numb to feel. Restores enough signal for release work to begin."},{"t":"Perception","d":"The ability to intuit and perceive, and to translate energy into a symbolic form that can be perceived and understood. Perceiving the sensory input to make sense of things."},{"t":"Plexus","d":"A physical nerve cluster. The plexus is the hardware; the chakra is the field it generates. Disruption at the plexus level produces disruption at the chakra level."},{"t":"Presence","d":"The ability to project one’s energy to be perceived and felt by others."},{"t":"Primary node","d":"The primary loaded node in a field of surrounding nodes. Clear the primary node and the surrounding field releases on its own. Working secondary nodes without finding the primary node produces partial release."},{"t":"Pure perception","d":"All the clairs operating in unison without distortion. Not an absence of thought--a state of full multi-sensory field coherence. Available as soma load reduces and the barriers between the clairs dissolve."},{"t":"Reading-as-release","d":"The protocol in which reading a properly constructed Letting Go sequence produces somatic release at the anatomical address the sequence specifies. No additional visualization required. Both mechanics run through the act of reading."},{"t":"Release","d":"The discharge of stored charge through the nervous system. Physical and observable: heat, shaking, tears, breath shifts. The pattern loses its power source."},{"t":"Resistance","d":"All drag combined--every fetter, loaded node, and inflammatory process that opposes the flow of signal through the system. Resistance is what the release work reduces. It no longer divides CQ, which is the laws alone."},{"t":"Saboteur","d":"One of 33 named behavioral patterns that contract a fetter into characteristic repeating behavior. Each has a specific belief structure, body location, and emotional signature."},{"t":"Self-unraveling state","d":"The body’s autonomous release state when enough gates have cleared. The soma fields begin releasing without active protocol work. The operational success criterion of a release session: not the node is cleared, the body is releasing on its own."},{"t":"Signal chain","d":"The full processing loop: field of awareness → senses → nervous system → brain → intelligence layer → relation layer → three axes → emotional layer → superego → koshas → archetypes → main field. The loop completes moment to moment."},{"t":"Soma","d":"The energetic field generated by the nervous system’s state. Accumulated soma creates load. Overlapping soma fields fragment the perceptive layer, forming barriers the awareness can't see through."},{"t":"Sol Star","d":"Field node just above the crown. The point through which the system extends beyond the body and opens to the field."},{"t":"Source","d":"The ground state of the field before any pattern is installed. The operating system underneath the operating system. What remains when all patterns are cleared."},{"t":"Superego","d":"The protective structure of the superficial mind. The story impressions handed down from an adult. The ego is more sophisticated because the ego is somatic in nature. The superego is superficial structure protecting beliefs."},{"t":"Tag","d":"The moment a charged experience is named and coded at a node address. The name locks the experience in. The tag is what the body scans for in all future input, firing the resident pattern when it finds a match."},{"t":"Two mechanics","d":"The two operations required for a complete release: (1) Release--the charge at the address reduces; (2) Embodied Truth--the replacement state is installed while the address is open. Both are required in sequence. The first without the second leaves no alternative at the address."},{"t":"Vritti","d":"A sensory input waveform and emotional input waveform. It channels across the nervous system, from the external field through the nervous system into the brain, where it's composited and perceived, and where awareness uses the sensory input to perceive. Once identified, the vritti is what collapses the nerve, the chakra, and the field of awareness."},{"t":"Willpower","d":"Available directed force. A measurement, not a character trait. It runs as a battery with a daily charge; sleep sets the starting level and moving through resistance spends it. High drag means low willpower. Release the charges, drag reduces    how a table edit looks like it landed and did not. */

   things i cannot take back. i lied to her" into one run of words, so the
   negator from the sentence before voided a true self action cue and the
   ownership account lost one of its four. A full stop, a question mark, a
   semicolon, a colon and a line break become a bar, which no phrase can
   contain, so it stops the look back and also stops a phrase matching
   across two sentences. A comma is left as a space on purpose: it is too
   weak a break to end a negation. */

  .replace(/[.!?;:\n\r]+/g,' | ')

      the short form inside it: "none of it was my fault" voided

/* ============================================================
   WHAT AN ENTRY IS, WHERE IT CAME FROM, AND WHAT IT MAY ASSERT.

   The three tables above were authored and nothing recorded their provenance,
   so the repository could not answer the owner's own question: does the
   sniffer have the logic supplied by the book. Measured, the answer was no in
   two directions at once. Nine of the nine axes the instrument scores, and
   seven of the seven cue words the thirty three saboteurs are defined by, were
   not words the scanner could find: one of nine and zero of seven resolved.
   And of the 192 authored words, 87 appear anywhere in the book and 105 do
   not, so more than half the vocabulary had no stated source at all.

   Neither of those is fixed by typing more words in. They are fixed by an
   entry knowing what it is. So an entry now has a schema, a source, and a
   validator that refuses rather than clamps, and every entry that is not hand
   authored is DERIVED by a named pass from a table that already has an owner.

   An entry is [seat, amount, fetter]. Positions are named below because a
   table read by index is a table nobody can search.

     seat     WHERE in the body the charge is held. One of LEX_SEATS. Always
              asserted, because the scanner genuinely knows it: the table says
              so and nothing was inferred to get there.
     amount   HOW MUCH, on the authored 12 to 28 curve. Signed: a coherent
              entry subtracts. parseStory divides by 3 and applyStory scales
              by 0.35, so this number is not a charge and must never be read
              as one.
     fetter   WHICH of the nine axes, and it is OPTIONAL BY DESIGN. Present
              means the word named the axis itself and the reading may say so.
              Absent means the seat is known and the axis is not, and
              parseStory will mark the imprint inferred. That flag is the
              whole difference between evidence and an accusation, and the
              product has already shipped the accusation once.

   WHAT AN ENTRY MAY NEVER ASSERT: a saboteur, an architecture, a diagnosis, a
   verdict, or a person. A word is evidence that a word was written. Every
   claim past that is made downstream, by a named stage, and says which it is.
   ============================================================ */
var LEX_SEAT=0, LEX_AMT=1, LEX_FET=2;
var LEX_SEATS=['root','sacral','solar','heart','throat','eye','crown','coherent'];
/* WHERE AN ENTRY CAME FROM. This list is the spec, not a summary of one.
   A source not on it is refused by name, including by whoever adds a helpful
   one later, because the gate asserts the set exactly.
     authored  hand written. the 192 above. no stated source and that is the
               open question, not a defect to be hidden.
     canon     derived from a canon table that already has an owner: the nine
               axes, and the seats and fetters CHG2SEAT and CHG2FET already
               assign them. No new number is invented by this pass.
     fold      an ordinary surface form of a key already present, generated by
               a stated rule and admitted only where a named corpus confirms
               the form is real writing. */
/* A FOURTH SOURCE, DECLARED. `composite` is a word whose reading is two
   fetters rather than one, seated by the pass at the bottom of sniff.js off the
   unanimous seat and family floor of the members already in the table. It is a
   separate source from `canon` because its derivation is different and a
   reviewer asking where an entry came from must get one answer rather than a
   family of them. The validator refused every composite entry until this line
   existed, which is the validator working: a new provenance is declared here or
   it does not reach the table. */
var LEX_SRC=['authored','canon','fold','composite'];
var LEX_AMT_MAX=30;
/* key -> {src, from, rule, cite}. Covers LEX exactly, in both directions, and
   the gate asserts that, because a provenance table with holes in it is worse
   than none: it reads as though everything in it were sourced. */
var LEXMETA={};
Object.keys(LEX).forEach(function(k){
 LEXMETA[k]={src:'authored',from:null,rule:null,cite:null};});
var CHGMETA={};
Object.keys(ADJ2CHG).forEach(function(k){
 CHGMETA[k]={src:'authored',from:null,rule:null,cite:null};});

/* THE BOUNDARY, in validateProfile's and obValidate's posture: refuse by name,
   never clamp, never accept in silence. A clamped amount reads back as a
   reading the author never wrote. */
function lexKeyOk(k){
 /* exactly the surface forms scanStory's normalisation can produce: lowercase
    letters, apostrophes and single interior spaces. A key with a capital or a
    comma in it can never match anything and is a dead row that looks live. */
 return typeof k==='string' && /^[a-z']+( [a-z']+)*$/.test(k);}

function lexRefuse(k,seat,amt,fet){
 var errs=[];
 if(!lexKeyOk(k)) errs.push('the key '+JSON.stringify(k)+' is not a form the scanner can ever match');
 if(LEX_SEATS.indexOf(seat)<0) errs.push(k+' names the seat '+seat+', which is not one of the '+LEX_SEATS.length);
 if(typeof amt!=='number'||amt!==Math.round(amt)||amt===0||Math.abs(amt)>LEX_AMT_MAX)
  errs.push(k+' carries the amount '+amt+', and an amount is a non zero integer no further than '+LEX_AMT_MAX+' from zero');
 if((amt<0)!==(seat==='coherent'))
  errs.push(k+' is seated at '+seat+' with amount '+amt+', and only a coherent entry subtracts');
 if(fet!=null&&CHARGES.indexOf(fet)<0)
  errs.push(k+' states the child emotion '+fet+', which is not one of the nine axes');
 if(LEX[k]&&LEX[k][LEX_SEAT]!==seat)
  errs.push(k+' is already seated at '+LEX[k][LEX_SEAT]+' and this would move it to '+seat);

/* ONE ENTRY. Already present with the same seat is a no op and says so, so a
   pass can be re-run without silently doubling the table. */
function lexAdd(k,seat,amt,fet,meta){
 var errs=lexRefuse(k,seat,amt,fet);
 if(errs.length) return {ok:false,why:errs[0],errs:errs};
 if(LEX_SRC.indexOf(meta&&meta.src)<0)
  return {ok:false,why:'the source '+(meta&&meta.src)+' is not one of '+LEX_SRC.join(', '),errs:[]};
 if(LEX[k]) return {ok:true,already:true};
 LEX[k]=fet!=null?[seat,amt,fet]:[seat,amt];
 LEXMETA[k]={src:meta.src,from:meta.from||null,rule:meta.rule||null,cite:meta.cite||null};
 return {ok:true,already:false};}

/* AND THE CHARGE NAME, which is the other half of the same entry.
   ADJ2CHG is the surface form to axis name table. Its name says adjective and
   its job is wider than that: it is what makes an imprint NAMED rather than
   inferred, and a person writes the noun as often as the adjective. Renaming
   it touches the export contract and two tools, so the rename is named and
   deferred rather than done in the same pass as the vocabulary. Nothing may be
   added to it except through here. */
function chgAdd(k,chg,meta){
 if(!lexKeyOk(k)) return {ok:false,why:'the key '+JSON.stringify(k)+' is not a matchable form'};
 if(typeof chg!=='string'||!chg) return {ok:false,why:k+' names no charge'};
 if(ADJ2CHG[k]&&ADJ2CHG[k]!==chg)
  return {ok:false,why:k+' already names '+ADJ2CHG[k]+' and this would move it to '+chg};
 if(LEX_SRC.indexOf(meta&&meta.src)<0)
  return {ok:false,why:'the source '+(meta&&meta.src)+' is not one of '+LEX_SRC.join(', ')};
 if(ADJ2CHG[k]) return {ok:true,already:true};
 ADJ2CHG[k]=chg;
 CHGMETA[k]={src:meta.src,from:meta.from||null,rule:meta.rule||null,cite:meta.cite||null};
 return {ok:true,already:false};}

/* ============================================================
   PASS ONE, THE FOLD. And the reason it is a list and not a stemmer.

   Measured. 29 of 63 ordinary inflections of words already in the table did
   not resolve, so the table was written in one form and people write in
   another. The obvious fix is a stemmer. It was prototyped and it is the wrong
   instrument here, and the numbers are the argument:

   The fourteen rules below, run over the 145 single word keys, generate 438
   forms. Of those 438, thirty one are confirmed by a corpus this repository
   actually holds. Seven percent. The other 407 are strings like ashams and
   anxiousing: harmless, because they never occur, and corrosive, because a
   lexicon nobody can read is a lexicon nobody can audit, and this product
   shows a person why.

   Worse, three of the thirty one confirmed forms are real English words with a
   different meaning, and two of those three fold off COHERENT keys, which
   subtract. A stemmer would have had the word contents lowering somebody's
   reading. A false positive in a somatic reading costs more than a miss, so
   the refusals are by name, in the table below, with the reason.

   So: the rules stay in the engine, because they are pure and tiny and the
   gate uses them to prove that every admitted form is reachable from a real
   key. The corpus stays out, because the engine may not read a file. What
   crosses the boundary is the confirmed list, and proto/sniffer/ holds the
   tool that produced it and re-runs it when a corpus grows.

   THE CORPUS, NAMED. index.html, the owner's own book, 117,716 words and
   7,667 distinct surface forms, plus the fourteen persona voices the product
   ships. A form neither confirms is not admitted, because admitting it is an
   unmeasured claim. When the record store exists there will be a third and
   much better corpus, and this list grows by re-running the tool rather than
   by anybody's judgement about what a person might write.

   A FOLD CHANGES THE SURFACE FORM AND NOTHING ELSE. Same seat, same amount,
   same stated fetter, same charge name. The gate asserts all four, so a fold
   can never be the back door through which a new reading arrives.
   ============================================================ */
var LEX_FOLD_RULES=[
 ['s',   function(k){return !/(s|x|z|ch|sh|y)$/.test(k);},                   function(k){return k+'s';}],
 ['es',  function(k){return /(s|x|z|ch|sh)$/.test(k);},                      function(k){return k+'es';}],
 ['ies', function(k){return /[^aeiou]y$/.test(k);},                          function(k){return k.slice(0,-1)+'ies';}],
 ['ed',  function(k){return /[^ey]$/.test(k)&&!/(ed|ing|ness)$/.test(k);},   function(k){return k+'ed';}],
 ['d',   function(k){return /e$/.test(k);},                                  function(k){return k+'d';}],
 ['ied', function(k){return /[^aeiou]y$/.test(k);},                          function(k){return k.slice(0,-1)+'ied';}],
 ['ing', function(k){return /[^ey]$/.test(k)&&!/(ed|ing)$/.test(k);},        function(k){return k+'ing';}],
 ['eing',function(k){return /e$/.test(k);},                                  function(k){return k.slice(0,-1)+'ing';}],
 ['ped', function(k){return /[^aeiou][aeiou][pgmnt]$/.test(k);},             function(k){return k+k.slice(-1)+'ed';}],
 ['ping',function(k){return /[^aeiou][aeiou][pgmnt]$/.test(k);},             function(k){return k+k.slice(-1)+'ing';}],

 ['Vs',  function(k){return /[a-z]{3}ed$/.test(k);},                         function(k){return k.slice(0,-2)+'s';}],
 ['Vy',  function(k){return /[a-z]{2}ied$/.test(k);},                        function(k){return k.slice(0,-3)+'ying';}],
 ['ness',function(k){return /[a-z]{4}$/.test(k)&&!/(ness|ion|ity|ing|ed|s)$/.test(k);},function(k){return k+'ness';}]];
