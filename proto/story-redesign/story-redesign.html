   ui/release.js already ruled how this crossing is answered: refuse it, do not
   repoint, because two attempts at repointing were each worse than the bug.
   So this does not repoint and undoApply still does not touch S.who. Switching
   record hides the arrows, because there is nothing to take back HERE, and
   switching back brings that record's history with it. That is why the stacks
   are keyed rather than cleared on a switch: clearing would spend a person's
   whole history on one glance at a worked example, and this module's own
   argument is that a person who cannot get back to where they started has a
   grace period and not an undo.

   Keyed by the record's id, not by S.who. S.who names a persona, and every one
   of the person's own records is S.who 0, so keying on it would leave two of
   their own profiles sharing one history and leaking into each other in exactly
   the same way. With no record bound at all, which is what a headless run has,
   there is one history under a key of its own. */
function undoRec(){ return (typeof CURP!=='undefined'&&CURP&&CURP.id)?CURP.id:'_'; }
var UNDO={};
function undoList(){ var k=undoRec(); return UNDO[k]||(UNDO[k]=[]); }
/* REDO. Undo without it is half a control.

   Taking a step back and then finding there is no way forward makes undo
   something a person is careful with rather than something they explore with,
   which is the opposite of what it is for. The redo stack takes whatever undo
   pops and holds it until the person either walks forward again or makes a
   new change, at which point the branch they walked away from is gone. That
   is the standard contract and it is the one people already have in their
   hands. */
var REDO={};
function redoList(){ var k=undoRec(); return REDO[k]||(REDO[k]=[]); }

/* the inputs, and nothing derived. everything else recomputes from these.
   THE RELEASE LIFT IS AN INPUT NOW. Since 25 September a release lifts the
   laws at its seat, and the count that does it lives on the record beside the
   answers (p.work, engine/compute.js LIFT_R). Undoing a release that restored
   the charge and left the count would leave CQ lifted by a release that, as far
   as the field is concerned, never ran. The history is keyed by the record, so
   the record's own work is the one taken and the one put back. */
function undoState(){
 var c={},o={},l={};
 CHARGES.forEach(function(k){c[k]=S.charge[k];o[k]=S.replace[k]||0;});
 SINAMES.forEach(function(k){l[k]=S.law[k];});
 var wk=(typeof CURP!=='undefined'&&CURP&&CURP.work)?JSON.parse(JSON.stringify(CURP.work)):null;
 return {charge:c, replace:o, law:l, work:wk,
  doms:S.doms.slice(), arcs:S.arcs.slice(), roots:S.roots.slice(),
  dom:S.dom, a1:S.a1, a2:S.a2};}

/* call BEFORE the mutation, with what the person is about to do, in their
   words, because an undo control that says "undo" and nothing else makes a
   person guess what they are about to get back. */
function undoPush(label){
 var U=undoList();
 U.push({s:undoState(), nm:label||'the last change', t:new Date().toISOString()});
 if(UNDO_MAX>0){while(U.length>UNDO_MAX)U.shift();}
 /* a new change abandons the branch that was walked away from */
 REDO[undoRec()]=[];
 return U.length;}

/* the depth of THIS record's history, which is how many steps back a person
   can actually take from where they are standing. The arrows read it and hide
   themselves on zero, so a control never offers a step it would refuse. */
function undoDepth(){return undoList().length;}
function undoPeek(){var U=undoList();return U.length?U[U.length-1].nm:null;}
function redoDepth(){return redoList().length;}
function redoPeek(){var R=redoList();return R.length?R[R.length-1].nm:null;}
/* every record's history, because this is the reset and not a switch */
function undoClear(){UNDO={};REDO={};}
/* the two ends share one restore, because a state is a state whichever
   direction it was reached from, and two copies of this would drift. */
function undoApply(s){
 CHARGES.forEach(function(k){
  S.charge[k]=(s.charge[k]!==undefined)?s.charge[k]:0;
  S.replace[k]=(s.replace[k]!==undefined)?s.replace[k]:0;});
 SINAMES.forEach(function(k){if(s.law[k]!==undefined)S.law[k]=s.law[k];});
 /* an entry taken before the lift existed carries no work and leaves it alone */
 if(s.work!=null&&typeof CURP!=='undefined'&&CURP)CURP.work=JSON.parse(JSON.stringify(s.work));
 S.doms=s.doms.slice(); S.arcs=s.arcs.slice(); S.roots=s.roots.slice();
 S.dom=s.dom; S.a1=s.a1; S.a2=s.a2;
 buildSoul();
 /* susceptibility is a function of the soul and is written by a pass, not by
    compute, so restoring the soul without rerunning it leaves the field
    attributing stories against the wrong profile. */
 suscAll();}
/* walk forward again. Symmetrical with undoPop: it captures where it is
   standing before it moves, so undo can bring it back. */
function redoPop(){
 var R=redoList(); if(!R.length)return null;
 var e=R.pop();
 undoList().push({s:undoState(), nm:e.nm, t:e.t});
 undoApply(e.s);
 return {nm:e.nm, t:e.t};}

/* restore, and return what was undone so the host can say so. A failed undo
   returns null rather than half applying: the state is replaced wholesale or
   not at all. */
function undoPop(){
 var U=undoList(); if(!U.length)return null;
 var e=U.pop();
 /* where it is standing goes onto the forward stack before it moves, under
    the name of the change being taken back, so the forward control can say
    what it will put back. */
 redoList().push({s:undoState(), nm:e.nm, t:e.t});
 undoApply(e.s);
 return {nm:e.nm, t:e.t};}

/* ============================================================
   COMPUTE. Everything downstream is a pure function of this.
   ============================================================ */
/* the Domain Matrix. the root domain a person runs makes them 1.3x more
   susceptible to its affine child fetters. that is the Distortion wiring.
   This was the first thing compute() did, and it was the only place n.susc
   was written. applyStory() reads n.susc to decide which addresses a story
   lands on, and the front door applies the story before compute() runs, so
   a story was attributed by whichever profile had been computed last. 944
   of 1560 profile pairs read differently by order. loadProfile() now runs
   this pass, so susceptibility always belongs to the profile being read. */
function suscAll(){
 const rootsIn=[...new Set(S.doms.map(d=>DOMAINS[d].r).concat(S.roots))];
 const aff=[...new Set(rootsIn.flatMap(rn=>AFFIN[rn]||[]))];
 W.forEach(n=>{
  const arc=Math.min(18,Math.floor(n.slot/(108/19)));
  const prox=aff.includes(n.cf)?1.3:1;
  n.susc=(0.40+0.60*DOMAIN[arc])*prox;});
 return aff;}
/* BALANCE. The nine child fetters split by the direction the body takes
   under them. Four discharge outward, five withdraw inward. That is the
   approach and withdrawal split, not a claim about anyone's character.
   The reading is the difference over the total, minus one to one, so an
   empty field reads zero rather than either pole. Sex at birth is stored
   and shown beside it; it does not enter the arithmetic. */
const OUTWARD=['Anger','Disgust','Anticipation','Surprise'];
const INWARD=['Fear','Shame','Sad','Apathy','Shock'];
function balance(){
 var o=0,i=0;
 OUTWARD.forEach(function(c){o+=S.charge[c]||0;});
 INWARD.forEach(function(c){i+=S.charge[c]||0;});
 /* Raw sums are not comparable: four axes discharge outward and five
    withdraw, so summing them biased every reading inward by a fifth. A
    simulation over 50,000 profiles put the split at 28 against 72 with no
    person in it. The means are what compare. */
 var om=o/OUTWARD.length, im=i/INWARD.length, t=om+im;
 /* And a field with nothing in it is not balanced, it is unread. Below a
    mean of 1 on both sides the strip says so rather than naming a pole. */
 return {out:o, in:i, outMean:om, inMean:im,
  read: (om>=1||im>=1),
  lean: t?(om-im)/t : 0};}
/* ============================================================
   WHETHER A LAW HAS BEEN ANSWERED. CQ sums the answered laws and counts the
   rest as 0, so it needs to know which is which, and S.law cannot say: an
   unanswered law holds the default 6 there, which is a plausible score.

   This is saveProfile's own test, so CQ counts exactly the laws a save would
   write as measured, and never one it would not. A law is in when the record
   holds it, or when it arrived measured, or when somebody has moved it off
   the seed it was given. A headless run that sets S.law with no profile
   loaded has nothing marked unset, so every law it set is in, which is what
   the simulation and the gates mean by setting it.
   ============================================================ */
function lawIn(nm){
 if(CURP&&CURP.laws&&CURP.laws[nm]!=null)return true;
 return !(LAW_UNSET[nm]&&S.law[nm]===LAW_SEED[nm]);}
/* Which arithmetic a stored reading came from. This is the second; the first
   never stamped its rows, so they read back as 0. snapshot() stamps it so two
   rows from two formulas are never compared as a move.

   The release lift below did not bump it, and that is deliberate. A row is
   stamped so a change of formula is never read as a move in the person. The
   lift starts at nothing on every record the day it ships and only grows from
   releases run after that, so a row before it and a row after it differ by
   work the person actually did, which is a move and is meant to read as one. */
const CQ_MODEL=2;

/* ============================================================
   A RELEASE MOVES THE LAWS AT ITS SEAT, A LITTLE. Ruled 25 September, after
   ship, correcting the team, who had read "CQ is the 21 laws" as "so a release
   can never touch it" and proved that as a hard rule:

     "I didn't say CQ doesn't move on a release. That wouldn't make sense. If
     a fetter is released, you may not see CQ move, but it may move 0.1 or
     0.05. I had about 15,000 patterns for my CQ. My CQ is about between 88
     and 92, plus or minus 3 points of accuracy. Those 15k releases raised my
     CQ."

   CQ is still the 21 laws over 210, and nothing else enters it. SQ and DQ are
   not folded in. What changed is what a law reads: a release closes a small
   share of the distance between each law at its seat and 10.

     law as CQ reads it = 10 - (10 - answer) x (1 - LIFT_R)^n

   n is the releases at that law's seat since the law was answered, and one
   release is one pattern of new ground: the meter's own unit, and the unit
   MARKERS already reads his fifteen thousand in. A rerun of ground already
   open is free and moves nothing, so the lift cannot be farmed, and it cannot
   outrun the ground there is: 200 patterns an address, 21,400 in the body.

   THE SEAT IS SI's OWN. Every law in SI is seated at a band, and compute()
   already reads that seating one way: a closed law relieves the charge at its
   own band. This is the same coupling read the other way, and every law at the
   seat takes the same step. No table maps a fetter to a law, so none is
   invented here.

   WHY THIS SHAPE, AND WHERE THE NUMBER COMES FROM. Fitted against his one
   data point, which is one anchor and not a curve (scratchpad lift/fit.js,
   reproduced by tests/engine.js 36e). His starting CQ is not known. The
   assumption is 50, his own "five is the average", with the 15,000 spread
   over the body the way the body is built. Two shapes were run at his scale:

     flat, a fixed step a release, capped at 10:
       from 30 lands 70.9, from 50 lands 90.0, from 70 lands 100.0
     this one, the step a share of the distance still left:
       from 30 lands 86.0, from 50 lands 90.0, from 70 lands 94.0

   A flat step lands where the person started plus a constant, so it fits him
   only if he happened to start at exactly 50, and anyone starting at 70 reads
   100 at about 14,000 releases, perfect integrity from releasing alone. This
   shape pulls every start toward the same place, so the unknown start barely
   matters: a start anywhere from 30 to 70 lands inside his 88 to 92, plus or
   minus 3. That is why it is this one.

   His other sentence is a check on it and was not fitted: a full run of 25
   patterns moves CQ 0.14 at 50, 0.11 at 60 and 0.055 at 80. A single pattern
   moves it 0.001 to 0.007, which no screen shows, which is his "you may not
   see CQ move". At 50 it takes about 180 releases to move a whole point.

   HOW WRONG THE NUMBER CAN BE. The rate each start would need to land 90:
   9.4e-4 from 30, 7.7e-4 from 50, 5.2e-4 from 70. Two significant figures is
   what one data point and an assumed start support, so two are written.
   Release alone can never reach 100: opening every pattern there is, from 50,
   reads 94.8. The last of it is the laws themselves moving, which is the
   person answering differently.

   A NEW ANSWER STARTS THE COUNT AGAIN. The count is kept with the answer it
   was earned against, and it counts only while the law still holds that
   answer. His own 88 to 92 is exactly this case: a reading taken after the
   work, which already contains it. Carrying the lift through a new answer
   would count his fifteen thousand twice. */
const LIFT_R=0.00077;
function lawLift(v,n){return n>0?10-(10-v)*Math.pow(1-LIFT_R,n):v;}
/* The releases a law has at its seat since it was answered, read off the
   record the laws in S were loaded from and nowhere else (LAW_REC, set with
   S.rec by loadProfile and loadP). Not CURP: the front door loads a profile
   into S without making it CURP, and a profile read there is its own only
   input. And checked against S.rec, the rule undo and the mirror already
   carry, so a field repointed without a load never wears another record's
   work. */
function lawWork(nm){
 var p=(typeof LAW_REC==='undefined')?null:LAW_REC;
 if(!p||!p.work)return 0;
 if(p.id&&S.rec!=null&&S.rec!==p.id)return 0;
 var w=p.work[nm];
 return (w&&w.on===S.law[nm]&&w.n>0)?w.n:0;}
/* a law as CQ reads it: the answer, and what the releases since have added */
function lawNow(nm){return lawLift(S.law[nm],lawWork(nm));}
/* CQ on its own, for the callers that need it without the whole reading */
function cqSum(){return SINAMES.reduce((a,l)=>a+(lawIn(l)?lawNow(l):0),0)/210*100;}
/* WHAT A RELEASE WRITES INTO THE LAWS. keys are the patterns of new ground the
   meter has just recorded, so a rerun passes none and moves nothing. Each key's
   address names a seat, and every answered law at that seat counts them. A law
   whose answer has changed since its count began starts again from the answer
   it holds now. A law not yet answered gets nothing: there is no reading to
   nudge, and CQ does not count it. p is the record the release was charged to,
   which relCoolDown guarantees is the one the laws in S came from. Returns
   what moved, by law, and CQ before and after as that record reads. */
function releaseWork(p,keys){
 var out={laws:{}, cq0:cqSum(), cq1:null, n:0};
 if(!p||!keys||!keys.length){out.cq1=out.cq0;return out;}
 if(!p.work||typeof p.work!=='object'||Array.isArray(p.work))p.work={};
 var bySeat={};
 keys.forEach(function(k){
  var n=BY[+String(k).split(':')[0]];
  if(n&&n.b){bySeat[n.b]=(bySeat[n.b]||0)+1; out.n++;}});
 SI.forEach(function(l){
  var u=bySeat[l.b]; if(!u||!lawIn(l.nm))return;
  var v=S.law[l.nm], w=p.work[l.nm];
  if(!w||w.on!==v)w=p.work[l.nm]={n:0,on:v};
  var before=lawLift(v,w.n); w.n+=u;
  out.laws[l.nm]={seat:l.b, u:u, n:w.n, from:before, to:lawLift(v,w.n)};});
 out.cq1=cqSum();
 return out;}
/* A LAW ANSWERED AGAIN IS A NEW READING, even when it lands on the same
   number. The count above would survive a same number answer, because it is
   keyed to the value; this is what the intake calls when a person changes an
   answer, so a new measurement always wins over the model's estimate. */
function lawAnswered(p,nm){if(p&&p.work&&p.work[nm])delete p.work[nm];}

/* ============================================================
   THE LEVER'S BELL, FITTED. The owner: "I'm a little tense is different than
   I'm paralyzed, it's orders of magnitude different ... so our bell curve
   becomes our multiplier." The pull at one address is the normal cumulative
   at its weight, centre LEVER_MU and width LEVER_SD, scaled so an address at
   10 pulls exactly 1.

   Fitted by the ten thousand run simulation (AZ5, scratchpad cq/cqsim.js),
   identical on two seeds. His words set the region: paralyzed (9) pulls at
   least 100 times a little tense (2), and the graded middle is at least as
   wide as the 4 to 6 he calls the range we travel. Inside it the data put
   the centre at 5 to 5.5; his "five is the average" decides 5, and 1.25 is
   the widest width at 5 that still clears 100 times (1.29 exact). Pull is
   0.008 at 2, 0.21 at 4, 0.50 at 5, 0.79 at 6, 0.95 at 7, 0.999 at 9: 122
   times from a little tense to paralyzed.

   The erf is Abramowitz and Stegun 7.1.26, error under 1.5e-7, and it is the
   same polynomial the simulation ran, so the worked people reproduce to the
   digit rather than to a tolerance. An address at 0 pulls 3.2e-5, not 0,
   because that is what the fitted curve says; it rounds away on every
   surface and it is not subtracted, because the simulation did not. ============ */
const LEVER_MU=5, LEVER_SD=1.25;
function leverPhi(z){
 const t=1/(1+0.3275911*Math.abs(z/Math.SQRT2)), x=z/Math.SQRT2;
 const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
 return 0.5*(1+(x>=0?y:-y));}
const LEVER_TOP=leverPhi((10-LEVER_MU)/LEVER_SD);
function leverPull(w){return leverPhi((w-LEVER_MU)/LEVER_SD)/LEVER_TOP;}

function compute(){
 const root=DOMAINS[S.dom].r;
 const rootsIn=[...new Set(S.doms.map(d=>DOMAINS[d].r).concat(S.roots))];
 const aff=suscAll();
 let loaded=[],sum=0;
 W.forEach(n=>{
  /* a closed law at this band lets charge sit deeper. integrity is local. */
  const relief=bandIg(n.b)/10;
  n.held = n.cf?clamp(S.charge[n.cf]*n.susc*(1-relief*0.42),0,10):0;
  /* the coherent opposite installed at the same address. an address with the
     opposite in does not merely read zero, it conducts. */
  n.rep  = n.cf?clamp((S.replace[n.cf]||0)*(0.72+0.28*relief),0,10):0;
  /* the binary. SQ is what is left of the held state after the pole is in. */
  n.sq   = clamp(n.held - n.rep*0.86,0,10);
  n.pole = clamp(n.rep - n.held,0,10);
  /* JOUISSANCE. the opposite overshot past the point where it serves.
     overshoot begins at 6. being loaded as well does not protect you from it;
     carrying the fetter and overdoing the cure is the commonest split there is. */
  n.jq   = clamp(n.rep - 6,0,4)/4*10;
  n.open = clamp(1-n.sq/10 + n.pole/26,0,1.18);
  if(n.sq>=4){loaded.push(n);sum+=n.sq;}});
 /* THE FOUR OUTSIDE THE BODY ARE SQ TOO. Ruled 25 September: "the four
    addresses outside the body do count as SQ because they're related to
    nerves within the body". They were forced to 0 here, so 4 of the 112 the
    product states could never carry anything and DQ summed over 108 while
    dividing by the 112. Each takes the mean of the seat it extends, the two
    above from the Crown and the two below from the Root, which is his torus.
    The simulation measured the heaviest of the seat as the alternative and
    could not tell the two apart (retest 0.06 of a point), so the simpler rule
    stands. They hold no charge of their own, so held, rep, pole and jq stay 0
    and nothing in the saboteur chain reads them. */
 const seatMean={Crown:0,Root:0};
 ['Crown','Root'].forEach(b=>{const g=W.filter(n=>n.b===b);
  seatMean[b]=g.reduce((a,n)=>a+n.sq,0)/g.length;});
 FIELD.forEach(n=>{n.sq=n.b==='Field-Above'?seatMean.Crown:seatMean.Root;
  n.open=clamp(1-n.sq/10,0,1);n.held=0;n.rep=0;n.pole=0;n.jq=0;});
 const SQm=loaded.length?sum/loaded.length:0;

 const sabs=[];
 /* SAB33: 33 named saboteurs matched on charge RANGES. */
 sab33Detect().forEach(function(d){
  const parts=W.filter(n=>n.b===d.band&&n.sq>=3).sort((a,b)=>b.sq-a.sq).slice(0,4);
  if(!parts.length)return;
  const key=d.charges[0]==='anxiety'?'Anticipation':
   ({fear:'Fear',anger:'Anger',shame:'Shame',disgust:'Disgust',apathy:'Apathy',
     shock:'Shock',sadness:'Sad',surprise:'Surprise'})[d.charges[0]];
  sabs.push({kind:'sab',nm:d.nm,hcx:FAM_OF[key]||'Collapse',named:true,
   score:d.score,exact:d.exact,charges:d.charges,auth:SABAUTH[d.nm]||null,
   parts,w:d.w,ang:meanAng(parts.map(n=>n.ang))});});
 ALL_SAB.forEach(s=>{const parts=s.nids.map(i=>BY[i]).filter(Boolean);
  const w=parts.reduce((a,n)=>a+n.sq,0)/parts.length;
  if(w>=3.7)sabs.push({kind:'sab',nm:s.nm,hcx:s.hcx,unnamed:!!s.unnamed,parts,w,
   auth:SABAUTH[s.nm]||null,ang:meanAng(parts.map(n=>n.ang))});
  /* the same cluster, overshot. a voice that will not stop rather than one that shuts. */
  const j=parts.reduce((a,n)=>a+n.jq,0)/parts.length;
  if(j>=3.7)sabs.push({kind:'sab',nm:s.nm+' overshot',hcx:FAM_POLE[s.hcx]||s.hcx,
   over:true,unnamed:!!s.unnamed,parts,w:j,ang:meanAng(parts.map(n=>n.ang))});});
 sabs.sort((a,b)=>b.w-a.w);

 const cxs=[];
 /* d is the line a person is shown and sub is the clinical correspondence,
    which is internal. Both are carried so the codex keeps its mapping and the
    card has something true to print that is not a diagnosis. */
 const FAMS=HCX_LIB.map(h=>({nm:h.nm,d:h.d,sub:h.sub})).concat(
  HCX_LIB.map(h=>({nm:FAM_POLE[h.nm],d:'the cure for '+h.nm.toLowerCase()
    +', done past the point where it helps',sub:'overshoot of '+h.nm,over:true})));
 FAMS.forEach(h=>{const fam=sabs.filter(s=>s.hcx===h.nm);
  for(let i=0;i+1<fam.length;i+=2){const parts=fam.slice(i,i+2);
   cxs.push({kind:'cx',nm:parts[0].nm+' + '+parts[1].nm,hcx:h.nm,over:!!h.over,parts,
    w:(parts[0].w+parts[1].w)/2,ang:meanAng(parts.map(p=>p.ang))});}});
 /* a family compounds into a hyper on two complexes, or on one complex that is
    already running hard. a two-complex-only gate makes the top unreachable. */
 const hys=[];
 FAMS.forEach(h=>{const fam=cxs.filter(c=>c.hcx===h.nm);
  if(fam.length>=2 || (fam.length===1 && fam[0].w>=6.5))
   hys.push({kind:'hy',nm:h.nm,d:h.d,sub:h.sub,over:!!h.over,parts:fam,
    w:fam.reduce((a,p)=>a+p.w,0)/fam.length,ang:meanAng(fam.map(p=>p.ang))});});
 hys.sort((a,b)=>b.w-a.w);
 const sups=[];
 for(let i=0;i+1<hys.length;i+=2){const parts=hys.slice(i,i+2),w=(parts[0].w+parts[1].w)/2;
  if(w>=5.6)sups.push({kind:'sup',nm:parts[0].nm+' / '+parts[1].nm,parts,w,
   ang:meanAng(parts.map(p=>p.ang))});}
 /* the six masks, one per developmental era, lit by what sits under it. */
 const maskRing=MASKS.map(m=>{
  const seg=W.filter(n=>m.b.indexOf(n.b)>=0);
  return {nm:m.nm,bands:m.b,w:seg.reduce((a,n)=>a+n.sq,0)/seg.length,
   ang:meanAng(seg.map(n=>n.ang))};});

 const dist=clamp(sabs.length*.19+cxs.length*.55+hys.length*1.35+sups.length*2.4,0,10);
 /* installed poles feed integrity. CQ and SQ are the same coordinate system read
    from opposite ends, so clearing one end must raise the other. But only up to
    the point of excess: past that the pole costs, it does not pay. */
 const poleMean=W.reduce((a,n)=>a+n.pole,0)/108;
 const JQ=W.reduce((a,n)=>a+n.jq,0)/108;
 const excess=W.filter(n=>n.jq>=4);
 /* Ig and It no longer enter CQ. They are kept because the Awareness and
    Will readouts and the will against drag steer below still read them. */
 const Ig=clamp(SINAMES.reduce((a,l)=>a+S.law[l],0)/21 + poleMean*0.30 - JQ*0.42,0,10);
 const It=clamp(BANDS.reduce((a,b)=>a+bandIg(b),0)/7 + poleMean*0.22 - JQ*0.30,0,10);
 /* DQ, THE TOTAL SHADOW. "DQ is a total shadow. I don't know why you keep
    asking me that." The 112 addresses summed over 1120, so it sits on the
    same 0 to 100 as CQ. It was sq over ten summed over the addresses at 4 or
    more, which dropped everything under the line and the four outside the
    body and had no ceiling at all. Not 100 minus CQ: that was one of his two
    statements and he has settled it as this one.

    ONE SHADOW TOTAL, NOT TWO. Resistance, vitality and drag read the old sum
    and it would have been easy to keep it for them under another name. Then
    the vitality drill would print one shadow weight while computing off a
    different one. They read DQ, with their constants unchanged. Where the
    weight sits above the line the two totals are close, Gordon 55.2 then
    54.3. Where it is spread under the line DQ reads higher, Diane 3.5 then
    19.7, because it now counts what the old sum dropped, and vitality and
    drag feel that weight too, which is the reason for counting it. */
 const SQ=NODES.map(n=>n.sq);
 const DQ=SQ.reduce((a,v)=>a+v,0)/1120*100;
 /* THE SIX AXES multiply what every held pattern costs. Detachment is the
    cheapest gate at 0.60, attachment the most expensive at 1.35. No story
    means no gate evidence, so the factor is 1 and nothing changes.
    Resistance is still computed and reported, because the gates drill names
    it, but it divides nothing any more: the owner ruled CQ is the 21 laws and
    nothing else, and verpFactor stops multiplying anything in CQ with it. */
 const _vf=verpFactor();
 const Rz=Math.max(1,(1+DQ*0.05)*_vf);
 /* ============================================================
    CQ, THE 21 LAWS SUMMED OVER 210. Ruled 25 September, fitted by the ten
    thousand run simulation (AZ5, DECISIONS.md "The CQ model, fitted").

    This was clamp(It*Ig/Rz). Ig was the law mean and It was the band mean of
    the same 21 laws, so the laws were counted twice and CQ went as their
    square: every law at 5 read 25 where his ruling reads 50 (AY2). And both
    factors carried poleMean and JQ, so installing an opposite past 6 pushed
    JQ up and CQ down: a release lowered CQ in 22 of 10,000 random fields
    (AY1, measured at 9f4c7e5). Neither can happen now, because nothing but
    a law score is read.

    AN UNANSWERED LAW COUNTS 0 AGAINST A FIXED 210, so CQ fills from zero as
    the laws land and can only rise while a person is answering. "I don't
    want it to go from 100 down, because that's demoralizing." The mean of
    the laws answered so far, which the desktop runs, fell in every one of
    10,000 simulated intakes; this rule fell in none of 630,000 answers.

    The default 6 still sits in S.law for an unanswered law, because the
    band relief inside sq and the Ig readout need a number. It never enters
    CQ: lawIn() is what says whether a law was answered. */
 const answered=SINAMES.filter(lawIn).length;
 const complete=(answered===SINAMES.length);
 /* each law as answered, plus what releases at its seat have added since. See
    LIFT_R above. It is still a law score and nothing else. */
 const CQ=cqSum();
 /* THE LEVER. Expression is CQ times what the shadow leaves: "CQ 100 SQ 0
    ... one pulls down the other, it's a lever", and the pull is his bell,
    applied per address because "a little tense" and "paralyzed" are
    intensity at a place. PULL is the mean of leverPull over the 112. */
 const PULL=SQ.reduce((a,v)=>a+leverPull(v),0)/SQ.length;
 const EX=CQ*(1-PULL);
 /* One table. This was a literal copy of the thresholds and the names, and a
    previous commit claimed to have removed the duplicate after removing only
    the one in the renderer. A rename would have drifted silently between the
    engine and the definitions. canon.js loads before this file, which is what
    makes tierOf reachable here.

    AND THE WORD WAITS FOR ALL 21. A partial CQ is a person coming into view,
    not a reading: after seven laws it can be at most 33, so a tier word on it
    would call everybody on day one Incoherent or worse. Null until complete,
    and every surface that names a tier says what is still to answer
    instead. Whether the word should name CQ or expression is the owner's
    question 1 and is not decided here; it stays on CQ until he rules. */
 const tier=complete?tierOf(CQ).nm:null;
 /* UNREAD. With nothing held and no law measured the product used to print
    CQ 36 and the word Incoherent off the default 6 on all 21 laws, in the
    largest type on screen, to someone who had not typed a word. CQ reads 0
    there now, because no law is in, but a stranger is still unread rather
    than a person at zero, and every surface that names a reading checks
    this first. */
 const measured=SI.filter(function(l){return CURP&&CURP.laws&&CURP.laws[l.nm]!=null;}).length;
 /* BELOW THE LINE. An address counts as carrying at SQ 4. Under that the
    charge is real, a person entered it, and every surface reported nothing
    held. Setting all nine axes to 4 gave an identical reading to setting them
    to 0: CQ 92.2, DQ 0.0, nothing carrying. That is the instrument saying
    nothing about something. The threshold stays, because it is what the
    arithmetic is built on, but the fact that there is charge underneath it is
    now reportable instead of invisible. */
 const under=W.filter(function(n){return n.sq>0&&n.sq<4;}).length;
 /* AND UNREAD COUNTS IT, because unread is a claim that nothing was entered
    and not a claim that nothing crossed the display line. Measured with all
    nine axes at 3.9: 107 addresses carrying, DQ 0.0, unread true, so Summary
    showed the four doors and said nothing had been entered while the release
    control offered the same 107 addresses and spent eight patterns a press on
    them. One surface billing for a field another surface denies exists is the
    worst version of this, so under is counted here. The display line is
    unchanged: DQ still reads 0 and nothing is called held, which is true. */
 const unread=(loaded.length===0&&measured===0&&under===0);
 /* benign and malig were CQ restated: malig was (50 minus CQ) doubled, so a
    surface asking whether a field was malignant AND decoherent was asking one
    question twice and could never get a no from one and a yes from the other.
    The owner's model needs two independent axes, so there are two now.

    SHAPE. Where the firing stack points. Predatory and Grandiosity run at
    other people, and Mania is Collapse turned outward. The rest lands on the
    person carrying it. This is the axis the book calls malignancy, and its
    threshold is the book's: harm to others becoming instrumental.

    CONTROL. Whether the will is directing or the drag is. Organised against
    chaotic, which is the difference between the devil and the demon.

    benign and malig keep their old meaning and their old callers, because
    they are the coherence read and several surfaces already print them. They
    are just no longer pretending to be a second axis.

    NULL WHILE CQ IS STILL FILLING. A person with a story in and no law
    answered reads CQ 0, and malig off that is 100: the most malignant field
    the scale can name, for somebody who has only not done the intake yet. */
 const benign=complete?CQ>=50:null;
 const malig=complete?(benign?0:Math.round((50-CQ)/50*100)):null;
 const X=clamp((1-S.charge.Apathy/10)*.3+(1-clamp(DQ/14,0,1))*.7,0,1);
 const Y=clamp((It/10)*.6+(1-dist/10)*.4,0,1);
 const Z=clamp((Ig/10)*(1-SQm/10),0,1);
 const radiance=Math.sqrt(X*X+Y*Y+Z*Z)/Math.sqrt(3);
 const af=affinity();
 let pi=0;af.forEach((v,i)=>{if(v>af[pi])pi=i;});
 let si=(pi+1)%12;af.forEach((v,i)=>{if(i!==pi&&v>af[si])si=i;});
 let dch=CHARGES[0];CHARGES.forEach(c=>{if(S.charge[c]>S.charge[dch])dch=c;});
 const will=(Ig/10)*(It/10),drag=clamp(DQ/14,0,1)*1.6+dist/10;
 const steer=will>=drag?'forced':'withheld';
 const mask=sups[0]||hys[0]||cxs[0]||sabs[0]||null;
 let darkB=BANDS[0],darkV=-1;
 BANDS.forEach(b=>{const gp=W.filter(n=>n.b===b),v=gp.reduce((a,n)=>a+n.sq,0)/gp.length;
  if(v>darkV){darkV=v;darkB=b;}});
 let weakL=SI[0];SI.forEach(l=>{if(S.law[l.nm]<S.law[weakL.nm])weakL=l;});
 /* THE TWO REAL AXES. Shape is where what is running points. Control is how
    far it has compounded, which is what conditioning is, and not whether the
    will is winning: at low coherence the will always loses, so measuring it
    that way made the devil unreachable and put every adversarial field in the
    chaotic corner. */
 const chain=sabs.concat(cxs).concat(hys).concat(sups);
 const outward=outwardShare(chain);
 const organized=organisedShare(chain);
 /* Angel needs CQ at 71 or more, which a partial CQ must not be read for */
 const gov=quadrant(outward,organized,complete?CQ:null);
 /* CARRYING IS NOT THE SAME AS HELD, and the product had only the second word.
    `loaded` is every address at or above the line at sq 4, and it drives the
    arithmetic: DQ, resistance, the saboteur scan. That stays exactly as it is.

    But every action surface also read `loaded`, and an absolute cut at 4 on a
    quantity that is often spread thin means a person can carry real load at
    every address and be told nothing is carrying. Measured across the roster:
    Marcus carries 99 addresses with his heaviest at 2.51 and is told nothing
    is carrying while the same screen calls him Incoherent. Sofia carries 52,
    Angela 74. Three of the six ICPs. And it is also where the release curve
    ran out: after two runs James is still Severe at CQ 18.6 with 72 addresses
    carrying, and every release control refused him.

    So `carrying` is its own word for its own thing: every address holding
    anything at all, heaviest first. `heaviest` is the top of it. Nothing here
    divides, multiplies or feeds CQ. It is a sort of what the field already
    says, so the arithmetic core keeps its bodies, and the action surfaces get
    something true to point at. */
 const carrying=W.filter(n=>n.sq>0).sort((a,b)=>b.sq-a.sq);
 return {loaded,carrying,heaviest:carrying[0]||null,
  sabs,cxs,hys,sups,maskRing,DQ,SQ,PULL,EX,Rz,vf:_vf,SQm,poleMean,JQ,excess,
  FAM_POLE,dist,Ig,It,CQ,answered,complete,tier,unread,measured,under,benign,malig,X,Y,Z,radiance,aff:af,pi,si,dch,steer,
  outward,organized,gov,
  will,drag,mask,darkB,darkV,root,rootsIn,weakL,balance:balance()};
}

/* ============================================================
   THE CEILING ON RELEASE. What expression reads once every charge is gone,
   which is the most a release can ever achieve, and the gap to it.

   Why this exists. A release empties addresses. What it does to integrity is
   small: it lifts the laws at its seat by a share of what is left (LIFT_R,
   about 0.005 of CQ a pattern at 50), and the laws otherwise move only when a
   person answers them. The product never said so, and offered release as its
   core loop, so a person pulled a lever that was nearly spent.

   THIS WAS cqCeiling. CQ is the laws and nothing else, and the part of it a
   release moves is too slow for one run to show, so the ceiling is read on
   expression, which is what a release moves visibly: the shadow, and through
   the lever, expression. So the ceiling is expression with the shadow gone, at
   the laws as they stand now. The lift the next releases add to the laws is
   not in it, which makes the headroom a slight understatement and never an
   overstatement.

   It is computed rather than simulated. With charge at zero, held is zero at
   every address, sq is zero whatever is installed, the four outside take a
   seat mean of zero, and the pull is leverPull(0) at all 112. Nothing is
   mutated and nothing is guessed. */
function exCeiling(){return cqSum()*(1-leverPull(0));}
/* the gap a release still has in it, for the person about to run one */
function exHeadroom(exNow){return Math.max(0,exCeiling()-exNow);}

/* ============================================================
   ACCURACY. Rebuilt from a layer ablation across visible axes x law
   coverage x expression. Both an additive and a multiplicative
   evidence form were fitted; additive won, 5.68 mean absolute error
   against 7.28.

     accuracy = 10 + 43*(1 - e^(-held/13)) + 28*lawCoverage + 18*expression

   Signal SATURATES rather than rising linearly: the curve is steep to
   about eight held addresses and flat after. A profile with 21/21 laws
   measured and an empty field is not at chance, it runs near 60.
   ============================================================ */
var ACC_BASE=10, ACC_AXG=43, ACC_K=13, ACC_LAWG=28, ACC_EXPG=18;
/* the profile is an argument, not ambient state. it defaults to the live one so
   every call site reads the same, but the fit stays measurable on any profile
   without first making it current. */
function accuracy(r,prof){
 var P=prof||CURP;
 var meas=SI.filter(function(l){return P&&P.laws&&P.laws[l.nm]!=null;}).length;
 var cov=meas/21;
 var sc=P?iqScore(P):{};
 var ks=Object.keys(sc);
 var rel=ks.length?ks.filter(function(k){return sc[k].reliable;}).length/ks.length:0;
 var held=W.filter(function(n){return n.sq>=4;}).length;
 var inst=W.filter(function(n){return n.pole>=4;}).length;
 /* an installed pole is readable signal too: a cleared address still says something */
 var eff=held+inst*0.35;
 var sig=eff>0?(1-Math.exp(-eff/ACC_K)):0;
 var E=exprRead();
 var exq=clamp(E.reduce(function(a,x){return a+x.fill;},0)/E.length/10,0,1);
 var fams={};[].concat(r.hys,r.sups).forEach(function(o){fams[o.nm]=1;});
 var deg=0;
 [['Collapse','Self-erasure'],['Numbness','Dissociation']].forEach(function(p){
  if(fams[p[0]]&&fams[p[1]])deg++;});
 var pct=ACC_BASE + ACC_AXG*sig + ACC_LAWG*cov + ACC_EXPG*exq;
 pct=clamp(pct*(1-deg*0.10),8.3,99);
 /* the interval is the fit's own error plus what is missing */
 var band=5.7*0.5 + (1-cov)*6 + (1-sig)*8 + deg*4 + (1-rel)*1.2 + (1-exq)*3;
 return {pct:pct, band:band, exq:exq, sig:sig, cov:meas, rel:Math.round(rel*100), relN:rel,
  held:held, inst:inst, deg:deg, signal:Math.round(sig*100)};}

/* ============================================================
   THE CHILD PATTERN. WHICH READING THIS IS, AND WHY IT IS AN ASSUMPTION.

   Ruled by the owner that a child pattern is special and has to be
   highlighted and located. What was never ruled is which of three things the
   phrase means, and the engine carries all three, so the count is not a
   detail of the wording. Measured on the roster the gates already load, at
   the same line compute() loads an address at:

     a) one of the nine in CHILD.      blank 0, James 4, Ana 8, Gordon 9
     b) a pattern imprinted in childhood, which is what AGES is for.
                                       blank 0, and 0 on every profile in
                                       the roster, because the age ladder
                                       stores nothing: AGE_ANS is a module
                                       variable in the drill and no profile
                                       field exists to hold a finding. The
                                       ceiling is the sixteen year rows.
     c) a child in the address ladder, meaning an address carrying while its
        seat's primary is carrying too.
                                       blank 0, James 9, Ana 20, Gordon 90

   Nine against ninety is the whole feature, which is why it is his call and
   not mine. CHILD_READ is the assumption, it is 'axis', and it is the
   narrowest of the three that is defensible: the nine are named, computed
   and drawn already, and (b) cannot be built at all until a profile has
   somewhere to keep a finding, which is a schema change and his.

   AND THERE IS NO SECOND LINE ANYWHERE IN HERE. The line an address carries
   at is compute()'s own, so childFound takes the reading rather than
   re-testing sq against a 4 typed a second time. The first cut tested
   S.charge on the axis instead, which counted nine axes for James where four
   of them have an address at or above the line: an axis can carry 5 and land
   nothing, because susceptibility and band relief scale it down per address.
   A figure of nine beside a panel showing four is the defect this repository
   has been bitten by nine times, in a new place.
   ============================================================ */
const CHILD_READ='axis';
/* the parent of an address in the ladder: the first address in its band,
   which is the plexus the seat is named for. Root is the lumbar plexus,
   Heart is the cardiac plexus. Derived, so a reordering of NODES moves it. */
const SEATPRIM={};
BANDS.forEach(function(b){SEATPRIM[b]=W.filter(function(n){return n.b===b;})[0];});
function childFound(r){
 var held=(r&&r.loaded)||[], out=[], at={};
 if(CHILD_READ==='ladder'){
  var on={}; held.forEach(function(n){on[n.i]=1;});
  held.forEach(function(n){
   var par=SEATPRIM[n.b];
   if(!par||par.i===n.i||!on[par.i])return;
   out.push({ax:n.cf||n.b, seat:n.b, at:n, under:par});});
 } else {
  /* one address per axis: where that child emotion sits heaviest. An axis
     with nothing at or above the line has no location, so it is not found.
     Sorted so the panel reads heaviest first, the way the pills do. */
  var by={};
  held.forEach(function(n){
   if(!n.cf)return;
   if(!by[n.cf]||n.sq>by[n.cf].sq)by[n.cf]=n;});
  CHILD.forEach(function(c){
   var n=by[c.nm]; if(!n)return;
   out.push({ax:c.nm, opp:c.opp, seat:n.b, at:n,
    n:held.filter(function(x){return x.cf===c.nm;}).length});});
  out.sort(function(a,b){return b.at.sq-a.at.sq;});}
 out.forEach(function(k){at[k.at.i]=k;});
 return {read:CHILD_READ, found:out, at:at, n:out.length};}
/* ============================================================
   THE PLAN. What a person is on, what it grants, and what it
   lets them see.

   HOST FREE, and deliberately so. Stripe is a network and this
   half of the product has none. Everything here is arithmetic over
   a plan record the host hands it, so the engine can answer what
   somebody may open and what they may see without ever knowing
   there is a payment processor in the world.

   The seam is one function in the UI that opens a hosted page. The
   engine never sees a key, a card, a customer id or a URL.

   THE LADDER IS THE OWNER'S, from DECISIONS. The gift is a hundred
   patterns with everything visible. Free is ten a week. The four
   paid tiers buy unique ground and sight, and neither of them buys
   more speaking, because a rerun costs nothing by construction.
   ============================================================ */

/* ============================================================
   SIGHT IS NOT FOR SALE. Ruled.

   > Tier one can see the Jungian archetypes. Actually, they can
   > see all that shit. It is really about the patterns and what
   > the patterns are doing. And then how many they can release.

   The ladder used to stop each tier somewhere along the chain.
   That is gone. Everybody sees the whole reading at every tier,
   free included. What a tier buys is one thing: how much new
   ground you may open.

   Simpler to explain, simpler to price, and it removes the one
   mechanic in the product that withheld a person's own reading
   from them in order to sell it back.
   ============================================================ */
const SEE_ORDER=['sab','cx','hy','sup'];
/* THE RUN CAP. A release run is at most twenty five patterns. It is a ceiling
   and not a size: a run costs the minimum for what was picked, and the cap
   only truncates a wide selection. It used to be both, which made every run
   cost twenty five and the free grant unspendable. */
const RUN_MAX=25;
/* THE SMALLEST RUN THERE IS: one address crossed with the four channels. It is
   the floor because a run has to cover the address on both sides and both
   tracks to be a release at all, and it is what an allowance is measured in
   now that a run costs the minimum rather than filling to the cap. Ten free
   patterns is two of these a week, which is a product. Ten against a run of
   twenty five was nought, which was not. */
const RUN_MIN=4;
const PLANS=[
 {k:'gift',  nm:'The gift',    per:'once',  grant:100,  see:'sup', lead:false,
  d:'A hundred patterns, free, with everything visible. Twenty five releases at one address, or fewer and wider. It is spent by opening new ground and never by rerunning what is already open.'},
 {k:'free',  nm:'Free',        per:'week',  grant:10,   see:'sup', lead:false,
  d:'Ten patterns a week, for life. Two releases at one address, and unlimited rerunning of anything already open. The whole reading is visible, the same as on every tier.'},
 {k:'one',   nm:'Tier one',    per:'month', grant:400,  see:'sup', lead:false,
  d:'Four hundred a month, a hundred a week. About what a month of half an hour of practice every day would release.'},
 {k:'two',   nm:'Tier two',    per:'month', grant:800,  see:'sup',  lead:false,
  d:'Eight hundred a month, two hundred a week. Twice the ground and nothing else different.'},
 {k:'three', nm:'Tier three',  per:'month', grant:1200, see:'sup',  lead:false,
  d:'Twelve hundred a month, three hundred a week. Three times the ground.'},
 /* TIER FOUR IS NOT MORE OF THE SAME. It carries the same twelve hundred as
    tier three, so patterns do not separate them at all: what tier four buys
    is the cohort lead suite. Ruled, and it is the one rung with a price
    attached. */
 {k:'four',  nm:'Tier four',   per:'month', grant:1200, see:'sup', lead:true,
  d:'The same twelve hundred as tier three, and the cohort lead suite. Manage profiles, build rituals and build accountability for the people you lead.'}];
const PLAN_BY={}; PLANS.forEach(function(p){PLAN_BY[p.k]=p;});
/* THE GIFT'S SIZE, NAMED ONCE. It is the gift row's grant above. planAllowance
   carried its own literal 100 in five places beside that row, which is the same
   number held twice and one edit away from two answers. */
const GIFT_N=PLAN_BY.gift.grant;
/* A FREE WEEK, as a length. The free tier's weeks are counted from the moment
   the gift ran out, seven days at a time, so a week needs no calendar, no zone
   and no host to start it. */
const WEEK_MS=7*24*3600*1000;
/* HOW MANY FREE WEEKS HAVE OPENED since the gift ran out, counting the one it
   ran out in. One when there is no date to count from, which is the reading a
   record that has never been stamped always had. Never below one, so a clock
   set backwards cannot take a week away. */
function planWeeks(at,now){
 var a=at?new Date(at).getTime():NaN; if(!isFinite(a))return 1;
 var n=(now!=null)?new Date(now).getTime():Date.now(); if(!isFinite(n))return 1;
 return Math.max(1,Math.floor((n-a)/WEEK_MS)+1);}
/* ============================================================
   WHAT A COHORT LEAD SEES OF SOMEBODY THEY LEAD.

   A separate axis from the personal sight ladder, and deliberately
   narrower than it. The owner's ruling: the outputs, not the tools.
   Fetters, saboteurs, complexes, hyper complexes. Their analytics.
   Not the spiritual material and not the story cloud. A snapshot.

   The story is the one thing that never crosses, because the story
   is the person's own words and the standing promise is that the
   record and the story are never held joined. A lead who can read
   twelve journals is a different product with a different
   obligation attached.
   ============================================================ */
const LEAD_SEES=['fetters','saboteurs','complexes','hyper complexes','analytics'];
const LEAD_HIDDEN=['the story cloud','the spiritual material','the tools themselves'];
function leadSees(what){ return LEAD_SEES.indexOf(what)>=0; }
/* the pain map and the tools are on every tier, ruled, so they are named
   here rather than left for a renderer to remember */
/* on every tier including free, and the list is long on purpose: it is
   everything except how much new ground you may open. */
const PLAN_ALWAYS=['the whole reading','saboteurs, complexes, hyper complexes and character',
 'the archetypes','the pain map','every tool','the journal',
 'rerunning anything already open'];
/* ANNUAL. TWO MONTHS FREE IS OUT, on the owner's ruling.

   It was ruled in as the convention and has been ruled back out, and this was
   not a document: planYear built the sentence "twelve months for the price of
   ten" and the settings surface printed it to a person. An offer the owner
   has withdrawn cannot keep being made by the product because the reversal
   only reached the design records.

   The discount is zero until a number is ruled. PLAN_YEAR_FREE stays as the
   one place that number lives, so setting it is the whole change when there
   is one, and at zero planYear says nothing about price at all.

   The allowance still arrives monthly rather than as a year in one lump,
   whatever the price, because the allowance is a pace and a year of patterns
   handed over at once is not a practice. That part was never about the
   discount. */
const PLAN_YEAR_FREE=0;
function planYear(k){
 var t=PLAN_BY[k]; if(!t||t.per!=='month')return null;
 var pay=12-PLAN_YEAR_FREE;
 return {pay:pay, grant:t.grant,
  say:(PLAN_YEAR_FREE>0
    ? 'Twelve months for the price of '+pay+'. The allowance still arrives '
      +'monthly, because it is a pace.'
    : 'Paid for the year. The allowance still arrives monthly, because it is '
      +'a pace.')};}

/* THE STATES A SUBSCRIPTION CAN BE IN, and what each one means for access.
   past_due keeps access, because cutting somebody off mid month over a card
   that expired is a punishment for a bank's timing. unpaid and canceled do
   not. The names are the processor's so that a record round trips without
   translation, and translation is where access bugs live. */
const PLAN_LIVE={trialing:1, active:1, past_due:1};
const PLAN_DEAD={canceled:1, unpaid:1, incomplete_expired:1, paused:1};
function planState(pl){
 if(!pl||!pl.tier||pl.tier==='free'||pl.tier==='gift')return 'none';
 if(PLAN_LIVE[pl.status])return 'live';
 if(PLAN_DEAD[pl.status])return 'ended';
 return 'pending';}
/* WHICH TIER IS ACTUALLY IN FORCE. A record can say tier three and be
   cancelled, and the answer is free, not tier three. Never read pl.tier
   directly anywhere else. */
function planOf(pl){
 var st=planState(pl);
 if(st==='live'&&PLAN_BY[pl.tier])return PLAN_BY[pl.tier];
 return PLAN_BY.free;}
/* SIGHT. Whether a rung of the chain is visible on this plan. */
function planSees(pl,kind){
 /* everybody, on every plan, including free. ruled. */
 return SEE_ORDER.indexOf(kind)>=0;}
/* the first rung this plan cannot see, which is what an upgrade buys and
   what a locked row has to name. null when everything is visible. */
/* there is no next rung of sight to sell, on any plan, ever. kept so a
   renderer asking the question gets a straight no rather than an error. */
function planNextSight(){ return null; }
/* ALLOWANCE. What is left to open this period. The gift is spent first and
   spent once, because it is a gift and not a monthly grant. Spend is never
   stored: it is always the unique count minus what has been granted, so the
   two cannot drift. */
function planAllowance(pl,uniqueCount,giftAt,now){
 /* IT TAKES A COUNT, AND IT NOW SAYS SO RATHER THAN TRUSTING IT.

    Two shapes of the same word live in this codebase and they are easy to
    confuse. `CURP.meter.unique` is the array of pattern keys, and
    `meterRead().unique` is already its length. The plan panel reads the
    second, which is correct, and I misread it as the first and changed a
    caller that was never broken. Checked afterwards, properly: that field is
    a number, and no build has ever shown a person a NaN here.

    What is worth keeping from the wrong turn is the guard. An array coerces
    to NaN the moment it holds more than one item, so a future caller handing
    this a list would put an unreadable number on the one surface that tells
    somebody what they have paid for and what is left. This takes either
    shape and can no longer emit NaN from any input. Array.isArray rather
    than a length check, because a string has a length too and the first cut
    read "x" as one pattern spent.

    The rule this broke is the one already written down here: reproduce the
    failure before fixing it. A direct call with a hand made array is not the
    caller, and I did not go and look at what the caller actually passes. */
 var n=Array.isArray(uniqueCount)?uniqueCount.length:uniqueCount;
 n=Number(n); if(!isFinite(n))n=0;
 var used=Math.max(0,n);
 var giftLeft=Math.max(0,GIFT_N-used);
 if(giftLeft>0)return {source:'gift', left:giftLeft, of:GIFT_N, inGift:true,
  base:0, spent:used, runs:Math.floor(giftLeft/RUN_MIN), weeks:0,
  /* what it is of, in words. "92 of the gift left" says ninety two of what. */
  say:giftLeft+' patterns left of the '+GIFT_N+' you were given'};
 var t=planOf(pl);
 /* The grant comes from the tier that is IN FORCE, not from the number
    written on the record, unless the plan is live and the host has written
    one for this period, which is how proration and a carried remainder
    arrive. A cancelled record carrying granted 400 must not spend 400: it
    drops to free and gets free's ten, which is the honest behaviour and not
    the punitive one. */
 var granted=(planState(pl)==='live'&&pl&&pl.granted>0)?Math.floor(pl.granted):t.grant;
 /* SPEND IS PER PERIOD, which needs a baseline and cannot be derived from a
    lifetime count. The first build subtracted every address ever opened from
    one month's grant, so somebody in their ninth month read nothing left on
    the day the month opened. base is the unique count when the current period
    began, written by the host when it writes the grant, and it defaults to the
    end of the gift so a record that has never had a period still reads
    correctly on its first one. */
 /* AND IT IS NEVER BELOW THE END OF THE GIFT. That default never fired: the
    schema wrote a literal 0 into every new record, 0 is not null, so every
    record read base 0, the gift's hundred were charged against the first free
    week, and the allowance read nought from the moment the gift ran out, for
    good. The schema no longer writes it, and the floor is here as well because
    every record saved before that fix still carries the 0 on disk. It is the
    rule and not a clamp: a period cannot open on ground the gift already paid
    for, so a baseline under the gift's end, written by anybody, charges the
    gift twice. The stored value is left as written. */
 var stored=(pl&&pl.base!=null&&isFinite(pl.base))?Number(pl.base):null;
 var base=Math.max(GIFT_N,stored===null?GIFT_N:stored);
 var spent=Math.max(0,used-base-Math.max(0,(pl&&pl.carried)||0));
 /* FREE BANKS, RULED IN DECISIONS: "the grant banks, the surface says it is
    banking". Nothing in a one file build starts a new week, so free was ten
    once and then never again. It is derived instead of written: every week
    since the gift ran out adds the tier's grant, and spend is everything opened
    past the gift. Nothing is stored but the date the gift ran out, which
    meterRun stamps as a fact about the meter, so a week cannot fail to start
    because no host was there to start it.

    Only while no host has written a period of its own. A record whose baseline
    sits past the gift's end had a period written by the record store, and the
    store that wrote it writes the next one. */
 var weeks=1, total=granted;
 if(t.k==='free'&&base===GIFT_N){ weeks=planWeeks(giftAt,now); total=granted*weeks; }
 var left=Math.max(0,total-spent);

    against the smallest run and not the largest: a run costs the minimum for
    what was picked, so what an allowance buys is answered by the floor. Saying
    nought runs on ten patterns was true only while every run cost twenty five. */
 var runs=Math.floor(left/RUN_MIN);
 return {source:t.k, left:left, of:total, inGift:false, base:base, spent:spent,
  runs:runs, weeks:weeks,
  say:!granted?'nothing left to open'
   /* more than one week's grant is only reachable by banking, and "18 of 10"
      says nothing, so a bank says what it is and what arrives next */
   :(left>granted?(left+' banked, and '+granted+' more arrive each '+t.per)
   :(runs>0?(left+' of '+granted+' left this '+t.per)
    :(left+' left this '+t.per+', banking toward a run of '+RUN_MIN)))};}
/* WHAT AN UPGRADE WOULD BUY, said in the two things a tier actually changes.
   Never phrased as what a person is missing out on, because the product does
   not sell by making somebody feel short. */
function planUpgrade(pl){
 var now=planOf(pl);
 var i=PLANS.map(function(p){return p.k;}).indexOf(now.k);
 var nxt=null;
 for(var j=i+1;j<PLANS.length;j++){if(PLANS[j].k!=='gift'){nxt=PLANS[j];break;}}
 if(!nxt)return null;
 var moreSight=false;                /* sight is not for sale. ruled. */
 /* A DIFFERENCE ONLY MEANS SOMETHING WHEN THE PERIODS MATCH. Free is ten a
    week and tier one is four hundred a month, and subtracting one from the
    other gave "390 more a month", which is arithmetic over two different
    units. Across a period boundary the tier states its own figure instead. */
 var same=(nxt.per===now.per);
 var moreGround=same?(nxt.grant-now.grant):nxt.grant;
 return {to:nxt, ground:moreGround>0?moreGround:0, sight:moreSight, same:same,
  say:(moreGround<=0?'the same ground'
     :same?(moreGround+' more of new ground a '+nxt.per)
     :(nxt.grant+' of new ground a '+nxt.per))
   +(moreSight?', and the next rung of the chain':'')};}

/* ============================================================
   WHAT AN ALLOWANCE IS WORTH, in the units people already price
   against. Every figure here is the codex's own, quoted:

     "Therapy tends to release one to six patterns per session, if
      you are lucky. Meditation, six to twelve patterns per twenty
      minute practice. Breathwork, similar. Plant medicine depends
      on exposure."

   Plant medicine is deliberately absent from the table. The book
   gives no figure for it and inventing one to make a comparison
   look good is the fastest way to lose an argument with somebody
   who has done it.

   TWO RULES ON HOW THIS MAY BE SAID.

   It is a claim about THROUGHPUT, never about outcome. How many
   patterns a thing releases is measurable against the book. What a
   person's life does afterwards is not, and the evidence tier does
   not carry it. So the copy says "as many patterns as", never "the
   same as" and never "instead of".

   And the low end is the one that gets said. A range of one to six
   quoted at six is the most flattering reading of your own number,
   which is exactly the reading a hostile reader will check first.
   ============================================================ */
const EQUIV=[
 {k:'therapy', nm:'therapy sessions',        lo:1,  hi:6,   unit:'a session',
  d:'One to six patterns a session, if you are lucky.'},
 {k:'medit',   nm:'thirty minute sittings',  lo:9,  hi:18,  unit:'per thirty minutes',
  d:'Six to twelve per twenty minutes, so nine to eighteen per half hour.'},
 {k:'breath',  nm:'breathwork sessions',     lo:9,  hi:18,  unit:'per thirty minutes',
  d:'The same rate as meditation.'},
 {k:'month',   nm:'months of daily practice',lo:270,hi:540, unit:'thirty minutes a day',
  d:'A month of half an hour every day, at the meditation rate.'}];
/* the second clause was the team's reasoning printed to the person. The
   reason a person needs is the first one, and tests/engine.js holds it. */
const EQUIV_NONE='Plant medicine is not on this list, because the book gives no rate for it.';
/* how many of a thing an allowance is worth. the low end first, because the
   low end is the claim that survives being checked. */
function equivOf(patterns,k){
 var e=EQUIV.filter(function(x){return x.k===k;})[0];
 if(!e||!(patterns>0))return null;
 return {k:k, nm:e.nm, lo:patterns/e.hi, hi:patterns/e.lo,
  /* the sentence, at the conservative end and phrased as throughput */
  say:'as many patterns as '+fmtN(patterns/e.hi)+' '+e.nm+' would release'};}
function fmtN(n){
 if(n>=10)return String(Math.round(n));
 if(n>=1)return String(Math.round(n*10)/10);
 return String(Math.round(n*100)/100);}
/* the one line a rung gets to say about itself, and it is the meditation month
   because four hundred a month lands inside two hundred and seventy to five
   hundred and forty, which IS a month of half an hour a day. */
function planWorth(patterns){
 var m=equivOf(patterns,'month'), t=equivOf(patterns,'therapy');
 if(!m||!t)return '';
 /* THE TEST IS WHETHER THE RANGE CONTAINS ONE, not whether a ratio is near
    it. Four hundred over the high rate is 0.74 months and over the low rate
    is 1.48, so a month sits inside the band and the honest sentence is "about
    a month". Comparing the conservative end to one instead said sixty seven
    therapy sessions, which is true and is the wrong unit. */
 if(m.lo<=1&&m.hi>=1)
  return 'About what a month of half an hour of practice every day would release.';
 if(m.lo>1)return 'About what '+fmtN(m.lo)+' months of half an hour a day would release.';
 return 'As many patterns as '+fmtN(t.lo)+' therapy sessions would release.';}

/* ============================================================
   THE AVATAR, THE PURPOSE MAP AND THE BOUNDARY.

   The becoming half. Release empties an address and replace fills
   it, and neither says what the person is filling it toward.

   Ported from the original Atuned build, not rebuilt. The owner's
   own sentence governs it: "one side is who the person is at their
   best, the other is who they are not. The app never rules on
   whether an attribute is a real edge or a saboteur wearing a
   virtue. That depends on where they are in their growth, and it
   is the thing they revise upward as they climb."

   Host free. The resolver and the seat weights come in as
   arguments, so nothing here reaches for a document or a store.
   ============================================================ */
const AV_MONTH=30*24*3600*1000;
function avatarBlank(){
 return {built:false, at:null, reviewedAt:null, pairs:[]};}
/* A PAIR IS WRITTEN AS A PAIR. The left side is a value and a value has no
   address. The right side is a sentence about a bad day, and a sentence about
   a bad day parses. That is why neither half is written alone. */
function avatarValid(pair){
 return !!(pair&&typeof pair.be==='string'&&pair.be.trim()
  &&typeof pair.notbe==='string'&&pair.notbe.trim());}
function avatarDue(av,now){
 if(!av||!av.built)return false;
 var last=av.reviewedAt||av.at||0;
 return ((now||Date.now())-new Date(last).getTime())>=AV_MONTH;}
function avatarDaysLeft(av,now){
 if(!av||!av.built)return null;
 var last=new Date(av.reviewedAt||av.at||(now||Date.now())).getTime();
 return Math.max(0,Math.ceil((AV_MONTH-((now||Date.now())-last))/86400000));}
/* THE GAP. The right side goes to the resolver, the resolver returns a seat,
   the seat has live imprints and the imprints have weight. The distance
   between who somebody is and who they are becoming is not a mood, it is a
   number at an address. seatLoad and seatIg are handed in so this stays pure. */
function avatarGap(pair,seat,seatLoad,seatIg){
 if(!avatarValid(pair)||!seat)return null;

  at:mirrorAt(seatLoad,seatIg)};}
/* completion read from work done rather than from work declared */
function avatarProgress(rows){
 var list=rows||[];
 if(!list.length)return null;
 var done=list.filter(function(r){return r.gap&&r.gap.clear;}).length;
 return {done:done, total:list.length,
  pct:Math.round(100*done/Math.max(1,list.length))};}

/* ============================================================
   THE PURPOSE MAP. Two overlapping triangles, and the overlap is
   the boundary.

   The owner's model. "Meaning is the end point of expression. At
   the end of expression, meaning creates purpose." The direction
   runs one way and purpose is what is left standing at the end of
   it, so a person may not type any of the three readings.

   Upward: the higher purpose, the soul's, three universal values.
   Downward: the earthly purpose, the ego's, three with a body
   attached. Each centre is the sum of its three corners. The line
   between the two centres is how a person makes money and how they
   find fulfilment doing it.

   Six values in. Nothing else is stored, because a derived value
   that is also stored is a value that can drift.
   ============================================================ */
const PUR_SIDES=['partner','family','friends','community','coworkers','alone'];
const PUR_PER_SIDE=5;
const PUR_SOUL='Universal. Freedom, free will, knowledge, wisdom, that register.';
const PUR_EGO='With a body attached. Health, fitness, financial stability, wealth, family.';
function purposeBlank(){
 var sides={}; PUR_SIDES.forEach(function(s){sides[s]=[];});
 return {soul:['','',''], ego:['','',''], sides:sides};}
function purposeReady(p){
 if(!p)return false;
 var f=function(a){return (a||[]).filter(function(x){return x&&String(x).trim();}).length===3;};
 return f(p.soul)&&f(p.ego);}
/* THE CENTRE IS THE SUM OF THE CORNERS and is never entered. With three words
   and no measurement behind them, the only honest centre is the three said
   together, so the product returns them rather than inventing a fourth. */
function purposeCentre(three){
 var a=(three||[]).filter(function(x){return x&&String(x).trim();});

function purposeRead(p){
 if(!purposeReady(p))return null;

  /* what the relation between the two centres answers, ruled */
  between:'Where those two meet is how you make money and how you find fulfilment doing it.'};}
/* THE HEXAGON IS THE BOUNDARY. Six sides, five commitments each, thirty in
   all. Inside is yours to protect and outside is choice. Thirty is not a lot
   to ask: this is the instrument, not an onboarding form, and a mirror half
   described shows half a person. */
function boundaryCount(p){
 if(!p||!p.sides)return {filled:0, of:PUR_SIDES.length*PUR_PER_SIDE, thin:PUR_SIDES.slice()};
 var n=0, thin=[];
 PUR_SIDES.forEach(function(s){
  var a=(p.sides[s]||[]).filter(function(x){return x&&String(x).trim();});
  n+=Math.min(a.length,PUR_PER_SIDE);
  if(a.length<PUR_PER_SIDE)thin.push(s);});

/* which side an imprint landed on, so the journal can say WHY the charge
   landed rather than only where. null when the entry names nobody. */
function boundaryCross(text){
 var t=String(text||'').toLowerCase();
 var MAP={partner:/\b(wife|husband|partner|girlfriend|boyfriend|spouse|marriage)\b/,
  family:/\b(mum|mom|mother|dad|father|parent|brother|sister|son|daughter|family)\b/,
  friends:/\b(friend|mate|friends)\b/,
  community:/\b(neighbour|neighbor|church|team|club|community|group)\b/,
  coworkers:/\b(boss|manager|colleague|coworker|co-worker|client|work)\b/,
  alone:/\b(myself|alone|on my own|by myself)\b/};
 for(var i=0;i<PUR_SIDES.length;i++)
  if(MAP[PUR_SIDES[i]].test(t))return PUR_SIDES[i];

/* ============================================================
   SOURCE PROFILE SCHEMA v1 · the cross-compatibility contract.
   Every number in the app derives from this and nothing else.
   Versioned so a v2 can migrate rather than break.
   ============================================================ */
/* v2 adds gates. The VERP mix is a cost multiplier of 0.60 to 1.35 on every

var SCHEMA_V=2, PKEY='source.profiles';
function blankProfile(name){
 var p={v:SCHEMA_V, id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
  name:name||'New profile', created:new Date().toISOString(), updated:null,
  soul:{doms:[0], arcs:[0,1], roots:[]},            /* the invariant */
  axes:{},                                          /* nine poled child fetters */

  who:{first:'', middle:'', last:'', sex:'', sealed:'',
   born:{date:'', time:'', place:'', zone:'', timeUnknown:false}},
  /* PER PROFILE INTERFACE PREFERENCES. quiet is the reduced motion switch the
     phone spec asked for and nothing had built; model is the consent to let a

     until a person turns it on, because it is a use of their own words. tone
     is the seat tone under a release, and it is off until a person turns it on
     for the same reason in a different organ: it is a sound in their ears. */
  ui:{quiet:false, model:false, tone:false},
  /* what the person said their type is, and what it wrote. null until stated. */
  seed:null,
  /* THE METER. One pattern is one release line delivered: one channel over
     one address. A six channel sweep over one address is six.

     Lines counts every line ever spoken, repeats included, because a person
     may rerun anything as often as they like and that is free. Unique holds
     the keys of the lines run at least once, and that is what the tier
     ladder buys: a tier is not how much you may speak, it is how much new
     ground you may open. It lives on the record and is never derived,
     because a derived count moves when the model moves and then the tier
     gate disagrees with the app about what was run. */
  meter:{lines:0, unique:[], firsts:[], first:null, last:null,
   /* the moment the unique count reached the gift's size, stamped once by

   giftAt:null},

  avatar:avatarBlank(), purpose:purposeBlank(),
  laws:{}, intake:{answers:{}, done:[], startedAt:null, completedAt:null},
  /* THE RELEASES SINCE EACH LAW WAS ANSWERED, by law: n patterns of new ground

var LAW_WAS={Justice:'Expression', Humility:'Discernment'};
/* AND THE RECORD THEY CAME FROM, as the object. The release lift reads the work

var LAW_REC=null;
function loadProfile(p){

 if(!p.meter)p.meter={lines:0,unique:[],first:null,last:null,giftAt:null};
 if(!Array.isArray(p.meter.unique))p.meter.unique=[];

 SI.forEach(function(l){

  if(v==null&&LAWWAS[l.nm]!=null&&p.laws[LAWWAS[l.nm]]!=null){

    address cost the same as eight. Against a free grant of ten unique patterns

    already noticed and described as the arithmetic rather than as a bug.

    is the fewest lines that covers the selection, and it is allowed to contain
    repeats. The cap still truncates a wide selection, which is what a ceiling

   A person does not have to clear a fixed number. They have to

   have been alive to accumulate it.

   The anchor is his: fifteen thousand by the age of fifty. That is
   three hundred a year, and three thousand a decade, not the two
   thousand a decade he estimated out loud. The arithmetic is stated
   here rather than rounded to the estimate, because every marker in
   the product derives from it.

   duality around five hundred, the beginning of nirvana around ten

   fifteen thousand those are exact thirtieths, one, twenty and
   thirty, and the three thresholds already in the book fall on
   thirtieths too, five, seven and nine. So the ladder is a fraction
   of a person's own load and always was. The absolute counts were
   one man's numbers at one man's age.

   They reach it at six. The distance is the same distance: all of
   what they are carrying.

   to 10 that are just seven, eight, nine, and 10. Looking for the root which
   is usually a 10." And: "it's their job to lead ... if they want to move on,
   source's job isn't to dig deeper, it's just to go cool."

   The reading is what is true of you now, and it is not an achievement, has no
   maximum, and is nobody's business to score. The record is what you did: how
   many days in a row you practised, how much ground you have opened, which
   marks you have earned. Those are counts of events that happened, and a count
   of what happened is honest. What is still refused is the shape "3 of 14",
   because that turns a record into a completion bar and invites a person to
   finish their own nervous system. Earned marks are shown. The next one is
   named with what it takes. The ones beyond it are not enumerated.

   Everything here is a pure function of a profile. No dates from the host: the
   caller passes the moment, so a test can hold time still and a streak cannot
   quietly break because a gate ran at midnight.
   ============================================================ */

/* a day key in the local frame of whoever recorded it, because a streak is
   counted in days a person lived and not in UTC. Derived from the stored
   timestamp rather than stored beside it, so an old record still counts. */
var DAY_MS=86400000;
function pracDay(t){
 var d=new Date(t); if(isNaN(d))return null;
 return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/DAY_MS);}

/* every distinct day carrying a saved ritual, newest first. */
function pracDays(p){
 var seen={}, out=[];
 ((p&&p.rituals)||[]).forEach(function(x){
  var k=pracDay(x&&x.t); if(k===null||seen[k])return; seen[k]=1; out.push(k);});
 return out.sort(function(a,b){return b-a;});}

/* THE STREAK, AND WHY TODAY IS NOT REQUIRED.

   A streak that breaks at midnight punishes a person for the hour they opened
   the app rather than for missing a day. It runs from the most recent day
   practised, and it is live while that day is today or yesterday. Practise
   today and yesterday's streak continues. Miss a whole day and it is over, and
   the length of what was lost is still reported, because the thing a person
   built is not deleted by having stopped. */
function streakRead(p,now){
 var days=pracDays(p), today=pracDay(now||Date.now());
 if(!days.length||today===null)return {run:0, live:false, last:null, best:0, days:0};
 /* THE RUN HALVES, IT DOES NOT RESET. Ruled, Bible 1133:
    Math.max(1, Math.ceil(s/2)) with one grace day.

    It used to break out of the walk at the first gap, so one missed pair of
    days threw away a month. Measured against a thousand simulated arrivals,
    a reset costs 36 of 1000 at day 30, and it is the wrong arithmetic as well
    as the expensive one: Lally 2010 found that missing one opportunity did not
    materially affect habit formation, so the penalty for a miss should be a
    penalty and not a demolition.

    Walked oldest to newest, because a rule that carries forward cannot be read
    backwards. A gap of one day is consecutive. A gap of two is the grace day
    and costs nothing. Three or more halves what was standing, and the day
    being walked is already inside the halved run rather than added to it.

    Nothing new is stored. This is the same day list read under a different
    rule, so an older profile gets the new arithmetic on the next render. */
 var asc=days.slice().reverse();
 var run=1;
 for(var i=1;i<asc.length;i++){
  var gap=asc[i]-asc[i-1];
  if(gap<=2)run++;
  else run=Math.max(1,Math.ceil(run/2));}
 var best=1,cur=1; for(var j=1;j<days.length;j++){
  if(days[j]===days[j-1]-1){cur++; if(cur>best)best=cur;} else cur=1;}
 var gap=today-days[0];
 return {run:run, live:gap<=1, last:days[0], best:best, days:days.length, gap:gap};}

/* THE LEDGER. Four quantities, each a count of something that happened.

   minutes is what the person put in. lines is what was spoken, repeats
   included, and ground is the unique addresses opened, which is the one the
   tier ladder charges for. clear is how many addresses are held at the far
   pole right now, and it is the only one of the four that can go down, which
   is correct: it is a state and not a tally. */
function ledgerRead(p){
 /* MINUTES PRACTISED WAS MINUTES PLANNED, and it was the one label in the
    product claiming what the data did not carry. Select the twenty minute scan,
    press save, close the tab, and the ledger read twenty minutes practised.

    A saved ritual is a plan. A ritual marked done is a thing that happened.
    They are now two counts and they are named differently. An entry saved
    before this existed carries no done key at all, and is read as practised
    rather than discarded, because a person's history is not ours to delete over
    a schema change. Only entries written from here on can be planned and not
    yet done. */
 var mins=0, plan=0, doneN=0;
 ((p&&p.rituals)||[]).forEach(function(x){
  var m=(x&&+x.min)||0; plan+=m;
  var done=(x&&x.done!==undefined)?!!x.done:true;
  if(done){mins+=m; doneN++;}});
 var m=(p&&p.meter)||{};
 var clear=0, carry=0;
 ((p&&p.axes)&&CHILD.forEach(function(c){
  var a=p.axes[c.nm]||{}; if((a.opp||0)>=4)clear++; if((a.held||0)>=4)carry++;}));
 return {minutes:mins, planned:plan, done:doneN,
  rituals:((p&&p.rituals)||[]).length,
  lines:+m.lines||0, ground:((m.unique||[]).length),
  clear:clear, carry:carry, snaps:((p&&p.history)||[]).length};}

/* ============================================================
   INTENTION, THE GAP BETWEEN WHAT WAS SAID AND WHAT WAS DONE. Ruled 25
   September: "You either did the thing you said you were gonna do or you
   didn't, and the reason why is going to be, there's a story in there from
   the SQ somewhere in the body." And: "you can have an emotion without an
   intention." So no charge is read into this number at all. It is the
   rituals a person committed to in the window, against the ones marked done.

   WHAT IS PORTED AND WHAT IS NOT. The number is the fitted model's own
   (cq-unified.md B.1): 100 times did over said, null when nothing was said,
   over the last seven days, which is the desktop's window. The reason half
   is not: the ruling ties each broken commitment to the address it was made
   for so the story stored there is the why, and a saved ritual carries a
   seat (band) and no address. Adding one is a schema change and SOURCE
   compatibility makes that the owner's call, so broken commitments are
   returned with their seat only and nothing here claims an address. Whether
   awareness scales this or sits beside it in words is his open question 4,
   so nothing scales it. It is not yet on any surface: the product's
   existing "intention" readout is It, the band mean of the laws, and putting
   a second number under the same word before he names one is the defect
   one word per concept exists to stop.

   An entry with no done key was saved before done existed. ledgerRead reads
   it as practised, which is right for minutes on a record, but here it would
   claim a commitment kept that nobody recorded either way, so it is left out
   of both counts. The caller passes the moment, as everywhere in this file. */
var INTENT_DAYS=7;
function intentionRead(p,now){
 var today=pracDay(now||Date.now()), said=0, did=0, broken=[];
 ((p&&p.rituals)||[]).forEach(function(x){
  if(!x||x.done===undefined)return;
  var d=pracDay(x.t); if(d===null||today===null)return;
  if(today-d<0||today-d>=INTENT_DAYS)return;
  said++;
  if(x.done)did++; else broken.push({t:x.t, band:x.band||''});});
 return {said:said, did:did, days:INTENT_DAYS,
  pct:said?100*did/said:null, broken:broken};}

/* THE MARKS.

   Each is a named thing, so each has an icon and a family, and the family has
   a colour that means what it means everywhere else: the seat. Three families,
   and they are the three things a person actually does here.

   Practice is what you kept up, and it sits at the root, because keeping up is
   the base everything else stands on. Ground is what you opened, at the throat,
   because opening ground is the act of saying the thing. Structure is what
   changed in the field, at the heart.

   A mark's test takes the ledger, the streak and the profile and returns true
   or false. Nothing in a test reaches outside those three. */
var MARKS=[
 /* practice */
 {k:'first', fam:'Practice', b:'Root', nm:'First run',
  d:'You ran one. The instrument is no longer a thing you are reading about.',
  ic:'M12 21V6 M7 11l5-5 5 5',
  t:function(l){return l.rituals>=1;}},
 {k:'week', fam:'Practice', b:'Root', nm:'Seven days',
  d:'Seven days in a row. This is where it stops being a decision each morning.',
  ic:'M4 6h16v14H4z M4 11h16 M8 3v4 M16 3v4',
  t:function(l,s){return s.best>=7;}},
 {k:'month', fam:'Practice', b:'Root', nm:'Thirty days',
  d:'Thirty in a row. The nervous system has had long enough to believe you.',
  ic:'M4 6h16v14H4z M4 11h16 M8 3v4 M16 3v4 M9 15l2 2 4-4',
  t:function(l,s){return s.best>=30;}},
 {k:'season', fam:'Practice', b:'Root', nm:'Ninety days',

  ic:'M12 3a9 9 0 109 9 M12 3v9h9 M12 12l5 5',

 {k:'hour', fam:'Practice', b:'Root', nm:'Sixty minutes',
