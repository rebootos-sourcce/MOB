  ic:'M12 3a9 9 0 100 18 9 9 0 100-18 M12 7v5l4 2',
  t:function(l){return l.minutes>=60;}},
 /* ground */
 {k:'ten', fam:'Ground', b:'Throat', nm:'Ten addresses',
  d:'Ten distinct addresses opened. Not ten runs. Ten places.',
  ic:'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z',
  t:function(l){return l.ground>=10;}},
 {k:'fifty', fam:'Ground', b:'Throat', nm:'Fifty addresses',
  d:'Fifty. Close to half the architecture has been opened at least once.',
  ic:'M3 12h18 M3 7h18 M3 17h18 M7 3v18 M17 3v18',
  t:function(l){return l.ground>=50;}},
 {k:'told', fam:'Ground', b:'Throat', nm:'First story',
  d:'You told it something true and let it read the charge out of that.',
  ic:'M4 5h16v11H8l-4 4z',
  t:function(l,s,p){return !!(p&&p.story&&(p.story.entries||[]).length);}},
 {k:'kept', fam:'Ground', b:'Throat', nm:'Ten stories',
  d:'Ten told. The field is being read from your own words and not from a form.',

  t:function(l,s,p){return ((p&&p.story&&p.story.entries)||[]).length>=10;}},
 /* structure */
 {k:'nine', fam:'Structure', b:'Heart', nm:'Nine axes',

 {k:'stated', fam:'Structure', b:'Heart', nm:'Blueprint stated',
  d:'You named your type, and the field carries that until you move it.',
  ic:'M4 20V8l8-5 8 5v12 M9 20v-7h6v7',
  t:function(l,s,p){return !!(p&&p.seed);}},
 {k:'aimed', fam:'Structure', b:'Heart', nm:'Purpose set',
  d:'Six values placed. The compass has something to point at.',
  ic:'M12 3a9 9 0 100 18 9 9 0 100-18 M12 8l3 8-3-2-3 2z',
  t:function(l,s,p){return !!(p&&p.purpose&&purposeReady&&purposeReady(p.purpose));}},
 {k:'turned', fam:'Structure', b:'Heart', nm:'First clearing',
  d:'An address that was carrying is held at the far pole instead.',
  ic:'M4 12a8 8 0 1116 0 8 8 0 01-16 0 M8 12l3 3 5-6',
  t:function(l){return l.clear>=1;}},
 {k:'seat', fam:'Structure', b:'Heart', nm:'Five clear',
  d:'Five addresses holding the opposite. That is structure, not a good day.',
  ic:'M4 12a8 8 0 1116 0 8 8 0 01-16 0 M12 4v16 M4 12h16',
  t:function(l){return l.clear>=5;}},
 /* the record itself */
 {k:'watched', fam:'Structure', b:'Heart', nm:'Ten snapshots',
  d:'Ten readings on file, so the movement is yours to see and not to recall.',

/* WHAT IS EARNED, AND WHAT IS NEXT. Never how many of how many.

   next is one mark: the nearest unearned one in the family the person is
   already furthest into, because the useful next thing is the one adjacent to
   what they are doing. Everything past it is deliberately not returned, so no
   caller can render a checklist of a person's unfinished self. */
function ladderRead(p,now){
 var l=ledgerRead(p), s=streakRead(p,now), got=[], left=[];
 MARKS.forEach(function(m){
  var ok=false; try{ok=!!m.t(l,s,p);}catch(e){ok=false;}
  (ok?got:left).push(m);});
 var by={}; got.forEach(function(m){by[m.fam]=(by[m.fam]||0)+1;});
 var lead=null, best=-1;
 left.forEach(function(m){var n=by[m.fam]||0; if(n>best){best=n; lead=m;}});
 return {earned:got, next:lead, ledger:l, streak:s};}

/* ============================================================
   COHERENCE OVER TIME. The series behind the graph.

   Every snapshot already carries an ISO stamp and a coherence, so the record
   is a time series and nothing on any surface was drawing it. Ruled: the span
   buttons become a graph, and the graph opens Summary.

   AN EMPTY SPAN SAYS EMPTY. A graph drawn from one point is a flat line, and a
   flat line is a claim: nothing changed. One reading is not a flat line, it is
   one reading, and the read says which so the renderer can say so too.
   ============================================================ */
var SPANS=[{k:'day',nm:'Day',d:1},{k:'week',nm:'Week',d:7},
 {k:'month',nm:'Month',d:30},{k:'quarter',nm:'Quarter',d:90},
 {k:'year',nm:'Year',d:365},{k:'five',nm:'Five years',d:1826}];
function spanOf(k){for(var i=0;i<SPANS.length;i++)if(SPANS[i].k===k)return SPANS[i];
 return SPANS[3];}
function seriesRead(p,spanKey,now){
 var sp=spanOf(spanKey), t1=(now===undefined?Date.now():now);
 var t0=t1-sp.d*86400000;
 var hist=(p&&p.history)||[];
 var pts=[];
 for(var i=0;i<hist.length;i++){
  var s=hist[i];
  if(!s||typeof s.cq!=='number')continue;
  var ms=Date.parse(s.t);
  if(!(ms>=t0&&ms<=t1))continue;
  pts.push({ms:ms, cq:s.cq, ig:(typeof s.jq==='number'?s.jq:null)});}
 pts.sort(function(a,b){return a.ms-b.ms;});
 /* WHAT THE SPAN CAN AND CANNOT SAY. Nothing at all is one state, one reading
    is a second, and two or more is a line. They read differently and a caller
    that cannot tell them apart will draw a flat line for a single point. */
 var st = !pts.length ? 'none' : (pts.length===1 ? 'one' : 'line');
 var lo=null, hi=null, first=null, last=null;
 if(pts.length){
  lo=hi=pts[0].cq; first=pts[0].cq; last=pts[pts.length-1].cq;
  for(var j=0;j<pts.length;j++){
   if(pts[j].cq<lo)lo=pts[j].cq;
   if(pts[j].cq>hi)hi=pts[j].cq;}}
 return {span:sp, state:st, pts:pts, n:pts.length,
  lo:lo, hi:hi, first:first, last:last,
  /* direction is only a claim when there are two ends to compare */
  dir: st==='line' ? (last>first?'up':(last<first?'down':'level')) : null,
  t0:t0, t1:t1};}
/* ============================================================
   THE OUTBOX. One seam, and an honest failure.

   CLAUDE.md is strict: source.html stays one file with no dependencies, and
   the app gains network at exactly one seam. A support question and a feedback
   submission both need network, and neither is that seam.

   The resolution is the pattern bindPlan and bindStore already use. This file
   never calls fetch and never knows what is on the other side. It builds an
   envelope, validates it at the boundary, queues it durably, and reports one
   of four states. A host binds a send function or it does not.

   NEVER SENT OFF A LOCAL ENQUEUE. A control that says "sent" when the thing is
   sitting in a queue on the person's own machine has lied about the only fact
   that mattered to them. Queued says queued.
   ============================================================ */
var OBKEY='source.outbox';
var OB_MAX=20, OB_BYTES=65536;
/* the free text ceilings, per kind. A ceiling is refused at the boundary and
   never silently truncated, because a silently cut sentence reads back to the
   person as something they never said. */
var OB_LIMIT={question:600, bug:600, rating:300, feedback:600};
var OB_KINDS=['question','bug','rating','feedback'];

/* WHAT AN ENVELOPE MAY CARRY. This list is the spec, not a summary of one.
   Anything not on it is refused by name, including by whoever adds a helpful
   field six months from now, because the gate asserts the key set exactly. */
var OB_KEYS=['kind','at','body','answers','band','build','platform','viewport'];
/* WHAT IT REFUSES, BY NAME. Read this before adding anything. */
var OB_NEVER=['name','first','middle','last','email','address','key','rk','rid',
 'customer','subscription','stripe','token','code','cookie','story','stories',
 'journal','imprints','born','birth','date','dob','cq','dq','sq','seed','type',
 'axes','laws','answers63','gates','device','ua','ip','geo','timezone','locale',
 'practitioner','roster','avatar','purpose','history','meter'];

function obStore(){ try{ return JSON.parse(STORE.get(OBKEY)||'[]'); }catch(e){ return []; } }
function obWrite(q){
 if(!STORE_BOUND) return false;
 try{ STORE.set(OBKEY,JSON.stringify(q)); return true; }catch(e){ return false; } }
function obCount(){ return obStore().length; }

/* THE BAND, BUCKETED. Two passes disagreed here and both were half right. A
   feedback row is worthless without knowing where on the curve it came from,
   because a three from a high reading and a three from a low one are opposite
   findings. But a fine grained band beside a platform and a theme is a cell of
   one in a panel of thirty. Three buckets keep the analysis and kill the cell.
   The raw reading never travels. */
function obBand(r){
 if(!r||r.unread) return 'unread';
 /* a CQ still filling is where somebody is in the intake, not on the curve,
    and bucketing it would file everybody mid intake as low */
 if(r.complete===false) return 'filling';
 var c=r.CQ;
 return c<50?'low':(c<70?'median':'high');}

/* THE BOUNDARY. validateProfile's posture, applied to what leaves rather than
   what arrives: refuse by name, never clamp, never strip in silence. */
function obValidate(e){
 var errs=[];
 if(!e||typeof e!=='object') return {ok:false,errs:['no envelope']};
 if(OB_KINDS.indexOf(e.kind)<0) errs.push('kind '+e.kind+' is not one of the four');
 Object.keys(e).forEach(function(k){
  if(OB_KEYS.indexOf(k)<0) errs.push('the envelope may not carry '+k);});
 var lim=OB_LIMIT[e.kind]||600;
 if(typeof e.body==='string'&&e.body.length>lim)
  errs.push('that is '+e.body.length+' characters and the limit is '+lim);
 /* WHAT THE PERSON TYPED IS CHECKED AND NEVER EDITED. A mail shaped string or
    a long run of digits is refused with the reason, so the person decides what
    to do about it. This will not catch a first name in a sentence and nothing
    anywhere may claim that it does. */
 var t=String(e.body||'');
 if(/[^\s@]+@[^\s@]+\.[^\s@]+/.test(t)) errs.push('that looks like an email address, '
  +'and nothing that identifies you can go in here');
 if(/\d[\d\s().-]{6,}\d/.test(t)) errs.push('that looks like a phone number or an '
  +'account number, and nothing that identifies you can go in here');
 return {ok:!errs.length, errs:errs};}

/* ONE QUEUE ENTRY. Over the cap is refused by name rather than evicting the
   oldest, because a queue that quietly discards a person's words has lost
   them, which is the failure this whole file exists to prevent. */
function obQueue(e){
 var v=obValidate(e);
 if(!v.ok) return {ok:false, why:v.errs[0], errs:v.errs};
 if(!STORE_BOUND) return {ok:false, why:'storage is blocked in this browser, so '
  +'there is nowhere to hold this. Copy it somewhere before you leave the page.'};
 var q=obStore();
 if(q.length>=OB_MAX) return {ok:false, why:'there are already '+OB_MAX
  +' waiting to send and nowhere to send them, so this one was not taken.'};
 var next=q.concat([e]);
 if(JSON.stringify(next).length>OB_BYTES) return {ok:false,
  why:'the outbox is full. Nothing was taken and nothing was thrown away.'};
 if(!obWrite(next)) return {ok:false, why:'could not write to storage. Nothing was taken.'};
 return {ok:true, queued:next.length};}

/* THE SEAM. Bound by the host exactly as storage and billing are. */
var SEND_HOST=null;
function bindSend(fn){ SEND_HOST=(typeof fn==='function')?fn:null; return !!SEND_HOST; }
/* THE FOUR STATES, and none of them is a guess. */
function obDrain(){
 var q=obStore();
 if(!q.length) return {state:'empty', n:0};
 if(typeof SEND_HOST!=='function') return {state:'nohost', n:q.length};
 /* THE BOUNDARY IS ON THE WAY OUT, NOT ONLY ON THE WAY IN.

    obValidate ran on queue and not on drain, so anything already sitting in
    the key went to the host unread: measured with a bound sender, name, email
    and story all crossed the wire, and every one of them is on OB_NEVER. The
    queue is on a disk a person, another build or another tab can write, so
    what comes off it is exactly as untrusted as what goes on.

    A refused entry is dropped rather than retried forever, and it is reported,
    because an envelope that can never be sent is not a queue item, it is a
    thing to tell somebody about. */
 var left=[], sent=0, err=null, bad=[];
 for(var i=0;i<q.length;i++){
  var v=obValidate(q[i]);
  if(!v.ok){ bad.push({i:i,errs:v.errs.slice(0,2)}); continue; }
  var r;
  try{ r=SEND_HOST(q[i]); }catch(ex){ r=false; err=String(ex&&ex.message||ex); }
  if(r===true) sent++; else { left.push(q[i]); if(!err)err='the send was refused'; }}
 obWrite(left);
 if(bad.length&&!left.length&&!sent)
  return {state:'refused', n:bad.length, bad:bad};
 if(!left.length) return {state:'sent', n:sent, refused:bad.length||undefined};
 return {state:'retry', n:left.length, sent:sent, why:err, refused:bad.length||undefined};}

/* ============================================================
   The engine is DOM free. In a browser these are globals on the
   concatenated script. In node the same file is requireable, so the
   engine can be tested headlessly and shared with Atuned through the
   one profile object the schema contract defines.
   ============================================================ */
if(typeof module!=='undefined'&&module.exports){
 module.exports={
  /* data */      NODES:NODES, SAB_LIB:SAB_LIB, HCX_LIB:HCX_LIB, SAB33:SAB33, SAB_PI:SAB_PI, GATEGLYPH:GATEGLYPH,

  /* meter */    meterFirst:meterFirst,
  /* source ai */ SRC_ASK:SRC_ASK, SRC_ROOT:SRC_ROOT, SRC_ONCE:SRC_ONCE, SRC_NEG:SRC_NEG,
                 srcNegated:srcNegated, srcPrior:srcPrior, srcRung:srcRung,
                 srcHear:srcHear, srcTurn:srcTurn,
  /* undo */     undoPush:undoPush, undoPop:undoPop, undoDepth:undoDepth,
                 redoPop:redoPop, redoDepth:redoDepth, redoPeek:redoPeek,
                  undoPeek:undoPeek, undoClear:undoClear, UNDO_MAX:UNDO_MAX,
  /* avatar */   avatarBlank:avatarBlank, avatarValid:avatarValid, avatarDue:avatarDue,
                 avatarDaysLeft:avatarDaysLeft, avatarGap:avatarGap,
                 avatarProgress:avatarProgress, AV_MONTH:AV_MONTH,
  /* purpose */  purposeBlank:purposeBlank, purposeReady:purposeReady,
                 purposeCentre:purposeCentre, purposeRead:purposeRead,
                 boundaryCount:boundaryCount, boundaryCross:boundaryCross,
                 PUR_SIDES:PUR_SIDES, PUR_PER_SIDE:PUR_PER_SIDE,
                 PUR_SOUL:PUR_SOUL, PUR_EGO:PUR_EGO,
  /* plan */     PLANS:PLANS, PLAN_BY:PLAN_BY, PLAN_ALWAYS:PLAN_ALWAYS, SEE_ORDER:SEE_ORDER,
                 PLAN_LIVE:PLAN_LIVE, PLAN_DEAD:PLAN_DEAD,
                 planState:planState, planOf:planOf, planSees:planSees,
                 planNextSight:planNextSight, planAllowance:planAllowance,
                 planWeeks:planWeeks, GIFT_N:GIFT_N, WEEK_MS:WEEK_MS,

/* ============================================================
   THE SEATS, AS SPRINGS. Targets are the engine's; the springs only carry a
   value from where it was to where the read put it.
     rd   the entry's reading at the seat, parseStory bands / 3, capped at 10
     rg   the rung, srcHear
     str  stress past five, the Field's own frStress curve on LEVER_MU
   ============================================================ */
var SEAT={};BN.forEach(function(b){SEAT[b]={rd:0,rv:0,rdT:0,rg:0,rgv:0,rgT:0,bend:0,bv:0,ph:0,rise:0};});
function frStressP(v){return v>LEVER_MU?0.18+0.82*Math.pow((v-LEVER_MU)/(10-LEVER_MU),0.8):0;}
function SEATS_T(){
 var p=ST.parse,h=ST.heard,rgs={};(h&&h.seats||[]).forEach(function(s){rgs[s.band]=s.rung;});
 BN.forEach(function(b){var o=SEAT[b],k=BKEY[b],t=p&&p.bands[k]?Math.min(10,p.bands[k]/3):0;
  if(t>o.rdT+0.01)o.rise=1.6;o.rdT=t;o.rgT=rgs[b]||0;});}
function stepSeats(dt){
 var snap=still();
 BN.forEach(function(b){var o=SEAT[b];
  if(snap){o.rd=o.rdT;o.rg=o.rgT;o.rv=o.rgv=0;o.bend=frStressP(o.rd);o.bv=0;return;}
  var sub=Math.max(1,Math.ceil(dt/(1/120))),sd=dt/sub;
  for(var s=0;s<sub;s++){
   var a=144*(o.rdT-o.rd)-2*.72*12*o.rv;o.rv+=a*sd;o.rd+=o.rv*sd;
   var a2=196*(o.rgT-o.rg)-2*.8*14*o.rgv;o.rgv+=a2*sd;o.rg+=o.rgv*sd;
   /* the Field's bend: w 14, damping .42, so it lands a fifth past its mark */
   var tb=frStressP(Math.max(0,o.rdT)),a3=196*(tb-o.bend)-2*.42*14*o.bv;o.bv+=a3*sd;o.bend+=o.bv*sd;}
  o.rise=Math.max(0,o.rise-dt);o.ph+=dt*(o.rise>0?0.9:0);});}

/* items that grow on landing, one per mark, per variant */
function itemStep(items,dt){var snap=still();
 Object.keys(items).forEach(function(k){var it=items[k],t=it.alive&&it.landed?1:0;
  if(snap){it.g=t;it.gv=0;}else{var a=220*(t-it.g)-2*.55*14.8*it.gv;it.gv+=a*dt;it.g+=it.gv*dt;}
  if(!it.alive&&it.g<0.01&&Math.abs(it.gv)<0.01)delete items[k];});}

  if(!items[m.key])items[m.key]={m:m,g:0,gv:0,alive:true,landed:false,born:performance.now()};
  else{items[m.key].m=m;items[m.key].alive=true;}});

function rgba(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}

/* TAU is the engine's own, 2 pi */

   o'clock, clockwise, each as wide as its share of the 108 somatic addresses */

 frame:function(dt,t){itemStep(VB.items,dt);var g=G,q=VB.box();g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,CW,CH);

  return {n:n,w0:w0,w1:w1,clears:w1<=6,opp:(CHILD.filter(function(c){return c.nm===n.cf;})[0]||{}).opp||''};});

    ['The release glows','the heaviest queued address\'s seat colour, brighter the heavier it is','compute, n.sq']],
 c:[['The chart slides left','one word read; the floor ticks are every word, kept or dropped','the tokens of the text'],
    ['A bar rises in a lane','one scored stretch of text, as tall as its amount over the largest in the lexicon','amt / PATHMAX']],
 d:[['A chip drops into a bin','the person\'s own word, in the seat it scored at','marksOf, srcHear words'],
    ['A bin widens','the seat has something in it; an empty seat stays a sliver','srcHear seats'],
    ['The dashed line','the second thing counted at a seat, which is where the rung reaches seven','srcRung'],
    ['A dial tick lights during the run','one thought line spoken; the ticks are the plan','meterPlan']]};
var NOTE_REL={
 a:'<b>Release, the field around it.</b> The card drops to the Field\'s own stage, darker than every panel, and carries one shell per queued address around its edge, in that address\'s seat colour and as thick as the address is heavy. His words: "maybe that field that\'s around it has a different call out look entirely."',
 b:'<b>Release, lit from within.</b> No border and no grey. The card is lit from its top edge in the seat colour of the heaviest address it will run, and the light is stronger the heavier that address is. The button takes the same colour, so the one action on the card reads as the light source.',
 c:'<b>Release, the lit slab.</b> The only light surface on a dark page, in the Snow lighting\'s own ground and ink. Kenya Hara\'s White: the one place the page changes its light is the place that changes the person.',
 d:'<b>Release, the dial.</b> A warm black and a brass hairline, the product\'s true gold token, where every other surface is a cool grey. The dial is the run: one tick per thought line, in its address\'s colour, the run time in the middle. During a run the ticks light one by one.'};
var NOTE_SHARED='<p><b>What changed in the release, on all four.</b> It says what it does in one line, before any control. Each address shows its weight now and its weight after the run, with the part the run takes off hatched: that is relCoolDown\'s own arithmetic, the same numbers the done card prints after a run, shown before it. The thought line the run speaks first is quoted. The cost is three figures with one word each: patterns, seconds, and patterns left. <b>Run a release</b> here plays the plan\'s own lines at the chosen pace and releases nothing.</p>'
 +'<p><b>Found while building, and shown rather than hidden.</b> "I was not scared" is set aside by Source AI as negated, so the root never appears under Heard. parseStory still charges four root imprints from the same word, so the imprints panel shows them, labelled with the words that did it. And the shipped journal sets a matched word in weight 600 over a caret that belongs to weight 300 text: measured 12.8 pixels of drift after five marks on one line. No mark here changes weight.</p>'
 +'<p><b>What each commit here does.</b> Commit writes the entry\'s charge onto an in-page copy of Nkem\'s field, which the release queue reads, and adds its seats to the earlier entries, which is how rungs nine and ten happen. Nothing is saved. Two earlier entries adds two example commits that touched the throat and the heart, seat keys only.</p>';
function paintNotes(){var v=ST.v,rows=NOTE_ROWS.concat(NOTE_VAR[v]||[]);
 $('idea').innerHTML=IDEA[v];
 $('notes').innerHTML='<h2>What moves, and what it is</h2><p>Nothing moves that the engine did not just do. There is no scanning sweep: the whole read takes under a millisecond, and an indicator for it would be a claim about effort that is false. Under Still, or the system\'s reduced motion setting, every value sits at its end state.</p>'
  +'<table><tr><th>Motion</th><th>What it represents</th><th>Where it comes from</th></tr>'
  +rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td><code>'+r[2]+'</code></td></tr>';}).join('')+'</table>'
  +'<h2>The release</h2><p>'+NOTE_REL[v]+'</p>'+NOTE_SHARED
  +'<p style="color:var(--dim)">Engine: '+esc(PROTO_STAMP.engine)+'. Built '+esc(PROTO_STAMP.when)+'. Requests made by this page: none.</p>';}

/* ============================================================
   SWITCHING, THE DEMO, AND THE FRAME LOOP
   ============================================================ */
function setV(v){if(!VARS[v])v='a';ST.v=v;document.body.setAttribute('data-v',v);
 document.querySelectorAll('#mkv button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-v')===v?'true':'false');});
 var pv=$('pv');if(v==='d'){$('colm').appendChild(pv);pv.classList.add('panel','im','alone');}
 else{$('imp').insertBefore(pv,$('imps'));pv.classList.remove('panel','im','alone');}
 if(location.hash.slice(1)!==v)history.replaceState(null,'','#'+v);
 VAR().init();VAR().sync&&VAR().sync();ST.marks.forEach(function(m){VAR().land(m);});
 SEATS_T();paintAll();}
function paintAll(){paintHL();paintCount();paintPrompt();paintSummary();paintImprints();paintStream();paintRelease();paintNotes();if(ST.v==='d')VD.paint();}
var EXAMPLE='My manager moved the deadline again and I said yes. My jaw was tight the whole call and I did not say anything. '
 +'I was not scared, I was angry. Afterwards I sat in the car and my throat was really tight. '
 +'I feel ashamed that I care this much. I slept well though, and I was grateful for the walk home.';
var DEMO=null;
function demo(txt,cps){stopDemo();var ta=$('ta'),i=0;ta.value='';onText('',true);
 var step=function(){if(i>=txt.length){DEMO=null;onText(ta.value,true);return;}var ch=txt.charAt(i++);ta.value+=ch;onText(ta.value);
  DEMO=setTimeout(step,ch==='.'?260:(ch===' '?46:(cps||32)));};step();}
function stopDemo(){clearTimeout(DEMO);DEMO=null;}
var LAST=0;
function loop(ts){var dt=Math.min(.05,(ts-(LAST||ts))/1000);LAST=ts;stepSeats(dt);if(CV&&VAR().frame)VAR().frame(dt,ts/1000);requestAnimationFrame(loop);}

function boot(){
 loadNkem();
 var ta=$('ta');
 ta.addEventListener('input',function(){stopDemo();onText(ta.value);});
 ta.addEventListener('scroll',function(){$('hl').scrollTop=ta.scrollTop;});
 /* a word closes when the caret leaves it, so moving away counts as finishing it */
 ta.addEventListener('blur',function(){if(ST.set!==ST.text)onText(ST.text,true);});
 document.querySelectorAll('#mkv button').forEach(function(b){b.onclick=function(){setV(b.getAttribute('data-v'));};});
 $('demo').onclick=function(){demo(EXAMPLE);};
 $('clr').onclick=$('jclr').onclick=function(){stopDemo();ta.value='';ST.passed=false;onText('',true);};
 /* the Move on button is repainted with the prompt, so it is bound there */
 $('prior').onclick=function(){ST.priorDemo=!ST.priorDemo;this.setAttribute('aria-pressed',ST.priorDemo);stRead();paintAfter();};
 $('still').onclick=function(){var on=!document.body.classList.contains('still');document.body.classList.toggle('still',on);this.setAttribute('aria-pressed',on);};
 $('commit').onclick=function(){if(!ST.parse||!ST.parse.imprints.length)return;
  applyStory(ST.set);ST.committed.push({bands:ST.parse.bands});stopDemo();ta.value='';ST.passed=false;onText('',true);paintRelease();};
 window.addEventListener('resize',function(){if(CV){sizeCanvas(CH);}});
 window.addEventListener('hashchange',function(){setV(location.hash.slice(1));});
 setV((location.hash||'#a').slice(1));
 requestAnimationFrame(loop);}
/* the test hook the screenshot harness drives, so a frame is taken of a state and not of a moment */
window.PROTO={setV:setV,demo:demo,type:function(t){stopDemo();$('ta').value=t;onText(t,true);},
 prior:function(on){ST.priorDemo=!!on;$('prior').setAttribute('aria-pressed',!!on);stRead();paintAfter();},
 rel:function(o){Object.assign(ST.rel,o);paintRelease();},run:function(){var M=relModel();startRun(M);},
 state:function(){return {v:ST.v,marks:ST.marks.length,turn:turnNow(),heard:ST.heard&&ST.heard.seats.map(function(s){return [s.band,s.rung];})};}};
boot();

</script>
