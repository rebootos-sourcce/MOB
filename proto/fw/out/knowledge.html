   THE FW MOCKUP KIT. Shared by every prototype in proto/fw/.

   The tokens are the product's own Dark values from shell/head.html, copied
   rather than invented, so a mockup is judged on its idea and not on a
   palette the product does not have. Inter is the product's own embedded

   ============================================================ */
:root{
 --bg:#0C0D12; --panel:#1A1D26; --panel-2:#252833; --sunk:#090A0E;
 --edge:rgba(255,255,255,.09); --edge-2:rgba(255,255,255,.14);
 --ink:#EFEDE8; --mid:#B4B0A8; --dim:#94908A;
 --root:#D6524C; --sacral:#D8924E; --solar:#DABF6A;
 --heart:#5FD5A6; --throat:#5EBBDB; --eye:#7D93E0; --crown:#A77EDB;
 --accent:#7EB8D4; --on-accent:#0B1418; --au:#C2A063;
 --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
 --r:14px; --tap:44px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
 font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}

/* THE PROTOTYPE SAYS SO ON ITS OWN FACE. Ruled in FK after two scares: a
   prototype wearing the product's clothes reads as the product. */
.pb{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
 padding:8px 16px;background:#2A2410;color:#F3E3B5;border-bottom:1px solid #5A4A1C;font-size:13px}
.pb b{font-weight:600;letter-spacing:.01em}
.pb .sp{flex:1}
.pb .who{display:flex;gap:4px;align-items:center;flex-wrap:wrap}

.wrap{max-width:1560px;margin:0 auto;padding:18px 16px 60px}
.hd{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:6px 0 14px}
.hd h1{font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em}
.hd p{margin:0;color:var(--mid);max-width:760px}
.eyebrow{font-size:12px;color:var(--dim);letter-spacing:.02em}

/* the option switch. one file, every option, switched in the page. */
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--edge-2);border-radius:999px;
 background:var(--sunk);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;
 min-height:36px;color:var(--mid);font-size:14px}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg.sm button{padding:5px 10px;min-height:30px;font-size:13px}

.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:16px}
.sunk{background:var(--sunk);border:1px solid var(--edge);border-radius:var(--r)}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge-2);border-radius:999px;
 padding:5px 10px;font-size:13px;background:var(--panel);cursor:pointer;min-height:32px}
.chip.on{border-color:var(--accent);color:var(--accent)}
.muted{color:var(--mid)} .dim{color:var(--dim)}
.small{font-size:13px}
.note{font-size:13px;color:var(--mid);border-left:2px solid var(--au);padding:4px 0 4px 10px;margin:10px 0}
.ic{display:inline-block;vertical-align:middle;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.today{border:1px dashed var(--edge-2);border-radius:var(--r);padding:10px;background:var(--sunk)}
.today img{max-width:100%;height:auto;display:block;border-radius:8px}
.today .cap{font-size:12px;color:var(--dim);margin-top:6px}
.qs{counter-reset:q}
.qs li{margin:6px 0}
@media (max-width:760px){
 .grid2{grid-template-columns:1fr}
 .hd h1{font-size:21px}
 .wrap{padding:12px 16px 60px}
 .pb{font-size:12px}
 .seg{border-radius:18px}
}

<style>
.grp{margin:22px 0 8px;display:flex;align-items:baseline;gap:12px}
.grp h2{margin:0;font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.04em}
.grp span{font-size:13px;color:var(--dim)}
.band{border:1px solid var(--edge);border-radius:18px;background:var(--panel);margin:8px 0;overflow:hidden;transition:border-color .2s}
.band.open{border-color:var(--edge-2)}
.bh{display:grid;grid-template-columns:56px 1fr auto 28px;gap:16px;align-items:center;width:100%;border:0;background:transparent;padding:14px 18px;cursor:pointer;text-align:left;min-height:76px}
.bh:hover{background:rgba(255,255,255,.025)}
.bh .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;border:1px solid}
.bh b{font-size:18px;font-weight:600;display:block}
.bh .d{font-size:14px;color:var(--mid)}
.bh .n{font-size:13px;color:var(--dim)}
.bh .chev{transition:transform .25s}
.band.open .chev{transform:rotate(180deg)}
.bb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.band.open .bb{grid-template-rows:1fr}
.bb>div{overflow:hidden}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:4px 18px 18px}
.it{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 8px 12px;border-radius:14px;background:var(--sunk);border:1px solid var(--edge);cursor:pointer;font-size:13px}
.it:hover,.it.on{border-color:var(--edge-2);background:#14161d}
.it small{color:var(--dim);font-size:11.5px;line-height:1.35}
.sub{padding:0 18px 4px;font-size:12px;color:var(--dim)}
.ladder{display:flex;flex-direction:column;gap:4px;padding:4px 18px 18px}
.ladder div{display:grid;grid-template-columns:14px 140px 1fr;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--sunk);font-size:13px}
.ladder i{width:12px;height:12px;border-radius:50%}
.detail{position:fixed;right:20px;bottom:20px;width:380px;max-height:70vh;overflow:auto;z-index:20;display:none}
.detail.open{display:block}
.srch{width:100%;max-width:520px;background:var(--sunk);border:1px solid var(--edge-2);border-radius:999px;padding:12px 18px;color:var(--ink);font:inherit}
/* summary */
.sum h1{font-size:40px;margin:0}
.sum .lead{font-size:22px;line-height:1.4;max-width:900px;margin:10px 0 22px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.three .card{display:flex;flex-direction:column;gap:10px}
.three h3{margin:0;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.03em}
.big{font-size:22px;font-weight:600}
.seatl{display:grid;grid-template-columns:18px 90px 1fr;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.bar{height:6px;border-radius:3px;background:var(--edge-2);overflow:hidden}
.bar i{display:block;height:100%}
.under{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.under .card{flex:1;min-width:260px;display:flex;gap:14px;align-items:center}
@media (max-width:900px){.three{grid-template-columns:1fr}.sum h1{font-size:30px}.sum .lead{font-size:18px}}

 it at face value","b":"Crown","ic":"M12 12m-5 0a5 5 0 1010 0 5 5 0 10-10 0M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"}],"MASKS":[{"nm":"Child","b":["Root","Sacral"],"ic":"M4 9a8 6 0 0116 0c0 6-4 10-8 10S4 15 4 9z M12 10v1","v":"gets small so somebody else decides"},{"nm":"Preteen","b":["Solar","Throat"],"ic":"M4 9a8 6 0 0116 0c0 6-4 10-8 10S4 15 4 9z M9 10v1 M15 10v1","v":"checks the room before it says the thing"},{"nm":"Teen","b":["Throat"],"ic":"M4 9a8 6 0 0116 0c0 6-4 10-8 10S4 15 4 9z M12 6v13","v":"pushes back on the person, not the problem"},{"nm":"Adult","b":["Sacral","Solar"],"ic":"M4 9a8 6 0 0116 0c0 6-4 10-8 10S4 15 4 9z M5 12h14","v":"handles it, and files what it cost"},{"nm":"Professional","b":["Solar","Throat"],"ic":"M4 9a8 6 0 0116 0c0 6-4 10-8 10S4 15 4 9z M8 13h8v5H8z","v":"performs competence until the feeling passes"},{"nm":"Ideological","b":["3rd Eye"],"ic":"M4 9a8 6 0 0116 0c0 6-4 10-8 10S4 15 4 9z M9 4a3 3 0 006 0","v":"answers from the position instead of the moment"}],"HCX_LIB":[{"nm":"Grandiosity","d":"the shape is held bigger than it is, and the gap is defended","sub":"narcissism · histrionic","b":"Throat","ic":"M12 3a9 9 0 100 18 9 9 0 100-18 M12 7a5 5 0 100 10 5 5 0 100-10"},{"nm":"Predatory","d":"other people are read as terrain, and the move is made before it is felt","sub":"machiavellian · antisocial","b":"3rd Eye","ic":"M3 3l9 9 M12 12l9-9 M12 12v9 M8 21h8"},{"nm":"Collapse","d":"the structure gives way downward and stays down","sub":"depression · BPD · anxiety","b":"Root","ic":"M4 20h16 M6 20V9 M18 20V9 M6 9l6 5 6-5"},{"nm":"Rigidity","d":"nothing is allowed out of its cell, including you","sub":"OCPD · paranoia","b":"Solar","ic":"M4 4h16v16H4z M4 12h16 M12 4v16"},{"nm":"Dysregulation","d":"the swing overshoots at both ends and never settles at the middle","sub":"bipolar · ADHD","b":"Sacral","ic":"M3 12h3l2-7 3 14 3-11 2 4h5"},{"nm":"Dissociation","d":"the outline holds and there is nobody inside it","sub":"schizoid · withdrawal","b":"Crown","ic":"M12 3a9 9 0 019 9 M21 12a9 9 0 01-9 9 M12 21a9 9 0 01-9-9 M3 12a9 9 0 019-9"}],"SABDEF":{"negotiator":{"c":"S01","d":"Argues against your own intentions. Always sounds reasonable. Never says stop forever, says stop today. The fear of discomfort is mild enough to be rationalized away. The happiness available from the easier option is just high enough to make the rationalization feel earned. Together they produce the internal diplomat who can talk you out of anything, not through force, but through the perfectly reasonable argument that now is not the right moment. The most dangerous saboteur in the system because it sounds exactly like you.","t":"The moment between intending to do the necessary thing and beginning to do it. The pause.","i":"Begin the action before the internal dialogue completes. Remove the pause. The Negotiator only has power in the gap between intention and motion. Close the gap.","q":"I can start tomorrow. / Just this once. / I've earned a break."},"controller":{"c":"S02","d":"Hypervigilance at the level of outcomes. The foundation of the Type A pattern. Not a personality trait, a fear response that has been running so long it looks like a management style. The fear underneath: something will go wrong, someone will get hurt, or the situation will fall apart if I release my grip. Self-control registers as 10. Anything less registers as loss. The delta between perceived control and actual control is the zone of active saboteur behavior. Anger layers in as a do-as-I-say mechanism, authority used to close the control gap quickly. Entitlement provides the justification: it is not just that I need to control this. It is that I am right to. Competition drives the adversarial edge, not just winning but not-losing, which is a different frequency entirely.","t":"The moment control begins to slip. Uncertainty in outcomes. Others not performing to expectation. Delegation without confirmation. Silence where confirmation should be.","i":"Control is not a state. It is a belief held under pressure. The person fails control the same way a person fails a landing, only if they quit. Recognize that the need to be in control and the experience of being out of control are both charges, not conditions. Neither is real. Locate the fear underneath. Release the fear. The control behavior loses its substrate.","q":"If I don't control this, something will go wrong."},"victim":{"c":"S03","d":"Focuses on internal feelings and victim mentality for attention. Martyrdom.","t":"When accountability is required.","i":"Identify one thing within your control. Take one action on it.","q":"This keeps happening to me."},"perfectionist":{"c":"S04","d":"Continuous pressure to do better. Anxiety about imperfections in self and others.","t":"Before completion or release of work.","i":"Set a fixed completion time. Release at that time regardless of state.","q":"It is not good enough yet."},"pleaser":{"c":"S05","d":"Indirectly tries to gain acceptance by helping, pleasing, rescuing, or flattering.","t":"When there is potential for disapproval or when a boundary is needed.","i":"State a preference or limit once. Do not explain or apologize.","q":"My worth depends on making others happy."},"hyper achiever":{"c":"S06","d":"Dependent on constant performance for self-respect. Workaholic.","t":"When performance is not being measured or when rest is available.","i":"Rest without producing for one hour. No metrics.","q":"My worth is in my output."},"hyper rational":{"c":"S07","d":"Processes everything through logic. Impatient with emotional concerns.","t":"When emotional input is offered.","i":"Name the emotion present in the room before analyzing the problem.","q":"If I can't explain it, it isn't real."},"hyper vigilant":{"c":"S08","d":"Continuous anxiety about potential dangers. Constant risk management.","t":"When the environment changes or trust is required.","i":"Identify one thing that is safe. Hold that for 60 seconds.","q":"The threat is always just ahead."},"restless":{"c":"S09","d":"Constant search for new activities. Rarely at peace with the current moment.","t":"When the current situation becomes familiar or stable.","i":"Stay with the current thing for twice as long as the impulse to move suggests.","q":"The next thing will be better."},"stickler":{"c":"S10","d":"Perfectionism and need for order. Anxiety when standards are not met.","t":"When the environment or person deviates from the correct way.","i":"Identify one situation where your standard is serving your fear, not your values.","q":"There is a right way and a wrong way."},"judge":{"c":"S11","d":"Judges self and others. Replays past failures. The master saboteur, activates all others.","t":"When someone, including self, falls short of standard.","i":"Find one thing that is right about the situation being judged.","q":"Someone is responsible for this."},"deflector":{"c":"S12","d":"Does not own. Justification to avoid accountability.","t":"When direct accountability or personal disclosure is required.","i":"Stay with the direct question for 10 seconds before redirecting.","q":"If they knew the real me they would leave."},"dramatizer":{"c":"S13","d":"Amplifies the emotional intensity of situations to generate attention or movement.","t":"When intensity of feeling is present and an audience is available.","i":"Reduce the intensity of the next statement by half.","q":"My pain must be visible to matter."},"worrywart":{"c":"S14","d":"Runs continuous worst-case scenarios. Mistakes anxiety for planning.","t":"When the future is uncertain.","i":"Name the specific worst case. Name one action if it occurs.","q":"Worrying is preparation."},"loner":{"c":"S15","d":"Withdraws from contact as protection. Independence as defense, not a value. Fear of rejection co-mingling with shame of belonging at sufficient magnitude. The person does not experience themselves as afraid, they experience themselves as preferring solitude. Release the fear and sad nodes and the solitude remains if chosen, not if driven.","t":"When connection is available and would be beneficial.","i":"Make one direct request for connection.","q":"Needing others is weakness."},"people pleaser":{"c":"S16","d":"Approval-seeking at the expense of authenticity.","t":"When approval is uncertain or a boundary is needed.","i":"Identify the response that serves the relationship rather than the approval.","q":"If they don't like me I have failed."},"skeptic":{"c":"S17","d":"Defaults to distrust and doubt. Skepticism as protection against disappointment.","t":"When new information challenges the current model.","i":"Sit with the new information for 24 hours before dismissing it.","q":"Trust gets you hurt."},"dreamer":{"c":"S18","d":"Lives in possibility without building the bridge toward it. Avoids the friction of execution.","t":"When the gap between vision and current reality is visible.","i":"Identify one concrete step. Execute it today.","q":"Someday the conditions will be right."},"procrastinator":{"c":"S19","d":"Delays action on important tasks. Mistakes motion for progress.","t":"When the important task is clear and available.","i":"Begin. Not finish. Not plan. Begin. Three minutes.","q":"I work better under pressure."},"imposter":{"c":"S20","d":"Believes their competence is unearned and discoverable as fraud.","t":"When competence is being evaluated or recognition is offered.","i":"Identify one thing you know that the room does not. State it.","q":"They will find out I do not belong here."},"aggressor":{"c":"S21","d":"Uses anger and force to override resistance. Mistakes compliance for agreement.","t":"When authority is challenged or outcome is not proceeding as required.","i":"Pause 5 seconds. Name the fear underneath the anger before responding.","q":"Aggression gets results."},"martyr":{"c":"S22","d":"Sacrifices for others to generate obligation or moral authority.","t":"When sacrifice has been made and goes unrecognized.","i":"Identify whether the sacrifice was chosen or performed. If performed, stop.","q":"I give everything and receive nothing."},"cynic":{"c":"S23","d":"Undermines possibility through pre-emptive dismissal.","t":"When hope or enthusiasm is present in self or others.","i":"Identify one thing good about the situation being dismissed.","q":"Optimism is naive."},"manipulator":{"c":"S24","d":"Achieves outcomes indirectly through influence, withholding, or positioning.","t":"When the direct approach feels risky.","i":"State the actual need directly. Once. Without positioning.","q":"Direct requests make me vulnerable."},"overthinker":{"c":"S25","d":"Loops on decisions past the point of useful analysis.","t":"When a decision is required and the outcome is uncertain.","i":"Set a decision time limit. Decide at that limit. Do not extend it.","q":"More analysis will produce the right answer."},"escapist":{"c":"S26","d":"Uses pleasure, distraction, or movement to exit discomfort before it resolves.","t":"When the present moment is uncomfortable and an exit is available.","i":"Stay in the discomfort for two minutes. Name what is present.","q":"I just need to not feel this right now."},"avoider":{"c":"S33","d":"Declines the engagement before it can cost anything. Not fleeing discomfort the way the Escapist does, and not arguing the way the Negotiator does. Simply not present for it.","t":"When something asks to be dealt with and not dealing with it carries no immediate penalty.","i":"Name the thing being avoided out loud, then do the smallest piece of it.","q":"If I stay unaware, nothing can land on me."},"nihilist":{"c":"S27","d":"Removes the foundation of meaning as a pre-emptive strike against disappointment.","t":"When meaning is required to justify effort.","i":"Identify one action worth doing regardless of meaning. Do it.","q":"Nothing matters enough to sustain effort."},"innocent":{"c":"S28","d":"Maintains deliberate unawareness to avoid responsibility or conflict.","t":"When complexity, conflict, or moral weight is present.","i":"Name one thing you know that you are pretending not to know.","q":"I don't want to be involved."},"pessimist":{"c":"S29","d":"Pre-empts positive outcomes by building a case against them before they materialize.","t":"When a positive outcome is possible.","i":"Identify the best plausible case. Operate from that.","q":"It will not work out."},"catastrophizer":{"c":"S30","d":"Projects the worst possible outcome onto every uncertainty. Distinguishable from Worrywart by magnitude, Catastrophizer reaches existential threat from ordinary uncertainty.","t":"Any unresolved uncertainty.","i":"Describe the actual current situation without projection. Stay in the present tense.","q":"This will destroy everything."},"enabler":{"c":"S31","d":"Supports others' destructive patterns to maintain relationship or avoid conflict. Distinct from Pleaser: the Enabler supports behavior they recognize as harmful.","t":"When someone they care about is repeating a destructive pattern.","i":"Name what you see. Once. Without attachment to the response.","q":"If I say something they will leave."},"control freak":{"c":"S32","d":"The colloquial name for the Controller and Hyper-Vigilant composite at Type A intensity. Hypervigilance running on outcomes and on threat at the same time. The body is scanning forward (what could go wrong) and downward (am I in command of this) in continuous loop. Reads to other people as competence under pressure. Reads in the body as never landing. The same fear that drives Controller (something will go wrong if I release grip) and the same fear that drives Hyper-Vigilant (the threat is just ahead) co-mingle here at sufficient magnitude that they cannot be felt as separate. Distinct from Controller alone: Control Freak does not wait for the control gap to open before acting. Distinct from Hyper-Vigilant alone: Control Freak organizes the scan around its own agency, not around external monitoring. Type A is the social presentation. The somatic state is sustained sympathetic activation that the body has normalized as baseline.","t":"Any environment the person did not configure. Any outcome the person did not design. Any silence where confirmation should be.","i":"Lock the jaw, the shoulders, and the diaphragm for a count of five. Notice they were already locked. Release on the exhale. The release is not a relaxation technique, it is a demonstration that the body can hold a state without scanning it. Repeat until the scan stops without being asked to.","q":"If I am not running this, no one is."}},"CHILD":[{"nm":"Fear","seat":"Root","ic":"M12 3l8 14H4z","opp":"Trust","addr":"Lumbar plexus","loc":"lower back, gut"},{"nm":"Anger","seat":"Solar","ic":"M13 2L4 14h6l-1 8 9-12h-6z","opp":"Equanimity","addr":"Celiac plexus","loc":"upper abdomen"},{"nm":"Shame","seat":"Sacral","ic":"M5 20V9a7 7 0 0114 0v11M9 20v-6h6v6","opp":"Worth","addr":"Pudendal plexus","loc":"pelvic floor"},{"nm":"Disgust","seat":"Sacral","ic":"M4 8c4 4 12 4 16 0M6 16c3-3 9-3 12 0","opp":"Acceptance","addr":"Sacral and dermis","loc":"lower abdomen, skin"},{"nm":"Apathy","seat":"Throat","ic":"M4 12h16M4 7h16M4 17h16","opp":"Vitality","addr":"Shoulder girdle and throat","loc":"base of neck"},{"nm":"Shock","seat":"3rd Eye","ic":"M12 12m-9 0a9 9 0 1018 0 9 9 0 10-18 0M12 12m-4.5 0a4.5 4.5 0 109 0 4.5 4.5 0 10-9 0","opp":"Groundedness","addr":"Prefrontal and dermis","loc":"forehead, skin"},{"nm":"Sad","seat":"Heart","ic":"M12 20s-8-5-8-11a4 4 0 018-2 4 4 0 018 2c0 6-8 11-8 11z","opp":"Joy","addr":"Cardiac plexus","loc":"centre chest"},{"nm":"Surprise","seat":"Heart","ic":"M12 3v18M7 7c-3 2-3 9 0 11M17 7c3 2 3 9 0 11","opp":"Readiness","addr":"Upper chest and back","loc":"upper torso"},{"nm":"Anticipation","seat":"Solar","ic":"M12 4v11M8 11l4 4 4-4M6 20h12","opp":"Presence","addr":"Below the heart","loc":"lower sternum"}],"DOMAINS":[{"nm":"Knowledge","ic":"M4 6h7v13H4zM20 6h-7v13h7","d":"understanding as operating mode"},{"nm":"Justice","ic":"M12 3v18M4 8h16M7 8l-3 6h6zM17 8l-3 6h6z","d":"alignment with natural law"},{"nm":"Imperium","ic":"M3 19l3-12 6 6 6-6 3 12z","d":"rulership through structure"},{"nm":"Duty","ic":"M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z","d":"obligation held without resentment"},{"nm":"Fate","ic":"M12 12m-9 0a9 9 0 1018 0 9 9 0 10-18 0M12 3v9l6 4","d":"the order you did not choose"},{"nm":"Power","ic":"M13 2L4 14h6l-1 8 9-12h-6z","d":"directed force. the warrior, not the king"},{"nm":"Creation","ic":"M12 12m-1 0a1 1 0 108 0 8 8 0 10-14 5","d":"bringing form from potential"},{"nm":"Dissolution","ic":"M4 4h7v7H4zM15 15h5v5h-5M14 6h2M18 6h2M6 14v2M6 18v2","d":"releasing form back to potential"},{"nm":"Descent","ic":"M12 3v14M6 12l6 6 6-6M4 21h16","d":"voluntary entry into shadow material"},{"nm":"Death","ic":"M12 21V8M6 8h12M9 8V5a3 3 0 016 0v3M4 21h16","d":"the ending that makes room"},{"nm":"Connection","ic":"M9 12m-5 0a5 5 0 1010 0 5 5 0 10-10 0M15 12m-5 0a5 5 0 1010 0 5 5 0 10-10 0","d":"bond without dependency"},{"nm":"Exchange","ic":"M3 9h15l-4-4M21 15H6l4 4","d":"reciprocal flow of value"},{"nm":"Restoration","ic":"M20 12a8 8 0 11-3-6M20 3v6h-6","d":"return to coherent baseline"},{"nm":"Provision","ic":"M4 9h16l-1.6 11H5.6zM8 9V6a4 4 0 018 0v3","d":"supplying what the other needs"},{"nm":"Play","ic":"M2 15c3-7 5 7 8 0s5 7 8 0","d":"unstructured creative exploration"},{"nm":"Nature","ic":"M12 21V9M12 9C9 9 5 7 5 3c4 0 7 2 7 6M12 11c3 0 7-2 7-6-4 0-7 2-7 6","d":"observation without interference"},{"nm":"Trickster","ic":"M4 18c4-10 12 10 16 0M4 8h.01M20 8h.01","d":"pattern disruption through paradox"},{"nm":"Mystery","ic":"M9 9a3 3 0 115 2.2c-1 .8-2 1.4-2 2.8M12 18h.01","d":"holding the unresolved without closing it"},{"nm":"Guardian","ic":"M12 3l7 3v6c0 4-3 7-7 8-4-1-7-4-7-8V6zM9 12l2 2 4-4","d":"watching over what cannot watch itself"}],"HARM":[{"c":"E01","t":"All Is One","a":"nature","ch":"Chapter 19"},{"c":"E02","t":"All Is Motion","a":"nature","ch":"Chapt :"Intellectual","a":"measure","ch":"Chapter 19"},{"c":"E71","t":"Emotional","a":"measure","ch":"Chapter 19"},{"c":"E72","t":"Wisdom","a":"measure","ch":"Chapter 19"},{"c":"E73","t":"Adversity","a":"measure","ch":"Chapter 19"},{"c":"E74","t":"Coherence","a":"measure","ch":"Chapter 19"},{"c":"E75","t":"Meta- Awareness","a":"meta","ch":"Chapter 19"},{"c":"E76","t":"Coherence","a":"meta","ch":"Chapter 19"}],"HARM_AX":{"nature":"Laws of Nature","human":"Laws of Human Nature","spirit":"Laws of Moral Integrity","express":"Laws of Expression","emotion":"The nine architectures","measure":"The instruments","meta":"The frame"},"SAB33":[["Negotiator",[["fear",4,6],["apathy",3,5]]],["Controller",[["fear",7,10],["anger",5,8]]],["Victim",[["sadness",6,8],["anger",5,7],["apathy",2,5]]],["Perfectionist",[["disgust",5,7],["anger",4,6]]],["Pleaser",[["apathy",3,5],["fear",3,8]]],["Hyper-Achiever",[["apathy",5,7],["fear",4,8]]],["Hyper-Rational",[["shock",2,4],["disgust",3,6]]],["Hyper-Vigilant",[["fear",7,9],["anger",5,7]]],["Restless",[["apathy",5,7],["fear",2,4]]],["Stickler",[["disgust",4,6],["anger",4,6]]],["Judge",[["disgust",6,8],["anger",5,7],["apathy",3,6]]],["Deflector",[["shame",4,6],["anger",4,6]]],["Dramatizer",[["shock",6,8],["sadness",4,6]]],["Worrywart",[["fear",6,8],["sadness",3,5]]],["Loner",[["sadness",6,8],["fear",5,7]]],["People-Pleaser",[["apathy",4,6],["shame",3,5]]],["Skeptic",[["disgust",5,7],["shock",3,5]]],["Dreamer",[["apathy",3,5],["sadness",2,4]]],["Procrastinator",[["fear",4,6],["sadness",3,5]]],["Imposter",[["shame",5,7],["fear",4,6]]],["Aggressor",[["anger",6,9],["apathy",4,7]]],["Martyr",[["sadness",6,8],["shame",5,7],["apathy",3,5]]],["Cynic",[["disgust",6,8],["sadness",4,6]]],["Manipulator",[["anger",5,8],["apathy",4,7]]],["Overthinker",[["fear",5,7],["shame",4,6]]],["Escapist",[["apathy",4,6],["fear",6,8]]],["Nihilist",[["disgust",7,9],["sadness",5,7]]],["Innocent",[["fear",2,4]]],["Pessimist",[["sadness",5,7],["fear",4,6]]],["Catastrophizer",[["fear",8,10],["sadness",6,8]]],["Enabler",[["apathy",3,5],["shame",4,6]]],["Control Freak",[["fear",7,9],["anger",5,7],["anticipation",5,7]]],["Avoider",[["apathy",6,8],["fear",5,7]]]],"INFER_NOUN":{"Fear":"Flincher","Anger":"Striker","Shame":"Hider","Disgust":"Recoiler","Apathy":"Drifter","Shock":"Freezer","Sad":"Mourner","Surprise":"Startler","Anticipation":"Bracer"},"FAM_POLE":{"Dysregulation":"Numbness","Collapse":"Mania","Rigidity":"Indiscriminate","Predatory":"Enabling","Grandiosity":"Self-erasure","Dissociation":"Enmeshment"},"FAM_OF":{"Fear":"Dysregulation","Shock":"Dysregulation","Anticipation":"Dysregulation","Anger":"Predatory","Shame":"Collapse","Sad":"Collapse","Surprise":"Dysregulation","Disgust":"Rigidity","Apathy":"Dissociation"},"SAB_PI":["Judge","Avoider","Controller","Hyper-Achiever","Hyper-Rational","Hyper-Vigilant","Pleaser","Restless","Stickler","Victim"],"IQ_STEM":{"Truth":"say the true thing","Transparency":"let yourself be seen as you are","Justice":"give the other what is actually theirs","Humility":"let the world be more right than you","Unity":"act as if the other is not separate","Awareness":"notice what you are doing while you do it","Nature":"let things be what they are","Presence":"stay in the room with what is happening","Equanimity":"stay level when it moves","Compassion":"feel it without fixing it","Forgiveness":"put it down","Generosity":"give without a ledger","Aesthetic Beauty":"make the thing well","Courage":"move toward what you are avoiding","Duty":"do what is yours to do","Responsibility":"own your part","Accountability":"name it out loud to someone","Temperance":"stop at enough","Detachment":"let the outcome be the outcome","Non-Harm":"take the option that costs others least","Patience":"wait without leaking"},"Q3":[{"k":"left","q":"When it costs you something, how often do you STEM?"},{"k":"right","q":"When nobody would know, how often do you STEM?"},{"k":"neutral","q":"On an ordinary day, how often do you STEM without deciding to?"}],"TIERDEF":[{"at":91,"nm":"Mastery","state":"Sovereign","soma":"Absolute structural clarity. No unprocessed past experiences.","def":"The field builds far more than it costs. Almost nothing is held.","energy":"Intention and action arrive together. There is no gap left to manage.","toward":"Hold it. The work here is maintenance, and what you can now carry for other people."},{"at":81,"nm":"Embodied","state":"Coherent","soma":"Frictionless connection between the field and local experience. Dynamic.","def":"The field builds more than it costs, with real load still in it.","energy":"You recover fast. A charge lands and clears instead of staying.","toward":"Mastery. Close the laws still shut, and clear what is still holding a week later."},{"at":71,"nm":"Compounding","state":"Aligned","soma":"High throughput, low friction.","def":"Each cleared address makes the next one cheaper. The gains are stacking.","energy":"Less effort buys more movement than it did a month ago.","toward":"Embodied. Stop opening addresses. Finish the ones already open."},{"at":61,"nm":"Gaining","state":"Tuned","soma":"Actively troubleshooting your own bottlenecks. Pragmatic, execution focused.","def":"The field builds more than it spends, and the margin is thin.","energy":"Forward on most days, and one hard week takes it back.","toward":"Compounding. Same seat, same address, repeated, until the load there stops returning."},{"at":51,"nm":"Even","state":"Receptive","soma":"Exhausted by the old way and aware that it is broken.","def":"The field breaks even and sits just above the line.","energy":"What you build holds about as often as it slips.","toward":"Gaining. One address cleared entirely beats four reduced."},{"at":41,"nm":"Oscillating","state":"Searching","soma":"Consuming and understanding, and still trapped in intellectualisation.","def":"The median range is forty to sixty and fifty is the centre of the line. The field crosses it in both directions.","energy":"The day decides. What is running that morning sets the range.","toward":"Even. Consistency rather than intensity. The swing narrows before the number rises."},{"at":31,"nm":"Incoherent","state":"Frustrated","soma":"Caught between somatic drag and occasional awareness.","def":"The field costs more than it builds. Charge is held at more addresses than are clearing.","energy":"Effort goes in and less comes out. You are working, and the work is going into holding.","toward":"Oscillating, and the median range starts at forty. Take the heaviest seat first. One address cleared where the load actually sits moves this further than ten cleared anywhere else."},{"at":21,"nm":"Corrupt","state":"Defensive","soma":"Bound by dogma. Managing symptoms to protect a position.","def":"The held charge is shaping decisions now, not only mood.","energy":"The pattern chooses before you do. You can see it afterwards and not while it runs.","toward":"Incoherent, then the median range. The move is interruption: name the address while it is running, ahead of the behaviour."},{"at":11,"nm":"Severe","state":"Numb","soma":"Medicating or distracting to survive the glitch. The hardware is shutting down.","def":"Most of the field is carrying. Very little is clear.","energy":"Ordinary demands read as threats. Capacity is spent before the day starts.","toward":"Corrupt, and it is reached one address at a time. One seat, one address, one line. Not a programme."},{"at":0,"nm":"Collapsed","state":"Fragmented","soma":"Hijacked by unprocessed past data. Absolute somatic drag.","def":"The field is fully loaded. Nothing is clearing.","energy":"Flat. Not calm, out of charge.","toward":"Weight off, and not alone. A reading this low is not a thing to manage by yourself, and the instrument will not pretend otherwise."}],"TIERCOL":{"Mastery":"#E8DBA4","Embodied":"#8BD4A7","Compounding":"#5FD5A6","Gaining":"#6FC5C9","Even":"#5EBBDB","Oscillating":"#7D93E0","Incoherent":"#CFAB64","Corrupt":"#CF8958","Severe":"#B58379","Collapsed":"#A48986 function draw(){
