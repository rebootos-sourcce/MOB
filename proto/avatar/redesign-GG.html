<!doctype html>
<html lang="en" data-build="prototype redesign-GG over e0659f3"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Avatar redesign prototype</title>
<!-- ============================================================
  AVATAR REDESIGN, ROUND GG. A PROTOTYPE, NOT THE APP.

  Standalone. Plain HTML, CSS and script, no dependencies, no network.
  Nothing under atuned_src/ is touched and nothing here is wired to the
  engine. It carries none of the shipped app's navigation, on purpose:
  round FB recorded two scares from a prototype wearing the real tab bar.

  Extends proto/avatar/seats4 (layout "Told", measured 9.4 against the
  D minus baseline's 5.4). What is carried over: the sentence above the
  ring, the ring as the hero, one action. What is new: the seat names are
  replaced by icon and percent satellites, five badges per satellite,
  the pair flow per area feeding the sniffer, and the Boundary overlay
  built on engine/avatar.js (PUR_SIDES, PUR_PER_SIDE, boundaryCount,
  boundaryCross, purposeRead).

  Mock data only. The journal lines are sim/stories.js plus a few written
  for this mock and marked in the notes. Pairs are proto/avatar/seats/pairs.js.
  ============================================================ -->
<style>
:root{
 --bg:#0C0D12; --bg2:#12141B; --panel:#171922; --panel2:#1E212B; --line:#2A2E3A;
 --ink:#EFEDE8; --dim:#94908A; --faint:#5E5B57;
 --root:#D6524C; --sacral:#D8924E; --solar:#DABF6A; --heart:#5FD5A6;
 --throat:#5EBBDB; --eye:#7D93E0; --crown:#A77EDB;
 --acc:#5EBBDB; --proto:#E0A93B; --protobg:#231C0E;
 --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- THE PROTOTYPE'S OWN CHROME. Striped amber, never the product's look. ---------- */
.pbar{position:relative;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
 padding:8px 16px;background:var(--protobg);border-bottom:2px solid var(--proto);
 background-image:repeating-linear-gradient(135deg,rgba(224,169,59,.10) 0 10px,transparent 10px 20px)}
.pbar .tag{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:#1A1405;background:var(--proto);
 padding:4px 10px;border-radius:6px;letter-spacing:.02em}
.pbar .say{color:#F2D9A6;font-size:14px;line-height:1.35;flex:1 1 280px}
.pbar .say b{color:#FFE7B8}
.pbar label{display:flex;align-items:center;gap:8px;font-size:14px;color:#F2D9A6}
.pbar select,.pbar .pbtn{min-height:44px;background:#16120A;border:1px dashed var(--proto);border-radius:10px;padding:0 12px;color:#FFE7B8}
.pbar .pbtn[aria-pressed="true"]{background:#3A2C10}
[data-proto] .pbtn{font-size:14px}

@media (min-width:1000px){.pbar{position:sticky;top:0}}
.ptag{position:fixed;left:12px;bottom:12px;z-index:70;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
 background:var(--proto);color:#1A1405;font:700 13px/1.2 system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.5);pointer-events:none}
.pin{position:absolute;z-index:5;width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--proto);
 background:#16120A;color:var(--proto);font:700 12px/1 system-ui,sans-serif;display:grid;place-items:center;padding:0}
.pin::after{content:"";position:absolute;inset:-9px}  /* 44px hit area around a 26px mark */
body.nonotes .pin, body.nonotes .notes{display:none!important}

/* ---------- PAGE ---------- */
.page{max-width:1480px;margin:0 auto;padding:20px 16px 64px}
.head{text-align:center;max-width:760px;margin:6px auto 18px;position:relative}
.eyebrow{color:var(--dim);font-size:15px;margin:0}
.head h1{font-size:clamp(22px,3.2vw,30px);line-height:1.25;font-weight:600;margin:4px 0 10px;text-wrap:balance}
.quote{font-size:clamp(17px,2vw,20px);margin:0 0 4px;text-wrap:balance}
.quote::before,.quote::after{color:var(--c,var(--acc))}
.quote::before{content:"\201C"}.quote::after{content:"\201D"}
.inway{color:var(--dim);margin:0;font-size:15px}
.inway b{color:var(--ink);font-weight:600}

.grid{display:grid;gap:24px 32px;grid-template-columns:minmax(0,1fr);
 grid-template-areas:"fig" "panel" "queue" "notes"}
@media (min-width:880px){
 .grid{grid-template-columns:minmax(0,600px) minmax(340px,420px);justify-content:center;
  grid-template-areas:"fig panel" "queue panel" "notes notes"}}
@media (min-width:1420px){
 .grid{grid-template-columns:minmax(0,600px) 400px 360px;
  grid-template-areas:"fig panel notes" "queue panel notes"}
 .notes{max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:84px}}
.figcol{grid-area:fig;min-width:0}
.panel{grid-area:panel;min-width:0}
.queue{grid-area:queue;min-width:0}
.notes{grid-area:notes;min-width:0}

/* ---------- THE FIGURE. Sized in container units so the ring, the
   satellites and the pips scale as one object at every width. ---------- */
.figwrap{container-type:inline-size;width:100%;max-width:600px;margin:0 auto;position:relative}
.fig{position:relative;width:100%;aspect-ratio:1/1}
.fig svg.draw{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sat{position:absolute;width:13cqw;height:13cqw;min-width:46px;min-height:46px;transform:translate(-50%,-50%);
 border-radius:50%;border:0;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:1px;padding:0;color:var(--ink);transition:background .2s, box-shadow .2s}
.sat svg{width:clamp(16px,4.2cqw,26px);height:clamp(16px,4.2cqw,26px);stroke:var(--c);fill:none;stroke-width:1.7;
 stroke-linecap:round;stroke-linejoin:round}
.sat .pc{font-size:clamp(12px,2.9cqw,17px);font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.sat .pc.none{color:var(--dim);font-weight:400}
.sat:hover{background:color-mix(in srgb,var(--c) 10%,var(--bg2))}
.sat[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 18%,var(--bg2));
 box-shadow:0 0 0 2px var(--c),0 0 26px color-mix(in srgb,var(--c) 45%,transparent)}
.slab{position:absolute;transform:translate(-50%,-50%);font-size:clamp(12px,2.35cqw,14px);color:var(--dim);
 pointer-events:none;white-space:nowrap;background:var(--bg);padding:0 4px;border-radius:4px;line-height:1.3}
.slab.on{color:var(--ink)}
.core{position:absolute;left:50%;top:50%;width:34cqw;height:34cqw;transform:translate(-50%,-50%);border-radius:50%;
 border:0;background:radial-gradient(circle at 50% 40%,#1B1E28,#101218 70%);display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:2px;padding:0}
.core svg{width:11cqw;height:11cqw;stroke:var(--ink);opacity:.85;fill:none;stroke-width:1.4;stroke-linecap:round}
.core .big{font-size:clamp(20px,5.2cqw,32px);font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.core .lb{font-size:clamp(12px,2.3cqw,14px);color:var(--dim)}
.core[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

.figrow{display:flex;justify-content:center;gap:10px;margin-top:8px;position:relative}
.bbtn{min-height:48px;display:inline-flex;align-items:center;gap:10px;padding:0 18px;border-radius:999px;
 background:var(--panel);border:1px solid var(--line)}
.bbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linejoin:round}
.bbtn:hover{border-color:var(--dim)}

/* ---------- PANEL ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative}
.ph{display:flex;align-items:center;gap:14px}
.ph .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--bg2));flex:none}
.ph .ic svg{width:24px;height:24px;stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ph h2{margin:0;font-size:22px;line-height:1.2;font-weight:620}
.ph p{margin:2px 0 0;color:var(--dim);font-size:14px}
.ph .fig2{margin-left:auto;text-align:right}
.ph .fig2 b{display:block;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.ph .fig2 span{font-size:13px;color:var(--dim)}
.sec{margin-top:18px}
.lbl{font-size:14px;color:var(--dim);margin:0 0 4px}
.be{font-size:18px;line-height:1.35;margin:0}
.nb{margin:0;font-size:16px}
.lands{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bg2);font-size:15px;position:relative}
.lands i{flex:none;width:12px;height:12px;border-radius:50%;margin-top:6px;border:2px solid var(--s,var(--dim))}
.badges{display:flex;justify-content:space-between;gap:4px;margin-top:6px}
.bdg{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--dim);text-align:center}
.bdg .ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
.bdg .ring svg{width:20px;height:20px;fill:none;stroke:var(--faint);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bdg.lit{color:var(--ink)}
.bdg.lit .ring{border:2px solid var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 35%,transparent)}
.bdg.lit .ring svg{stroke:var(--c)}
.bdg.next .ring{border:1.5px dashed var(--dim)}
.bdg.next .ring svg{stroke:var(--dim)}
.hint{margin:8px 0 0;font-size:14px;color:var(--dim)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.go{min-height:52px;padding:6px 22px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 70%,#fff 0%);
 background:color-mix(in srgb,var(--c) 26%,#171922);color:var(--ink);font-weight:620;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.go small{font-weight:400;color:var(--dim);font-size:13px}
.go[disabled]{opacity:.45;cursor:not-allowed}
.go.busy{background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);background-size:200% 100%;animation:sweep 1s linear infinite}
@keyframes sweep{from{background-position:200% 0}to{background-position:-200% 0}}
.ghost{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.field{margin-top:14px}
.field label{display:block;font-weight:600;margin-bottom:2px}
.field .h{display:block;color:var(--dim);font-size:14px;margin-bottom:6px}
textarea{width:100%;min-height:76px;resize:vertical;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.4}
textarea:focus{border-color:var(--c,var(--acc));outline:none}
.listen{margin-top:14px;padding:12px;border-radius:10px;border:1px dashed var(--line);position:relative}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:14px;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.chip em{font-style:normal;color:var(--dim);margin-right:4px}
.status{min-height:24px;margin:12px 0 0;font-size:15px;color:var(--ink)}
.status.warn{color:#E8B27A}
.empty{color:var(--dim)}

/* ---------- RELEASE ORDER ---------- */
.queue h3,.notes h3{font-size:17px;margin:0 0 4px;font-weight:620}
.queue .sub{margin:0 0 10px;color:var(--dim);font-size:14px}
.qi{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.qi:first-of-type{border-top:0}
.qi .qic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--bg2))}
.qi .qic svg{width:17px;height:17px;stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qi p{margin:0}
.qi .why{font-size:14px;color:var(--dim);margin-top:2px}
.qi.moved{animation:flash 1.6s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--acc) 22%,transparent)}to{background:transparent}}
.tryj{margin-top:14px;padding:12px;border:1px dashed var(--proto);border-radius:10px;background:var(--protobg)}
.tryj label{font-size:14px;color:#F2D9A6;display:block;margin-bottom:6px}
.tryj .row{display:flex;gap:8px}
.tryj input{flex:1;min-height:44px;background:#16120A;border:1px solid #4A3A18;border-radius:10px;padding:0 12px;min-width:0}
.tryj .pbtn{min-height:44px;background:#16120A;border:1px dashed var(--proto);border-radius:10px;padding:0 14px;color:#FFE7B8}
.tryj .out{font-size:14px;color:#F2D9A6;margin:8px 0 0;min-height:20px}

/* ---------- NOTES, the prototype's own ---------- */
.notes{border:1.5px dashed var(--proto);border-radius:var(--r);padding:16px;background:#110F0A}
.notes h3{color:var(--proto)}
.notes .meas{font-size:14px;color:#F2D9A6;margin:6px 0 12px;padding:8px 10px;border-radius:8px;background:var(--protobg)}
.notes ol{margin:0;padding-left:0;list-style:none;counter-reset:n}
.notes li{margin:0 0 14px;font-size:14px;line-height:1.5;color:#DCD6CB;padding-left:34px;position:relative}
.notes li .n{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--proto);color:var(--proto);font-size:12px;font-weight:700;display:grid;place-items:center}
.notes li b{color:#FFE7B8}
.notes li.hl{animation:flashp 2s ease-out}
@keyframes flashp{from{background:rgba(224,169,59,.25)}to{background:transparent}}
.notes .q{margin-top:6px;color:#F2D9A6}
.notes code{font-size:13px;color:#FFE7B8}

/* ---------- THE BOUNDARY OVERLAY ---------- */
.ov{position:fixed;inset:0;z-index:40;background:rgba(6,7,10,.84);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
 overflow:auto;padding:64px 16px 32px;opacity:0;transition:opacity .22s}
.ov.show{opacity:1}
.ov[hidden]{display:none}
.ovin{max-width:1060px;margin:0 auto;display:grid;gap:20px 32px;grid-template-columns:minmax(0,1fr)}
@media (min-width:880px){.ovin{grid-template-columns:minmax(0,520px) minmax(320px,1fr);align-items:start}}
.ovhead{grid-column:1/-1;display:flex;align-items:flex-start;gap:12px}
.ovhead h2{margin:0;font-size:24px;font-weight:620}
.ovhead p{margin:2px 0 0;color:var(--dim)}
.xbtn{margin-left:auto;flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.xbtn svg{width:20px;height:20px;stroke:var(--ink);stroke-width:1.8}
.hexwrap{container-type:inline-size;width:100%;max-width:520px;margin:0 auto;position:relative}
.hex{position:relative;width:100%;aspect-ratio:1/1}
.hex > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.side{position:absolute;transform:translate(-50%,-50%);min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;
 background:var(--panel);border:1px solid var(--line);font-size:clamp(13px,2.8cqw,15px);white-space:nowrap}
.side[aria-pressed="true"]{border-color:var(--ink);background:var(--panel2);box-shadow:0 0 18px rgba(94,187,219,.25)}
.side.thin::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#E8B27A;margin-left:7px;vertical-align:middle}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.hub .nm{font-size:clamp(15px,3.4cqw,19px);font-weight:620;line-height:1.1}
.hub .ct{font-size:13px;color:var(--dim)}
.arr{width:52px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.arr svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arr[disabled]{opacity:.35;cursor:not-allowed}
.tri{position:absolute;transform:translate(-50%,-50%);font-size:12px;color:var(--dim);white-space:nowrap;pointer-events:none}
.bline{display:flex;gap:8px;align-items:center;margin-top:8px}
.bline .dot{flex:none;width:10px;height:10px;border-radius:2px;border:1.5px solid var(--acc)}
.bline .dot.lit{background:var(--acc)}
.bline input{flex:1;min-height:44px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-width:0}
.bline input:focus{border-color:var(--acc);outline:none}
.rem{padding:10px 12px;border-radius:10px;background:var(--bg2);margin-top:8px}
.rem p{margin:0}
.rem .why{font-size:14px;color:var(--dim);margin-top:2px}
.rem.thin{background:transparent;border:1px dashed #6A5234}
details.pur{margin-top:16px;border-top:1px solid var(--line);padding-top:8px}
details.pur summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;list-style:none}
details.pur summary::-webkit-details-marker{display:none}
details.pur summary::after{content:"";width:8px;height:8px;border-right:1.8px solid var(--dim);border-bottom:1.8px solid var(--dim);transform:rotate(45deg);margin-left:10px;margin-top:-4px;transition:transform .2s}
details.pur[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.pur dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.pur dt{color:var(--dim)}
.pur dd{margin:0}

/* the note sheet, the prototype's own, above everything */
.sheet{position:fixed;inset:auto 16px 16px 16px;z-index:80;max-width:560px;margin:0 auto;background:#16120A;border:1.5px dashed var(--proto);
 border-radius:14px;padding:16px 18px;color:#EDE3CF;font-size:15px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet[hidden]{display:none}
.sheet h4{margin:0 40px 6px 0;color:var(--proto);font-size:16px}
.sheet p{margin:0 0 8px}
.sheet .xbtn{position:absolute;top:8px;right:8px;background:#16120A;border-color:#4A3A18}
.sheet .xbtn svg{stroke:#FFE7B8}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>

<div class="pbar" data-proto role="region" aria-label="Prototype controls">
 <span class="tag">Prototype</span>
 <span class="say"><b>Not the app.</b> Avatar redesign for round GG. Mock data: nothing is saved, nothing is read by the real engine.</span>
 <label>Person <select id="who">
  <option value="James">James, 57, level 3</option>
  <option value="Angela">Angela, 36, level 5</option>
  <option value="Derek">Derek, 39, level 7</option>
  <option value="blank">Nobody yet, first run</option>
 </select></label>
 <button type="button" class="pbtn" id="notesT" aria-pressed="true">Design notes on</button>
</div>

<div class="ptag" data-proto aria-hidden="true">Prototype, not the app</div>

<main class="page">
 <header class="head" id="head"></header>
 <div class="grid">
  <section class="figcol" aria-label="Your avatar">
   <div class="figwrap"><div class="fig" id="fig"></div></div>
   <div class="figrow">
    <button type="button" class="bbtn" id="openB" aria-haspopup="dialog">
     <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z"/></svg>Boundaries</button>
    <button type="button" class="pin" data-proto data-note="6" style="right:calc(50% - 110px);top:-6px" aria-label="Design note 6">6</button>
   </div>
  </section>
  <aside class="panel" aria-live="polite"><div class="card" id="panel"></div></aside>
  <section class="queue card" id="queue" aria-label="Next to release"></section>
  <aside class="notes" id="notes" data-proto aria-label="Design notes"></aside>
 </div>
</main>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-labelledby="ovT">
 <div class="ovin">
  <div class="ovhead">
   <div><h2 id="ovT">Boundaries</h2><p>Six sides, five lines each. Inside is yours to protect.</p></div>
   <button type="button" class="xbtn" id="closeB" aria-label="Close boundaries"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="hexwrap"><div class="hex" id="hex"></div></div>
  <div class="card" id="bpanel"></div>
 </div>
</div>

<div class="sheet" id="sheet" data-proto hidden role="dialog" aria-labelledby="shT">
 <button type="button" class="xbtn" id="shX" aria-label="Close note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
 <h4 id="shT"></h4><div id="shB"></div>
</div>

<script>
(function(){
'use strict';

/* ================= ICONS. Ring, never fill. ================= */

var PUR_SIDES=['partner','family','friends','community','coworkers','alone'];
var PUR_PER_SIDE=5;
function boundaryCount(p){
 if(!p||!p.sides)return {filled:0, of:PUR_SIDES.length*PUR_PER_SIDE, thin:PUR_SIDES.slice()};
 var n=0, thin=[];
 PUR_SIDES.forEach(function(s){
  var a=(p.sides[s]||[]).filter(function(x){return x&&String(x).trim();});
  n+=Math.min(a.length,PUR_PER_SIDE);
  if(a.length<PUR_PER_SIDE)thin.push(s);});
 return {filled:n, of:PUR_SIDES.length*PUR_PER_SIDE, thin:thin};}
function boundaryCross(text){
 var t=String(text||'').toLowerCase();
 var MAP={partner:/\b(wife|husband|partner|girlfriend|boyfriend|spouse|marriage)\b/,
  family:/\b(mum|mom|mother|dad|father|parent|brother|sister|son|daughter|family)\b/,

  community:/\b(neighbour|neighbor|church|team|club|community|group)\b/,
  coworkers:/\b(boss|manager|colleague|coworker|co-worker|client|work)\b/,
  alone:/\b(myself|alone|on my own|by myself)\b/};
 for(var i=0;i<PUR_SIDES.length;i++)
  if(MAP[PUR_SIDES[i]].test(t))return PUR_SIDES[i];
 return null;}

/* ================= A STAND IN FOR THE RESOLVER AND THE SNIFFER =================
   A dozen words, so the mock can show where words land and what is listened
   for. The real resolver is readSeat in ui/drills.js and the real scoring is
   the ai director's. "tired" and "shoulders" deliberately resolve to nothing,
   because the real resolver does not read them either (round FB). */
var BODY={chest:'heart',heart:'heart',breath:'heart',throat:'throat',jaw:'throat',neck:'throat',voice:'throat',
 face:'eye',head:'eye',eyes:'eye',stomach:'solar',gut:'solar',belly:'sacral',hips:'sacral',legs:'root',feet:'root'};
var FEEL={numb:'sacral',angry:'solar',ashamed:'solar',disgusted:'solar',afraid:'root',terrified:'root',scared:'root',
 sad:'heart',alone:'heart',nothing:'heart',lonely:'heart',lost:'eye',confused:'eye',guilty:'solar',frightens:'root'};
var UNREAD={tired:1,shoulders:1,exhausted:1};
var STOP=('the and that this with have from what when were they them their there then than just like into about been being '+
 'every because would could should which while where your yours mine ours after before again still some more most very '+
 'said says will shall does doing done make made call called know knew each other anything everything').split(' ');
var STOPS={}; STOP.forEach(function(w){STOPS[w]=1;});
function words(s){return String(s||'').toLowerCase().replace(/[^a-z\s'-]/g,' ').split(/\s+/).filter(Boolean);}
function stem(w){return w.replace(/'s$/,'').replace(/(ing|ed)$/,'').replace(/s$/,'');}
function toks(s){var o={};words(s).forEach(function(w){if(FEEL[w]||BODY[w]||UNREAD[w]){o[stem(w)]=w;return;}
 if(w.length<5||STOPS[w])return; o[stem(w)]=w;});return o;}
function landsAt(text){var ws=words(text),i;
 for(i=0;i<ws.length;i++)if(BODY[ws[i]])return BODY[ws[i]];
 for(i=0;i<ws.length;i++)if(FEEL[ws[i]])return FEEL[ws[i]];
 return null;}
function listenFor(text){
 var ws=words(text), f=[], b=[], u=[];
 ws.forEach(function(w){if(FEEL[w]&&f.indexOf(w)<0)f.push(w);if(BODY[w]&&b.indexOf(w)<0)b.push(w);if(UNREAD[w]&&u.indexOf(w)<0)u.push(w);});
 return {feel:f, body:b, unread:u, side:boundaryCross(text), seat:landsAt(text)};}

function load(who){

/* percent complete: the share of the weight held when the pair was written
   that has since been released. seats4 calls it closure. null when nothing
   is read, which prints as a dash and never as zero. */
function pct(k){var a=ST.P.areas[k]; if(!a)return null; if(!a.seat||!(a.load0>0))return null;
 return Math.round(100*Math.max(0,Math.min(1,1-a.load/a.load0)));}
function overall(){var v=AREAS.map(function(x){return pct(x.k);}).filter(function(x){return x!=null;});
 return v.length?Math.round(v.reduce(function(s,x){return s+x;},0)/v.length):null;}
function lead(){var best=null,bl=-1;Object.keys(ST.P.areas).forEach(function(k){var a=ST.P.areas[k];if(a.seat&&a.load>bl&&a.load>0){bl=a.load;best=k;}});return best;}

/* THE SNIFFER, AS A MOCK. For each journal entry, the area whose pair it
   echoes: shared words first, then landing at the same seat. */
function match(e){
 var et=toks(e.t), eseat=landsAt(e.t), best=null;
 Object.keys(ST.P.areas).forEach(function(k){var a=ST.P.areas[k];
  var pt=toks(a.notbe), shared=[];
  Object.keys(et).forEach(function(s){if(pt[s])shared.push(et[s]);});
  var same=!!(eseat&&a.seat&&eseat===a.seat);
  var sc=shared.length*2+(same?1.5:0);
  if(sc>0&&(!best||sc>best.sc))best={k:k,sc:sc,shared:shared,same:same,seat:eseat};});
 return best;}
function order(){
 return ST.P.journal.filter(function(e){return !e.done;}).map(function(e){return {e:e,m:match(e)};})
  .sort(function(x,y){var a=x.m?x.m.sc:0,b=y.m?y.m.sc:0;return b-a||x.e.d-y.e.d;});}
function badges(k){var a=ST.P.areas[k]; if(!a)return [0,0,0,0,0];
 var heard=ST.P.journal.some(function(e){var m=match(e);return m&&m.k===k;});
 return [1,heard?1:0,a.rel>0?1:0,a.prac?1:0,a.emb?1:0];}

/* ================= NOTES ================= */
var NOTES={
 0:['What this page is for','The job, in James\'s words: <i>show me who I said I would become, what is in the way, and the one thing to do today.</i> Told\'s order is kept: the sentence above, the ring as the hero, one action. There is no app chrome on this page, on purpose.'],
 1:['Seven satellites replace the seat names','Each circle is a part of a life with an icon and a percent complete. Underneath, each is still a seat: the ring keeps the body\'s order top to bottom (Meaning at the crown, Ground at the root) and keeps the seat colour. <b>Percent complete</b> is the share of the weight held when the pair was written that has since been released. seats4 already computes it as <code>closure()</code>, from <code>avatarGap().load</code>. That is work done, which is why it does not break the rule that a reading is not a score. When nothing is read it prints a dash, never a zero.<div class="q">The one word names (Ground, Pleasure, Drive, Love, Voice, Clarity, Meaning) are placeholders for his ruling.</div>'],
 2:['Five badges per satellite','Drawn as pips outside each circle, and labelled only in the panel. <b>Said, Heard, Released, Practised, Embodied.</b> That is the loop: Said and Heard are discover, Released is play, Practised is flow, Embodied is embody. The pips are not buttons, on purpose: 35 more buttons around one figure would put the page over 40 choices. The next unlit badge says how it lights, so a badge teaches the next step instead of decorating.'],
 3:['The pair, per area','Press a circle, then two sentences: who you want to be here, and who you do not. <b>Keep both</b> stays off until both halves have words, which is <code>avatarValid()</code>: "a pair is written as a pair." Stored per pair: <code>{area, be, notbe, at}</code>. The <code>area</code> field is new: an additive schema change to <code>avatar.pairs</code>, and the schema is his call. One pair per area in this design; the engine allows any number.'],
 4:['What the sniffer takes, and how it orders release','From the "do not want to be" sentence it keeps the feeling words, the body words, the person named (read by <code>boundaryCross()</code> into one of the six boundary sides) and the seat the words land at. <b>Priority rule:</b> a journal entry that echoes a person\'s own words for an area goes to the front of the release order, ranked by shared words, then by landing at the same seat, then by how recent it is. The reason is printed beside each entry so the order is never a black box. The listening here is a dozen word stand in. The real one is the ai director\'s scoring.'],
 5:['Where you put it, and where it lands','A person files a pair under an area, and the resolver reads the sentence to a seat. They can disagree. James files his public speaking pair under Voice, and "my chest is tight" lands at the heart. This design keeps both: the satellite shows where he wants it to show, the release runs where the words land. Two of the six reference people, Angela and Derek, have pairs that land nowhere, because the real resolver does not read "tired" or "shoulders" (round FB). The page says so rather than printing zero.'],
 6:['The Boundary overlay','It opens over the avatar and dims everything else. The shape is the engine\'s own: <code>PUR_SIDES</code> (partner, family, friends, community, coworkers, alone) and <code>PUR_PER_SIDE</code> of five. How full each side is gets drawn as five segments and never printed as "12 of 30". The sides <code>boundaryCount().thin</code> reports carry an amber dot. The two triangles behind it are the Purpose Map: the engine\'s own comment reads "two overlapping triangles, and the overlap is the boundary", and the overlap of two triangles is this hexagon.'],
 7:['The arrows','Built as asked: press a side, then the up arrow adds a line to it and the down arrow takes the last line off, with undo. An empty line does not count, which is <code>boundaryCount()</code>\'s own filter.<div class="q">Open, and his to read: in the engine the Purpose Map is an upward triangle (higher purpose, three soul values) and a downward one (earthly purpose, three ego values). His words were "the up arrow, down arrow, and the six sides that you fill in". That may mean these two triangles and the hexagon, not per side arrows.</div>'],
 8:['How it feeds ritual reminders','<code>boundaryCross()</code> reads each journal entry and names the side it touches. If that side has lines, the next ritual carries one of them as a reminder, with the entry that raised it quoted. With accounts, the same line goes out as a push notification. A thin side named in the journal gets a prompt instead. <b>Three engine findings, visible in this mock:</b> "team" reads as community, not coworkers, so James\'s board meeting lands on the wrong side. An entry naming a wife and a boss returns partner only, because the first match wins. "Coach" is not read at all.'],
 9:['Purpose, folded','Six values in, three per triangle. The centre of each is derived and never typed (<code>purposeCentre()</code>), and the line between them is the engine\'s own sentence. Folded by default behind a visible control, because the page is about boundaries when this opens.'],
 10:['The count, measured live','A working screen should offer fewer than 12 simultaneous choices. The live figure above counts every visible button, field and link that is not the prototype\'s own. Told measured 11 on its first screen, 17 on its own surface and 86 across the whole screen. The 69 between those last two sit outside the surface, in the tab bar and the two rails, and this page carries neither. So compare the surface figures, never the whole screen ones.']};

/* ================= RELEASE, MOCKED =================
   Two seconds, so the indicator is honest (one to three seconds: a moving
   state). It lowers the load on this area and retires the top matching
   entry. Nothing is written anywhere. */
function release(){
 if(ST.busy)return; var k=ST.sel, a=ST.P.areas[k], A=AK[k]; if(!a||!a.seat)return;
 ST.busy=true; var b=$('rel'); b.classList.add('busy'); b.disabled=true; b.firstChild.textContent='Releasing';
 setTimeout(function(){
  var before=pct(k);
  a.load=Math.max(0,+(a.load-a.load0*0.22).toFixed(2)); if(a.load<0.25)a.load=0; a.rel++;
  var q=order().filter(function(q){return q.m&&q.m.k===k;})[0]; if(q)q.e.done=true;
  ST.busy=false; paint();
  var after=pct(k);
  $('st').textContent='Released. '+A.nm+' went from '+before+'% to '+after+'% complete.'+(a.load===0?' Clear. Embodied lights after seven days clear.':'')+(q?' One journal entry left the order.':'');
 },2000);}

/* ================= WIRING ================= */
function paint(){paintHead(); paintFig(); paintPanel(); paintQueue(); measure();}
document.addEventListener('click',function(e){
 var t=e.target.closest('button,summary'); if(!t)return;
 if(t.classList.contains('pin')){showNote(t.dataset.note);return;}
 if(t.dataset.a){ST.sel=t.dataset.a; ST.edit=false; paintFig(); paintPanel(); measure();
  var p=document.querySelector('.panel'); if(p.getBoundingClientRect().top>innerHeight*0.75)p.scrollIntoView({behavior:'smooth',block:'start'}); return;}
 if(t.id==='core'){ST.sel='core'; ST.edit=false; paintFig(); paintPanel(); measure(); return;}
 if(t.dataset.go){ST.sel=t.dataset.go; paintFig(); paintPanel(); measure(); return;}
 if(t.id==='rel'){release();return;}
 if(t.id==='rew'){ST.edit=true; paintPanel(); measure(); $('fbe').focus(); return;}
 if(t.id==='cancel'){ST.edit=false; paintPanel(); measure(); return;}
 if(t.id==='keep'){
  var be=$('fbe').value.trim(), nb=$('fnb').value.trim(); if(!avatarValid({be:be,notbe:nb}))return;
  var k=ST.sel, old=ST.P.areas[k], seat=landsAt(nb), lo=seat?(old&&old.seat===seat?old.load0:4.0):0;
  ST.P.areas[k]={be:be,notbe:nb,seat:seat,load0:lo,load:seat?(old&&old.seat===seat?old.load:lo):0,rel:old?old.rel:0,prac:old?old.prac:0,emb:0,at:new Date().toISOString()};
  if(!ST.P.ideal)ST.P.ideal=k;
  var heard=ST.P.journal.filter(function(e){var m=match(e);return m&&m.k===k;}).length;
  ST.edit=false; paint();
  $('st').textContent='Kept. '+(heard?(heard===1?'One journal entry echoes':heard+' journal entries echo')+' these words and moved up the release order.':'Journal entries that echo these words will go to the front of the release order.');
  return;}
 if(t.id==='openB'){openOv();return;}
 if(t.id==='closeB'){closeOv();return;}
 if(t.dataset.side){ST.side=t.dataset.side; paintOv(); return;}
 if(t.id==='upA'){var L=lines(ST.side); if(L.length>=PUR_PER_SIDE)return; L.push(''); paintOv();
  var ins=$('bpanel').querySelectorAll('.bline input'); ins[ins.length-1].focus(); bStatus('A line opened on '+ST.side+'. It counts once it has words.'); return;}
 if(t.id==='dnA'){var L2=lines(ST.side); if(!L2.length)return; var x=L2.pop(); ST.undo={sd:ST.side,x:x}; paintOv();
  if(x&&x.trim())bStatus('Took "'+bare(x)+'" off '+ST.side+'.',true); else bStatus('Took the empty line off.'); return;}
 if(t.id==='notesT'){ST.notes=!ST.notes; document.body.classList.toggle('nonotes',!ST.notes); t.setAttribute('aria-pressed',ST.notes); t.textContent=ST.notes?'Design notes on':'Design notes off'; measure(); return;}
 if(t.id==='shX'){$('sheet').hidden=true; return;}
});
$('ov').addEventListener('click',function(e){if(e.target===$('ov')||e.target.classList.contains('ovin'))closeOv();});
document.addEventListener('keydown',function(e){
 if(e.key!=='Escape')return;
 if(!$('sheet').hidden){$('sheet').hidden=true;return;}
 if(!$('ov').hidden)closeOv();});
$('who').addEventListener('change',function(){load(this.value);});
function showNote(k){var n=NOTES[k]; if(!n)return; $('shT').textContent='Design note '+k+'. '+n[0];
 $('shB').innerHTML='<p>'+n[1]+'</p>'; $('sheet').hidden=false; $('shX').focus();
 var li=$('n'+k); if(li&&ST.notes){li.classList.remove('hl'); void li.offsetWidth; li.classList.add('hl');}}
addEventListener('resize',measure); addEventListener('scroll',function(){clearTimeout(measure.t);measure.t=setTimeout(measure,120);},{passive:true});

paintNotes();
var hw=(location.hash.match(/who=(\w+)/)||[])[1]; if(hw&&PEOPLE[hw])$('who').value=hw;
load(hw&&PEOPLE[hw]?hw:'James');
if(/boundary=1/.test(location.hash))openOv();
if(/nonotes=1/.test(location.hash))$('notesT').click();
addEventListener('hashchange',function(){var w=(location.hash.match(/who=(\w+)/)||[])[1];
 if(w&&PEOPLE[w]&&w!==ST.who){$('who').value=w; if(!$('ov').hidden)closeOv(); load(w);}});
})();
</script>
</body></html>
