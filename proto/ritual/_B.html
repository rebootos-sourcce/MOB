<div class="wrap">
 <div class="bar">
  <span class="brand">ATUNED &middot; RITUAL</span>
  <select id="who"></select>
  <span class="dim" id="tag" style="font-size:13px"></span>
  <span style="flex:1"></span>
  <button class="btn" id="edit">Edit</button>
 </div>

 <!-- THE BOARD. Streaks' answer, ported and not copied: a tile per ritual, each
      one a ring with its glyph inside, the ring filling as the day is recorded.
      Six is the cap, which is the number Streaks itself started on and the one
      its designer defended. Four is the working memory floor this product
      carries, so six is already the generous end. -->
 <div class="board" id="board"></div>
 <p class="why" id="why"></p>

 <div class="two">
  <div class="card">
   <div class="hmhead">
    <div><div class="eye">The record</div><div class="note" id="hmnote"></div></div>
    <div class="key" id="key"></div>
   </div>
   <div class="hm" id="hm"></div>
  </div>
  <div class="card">
   <div class="eye">Over time</div>
   <div class="stats" id="stats" style="margin-top:14px;grid-template-columns:1fr 1fr"></div>
   <div id="bars" style="margin-top:18px"></div>
  </div>
 </div>
 <div class="foot" id="foot"></div>
</div>

<style>
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
 padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;
 cursor:pointer;transition:.16s;min-height:44px;text-align:center;font:inherit;color:inherit}
.tile:hover{border-color:var(--tc)}
.tile .ring{position:relative;width:76px;height:76px}
/* the ring svg only. Without the child selector the glyph inside .gl was
   absolutely positioned too and sat in the tile's top left corner. */
.tile .ring>svg{position:absolute;inset:0}
.tile .ring .gl{position:absolute;inset:0;display:grid;place-items:center}
.tile b{font-size:13.5px;font-weight:600;line-height:1.3}
.tile span{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.tile.done b{color:var(--tc)}
.tile.add{border-style:dashed;justify-content:center;color:var(--dim)}
.tile.add:hover{color:var(--accent);border-color:var(--accent)}
.why{font-size:14px;color:var(--mid);line-height:1.62;margin:0 0 14px;
 padding:14px 16px;background:var(--panel);border:1px solid var(--line);
 border-left:2px solid var(--wc);border-radius:var(--r)}
.why b{color:var(--ink);font-weight:600}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.hmhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
 margin-bottom:13px;flex-wrap:wrap}
.key{display:flex;gap:13px;font-size:11.5px;color:var(--dim);align-items:center}
.key s{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;
 vertical-align:-1px;text-decoration:none}
.wk{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);margin-bottom:7px}
.wk u{flex:1;height:7px;border-radius:4px;background:var(--sunk);text-decoration:none;
 display:block;overflow:hidden}
.wk u b{display:block;height:100%;background:var(--tc);border-radius:4px}
.wk em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--mid);min-width:52px;
 text-align:right}
.edrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);
 font-size:14px}
.edrow:last-child{border-bottom:0}
.edrow span{flex:1}
@media(max-width:900px){.two{grid-template-columns:1fr}
 .board{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.board{grid-template-columns:repeat(2,1fr);gap:10px}
 .tile .ring{width:66px;height:66px}}
</style>

<script>
var D=DATA, cur='Marcus', EDIT=false, W={}, R={};
var sel=document.getElementById('who');
Object.keys(D).forEach(function(k){var o=document.createElement('option');
 o.value=k;o.textContent=D[k].nm+', '+D[k].age+', '+D[k].role.replace(' · ICP','');
 sel.appendChild(o);});
sel.value=cur;sel.onchange=function(){cur=sel.value;draw();};
document.getElementById('edit').onclick=function(){EDIT=!EDIT;
 this.className='btn'+(EDIT?' on':'');this.textContent=EDIT?'Done':'Edit';draw();};

function walk(){if(!W[cur])W[cur]=D[cur].walk.slice();return W[cur];}

/* THE ROTATION. The practice the reading calls for, plus whatever the person
   has already added. Never a fixed six with five empty holes, because an empty
   slot is a count against a total wearing a costume: it says five to go. */
function rot(){
 if(R[cur])return R[cur];
 var d=D[cur], tr=d.substituted?d.actualTrack:d.track;
 var list=[{k:d.called.k,nm:d.called.nm,min:d.called.min,track:d.called.track,called:true}];
 /* a second and third, if the reading has the room for them, drawn from the
    same tier so nothing is offered that the person cannot do today */
 d.fit.filter(function(p){return p.track===tr&&p.k!==d.called.k;})
  .sort(function(a,b){return a.min-b.min;}).slice(0,2)
  .forEach(function(p){list.push({k:p.k,nm:p.nm,min:p.min,track:p.track,called:false});});
 R[cur]=list; return list;}

function ringSvg(frac,c,sz){
 var r=(sz/2)-4, cx=sz/2;
 var s='<svg viewBox="0 0 '+sz+' '+sz+'" width="'+sz+'" height="'+sz+'">';
 s+='<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="5"/>';
 if(frac>0)s+='<path d="'+arc(cx,cx,r,0,Math.min(359.9,frac*360))+'" fill="none" stroke="'+c
  +'" stroke-width="5" stroke-linecap="round"/>';
 return s+'</svg>';}

function board(){
 var d=D[cur], w=walk(), list=rot();
 var doneToday=w.length?w[w.length-1]:0;
 var h=list.map(function(p,i){
  var tr=TRACKS[p.track], on=(i===0&&doneToday);
  /* THE RING ENCODES THE DAY, exactly as Streaks' does: full when today is
     recorded and empty when it is not. It is not a percentage of a goal and it
     never draws a partial guess. */
  return '<button class="tile'+(on?' done':'')+'" style="--tc:'+tr.c+'" data-i="'+i+'">'
   +'<span class="ring">'+ringSvg(on?1:0,tr.c,76)
   +'<span class="gl">'+svgIc(tr.ic,on?tr.c:'var(--mid)',27)+'</span></span>'
   +'<b>'+p.nm+'</b><span>'+p.min+' min'+(p.called?' · called for':'')+'</span></button>';}).join('');
 h+='<button class="tile add" id="add"><span style="font-size:26px;line-height:1">+</span>'
  +'<b style="font-weight:500">Add</b></button>';
 document.getElementById('board').innerHTML=h;
 document.getElementById('board').querySelectorAll('[data-i]').forEach(function(el){
  el.onclick=function(){ if(+el.dataset.i!==0)return;
   var ww=walk(); ww[ww.length-1]=ww[ww.length-1]?0:1; draw();};});}

function why(){
 var d=D[cur], tr=TRACKS[d.substituted?d.actualTrack:d.track];
 var s='Your <b>'+d.seat.toLowerCase()+'</b> is carrying more than any other seat. The <b>'
  +(d.substituted?d.actualTrack:d.track).toLowerCase()+'</b> track is what moves a '
  +d.seat.toLowerCase()+', so these are '+d.seat.toLowerCase()+' practices.';
 if(d.substituted)s+=' Nothing in the '+d.track.toLowerCase()
  +' track starts this gently, so the '+d.actualTrack.toLowerCase()+' track is carrying it today.';
 var el=document.getElementById('why');
 el.style.setProperty('--wc',tr.c); el.innerHTML=s;}

function heat(){
 var d=D[cur], w=walk(), tr=TRACKS[d.substituted?d.actualTrack:d.track];
 var cols=spanOf(w,13), cells=weeksOf(w,cols), h=document.getElementById('hm');
 h.style.setProperty('--k',tr.c); h.className='hm'+(EDIT?' edit':'');
 h.innerHTML=cells.map(function(v,i){
  return '<i class="'+(v===1?'on':v===2?'fl':v===0?'no':'')+'" data-i="'+i+'"></i>';}).join('');
 if(EDIT)h.querySelectorAll('i').forEach(function(el){el.onclick=function(){
  var i=+el.dataset.i, pad=cols*7-w.length, j=i-pad;
  if(j<0||j>=w.length)return; w[j]=w[j]?0:1; draw();};});
 document.getElementById('key').innerHTML=
  '<span><s style="background:'+tr.c+'"></s>practised</span>'
  +'<span><s style="border:1.5px solid '+tr.c+'"></s>short version</span>';
 document.getElementById('hmnote').textContent=EDIT
  ? 'Tap a day to add it or take it off.' : plural(cols,'week')+' on the record, one square a day.';}

function stats(){
 var d=D[cur], w=walk();
 var done=w.filter(Boolean).length, best=bestOf(w), run=runOf(w);
 document.getElementById('stats').innerHTML=[
  '<b>'+run+'</b><span>'+(run===1?'day running':'days running')+'</span>',
  '<b>'+best+'</b><span>longest run, in days</span>',
  '<b>'+done+'</b><span>days practised</span>',
  '<b>'+(done*d.called.min)+'</b><span>minutes recorded</span>'
 ].map(function(x){return '<div class="stat">'+x+'</div>';}).join('');
 /* ANALYTICS THAT SAY SOMETHING. Weekday is the one cut of a habit record that
    changes behaviour, because the answer is a day of the week a person can act
    on. It is a rate per weekday and never a count against a total. */
 var NM=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], hit=[0,0,0,0,0,0,0], tot=[0,0,0,0,0,0,0];
 var cells=weeksOf(w,spanOf(w,13));
 cells.forEach(function(v,i){ if(v===null)return; var r=i%7; tot[r]++; if(v)hit[r]++; });
 var tr=TRACKS[d.substituted?d.actualTrack:d.track];
 /* AN ANALYTIC NEEDS EVIDENCE BEFORE IT SPEAKS. On seven days of history
    every weekday read 100 in 100 and the chart said nothing while looking as
    though it had. Four weeks is the floor: below it the panel says what it is
    waiting for instead of drawing seven full bars off one sample each. */
 var FLOOR=4;
 if(Math.min.apply(null,tot)<FLOOR){
  var need=FLOOR-Math.min.apply(null,tot);
  document.getElementById('bars').innerHTML=
   '<div class="eye" style="margin-bottom:10px">Which day you keep it</div>'
   +'<p class="note">Not enough weeks yet to say. '+plural(need,'more week')
   +' and this reads which weekday you keep and which one you lose.</p>';
  return;}
 var bars=NM.map(function(n,i){
  var p=tot[i]?Math.round(hit[i]/tot[i]*100):0;
  return '<div class="wk" style="--tc:'+tr.c+'"><span style="min-width:30px">'+n+'</span>'
   +'<u><b style="width:'+p+'%"></b></u><em>'+p+' in 100</em></div>';}).join('');
 document.getElementById('bars').innerHTML=
  '<div class="eye" style="margin-bottom:10px">Which day you keep it</div>'+bars;}

function draw(){
 var d=D[cur];
 document.getElementById('tag').textContent=d.seat+' seat  ·  '
  +(d.substituted?d.actualTrack:d.track)+' track  ·  tier '+d.tier;
 board(); why(); heat(); stats();
 var w=walk();
 document.getElementById('foot').innerHTML=
  'Design B, the board. Comped against Streaks: a tile per ritual, the ring full when today is '
  +'recorded and empty when it is not, six the cap. Every number is real. Seat, track, tier and '
  +'practice come from <b>engine.js</b> through the build’s own <b>ritFor</b> rule, checked '
  +'against <b>PANEL-ritual-1000.md</b> A1. The '+w.length+' days of history are '+d.nm
  +'’s longest walk out of <b>losssim.js</b>. '+d.survived+' of '+d.sampled+' '+d.nm
  +'s in the panel reached day ninety, so this is the best case for this person.';}
draw();
</script>
