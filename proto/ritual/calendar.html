*{box-sizing:border-box}

body{font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif;
 -webkit-font-smoothing:antialiased;padding:0 0 64px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-weight:600;letter-spacing:-.01em;margin:0}
.eye{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
 font-weight:600}
.dim{color:var(--dim)}.mid{color:var(--mid)}
.bar{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);
 margin-bottom:22px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.16em;font-size:12px;color:var(--mid)}
select,button{font:inherit;color:inherit}
select{background:var(--panel-2);border:1px solid var(--line2);border-radius:10px;
 padding:9px 12px;min-height:44px}
.btn{background:transparent;border:1px solid var(--line2);border-radius:11px;
 padding:11px 16px;min-height:44px;cursor:pointer;color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.note{font-size:13px;color:var(--dim);line-height:1.6}
/* A CELL IS A FIXED SIZE AND THE GRID DOES NOT STRETCH IT. Stretched to the
   width of a 1600 column the squares became a checkerboard, and on a person
   with seven days of history the empty ones became a wall of absence: eighty
   four black squares against seven gold. That is a count against a total drawn
   in pixels, and it is the one thing this product refuses. */
/* The square grows to fill the card it is in. A fixed cell drew two weeks
   as a sliver in a card sized for thirteen, which is the wall of absence
   again in the opposite direction: an empty card instead of empty squares. */
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--cell,14px));
 gap:3px;justify-content:start}
.hm i{width:var(--cell,14px);height:var(--cell,14px);border-radius:3px;background:var(--sunk);
 border:1px solid var(--line);display:block;cursor:default}
.hm i.on{background:var(--k);border-color:var(--k)}
.hm i.fl{background:transparent;border-color:var(--k);border-width:1.5px}
.hm i.no{background:transparent;border-color:rgba(255,255,255,.05)}
.hm.edit i{cursor:pointer}
.hm.edit i:hover{outline:1.5px solid var(--accent);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.stat span{font-size:11.5px;color:var(--dim);letter-spacing:.04em}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;
 color:var(--dim);line-height:1.7}
@media(max-width:560px){
 .wrap{padding:0 16px}
 .stats{grid-template-columns:repeat(2,1fr)}
 body{padding-bottom:40px}}

<div class="wrap">
 <div class="bar">
  <span class="brand">ATUNED &middot; RITUAL</span>
  <select id="who" aria-label="Profile"></select>
  <span style="flex:1"></span>
  <!-- THE SPAN. One object at three resolutions, not three pages and not a
       tab bar with a count on it. The grid below keeps its row axis, its
       colour and its sort order at every stop, and only the column count and
       the cell's resolution change: thirty five cells, seven, one. -->
  <div class="seg" id="span" role="group" aria-label="Span"></div>
  <button class="btn" id="qbtn">Queue</button>
  <button class="btn" id="edit">Edit</button>
 </div>

 <!-- WHAT IS DUE. The first of the two questions, answered before the
      calendar is read, in one strip that never moves. -->
 <div class="due" id="due"></div>

 <div class="two" id="two">
  <div class="calwrap">
   <div class="calhead"><div class="eye" id="calttl"></div><div class="note" id="calnote"></div></div>
   <div id="cal"></div>
  </div>

  <div class="side">
   <!-- WHAT IS STANDING. The second question. Standing and not running,
        because running is this product's word for a saboteur. -->
   <div class="card">
    <div class="eye">Standing</div>
    <div id="stand"></div>
   </div>
   <div class="card">
    <div class="eye">Over time</div>
    <div class="stats" id="stats" style="margin-top:14px;grid-template-columns:1fr 1fr"></div>
    <div id="bars" style="margin-top:18px"></div>
   </div>
  </div>
 </div>
 <div class="foot" id="foot"></div>
</div>

<!-- THE QUEUE. His answer to where you are adding from. Ordered by the load
     each proposal is aimed at, labelled by who proposed it, and every row
     carries the engine function it came out of. -->
<div class="qmask" id="qmask" hidden></div>
<aside class="q" id="q" hidden aria-label="Queue">
 <div class="qhead">

 </div>

 <div id="qlist"></div>
</aside>

<style>

<script>
/* ============================================================
   SHARED BY THE THREE PROTOTYPES. Inlined into each one at build, so every
   page runs with no sibling file. Nothing here reaches the network.

   ICONOGRAPHY. Four tracks, four glyphs, RING AND NOT FILL, which is the
   standing ruling. Each is a stroke path in a 24 box and carries the track's
   colour, so the glyph and the colour say the same thing twice and a person
   who cannot tell the blue from the green still reads the shape.
   ============================================================ */
var TRACKS={
 Somatic:{c:'#DBBF68', ic:'M12 21c-4 0-7-3-7-6s2-5 4-5 3 1 3 3-1 3-2 3',
   nm:'Somatic', d:'sensation, read directly'},
 Body:{c:'#68CBA4', ic:'M12 4a8 8 0 100 16 8 8 0 100-16 M4 12h16',
   nm:'Body', d:'breath, and the nervous system'},
 Energy:{c:'#AF89D6', ic:'M12 8a4 4 0 100 8 4 4 0 100-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3',
   nm:'Energy', d:'attention, held at a point'},
 Mind:{c:'#7B97E2', ic:'M4 8h16 M4 12h10 M4 16h13',
   nm:'Mind', d:'thought, watched and not followed'}};
var SEATC={Root:'#CF5953',Sacral:'#D19255',Solar:'#D4BC70',Heart:'#65CFA5',
 Throat:'#65B8D4','3rd Eye':'#8296DB',Crown:'#A883D6'};
/* where each seat sits on the dial, in degrees clockwise from the top. Root at
   the bottom and Crown at the top, because that is where they sit on the body
   and the figure on every other surface already draws them that way. */
var SEATDEG={Crown:0,'3rd Eye':26,Throat:51,Heart:77,Solar:103,Sacral:129,Root:180};
var SEATORDER=['Crown','3rd Eye','Throat','Heart','Solar','Sacral','Root'];

function svgIc(path,c,sz){
 return '<svg viewBox="0 0 24 24" width="'+(sz||20)+'" height="'+(sz||20)+'" fill="none" '
 +'stroke="'+c+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
 +'<path d="'+path+'"/></svg>';}

/* THE RUN, READ OFF A WALK. Same rule as engine/ladder.js streakRead: a gap of
   one or two days is carried, three or more halves what was standing, and it
   never resets. Ported rather than reinvented so the prototype cannot claim a
   number the build would not. */
function runOf(walk){
 var run=0,gap=0;
 for(var i=0;i<walk.length;i++){
  if(walk[i]){run++;gap=0;}
  else{gap++; if(gap>2){run=Math.max(1,Math.ceil(run/2));gap=0;}}}
 return run;}
function bestOf(walk){var b=0,c=0;
 for(var i=0;i<walk.length;i++){if(walk[i]){c++;if(c>b)b=c;}else c=0;}return b;}

/* THE SPAN IS EARNED, NOT FIXED. A thirteen week grid drawn for somebody with
   seven days on the record is eighty four empty squares beside seven full
   ones, which reads as a tally of failures nobody asked for. The grid starts
   at the history it has, rounded up to a whole week with one week of room
   ahead, and grows to the cap. Nothing is ever drawn that the person has not
   lived through.  */
function spanOf(walk,cap){
 return Math.max(2,Math.min(cap||13,Math.ceil(walk.length/7)+1));}
/* the walk laid out as calendar weeks ending today, so the heat map has a
   weekday axis and is not just a run of squares. */
function weeksOf(walk,cols){
 cols=cols||13; var cells=cols*7, out=[];
 var pad=cells-walk.length;
 for(var i=0;i<cells;i++){
  var j=i-pad;
  out.push(j<0?null:(walk[j]===undefined?null:walk[j]));}
 return out;}

/* ARC. One segment of a ring, drawn as a stroked path so nothing is ever
   filled. a0 and a1 in degrees clockwise from the top. */
function arc(cx,cy,r,a0,a1){
 var p=function(a){var t=(a-90)*Math.PI/180;
  return [cx+r*Math.cos(t),cy+r*Math.sin(t)];};
 var s=p(a0), e=p(a1), big=(a1-a0)>180?1:0;
 return 'M'+s[0].toFixed(2)+' '+s[1].toFixed(2)
  +'A'+r+' '+r+' 0 '+big+' 1 '+e[0].toFixed(2)+' '+e[1].toFixed(2);}

/* a name made possessive without producing Marcuss */
function poss(n){return n+(/s$/i.test(n)?'\u2019':'\u2019s');}
function plural(n,w){return n+' '+w+(n===1?'':'s');}

var DATA={
 "profiles": {
  "Marcus": {
   "nm": "Marcus",

   "role": "creative director · ICP",
   "weight": 160,

    {

    },
    {
     "k": "box",

/* ---------- the rituals a person has standing ----------
   ONE PER KIND, AND EACH ONE HAS A SOURCE. Not six tiles with five holes in
   them, which is a count against a total wearing a costume, and not one tile
   with two grey kinds beside it, which teaches the three colours as two
   absences. The engine names a practice for each kind independently: ritFor
   for always on, the weakest of the twenty one laws for behaviour, and the
   heaviest address above the release line for release. Where a kind has no
   source the kind is empty and says so, which is the honest state for the four
   hundred and sixty five of a thousand who cannot run a release yet.

   The other two start today, because nothing in PEOPLE holds a second walk and

function rits(){
 if(RIT[cur])return RIT[cur];
 var d=D[cur], L=d.walk.length, out=[], zero=d.walk.map(function(){return 0;});

  kind:'hold', cadence:'every day', from:0, walk:d.walk.slice(), src:'ritFor'});
 d.queue.forEach(function(q){
  if(!q.min)return;
  if(q.kind==='hold')return;
  if(out.some(function(r){return r.kind===q.kind;}))return;
  out.push({k:q.nm, nm:q.nm, min:q.min, track:q.track||'Somatic', kind:q.kind,
   cadence:q.unit==='when called'?'when called':'every day',
   from:L-1, walk:zero.slice(), src:q.src, fresh:true});});

  return out;}
 /* month: the calendar month today sits in, padded to whole weeks, Monday
    first. Days before the person's first day are drawn as nothing at all. */
 var t=new Date(TODAY), y=t.getUTCFullYear(), m=t.getUTCMonth();
 var s=Date.UTC(y,m,1), e=Date.UTC(y,m+1,0);
 s-=((new Date(s).getUTCDay()+6)%7)*MS;
 e+=(6-((new Date(e).getUTCDay()+6)%7))*MS;
 for(var ms=s;ms<=e;ms+=MS){
  var inM=new Date(ms).getUTCMonth()===m;
  /* out: padding from the month either side, and drawn as nothing.
     pre: a day of this month from before the person's first day, drawn as its
     number and nothing else. */
  out.push({ms:ms,i:idxOf(ms,L),out:(ms<first&&!inM)||(!inM&&ms<first),
   pre:inM&&ms<first});}
 return out;}

function cal(){
 var el=document.getElementById('cal'), L=len();
 document.getElementById('calttl').textContent=
  span==='day'?'Today':(span==='week'?'This week':MON[new Date(TODAY).getUTCMonth()]
   +' '+new Date(TODAY).getUTCFullYear());
 if(span==='day'){ el.innerHTML=dayView();
  document.getElementById('calnote').textContent=
   plural(rits().length,'ritual')+' standing.';
  el.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){
   var r=rits()[+b.dataset.r], i=L-1; r.walk[i]=r.walk[i]?0:1; draw();};});
  el.querySelectorAll('[data-add]').forEach(function(b){
   b.onclick=function(){openQ(b.dataset.add);};});
  return;}
 var days=gridDays();
 var h='';
 if(span==='month'||window.innerWidth>980)
  h+='<div class="dowrow">'+DOW.map(function(d){return '<div class="dow">'+d+'</div>';})
   .join('')+'</div>';
 h+='<div class="grid '+span+(EDIT?' edit':'')+'">';
 days.forEach(function(d){
  if(d.out){h+='<div class="cell"></div>';return;}
  if(d.pre){h+='<div class="cell pale"><u>'+new Date(d.ms).getUTCDate()
   +'</u><div class="mk"></div></div>';return;}
  /* A DATE IS NOT A SLOT. A day before the person's first is drawn as its
     number and nothing else: no square, no outline, no mark. That is a month
     whose earlier days are not theirs yet. An empty square in the same place
     would be the wall of absence, which is a different object: a slot drawn
     for a day they are being told they did not fill. */
  var live=d.i>=0&&d.i<=L-1, ahead=d.i>L-1, dt=new Date(d.ms).getUTCDate();
  var cls='cell'+(live?' live':(ahead?' ahead':''))+(d.ms===TODAY?' today':'')
   +(span==='month'&&new Date(d.ms).getUTCMonth()!==new Date(TODAY).getUTCMonth()?' pale':'');
  h+='<button class="'+cls+'" data-d="'+d.i+'"'+((!live&&!ahead)?' disabled':'')+'>';
  h+='<u>'+(span==='week'?DOW[(new Date(d.ms).getUTCDay()+6)%7]+' '+dt:dt)+'</u>';
  if(span==='week'){
   h+='<div class="wk7">';
   KINDS.forEach(function(x){
    has(x.k).forEach(function(r){
     if(!dueOn(r,d.i))return; var on=didOn(r,d.i);
     h+='<span class="wrow k-'+x.k+(on?'':' off')+'"><s class="dot"></s>'
      +'<span>'+r.nm+'</span></span>';});});
   h+='</div>';}
  else{
   /* NOTHING IS DRAWN AHEAD OF TODAY. A day that has not happened has nothing
      on the record and nothing missing from it, and seven empty slots drawn
      forward is a tally of failures a person has not had the chance to make. */
   h+='<div class="mk">';
   KINDS.forEach(function(x){
    var st=live?kindOn(x.k,d.i):null;
    h+='<s class="k-'+x.k+(st==='on'?' on':(st==='due'?' due':''))+'"></s>';});
   h+='</div>';}
  h+='</button>';});
 el.innerHTML=h+'</div>';
 /* THIS MONTH'S OWN DAYS. The grid is padded to whole weeks, so the last of
    August and the first of October sit in it, and counting the cells said
    twenty one days of September on a month that has had twenty. */
 var m0=new Date(TODAY).getUTCMonth();
 var seen=days.filter(function(d){return !d.out&&d.i>=0&&d.i<=L-1
   &&new Date(d.ms).getUTCMonth()===m0;}).length;
 document.getElementById('calnote').textContent=EDIT
  ? 'Tap a day to put it on the record or take it off.'
  : (span==='week'?'Seven days, and the three kinds in the same order down each.'
     :plural(seen,'day')+' of this month on the record. One cell a day.');
 if(EDIT)el.querySelectorAll('.cell.live').forEach(function(b){b.onclick=function(){
  var i=+b.dataset.d; has('hold').forEach(function(r){
   if(i>=r.from)r.walk[i]=r.walk[i]?0:1;}); draw();};});
 else el.querySelectorAll('.cell').forEach(function(b){b.onclick=function(){
  if(b.dataset.d===undefined)return; setSpan(span==='month'?'week':'day');};});}

function dayView(){
 var L=len(), i=L-1;
 return KINDS.map(function(x){
  var rs=has(x.k);
  var h='<div class="sect k-'+x.k+'"><div class="shead"><span class="sg">'
   +kg(x.k,17)+'</span><span><b>'+x.nm+'</b> <i>'+x.d+'</i></span></div>';
  if(!rs.length){
   h+='<button class="empty" data-add="'+x.k+'">Nothing standing here yet. '
    +'<b>Open the queue</b> to put something in it.</button>';
   return h+'</div>';}
  h+='<div class="tiles">'+rs.map(function(r){
   var j=rits().indexOf(r), on=didOn(r,i), tr=TRACKS[r.track]||TRACKS.Body;
   return '<button class="tile'+(on?' done':'')+'" data-r="'+j+'">'
    +'<span class="ring">'+ringSvg(on?1:0,KC[x.k],64)
    +'<span class="gl">'+svgIc(tr.ic,on?KC[x.k]:'var(--mid)',24)+'</span></span>'
    +'<b>'+r.nm+'</b><span>'+r.min+' min &middot; '+r.cadence+'</span></button>';})
   .join('')+'</div>';
  return h+'</div>';}).join('');}

/* ---------- standing ---------- */
function stand(){
 var el=document.getElementById('stand'), rs=rits();
 el.innerHTML=rs.map(function(r){
  var tr=TRACKS[r.track]||TRACKS.Body, run=runOf(r.walk.slice(r.from));
  return '<div class="srow k-'+r.kind+'"><span class="sg">'+svgIc(tr.ic,KC[r.kind],17)
   +'</span><span class="tx"><b>'+r.nm+'</b><i>'+K[r.kind].nm.toLowerCase()
   +(r.via?' &middot; '+r.via.toLowerCase():'')
   +' &middot; '+r.min+' min &middot; '+r.cadence+'</i></span>'
   +'<em>'+(run?plural(run,'day'):(r.fresh?'starts today':'not yet'))+'</em></div>';})
  .join('');}

/* ---------- the accountability read. Passed as built, and not redesigned. ---- */
function stats(){
 var d=D[cur], base=has('hold')[0]||rits()[0], w=base.walk;
 var done=w.filter(Boolean).length, best=bestOf(w), run=runOf(w), mins=0;
 rits().forEach(function(r){mins+=r.walk.filter(Boolean).length*r.min;});
 document.getElementById('stats').innerHTML=[
  '<b>'+run+'</b><span>'+(run===1?'day standing':'days standing')+'</span>',
  '<b>'+best+'</b><span>longest run, in days</span>',
  '<b>'+done+'</b><span>days practised</span>',
  '<b>'+mins+'</b><span>minutes recorded</span>'
 ].map(function(x){return '<div class="stat">'+x+'</div>';}).join('');
 var hit=[0,0,0,0,0,0,0], tot=[0,0,0,0,0,0,0];
 var cells=weeksOf(w,spanOf(w,13));
 cells.forEach(function(v,i){if(v===null)return;var r=i%7;tot[r]++;if(v)hit[r]++;});
 var FLOOR=4;
 if(Math.min.apply(null,tot)<FLOOR){
  var need=FLOOR-Math.min.apply(null,tot);
  document.getElementById('bars').innerHTML=
   '<div class="eye" style="margin-bottom:10px">Which day you keep it</div>'
   +'<p class="note">Not enough weeks yet to say. '+plural(need,'more week')
   +' and this reads which weekday you keep and which one you lose.</p>';
  return;}
 document.getElementById('bars').innerHTML=
  '<div class="eye" style="margin-bottom:10px">Which day you keep it</div>'
  +DOW.map(function(n,i){var p=tot[i]?Math.round(hit[i]/tot[i]*100):0;
   return '<div class="wk k-'+base.kind+'"><span style="min-width:30px">'+n+'</span>'
    +'<u><b style="width:'+p+'%"></b></u><em>'+hit[i]+' of '+tot[i]+'</em></div>';})
  .join('');}

/* ---------- the queue ---------- */
function openQ(k){if(k)opt=k;QOPEN=true;draw();
 var f=document.querySelector('#q .qrow .yes');if(f)f.focus();}
function closeQ(){QOPEN=false;draw();document.getElementById('qbtn').focus();}
function qlist(){
 var d=D[cur], ref=refused();
 return d.queue.filter(function(q){return !ref[q.i];})
  .filter(function(q){return !rits().some(function(r){return r.nm===q.nm;});})
  .slice()
  /* ORDERED, NOT LISTED. The order is the load each proposal is aimed at.
     What the person is optimising for lifts one kind to the top and hides
     nothing, which is the whole of his "the user gets to choose". */
  .sort(function(a,b){return (b.kind===opt)-(a.kind===opt)||b.weight-a.weight;});}
function queue(){
 var d=D[cur], list=qlist();
 document.getElementById('qnote').innerHTML=
  'Ordered by the load each one is aimed at. '+plural(list.length,'proposal')+' waiting.';
 document.getElementById('qlist').innerHTML=list.length?list.map(function(q){
  return '<div class="qrow k-'+q.kind+'"><span class="sg">'+kg(q.kind,18)+'</span>'
   +'<span class="tx"><b>'+q.nm+'</b><span class="by">'+cap(q.by)+'</span>'
   +'<div class="meta">'+K[q.kind].nm.toLowerCase()
   +(q.via?' &middot; '+q.via.toLowerCase():'')
   +(q.min?' &middot; '+q.min+' min':'')+' &middot; '+q.unit+'</div>'
   +'<p>'+q.because+'</p><span class="acts">'
   +'<button class="yes" data-add="'+q.i+'">'+(q.min?'Add':'Build it')+'</button>'
   +'<button class="no" data-no="'+q.i+'">Not now</button></span>'
   +'<div class="st" id="st'+q.i+'"></div></span></div>';})
  .join('')
  :'<p class="note" style="padding-top:14px">Nothing waiting. The queue refills when '
   +'the field moves or you tell it something new.</p>';
 document.getElementById('qlist').querySelectorAll('[data-add]').forEach(function(b){
  b.onclick=function(){add(+b.dataset.add);};});
 document.getElementById('qlist').querySelectorAll('[data-no]').forEach(function(b){
  b.onclick=function(){refused()[+b.dataset.no]=1;draw();};});}
function add(i){
 var q=D[cur].queue.filter(function(x){return x.i===i;})[0];
 if(!q)return;
 if(!q.min){
  /* not a practice, so nothing is added and the row says so and stays put */
  var st=document.getElementById('st'+i);
  if(st)st.innerHTML='The avatar is built on its own surface, by writing both '
   +'sides of a pair. That surface is not in this prototype, so nothing was '
   +'added here.';
  return;}
 var L=len();
 rits().push({k:q.nm, nm:q.nm, via:q.via||null, min:q.min,
  track:q.track||'Somatic', kind:q.kind,
  cadence:q.unit==='when called'?'when called':'every day',
  from:L-1, walk:D[cur].walk.map(function(){return 0;}), fresh:true});
 draw();}

/* ---------- controls ---------- */
function setSpan(s){span=s;draw();}
function segs(id,items,get,set){
 document.getElementById(id).innerHTML=items.map(function(x){
  return '<button data-v="'+x[0]+'" aria-pressed="'+(get()===x[0])+'">'+x[1]+'</button>';})
  .join('');
 document.getElementById(id).querySelectorAll('[data-v]').forEach(function(b){
  b.onclick=function(){set(b.dataset.v);};});}

var sel=document.getElementById('who');
Object.keys(D).forEach(function(k){var o=document.createElement('option');
 o.value=k;o.textContent=D[k].nm+', '+D[k].age+', '+D[k].role.replace(' · ICP','');
 sel.appendChild(o);});
sel.value=cur;sel.onchange=function(){cur=sel.value;span='month';draw();};
document.getElementById('edit').onclick=function(){EDIT=!EDIT;draw();};
document.getElementById('qbtn').onclick=function(){QOPEN?closeQ():openQ();};
document.getElementById('qclose').onclick=closeQ;
document.getElementById('qmask').onclick=closeQ;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&QOPEN)closeQ();});

function draw(){
 var d=D[cur];
 segs('span',[['day','Day'],['week','Week'],['month','Month']],
  function(){return span;},setSpan);
 segs('opt',KINDS.map(function(x){return [x.k,x.nm];}),function(){return opt;},
  function(v){opt=v;draw();});
 var eb=document.getElementById('edit');
 eb.className='btn'+(EDIT?' on':''); eb.textContent=EDIT?'Done':'Edit';
 document.getElementById('q').hidden=!QOPEN;
 document.getElementById('qmask').hidden=!QOPEN;
 document.getElementById('two').className='two '+span;
 due(); cal(); stand(); stats(); if(QOPEN)queue();
 document.getElementById('foot').innerHTML=
  'The ritual builder as a calendar. Design B made a calendar: one grid at three spans, '
  +'sorted by the three kinds, and the queue is where a person adds from. '
  +'<b>Every number is real.</b> Seat, track, tier and practice come from <b>engine.js</b> '
  +'through the build’s own <b>ritFor</b> rule. The queue’s proposals come from '
  +'<b>compute().carrying</b>, <b>compute().weakL</b>, <b>sniffStory</b> and '
  +'<b>avatarBlank</b>, and <b>caldata.js</b> refuses to write if any row cannot name '
  +'its source. The '+d.walk.length+' days on the always on lane are '+d.nm
  +'’s longest walk out of <b>losssim.js</b>; '+d.survived+' of '+d.sampled+' '
  +d.nm+'s in the panel reached day ninety, so it is the best case for this person. '
  +'The other two lanes carry no history because nothing in <b>PEOPLE</b> holds a second '
  +'one, and inventing it would be the only fabricated number on the page. '
  +'The sniffer reads '+d.nm+'’s own words and returns '
  +(d.snOffer.length?plural(d.snOffer.length,'address'):'nothing')
  +', which is the defect measured at <b>TASKS.md</b> 0j and not a blank.';}
draw();
</script>
