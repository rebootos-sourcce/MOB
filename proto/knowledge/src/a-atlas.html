<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge prototype A, Atlas</title>
<!--CSS-->
<style>
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px;margin-bottom:24px}
.srch{flex:1 1 520px;position:relative}
.srch label{display:block;font-size:14px;color:var(--dim);margin-bottom:6px}
.srch input{width:100%;height:56px;padding:0 18px 0 48px;border-radius:14px;border:1px solid var(--line);
 background:var(--panel);color:var(--ink);font-size:18px}
.srch svg{position:absolute;left:16px;bottom:16px;width:22px;height:22px;fill:none;stroke:var(--dim);stroke-width:1.8}
.recd{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.recd .f{display:flex;flex-direction:column}
.recd .f span{font-size:13px;color:var(--dim)}
.recd .f b{font-size:20px;font-weight:600}
.shelf{margin:0 0 32px}
.shelf-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.shelf-h h2{font-size:21px}
.shelf-h .eyebrow{font-size:14px}
.shelf-h .more{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px;border-radius:14px;
 border:1px solid var(--line);background:var(--panel);cursor:pointer;min-height:150px;position:relative}
.card:hover{border-color:#454B5E;background:#1E2230}
.card .hd{display:flex;align-items:center;gap:12px}
.card .nm{font-size:17px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.card .fm{font-size:13px;color:var(--dim)}
.card .df{font-size:15px;color:#CFCBC3;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{display:flex;align-items:center;gap:10px;margin-top:auto;font-size:14px;color:var(--mid)}
.card .ft .fig{margin-left:auto;color:var(--ink)}
.card.yours{border-color:rgba(126,184,212,.45)}
.res-gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:20px}
.gl{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:12px 14px;background:var(--panel)}
.gl b{display:block;margin-bottom:4px}
.gl p{color:#D6D2CA;font-size:15px;max-width:72ch}
.rlist{display:flex;flex-direction:column;gap:2px;max-width:1100px}
.rrow{display:flex;align-items:center;gap:14px;min-height:56px;padding:6px 10px;border-radius:10px;border:1px solid transparent;
 background:transparent;cursor:pointer;text-align:left}
.rrow:hover{background:var(--panel);border-color:var(--line)}
.rrow .t{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.rrow .t small{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .fig{margin-left:auto}
.rgh{font-size:14px;color:var(--dim);margin:14px 10px 4px}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:20px}
.trail button{min-height:44px}
.trail .sep{color:var(--dim)}
@media (max-width:760px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .card{min-height:0;padding:12px}
 .card .hd{flex-direction:column;align-items:flex-start;gap:8px}
 .card .df{display:none}
 .srch input{font-size:17px}
}
</style></head>
<body>
<main class="stage" id="stage">
 <div class="top">
  <div class="srch"><label for="q">Search every entry and term</label>
   <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
   <input id="q" type="search" autocomplete="off" placeholder="Fear, the Controller, jaw, address"></div>
  <div class="recd" id="recd"></div>
 </div>
 <div id="body"></div>
</main>
<!--JS-->
<script>
/* ============================================================
   A. THE ATLAS. Browse by the question a person arrives with, search
   as you type, read an entry in place, and follow its links without
   losing the way back.

   Built on: cards for browsing mixed content and a plain list for
   search results (Nielsen Norman on cards); information scent, so a
   shelf is named by the question and the deck name rides under it
   (Pirolli and Card); the glossary answering first, which the shipped
   codex already does; previews on hover, which Wikipedia measured at
   about a fifth more pages reached per session.
   ============================================================ */
var Q='', OPEN=[], ALL={};
var SHELVES=[
 ['axis','What you carry','The nine child emotions every reading is built from.'],
 ['seat','Where it sits','Seven seats, root to crown, each generated by a nerve plexus.'],
 ['sab','What runs you','Patterns that fire on a trigger and sound like your own voice.'],
 ['mask','Who shows up when it runs','Six masks, worn over the seats they cover.'],
 ['hcx','The shape a pattern takes','Six architectures the saboteurs belong to.'],
 ['arch','What you are built for','Twelve archetypes, each a way of moving.'],
 ['dom','Where you work','Nineteen blueprint domains, four roots.'],
 ['node','Every address','Where each pattern is held in the body.'],
 ['term','The words','Every term the instrument uses, defined once.']];
var esc=KB.esc;

KB.chrome('A','Atlas','<b>Why this design.</b> Browse by question, search as you type, read in place, follow links. '
 +'Cards are for browsing mixed kinds of content and a plain list is for search results, which is Nielsen Norman’s split. '
 +'Each shelf is named by the question a person arrives with, because a label like "Fetters" carries no scent for a stranger. '
 +'Hovering a link previews it, which Wikipedia measured at about a fifth more pages reached per session with fewer trips back. '
 +'The shelf a person carries most on comes first. Seen costs one tap; Known costs one right answer, because recall holds and rereading does not.');

function sortFor(list){var p=KB.person(); if(!p)return list;
 return list.slice().sort(function(a,b){return (KB.pct(b)||0)-(KB.pct(a)||0);});}

function card(e,cls){var p=KB.pct(e), st=KB.known(e.id)?'known':KB.seen(e.id)?'seen':'';
 return '<button type="button" class="card'+(cls?' '+cls:'')+'" data-open="'+esc(e.id)+'">'
  +'<span class="hd">'+KB.ring(e,40,p)+'<span><span class="nm">'+esc(e.nm)+'</span><br><span class="fm">'
  +esc(KB.KIND[e.kind][0])+(e.fam&&e.kind!=='term'?' · '+esc(e.fam):'')+'</span></span></span>'
  +'<span class="df">'+esc(e.card||e.def)+'</span>'
  +'<span class="ft">'+(st?'<span class="state '+st+'"><i></i>'+(st==='known'?'Known':'Seen')+'</span>':'')
  +(p==null?'':'<span class="fig">'+p+'%</span>')+'</span></button>';}

function yours(){
 var p=KB.person(), E=KB.E, out=[];
 if(!p){['term:Address','term:Charge','seat:Root','term:Release'].forEach(function(id){if(KB.BY[id])out.push(KB.BY[id]);});
  return {h:'Start here',sub:'Four entries the rest of the atlas is built on.',list:out};}
 var ax=E.filter(function(e){return e.kind==='axis';}).sort(function(a,b){return KB.pct(b)-KB.pct(a);});
 var nd=E.filter(function(e){return e.kind==='node';}).sort(function(a,b){return KB.pct(b)-KB.pct(a);});
 var sb=E.filter(function(e){return e.kind==='sab';}).sort(function(a,b){return KB.pct(b)-KB.pct(a);});
 /* one of each kind only where the reading carries it. Three of the six
    reference profiles have no saboteur running and nothing held, and a
    row called yours must not show them a 0. The axes fill the gap. */
 out=[ax[0],ax[1]];
 if(KB.held(nd[0]))out.push(nd[0]);
 if(KB.pct(sb[0]))out.push(sb[0]);
 for(var i=2;out.length<4;i++)out.push(ax[i]);
 return {h:'Yours first',sub:'What your reading carries most, one of each kind.',list:out};}

function browse(){
 var y=yours(), h='<section class="shelf"><div class="shelf-h"><h2>'+y.h+'</h2><span class="eyebrow">'+y.sub+'</span></div>'
  +'<div class="grid">'+y.list.map(function(e){return card(e,'yours');}).join('')+'</div></section>';
 SHELVES.forEach(function(s){
  var list=sortFor(KB.E.filter(function(e){return e.kind===s[0];}));
  var n=ALL[s[0]]?list.length:Math.min(list.length,s[0]==='node'||s[0]==='term'?8:5);
  h+='<section class="shelf"><div class="shelf-h"><h2>'+s[1]+'</h2><span class="eyebrow">'+KB.KIND[s[0]][1]+'. '+s[2]+'</span>'
   +(list.length>n||ALL[s[0]]?'<button type="button" class="btn more" data-all="'+s[0]+'">'
    +(ALL[s[0]]?'Show fewer':'Show all '+list.length)+'</button>':'')+'</div>'
   +'<div class="grid">'+list.slice(0,n).map(function(e){return card(e);}).join('')+'</div></section>';});
 return h;}

function match(e,q){return (e.nm+' '+e.fam+' '+(e.where||'')+' '+(e.theme||'')).toLowerCase().indexOf(q)>=0;}
function results(){
 var q=Q.trim().toLowerCase();
 var terms=KB.E.filter(function(e){return e.kind==='term'&&e.nm.toLowerCase().indexOf(q)>=0;}).slice(0,2);
 var rest=KB.E.filter(function(e){return e.kind!=='term'&&match(e,q);});
 var h='';
 if(terms.length)h+='<div class="res-gloss">'+terms.map(function(t){return '<div class="gl"><b>'+esc(t.nm)+'</b><p>'+esc(t.def)+'</p></div>';}).join('')+'</div>';
 if(!rest.length&&!terms.length)return '<p class="muted">Nothing matches "'+esc(Q)+'". Try a place in the body, like jaw or chest, or a word like fear.</p>';
 var by={}; rest.forEach(function(e){(by[e.kind]=by[e.kind]||[]).push(e);});
 h+='<div class="rlist">';
 ['axis','seat','sab','hcx','mask','arch','dom','node'].forEach(function(k){
  if(!by[k])return;
  h+='<div class="rgh">'+KB.KIND[k][1]+'</div>';
  by[k].slice(0,12).forEach(function(e){var p=KB.pct(e);
   h+='<button type="button" class="rrow" data-open="'+esc(e.id)+'">'+KB.ring(e,36,p)
    +'<span class="t"><span>'+esc(e.nm)+'</span><small>'+esc(e.card||e.def)+'</small></span>'
    +(p==null?'':'<span class="fig">'+p+'%</span>')+'</button>';});});
 return h+'</div>';}

function entry(){
 var e=KB.BY[OPEN[OPEN.length-1]]; KB.markSeen(e.id);
 var trail='<nav class="trail" aria-label="Where you came from"><button type="button" class="btn" data-back="0">Back to the atlas</button>'
  +OPEN.slice(0,-1).map(function(id,i){return '<span class="sep">/</span><button type="button" class="chip" data-back="'+(i+1)+'">'+esc(KB.BY[id].nm)+'</button>';}).join('')
  +'<span class="sep">/</span><span>'+esc(e.nm)+'</span></nav>';
 return trail+KB.sheet(e)+'<div style="margin-top:20px">'+KB.award('an entry becoming Known')+'</div>';}

function recd(){var c=KB.counts();
 document.getElementById('recd').innerHTML='<div class="f"><span>Seen</span><b>'+c.seen+' '+(c.seen===1?'entry':'entries')+'</b></div>'
  +'<div class="f"><span>Known</span><b>'+c.known+' '+(c.known===1?'entry':'entries')+'</b></div>';}

var hidePv;
function render(){
 var b=document.getElementById('body');
 b.innerHTML=OPEN.length?entry():(Q.trim()?results():browse());
 recd();
 b.querySelectorAll('[data-open]').forEach(function(el){el.onclick=function(){
  if(hidePv)hidePv(); OPEN.push(el.getAttribute('data-open')); render(); window.scrollTo(0,0);};});
 b.querySelectorAll('[data-back]').forEach(function(el){el.onclick=function(){
  OPEN=OPEN.slice(0,+el.getAttribute('data-back')); render(); window.scrollTo(0,0);};});
 b.querySelectorAll('[data-all]').forEach(function(el){el.onclick=function(){
  var k=el.getAttribute('data-all'); ALL[k]=!ALL[k]; render();};});
 KB.wireCheck(b,function(){recd();});}
document.getElementById('q').oninput=function(){Q=this.value; OPEN=[]; render();};
hidePv=KB.preview(document.getElementById('body'));
KB.on(render);
render();
</script>
</body></html>
