<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field overlay compared</title>
<!-- The three looks side by side, same profile, same lines, same clock, so
     the only thing that differs between them is the look. The ruling that a
     question about a drawing is asked with the drawing, applied to motion. -->
<style>
:root{--ground:#0b0b0d;--edge:rgba(255,255,255,.09);--edge-2:rgba(255,255,255,.16);
 --ink:#EFEDE8;--mid:#B4B0A8;--dim:#94908A;--accent:#7EB8D4;
 --ease-out:cubic-bezier(.22,1,.36,1);--t-micro:.12s;
 --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--edge)}
.bar h1{font-size:15px;font-weight:600;margin:0 8px 0 0}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp span{color:var(--dim);font-size:12.5px;margin-right:4px}
.bar button,.bar label{background:transparent;border:1px solid var(--edge);border-radius:8px;color:var(--mid);
 font:inherit;font-size:13px;padding:6px 11px;min-height:34px;cursor:pointer;display:flex;gap:6px;align-items:center;
 transition:all var(--t-micro) var(--ease-out)}
.bar button:hover{border-color:var(--edge-2);color:var(--ink)}
.bar button[aria-pressed=true]{color:var(--accent);border-color:rgba(126,184,212,.45)}
.row{display:flex;gap:16px;padding:16px;flex-wrap:wrap;justify-content:center}
.col{flex:0 0 auto;min-width:0}
.col h2{font-size:14px;font-weight:600;margin:0 0 2px}
.col p{margin:0 0 8px;color:var(--dim);font-size:12.5px;max-width:var(--pw);min-height:3.2em}
.view{position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--edge)}
.plate{position:absolute;left:0;top:0;transform-origin:0 0}
.plate img{position:absolute;left:0;top:0;display:block;pointer-events:none}
.plate canvas{position:absolute;pointer-events:none}
.cost{margin-top:6px;color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="bar">
 <h1>Field overlay, the three looks at once</h1>
 <div class="grp" id="g-who"><span>Profile</span></div>
 <div class="grp" id="g-m"><span>Most active</span></div>
 <div class="grp"><button type="button" id="tog" aria-pressed="true">Active</button>
  <label><input type="checkbox" id="rm"> Reduced motion</label></div>
</div>
<div class="row" id="row"></div>
<script src="data-sofia.js"></script>
<script src="data-james.js"></script>
<script src="data-gordon.js"></script>
<script src="overlay.js"></script>
<script>
(function(){
var LOOKS=[{k:'hum',nm:'1. Hum',d:'A plucked string. Pitch is tension, swing is charge.'},
 {k:'pulse',nm:'2. Pulse',d:'Points running in along the line and back. Count and speed are charge.'},
 {k:'relay',nm:'3. Relay',d:'One whole chain fires at a time, address inward, hop by hop.'}];
var q=new URLSearchParams(location.search);
var st={who:q.get('who')||'James',mode:q.get('mode')||'ring',on:true,rm:false};
var REC=q.get('rec')==='1';
var clock=REC?{t:0,now:function(){return this.t;}}:{now:function(){return performance.now();}};
var $=function(id){return document.getElementById(id);}, P=[];
function group(id,list,lab,key){var g=$(id);list.forEach(function(v){var b=document.createElement('button');
 b.type='button';b.textContent=lab(v);b.dataset.v=v;b.addEventListener('click',function(){st[key]=v;mount();});g.appendChild(b);});}
group('g-who',['Sofia','James','Gordon'],function(v){return v;},'who');
group('g-m',['ring','overall'],function(v){return v==='ring'?'Heaviest per ring':'Heaviest overall';},'mode');
$('tog').addEventListener('click',function(){st.on=!st.on;this.setAttribute('aria-pressed',String(st.on));
 var now=clock.now();P.forEach(function(x){x.ov.set(st.on,now);x.at=now;x.from=x.op;});});
$('rm').addEventListener('change',function(){st.rm=this.checked;mount();});
function mount(){
 ['g-who','g-m'].forEach(function(id,i){$(id).querySelectorAll('button').forEach(function(b){
  b.setAttribute('aria-pressed',String(b.dataset.v===[st.who,st.mode][i]));});});
 var G=window.OV[st.who].sizes[1600], tag=st.who.toLowerCase()+'-1600';
 var cx=G.cv.x+G.CX, cy=G.cv.y+G.CY, r=G.U*1.12;
 var pw=Math.floor(Math.min(520,Math.max(300,(window.innerWidth-80)/3)));
 if(q.get('pw'))pw=+q.get('pw');
 var k=pw/(2*r), row=$('row'); row.innerHTML=''; P=[];
 LOOKS.forEach(function(L){
  var col=document.createElement('div');col.className='col';col.style.setProperty('--pw',pw+'px');
  col.innerHTML='<h2>'+L.nm+'</h2><p>'+L.d+'</p><div class="view" style="width:'+pw+'px;height:'+pw+'px">'
   +'<div class="plate" style="width:1600px;height:1000px;transform:scale('+k+') translate('+(-(cx-r))+'px,'+(-(cy-r))+'px)">'
   +'<img src="plates/'+tag+'-ship.png" alt=""><img class="dim" src="plates/'+tag+'-dim.png" alt="">'
   +'<canvas style="left:'+G.cv.x+'px;top:'+G.cv.y+'px"></canvas></div></div><div class="cost">-</div>';
  row.appendChild(col);
  var cv=col.querySelector('canvas');
  var ov=new Overlay({canvas:cv,G:G,look:L.k,n:12,mode:st.mode,reduced:st.rm,
   dpr:Math.max(1,Math.min(4,(window.devicePixelRatio||1)*k))});
  ov.size(G.cv.w,G.cv.h);
  var now=clock.now(); if(st.on)ov.set(true,now);
  P.push({ov:ov,dim:col.querySelector('.dim'),cost:col.querySelector('.cost'),at:now,from:0,op:0});});}
function dimOp(x,now){var E=OVL_E;
 if(st.rm)return st.on?1:0;
 if(st.on)return x.from+(1-x.from)*E.out(Math.min(1,Math.max(0,(now-x.at)/320)));
 return x.from*(1-E.in(Math.min(1,Math.max(0,(now-x.at-60)/320))));}
var lastT=0;
function paint(now){P.forEach(function(x){x.op=dimOp(x,now);x.dim.style.opacity=x.op.toFixed(3);
 var s=x.ov.frame(now);
 if(!REC&&now-lastT>500)x.cost.textContent=(s.ms||s.last).toFixed(2)+' ms a frame, '+s.moving+' moving, '+s.lines+' lines lit';});
 if(now-lastT>500)lastT=now;}
mount();
if(REC)document.head.insertAdjacentHTML('beforeend','<style>.cost{display:none}</style>');
if(REC)window.__rec={at:function(ms){clock.t=ms;paint(ms);},set:function(o){for(var k in o)st[k]=o[k];clock.t=0;mount();}};
else (function loop(){paint(clock.now());requestAnimationFrame(loop);})();
window.addEventListener('resize',function(){if(!REC)mount();});
})();
</script>
</body>
</html>
