<title>Pass 2, the card becomes a line</title>
<style>
:root{
 --bg:#0C0D12; --panel:#1A1D26; --panel-2:#252833; --sunk:#090A0E;

 --ink:#EFEDE8; --mid:#B4B0A8; --dim:#94908A;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--mid);font-family:var(--sans);
 font-size:14px;-webkit-font-smoothing:antialiased}
/* the prototype's own frame. It stands in for the app's centre column and it
   says so, because a prototype that pretends to be the whole screen lies about
   how much room the design actually has. */
.pw{max-width:884px;margin:0 auto;padding:0 16px}
.pnote{font-size:11.5px;color:var(--dim);padding:8px 16px;border-bottom:1px solid var(--edge);
 display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.pnote b{color:var(--ink);font-weight:500}
.pnote select,.pnote button{background:var(--sunk);border:1px solid var(--edge);
 color:var(--ink);border-radius:var(--r-xs);padding:5px 9px;font-family:var(--sans);
 font-size:11.5px;cursor:pointer}
.eye{font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--dim);
 text-transform:capitalize}
h2.kh{margin:0;font-size:22px;font-weight:500;letter-spacing:-.01em;color:var(--ink);
 text-transform:capitalize}
.kp{margin:0;font-size:13.5px;line-height:1.65;color:var(--mid);max-width:76ch}
.tabs{display:flex;flex-wrap:wrap;gap:5px}
.tb{background:var(--sunk);border:0;color:var(--mid);border-radius:var(--r-xs);
 padding:8px 13px;font-family:var(--sans);font-size:12.5px;cursor:pointer;
 min-height:var(--tap);display:inline-flex;align-items:center;gap:5px}
.tb.on{background:transparent;color:var(--accent);font-weight:500}
.tb b{font-family:var(--num);font-weight:500;color:var(--dim)}
.tb.on b{color:var(--accent)}
.sch{flex:1 1 280px;background:var(--sunk);border:1px solid var(--edge);color:var(--ink);
 border-radius:var(--r-xs);padding:0 13px;min-height:var(--tap);font-family:var(--sans);
 font-size:14px;width:100%}
/* the mark. ring not fill, 24 unit grid, everywhere. */
svg.g{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.scale{font-size:11px;color:var(--dim);font-family:var(--sans)}
@media(max-width:760px){.pw{max-width:none}}


.lg{display:grid;gap:0 22px;grid-template-columns:repeat(3,1fr)}
.ln{display:flex;align-items:center;gap:10px;min-height:44px;
 border-bottom:1px solid var(--edge);padding:0 2px}
.lni{width:24px;height:24px;display:grid;place-items:center;color:var(--c);flex:0 0 auto}
.lnn{font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.lns{font-size:11.5px;color:var(--dim);white-space:nowrap}
.lnv{margin-left:auto;font-family:var(--num);font-size:13px;font-weight:500;
 color:var(--c);font-variant-numeric:tabular-nums;flex:0 0 auto}
.lnv.off{color:var(--dim)}
.top{display:flex;flex-direction:column;gap:14px;padding:18px 0 16px}
@media(max-width:760px){.lg{grid-template-columns:1fr}}
</style></head><body>

function mark(ic,size,sw){
 var body = !ic ? '<circle cx="12" cy="12" r="7"/>'
  : (String(ic).charAt(0)==='<' ? ic : '<path d="'+ic+'"/>');
 return '<svg class="g" viewBox="0 0 24 24" width="'+size+'" height="'+size+
  '" stroke-width="'+sw+'" aria-hidden="true">'+body+'</svg>';}


function ring(pc,col,ic,box,sw,gl){
 var r=(box-sw)/2-0.5, C=2*Math.PI*r, off=C*(1-(pc==null?0:pc)/100);
 var half=box/2;
 return '<span class="rg" style="--c:'+col+';width:'+box+'px;height:'+box+'px">'
  +'<svg class="rga" width="'+box+'" height="'+box+'" aria-hidden="true">'
  +'<circle cx="'+half+'" cy="'+half+'" r="'+r+'" fill="none" stroke="rgba(148,144,138,.22)" stroke-width="'+sw+'"/>'
  +(pc==null?'':'<circle cx="'+half+'" cy="'+half+'" r="'+r+'" fill="none" stroke="'+col+'"'
   +' stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'"'
   +' stroke-dashoffset="'+off.toFixed(1)+'"/>')
  +'</svg><span class="rgg" style="width:'+box+'px;height:'+box+'px">'
  +'<svg class="g" viewBox="0 0 24 24" width="'+gl+'" height="'+gl+'" stroke-width="'+(gl<=16?1.9:gl<=22?1.7:1.5)+'" aria-hidden="true">'
  +(ic?'<path d="'+ic+'"/>':'<circle cx="12" cy="12" r="7"/>')+'</svg></span></span>';}
