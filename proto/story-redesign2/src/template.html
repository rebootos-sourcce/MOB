<!doctype html>
<html lang="en" data-build="proto-story-redesign2 {{STAMP}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Story page, four layouts</title>
{{FONT}}
<style>
/* ============================================================
   THE STORY PAGE, SECOND ROUND. Round HY in TASKS.md. A proposal, not a wire in.

   The frame is the product's own, measured off the committed source.html on
   the Story tab: the stage starts 85px down and 78px in at 1600 by 1000, and
   121px down with a 59px bottom bar at 390 by 844. The proposal strip sits in
   the top band and a placeholder rail sits at the left, so "above the fold"
   here means above the fold in the product, not in a bare page.

   The right rail is gone. His words: "feel free to break that right
   navigation." Every layout below uses the stage and the rail's width together.
   ============================================================ */
:root{
 --bg:#0C0D12; --panel:#1A1D26; --panel-2:#252833; --sunk:#090A0E; --stage:#101010;
 --edge:rgba(255,255,255,.09); --edge-2:rgba(255,255,255,.14);
 --ink:#EFEDE8; --mid:#B4B0A8; --dim:#94908A;
 --accent:#7EB8D4; --on-accent:#0B1418; --au:#C2A063; --proto:#D6A93B;
 --ease-out:cubic-bezier(.22,1,.36,1); --ease-land:cubic-bezier(.34,1.56,.64,1);
 --r-s:8px; --r-m:12px;
 --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --top:85px; --left:78px; --foot:0px; --pad:12px;
}
*{box-sizing:border-box}
*{--ct:color-mix(in srgb,var(--c,#7EB8D4) 88%,#fff)}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font:400 14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.eb{font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.01em}
.ring{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.6px solid var(--c,var(--accent));flex:0 0 auto}
.btn{background:var(--panel-2);border:1px solid var(--edge-2);border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer;font-size:14px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}

/* ---- the frame: the product's top band and left rail, as placeholders ---- */
.top{position:fixed;left:0;right:0;top:0;height:var(--top);z-index:30;background:#0A0B0F;border-bottom:1px solid var(--edge);
 display:flex;flex-direction:column}
.top .strip{background:var(--proto);color:#16130A;font-weight:600;font-size:12.5px;padding:3px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .strip span{font-weight:500;opacity:.85}
.top .tb{display:flex;align-items:center;gap:6px;padding:6px 12px;flex-wrap:wrap}
.top .tb .lbl{font-size:12.5px;color:var(--dim);margin:0 2px 0 6px}
.top .tb button,.top .tb select{font-size:13px;background:#171920;border:1px solid var(--edge-2);border-radius:999px;
 padding:0 13px;min-height:44px;cursor:pointer;color:var(--mid)}
.top .tb select{padding:0 10px}
.top .tb button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:#1B2229}
.top .tb button b{font-weight:600;color:var(--ink);margin-right:5px}
.top .tb .sp{flex:1 1 auto}
.rail{position:fixed;left:0;top:var(--top);bottom:0;width:var(--left);z-index:20;border-right:1px solid var(--edge);background:#0A0B0F;
 display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:22px}
.rail i{width:22px;height:22px;border-radius:50%;border:1.6px solid rgba(255,255,255,.16)}
.rail small{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;color:#57544F;margin-top:8px}
.foot{display:none}

/* ---- the app: exactly the viewport under the band and beside the rail ---- */
.app{position:relative;margin:var(--top) 0 0 var(--left);height:calc(100vh - var(--top) - var(--foot));min-height:640px;
 padding:var(--pad);display:flex}
.app .row{display:flex;flex-direction:row;gap:12px;min-width:0;min-height:0}
.app .col{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.app .row,.app .col{transition:flex .5s var(--ease-out)}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r-m);padding:14px 16px;position:relative;min-height:0;min-width:0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:24px}
.tag{font-size:12px;color:var(--dim)}

/* ---- pips: the rung, drawn and never printed. Shipped shape. ---- */
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:5px;height:12px;border-radius:1px;border:1px solid var(--edge-2)}
.pips i.ask{border-color:var(--c)}
.pips i.on{background:var(--c);border-color:var(--c)}

/* ---- Source AI's prompt ---- */
.pe{background:transparent;border:0;border-left:3px solid var(--accent);border-radius:0;padding:2px 0 2px 16px}
.pe .pe-q{font-size:22px;line-height:1.3;font-weight:300;margin:4px 0 2px;color:var(--ink);max-width:44ch}
.pe .pe-q.quiet{font-size:16px;color:var(--mid)}
.pe .pe-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.pe .pe-note{font-size:13px;color:var(--dim)}
.pe .pe-gauge{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.pe .pe-gauge .sn{color:var(--ct);font-weight:600}
.pe .pe-jog{margin:6px 0 0;font-size:14px;color:var(--dim)}
.pe .pe-jog q{color:var(--mid);quotes:"\201C" "\201D"}

/* ---- the journal ---- */
.jr{display:flex;flex-direction:column}
.jr .ed{position:relative;display:flex;flex:1 1 auto;min-height:150px;font-family:var(--sans);font-size:17px;line-height:1.72;font-weight:300}
.jr .ta,.jr .hl{flex:1 1 auto;border:1px solid transparent;border-radius:var(--r-s);padding:16px 18px;
 font:inherit;letter-spacing:normal;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;margin:0}
.jr .hl{position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--ink);z-index:0;border-color:var(--edge);
 background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.72em - 1px),rgba(255,255,255,.05) calc(1.72em - 1px),rgba(255,255,255,.05) 1.72em) 0 16px/100% 100% no-repeat,var(--sunk)}
.jr .ta{position:relative;z-index:1;resize:none;background:transparent;color:transparent;caret-color:var(--ink);outline:none;overflow:auto;width:100%}
.jr .ta::placeholder{color:var(--dim)}
.jr .ta::selection{background:color-mix(in srgb,var(--accent) 34%,transparent)}
.jr .ed:focus-within .hl{border-color:var(--accent)}
/* a mark never changes weight, round HW's caret drift, measured 12.8px after five marks */
.jr mark{color:var(--ct);background:none;box-shadow:inset 0 -2px 0 var(--c);border-radius:0;font-weight:inherit}
.jr mark.neg{box-shadow:none;color:var(--dim);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--c) 70%,transparent)}
.jr mark.coh{--c:var(--accent)}
.jr mark.new{animation:mk-in .6s var(--ease-out)}
@keyframes mk-in{from{background:color-mix(in srgb,var(--c) 45%,transparent)}}
.jr .bar{display:flex;align-items:center;gap:10px;margin-top:10px}
.jr .ct{font-size:13px;color:var(--dim);flex:1 1 auto;min-width:0}
.jr .ct b{color:var(--mid);font-weight:500}

/* ---- the imprints instrument: Trace's strip chart with Route's line through it ---- */
.ch{display:flex;flex-direction:column;background:var(--panel)}
.ch .stage{position:relative;flex:1 1 auto;min-height:120px;margin:8px -6px 0;border-radius:var(--r-s);background:var(--stage);overflow:hidden}
.ch canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.ico{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 10px;border-radius:999px;border:1px solid var(--edge-2);background:transparent;cursor:pointer;font-size:13px;color:var(--mid)}
.ico svg{flex:0 0 auto;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.ico[aria-pressed="true"]{border-color:var(--au);color:var(--ink)}
.ico b{font-weight:600;color:var(--ink)}
#pend,.open{white-space:nowrap}
.sort{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.sort .eb{margin-right:4px}
.sort button{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--edge-2);background:transparent;cursor:pointer;font-size:13px;color:var(--mid)}
.sort button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:#1B2229}
.ch .ctr{font-size:12.5px;color:var(--dim);margin-top:6px;min-height:18px}
.ls{display:flex;flex-direction:column;background:var(--panel)}
.ls .body{flex:1 1 auto;overflow:auto;margin:4px -6px 0;padding:0 6px;scrollbar-color:#3A3D47 transparent}
.ls .grp{margin-top:10px;border-radius:8px;padding:2px 6px 6px;margin-left:-6px;margin-right:-6px;transition:background .2s}
.ls .grp.hot{background:color-mix(in srgb,var(--c) 9%,transparent)}
.ls .ghd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;border-bottom:1px solid var(--edge);padding:4px 0}
.ls .ghd b{color:var(--ct);font-weight:600;display:flex;align-items:center;gap:7px}
.ls .ghd svg{width:15px;height:15px;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.ls .ghd em{font-style:normal;color:var(--dim);text-align:right}
.ls .ghd em.warn{color:var(--mid)}
.ls .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ls .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:999px;
 padding:4px 11px 4px 8px;font-size:13.5px;min-height:30px}
.ls .pill.inf{border-style:dashed}
.ls .pill small{color:var(--mid);font-size:12px}
.ls .pill.new{animation:pl-in .5s var(--ease-land)}
@keyframes pl-in{from{transform:scale(.6);opacity:0}}
.none{color:var(--dim);font-size:13.5px;margin:10px 0 0;max-width:52ch}
.flt{position:fixed;left:0;top:0;z-index:40;pointer-events:none;font:500 13px/1 var(--sans);color:var(--ct);
 background:color-mix(in srgb,var(--c) 18%,#0C0D12);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);
 border-radius:999px;padding:4px 8px;white-space:nowrap;will-change:transform,opacity}

/* ---- the release: lit from within by the heaviest address it will run (round HX, B) ---- */
.rl{display:flex;flex-direction:column;border:0;--glow:var(--accent);
 background:radial-gradient(70% 90px at 50% 0,color-mix(in srgb,var(--glow) 36%,transparent),transparent),
  radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--glow) calc(var(--lux,.3) * 60%),transparent),transparent 70%),#15171E;
 box-shadow:0 0 0 1px color-mix(in srgb,var(--glow) 40%,transparent),0 18px 60px -18px color-mix(in srgb,var(--glow) 50%,transparent)}
.rl .rl-hd{display:flex;align-items:center;gap:9px}
.rl .rl-hd h3{margin:0;font-size:19px;font-weight:600}
.rl .seg{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--edge-2);background:transparent;cursor:pointer;font-size:13px;color:var(--mid)}
.rl .seg[aria-pressed="true"]{border-color:var(--glow);color:var(--ink)}
.rl .rl-q{list-style:none;margin:10px 0 0;padding:0}
.rl .rq-b{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;background:transparent;border:0;border-top:1px solid var(--edge);cursor:pointer;text-align:left;padding:0 2px}
.rl .rq-b .ring{transition:background .2s}
.rl .rq-b[aria-pressed="true"] .ring{background:var(--c)}
.rl .rq-b[aria-pressed="false"] .nm{color:var(--dim)}
.rl .rq-b .nm{font-size:14.5px;font-weight:500;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl .rq-b .sb{font-size:12.5px;color:var(--dim)}
.rl .rl-pace{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.rl .rl-pace .eb{color:var(--mid);margin-right:4px}
.rl .rl-count{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:10px}
.rl .rl-count small{font-size:13px;font-weight:400;color:var(--mid);margin-left:4px}
.rl .rq{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--edge)}
.rl .rq .nm{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl .rq .wt{font-size:13px;color:var(--mid);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rl .rq .wt b{color:var(--ink);font-weight:600}
.rl .rq .sub{grid-column:2/4;font-size:12.5px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.rl .rq .br{grid-column:2/4;height:5px;border-radius:3px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.rl .rq .br i{position:absolute;top:0;bottom:0;left:0;background:var(--c);border-radius:3px}
.rl .rq .br i.cut{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 5px);opacity:.9}
.rl .rq.new{animation:pl-in .5s var(--ease-land)}
.rl .rl-mid{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-color:#3A3D47 transparent}
.rl .rl-foot{margin-top:auto;padding-top:10px}
.rl .rl-go{width:100%;margin-top:12px;min-height:52px;border-radius:12px;border:0;cursor:pointer;font-size:16px;font-weight:600;
 background:var(--glow);color:#0B0C10}
.rl .rl-go:disabled{opacity:.4;cursor:default}
.rl .rl-go.stop{background:var(--panel-2);color:var(--ink)}
.rl .rl-run .nd{font-size:21px;font-weight:600;color:var(--ct);margin-top:10px}
.rl .rl-run .chn{font-size:12.5px;color:var(--mid)}
.rl .rl-run .ln{font-size:16px;line-height:1.5;margin:10px 0}
.rl .rl-run .pg{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.rl .rl-run .pg i{display:block;height:100%;background:var(--c);transition:width .4s var(--ease-out)}
.rl .rl-sum{display:none}
.st{font-size:13px;color:var(--mid)}

/* ============================================================
   F. BAND. The instrument spans the page, so every word gets its own tick.
   ============================================================ */
body[data-l="f"] .ch .stage{margin-top:6px}
body[data-l="f"] .ch .hd2{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
body[data-l="f"] .ch .sort{margin-top:0;margin-left:auto}

/* ============================================================
   G. DOCK. The release is a bar across the foot of the page.
   ============================================================ */
body[data-l="g"] .rl{display:grid;grid-template-columns:130px minmax(0,1fr) auto;grid-template-rows:1fr;gap:4px 18px;align-items:center;padding:14px 18px}
body[data-l="g"] .rl .rl-hd{grid-column:1;grid-row:1}
body[data-l="g"] .rl .rl-mid{grid-column:2;grid-row:1;min-width:0;display:flex;flex-direction:column}
body[data-l="g"] .rl .rl-q{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 14px;margin-top:0}
body[data-l="g"] .rl .rq-b{border-top:0;border-left:1px solid var(--edge);padding-left:10px}
body[data-l="g"] .rl .rl-mid{overflow:visible}
body[data-l="g"] .rl .rl-foot{grid-column:3;grid-row:1;margin:0;padding:0;display:flex;align-items:center;gap:18px}
body[data-l="g"] .rl .rl-count{margin:0}
body[data-l="g"] .rl .rl-go{width:190px}
body[data-l="g"] .rl .rl-go{margin:0}

/* ============================================================
   H. FLOW. Nothing is hidden; the column you are working in gets the room.
   ============================================================ */

/* ============================================================
   THE PHONE, 390 wide. The product's band is 121px and its foot bar 59px.
   ============================================================ */
@media (max-width:760px){
 :root{--top:121px;--left:0px;--foot:59px;--pad:10px}
 .rail{display:none}
 .foot{display:flex;position:fixed;left:0;right:0;bottom:0;height:var(--foot);z-index:30;background:#0A0B0F;border-top:1px solid var(--edge);
  align-items:center;justify-content:space-around}
 .foot i{width:22px;height:22px;border-radius:50%;border:1.6px solid rgba(255,255,255,.16)}
 .top .tb{padding:4px 8px;gap:4px}
 .top .tb button,.top .tb select{padding:0 9px;font-size:12.5px}
 .top .tb .lbl,.top .tb .wide{display:none}
 .app{height:auto;min-height:0;display:block;padding-bottom:calc(var(--foot) + 16px)}
 .app .row,.app .col{display:flex;flex-direction:column;gap:10px}
 .app .row>*,.app .col>*{flex:0 0 auto!important}
 .app>.col,.app>.row{gap:10px}
 .pe .pe-q{font-size:19px}
 .jr .ed{min-height:210px;font-size:16px}
 .ch .stage{min-height:0;height:230px;flex:0 0 auto}
 .ls .body{overflow:visible}
 .rl .rl-q{overflow:visible}
 body[data-l="g"] .rl{display:flex}
 body[data-l="g"] .rl .rl-foot{grid-column:3;grid-row:1;margin:0;padding:0;display:flex;align-items:center;gap:18px}
body[data-l="g"] .rl .rl-count{margin:0}
body[data-l="g"] .rl .rl-go{width:190px}
 body[data-l="g"] .rl .rl-q{display:block}
 body[data-l="g"] .rl .rq-b{border-left:0;border-top:1px solid var(--edge);padding-left:2px}
 body[data-l="g"] .rl .rl-foot{display:block}
 /* G on the phone: the dock is a bar pinned over the product's foot bar */
 body[data-l="g"] .rl.dockbar{position:fixed;left:8px;right:8px;bottom:calc(var(--foot) + 8px);z-index:25;padding:10px 12px;display:grid;
  grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
 body[data-l="g"] .rl.dockbar>*:not(.rl-sum):not(.rl-foot){display:none}
 body[data-l="g"] .rl.dockbar .rl-foot{padding:0;margin:0}
 .rl.dockbar .rl-pace,.rl.dockbar .rl-count,.rl.cmp .rl-pace,.rl.cmp .rl-count{display:none!important}
 body[data-l="g"] .rl.dockbar .rl-go{margin:0;min-height:48px;padding:0 20px;width:auto}
 body[data-l="g"] .app{padding-bottom:calc(var(--foot) + 110px)}
 .rl .rl-sum{display:none}
 .rl.dockbar .rl-sum,.rl.cmp .rl-sum{display:block;font-size:13.5px;min-width:0}
 .rl-sum b{display:block;font-size:15px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .rl-sum span{color:var(--mid)}
 /* H on the phone: the two you are not in sit compact, so all three are on the first screen */
 body[data-l="h"] .ch.cmp .stage{height:112px}
 body[data-l="h"] .ch.cmp .sort,body[data-l="h"] .ch.cmp .ctr{display:none}
 body[data-l="h"] .ls.cmp{display:none!important}
 body[data-l="h"] .ch.cmp .open{display:inline-flex}
 body[data-l="h"] .ch.cmp .ico .lb{display:none}
 body[data-l="h"] .ch.cmp .ico{padding:0 10px;gap:4px}
 body[data-l="h"] .rl.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px}
 body[data-l="h"] .rl.cmp>*:not(.rl-sum):not(.rl-foot){display:none}
 body[data-l="h"] .rl.cmp .rl-foot{padding:0;margin:0}
 body[data-l="h"] .rl.cmp .rl-go{margin:0;min-height:48px;padding:0 20px;width:auto}
 body[data-l="h"] .jr .ed{min-height:160px}
 body[data-l="h"] .jr.cmp .ed{min-height:120px}
 body[data-l="h"] .pe .pe-q{font-size:17.5px}
 body[data-l="h"] .ch.cmp .hd2 .hd{min-height:0}
}
.open{display:none;margin-left:auto;align-items:center}

/* ---- notes and the simulation, under the fold on purpose ---- */
.notes{margin:0 0 0 var(--left);padding:28px 24px 60px;color:var(--mid);font-size:14px;border-top:1px solid var(--edge);background:#0A0B0F}
.notes h2{font-size:17px;color:var(--ink);margin:22px 0 6px;font-weight:600}
.notes h3{font-size:15px;color:var(--ink);margin:16px 0 4px;font-weight:600}
.notes p,.notes li{max-width:96ch;margin:6px 0}
.notes b{color:var(--ink);font-weight:600}
.notes table{border-collapse:collapse;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
.notes th,.notes td{text-align:left;padding:6px 14px 6px 0;border-bottom:1px solid var(--edge);vertical-align:top}
.notes th{color:var(--dim);font-weight:600}
.notes td.n{text-align:right}
.notes .win{color:#5FD5A6;font-weight:600}
.notes .lose{color:#E0837E}
.notes .scroll{overflow-x:auto}
@media (max-width:760px){.notes{margin:0;padding:22px 16px calc(var(--foot) + 30px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.still *{animation:none!important;transition:none!important}
</style>
</head>
<body data-l="e">
<div class="top" data-proto>
 <div class="strip">Proposal for round HY <span>Four journal layouts with Story, Imprints and Release on one screen. Nothing here is wired into the product, and nothing leaves this page.</span></div>
 <div class="tb" role="toolbar" aria-label="Layouts">
  <span class="lbl">Layout</span>
  <button data-l="e"><b>E</b>Chain</button>
  <button data-l="f"><b>F</b>Band</button>
  <button data-l="g"><b>G</b>Dock</button>
  <button data-l="h"><b>H</b>Flow</button>
  <span class="sp"></span>
  <button id="demo">Type the example</button>
  <button id="clr" class="wide">Clear</button>
  <select id="who" aria-label="Whose field the release reads"></select>
  <button id="prior" class="wide" aria-pressed="false">Two earlier entries</button>
  <button id="still" class="wide" aria-pressed="false">Still</button>
  <button id="gonotes" class="wide">Notes and simulation</button>
 </div>
</div>
<nav class="rail" aria-hidden="true" data-proto><i></i><i></i><i></i><i></i><i></i><small>the product's tool rail</small></nav>
<nav class="foot" aria-hidden="true" data-proto><i></i><i></i><i></i><i></i><i></i></nav>

<main class="app" id="app">
 <div class="panel pe" id="pe" aria-label="Source AI prompt"></div>
 <div class="panel jr" id="jr">
  <div class="ed"><textarea id="ta" class="ta" spellcheck="false" aria-label="The day"
   placeholder="What happened. Write it the way you would say it out loud."></textarea><div class="hl" id="hl" aria-hidden="true"></div></div>
  <div class="bar"><span class="ct" id="ct" role="status" aria-live="polite">0 words</span><button class="btn" id="jclr">Clear</button><button class="btn pri" id="commit" disabled>Commit</button></div>
 </div>
 <div class="panel ch" id="ch" aria-label="Imprints, as read">
  <div class="hd2"><div class="hd" style="flex:1 1 auto"><span class="eb">Imprints</span><span class="tag" id="pend" style="margin-right:auto">Nothing read yet</span>
   <button class="ico" id="bank" title="The bank: every imprint you hold, on the Imprints page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5L12 4l9 5.5M5 10v8M9.7 10v8M14.3 10v8M19 10v8M3 20.5h18"/></svg><span class="lb">Bank</span></button>
   <button class="ico" id="vault" aria-pressed="false" title="The vault: what you have released"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h16v14H4zM7 18.5v2M17 18.5v2"/><circle cx="12" cy="11.5" r="3.6"/><path d="M12 7.9v1.2M12 13.9v1.2"/></svg><span class="lb">Vault</span> <b id="vn">0</b></button>
   <button class="btn open" id="chopen">List</button></div>
   <div class="sort" id="sort" role="group" aria-label="Sort imprints by"><span class="eb">Sort</span></div></div>
  <div class="stage" id="stage"><canvas id="cv" aria-hidden="true"></canvas></div>
  <div class="ctr" id="ctr"></div>
 </div>
 <div class="panel ls" id="ls" aria-label="Imprints, listed">
  <div class="hd"><span class="eb" id="lshd">Pending imprints</span></div>
  <div class="body" id="imps"></div>
 </div>
 <div class="panel rl" id="rl" aria-label="Release"></div>
</main>
<p class="vh" id="say" aria-live="polite"></p>
<section class="notes" id="notes"></section>
<script>
{{ENGINE}}
</script>
<script>
var PROTO_STAMP={{STAMPJSON}};
var SIMDATA={{SIMJSON}};
{{SHARED}}
</script>
</body>
</html>
