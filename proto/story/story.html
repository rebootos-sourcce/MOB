<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story, rebuilt</title>
<style>
/* ============================================================
   TOKENS. Copied by value from atuned_src/shell/head.html so this page
   stands alone with no sibling files and no outbound request. Every one of
   them is the shipping value. Nothing here invents a colour.
   ============================================================ */
:root{
 --bg:#0C0D12; --panel:#1A1D26; --panel-2:#252833; --sunk:#090A0E;
 --edge:rgba(255,255,255,.09); --edge-2:rgba(255,255,255,.14);
 --ink:#EFEDE8; --mid:#B4B0A8; --dim:#94908A;
 --root:#D6524C; --sacral:#D8924E; --solar:#DABF6A;
 --heart:#5FD5A6; --throat:#5EBBDB; --eye:#7D93E0; --crown:#A77EDB;
 --alarm:#FF2E1F; --alarm-soft:rgba(255,46,31,.16);
 --accent:#7EB8D4; --gold:var(--accent); --on-accent:#0B1418; --au:#C2A063;
 --sans:'Inter','Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
 --num:'Inter','Inter Tight',system-ui,-apple-system,sans-serif;
 --r:16px; --r-s:11px; --r-xs:8px; --tap:44px;
 --t-micro:.12s; --t-element:.22s; --ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
 font-weight:300;-webkit-font-smoothing:antialiased}

/* the prototype's own chrome. Not part of the port. */
.pchrome{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
 padding:12px 22px;border-bottom:1px solid var(--edge);background:var(--panel)}
.pchrome b{font-weight:500;font-size:13px;color:var(--mid);letter-spacing:.06em;
 text-transform:uppercase}
.pchrome select,.pchrome button{min-height:var(--tap);background:var(--panel-2);
 color:var(--ink);border:1px solid var(--edge);border-radius:var(--r-xs);
 padding:8px 14px;font-family:var(--sans);font-size:13.5px;cursor:pointer}
.pchrome .note{font-size:12.5px;color:var(--dim);flex:1 1 220px;min-width:0}

/* ============================================================
   THE SURFACE. Two columns at desk width, one at phone width.
   ============================================================ */
.st-wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;
 padding:18px 22px 22px;align-items:start}
.st-col{min-width:0;display:flex;flex-direction:column}

/* ============================================================
   THE JOURNAL, AND WHY IT IS RAISED.

   Measured against the page ground at #0C0D12: the box shipped on --sunk
   #090A0E, which is 1.02 to 1. It is darker than the page it sits on, so it
   is a hole. The reading card on Summary sits on --panel at 1.15 to 1 and
   the comment beside it in the stylesheet says why in the product's own
   words: "the reading gets a home. It was text on the page ground."

   The journal is the one consequential region in this product that was
   below the ground. It rises now, onto the same --panel every reading in
   the product already sits on, so the one surface the whole content chain
   starts at is treated like the readings it produces.
   ============================================================ */
.st-col:first-child{min-height:calc(100vh - 140px)}
.jr{position:relative;flex:1 1 auto;display:flex;flex-direction:column;
 background:var(--panel);border:1px solid var(--edge);
 border-radius:var(--r);overflow:hidden;
 transition:border-color var(--t-element) var(--ease-out)}
/* THE TOP EDGE CARRIES THE READING. The seat colour of the heaviest thing
   the sniffer has found so far, so the box's own frame is the first place
   the instrument answers. Nothing found yet, and it is the page edge. */
.jr::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;z-index:3;
 background:var(--lead,var(--edge-2));
 transition:background var(--t-element) var(--ease-out)}
.jr:focus-within{border-color:var(--edge-2)}
/* the top rule lights the moment somebody clicks in, before a word is typed.
   Every action gets a response, and this is the box's. */
.jr:focus-within::before{background:var(--lead,var(--accent))}
/* THE MEASURE. 66ch, the same measure .s-p already holds the reading at.
   A field that runs the full width of a column is a form input. A column of
   text at a reading measure is a page. */
.jr-ed{position:relative;flex:1 1 auto;display:flex;width:100%;max-width:72ch;
 margin:0 auto;font-family:var(--sans);font-size:17px;line-height:1.78;
 font-weight:300}
.jr-ta,.jr-hl{flex:1 1 auto;min-height:340px;border:0;margin:0;
 padding:52px 30px 96px;
 font-family:inherit;font-size:inherit;line-height:inherit;font-weight:inherit;
 white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word}
.jr-hl{position:absolute;inset:0;overflow:hidden;pointer-events:none;
 color:var(--ink);z-index:0}
.jr-ta{position:relative;z-index:1;resize:none;background:transparent;
 color:transparent;caret-color:var(--accent);outline:none;overflow:auto}
.jr-ta::selection{background:color-mix(in srgb,var(--accent) 34%,transparent)}
.jr-ta::placeholder{color:var(--dim)}
/* AND THE FETTERS ARE LIT IN THEIR OWN SEAT COLOUR, which is the one thing
   this box already did and the last thing anybody noticed. It is the centre
   of the treatment now: this is the only surface in the product where the
   instrument marks up a person's own sentence while they are still writing
   it. That is what makes it the journal rather than a text field. */
.jr-f{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);
 font-weight:500;border-radius:3px;padding:1px 0;
 box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 26%,transparent)}

/* THE RED LIGHT. Upper left, inside the field, present only while the
   microphone is open. It is the one unmissable signal that something is
   listening, so it is the alarm colour and nothing else on this surface is. */
.jr-live{position:absolute;left:18px;top:16px;z-index:4;display:none;
 align-items:center;gap:9px;font-family:var(--num);font-size:12.5px;
 letter-spacing:.07em;text-transform:uppercase;color:var(--alarm)}
.jr.live .jr-live{display:inline-flex}
.jr-lamp{width:11px;height:11px;border-radius:50%;background:var(--alarm);
 box-shadow:0 0 0 4px var(--alarm-soft);animation:lamp 1.5s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:1}50%{opacity:.38}}
@media (prefers-reduced-motion:reduce){.jr-lamp{animation:none}}
.jr.live{border-color:color-mix(in srgb,var(--alarm) 42%,transparent)}

/* THE RECORD BUTTON. Circular, lower right, inside the field. 56px, which
   clears the 44px floor with room, because it is pressed with a thumb on a
   phone and it is the only control inside the writing surface. Ring, never
   fill: the resting state is a ring around a microphone and the recording
   state is a ring around a stop square. */
.jr-rec{position:absolute;right:20px;bottom:20px;z-index:4;
 width:56px;height:56px;min-width:56px;min-height:56px;border-radius:50%;
 display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
 background:var(--panel-2);border:1px solid var(--edge-2);color:var(--mid);
 transition:color var(--t-micro) var(--ease-out),
  border-color var(--t-micro) var(--ease-out),
  background var(--t-micro) var(--ease-out)}
.jr-rec:hover{color:var(--ink);border-color:var(--accent)}
.jr-rec:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.jr-rec svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;
 stroke-linejoin:round;width:22px;height:22px}
.jr.live .jr-rec{color:var(--alarm);border-color:var(--alarm)}
.jr.live .jr-rec svg{fill:var(--alarm);stroke:var(--alarm)}

/* the line under the box. One sentence, because the microphone route has to
   state where the audio goes before it opens and that is a standing ruling.
   It sits under the writing rather than above it, so it is read on the way
   to the button and never between a person and the page they came to write. */
.jr-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
 margin-top:13px}
.jr-note{flex:1 1 280px;min-width:0;font-size:13px;line-height:1.55;
 color:var(--dim)}
.jr-ct{font-family:var(--num);font-size:12.5px;color:var(--dim);
 font-variant-numeric:tabular-nums}
.btn{min-height:var(--tap);display:inline-flex;align-items:center;
 justify-content:center;gap:7px;background:var(--panel-2);
 border:1px solid var(--edge);color:var(--mid);border-radius:var(--r-xs);
 padding:9px 17px;font-family:var(--sans);font-size:13.5px;cursor:pointer;
 transition:all var(--t-micro) var(--ease-out)}
.btn:hover:not(:disabled){color:var(--ink);border-color:var(--edge-2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);border-color:var(--accent);
 color:var(--on-accent);font-weight:500}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.42;cursor:default}

/* ============================================================
   THE RIGHT COLUMN. Release on top, so Run release is above the fold on
   every viewport this product ships to. Selection under it, cloud under
   that and scrolling on its own.
   ============================================================ */
.rt{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--edge);
 border-radius:var(--r-s);padding:16px 18px}
.eyeline{display:flex;align-items:center;justify-content:space-between;
 gap:12px;margin-bottom:12px}
.eye{font-family:var(--num);font-size:11.5px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--dim)}
.lnk{min-height:var(--tap);display:inline-flex;align-items:center;gap:7px;
 background:transparent;border:1px solid var(--edge);color:var(--mid);
 border-radius:var(--r-xs);padding:8px 14px;font-family:var(--sans);
 font-size:13px;cursor:pointer}
.lnk:hover{color:var(--ink);border-color:var(--accent)}
.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round}

/* the release panel. Two controls, and that is the whole of it. */
.rl-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
 margin-bottom:14px}
.rl-pace{display:inline-flex;align-items:center;gap:9px;
 font-size:13px;color:var(--mid)}
.rl-pace input{width:76px;min-height:var(--tap);background:var(--panel-2);
 border:1px solid var(--edge);border-radius:var(--r-xs);color:var(--ink);
 font-family:var(--num);font-size:15px;font-variant-numeric:tabular-nums;
 padding:9px 11px;text-align:center}
.rl-pace input:focus{outline:2px solid var(--accent);outline-offset:1px}
.rl-run{flex:1 1 auto;min-height:48px}
.rl-list{display:flex;flex-direction:column;gap:2px}
.rl-row{display:flex;align-items:center;gap:11px;min-height:var(--tap);
 padding:4px 0}
/* .rl-row span matched the badge too, because the badge is a span. Element
   selectors inside a component reach components the component does not own.
   The name carries a class and nothing else in the row is addressed by tag. */
.rl-nm{flex:1 1 auto;min-width:0;font-size:14px;color:var(--ink);
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl-row em{font-style:normal;font-size:12.5px;color:var(--dim)}
.rl-none{font-size:13.5px;color:var(--dim);line-height:1.65}

/* the selection panel. What one imprint is, and what two do together. */
.sel-one{padding:13px 0;border-top:1px solid var(--edge)}
.sel-one:first-of-type{border-top:0;padding-top:0}
.sel-hd{display:flex;align-items:center;gap:11px;margin-bottom:7px}
.sel-nm{font-size:16px;font-weight:500;color:var(--ink);line-height:1.25}
.sel-sub{font-size:12px;color:var(--dim)}
.sel-p{font-size:14px;line-height:1.68;color:var(--mid);margin:0;max-width:60ch}
.sel-p b{color:var(--ink);font-weight:500}
.sel-p .w{color:var(--c);font-weight:500}
.sel-pair{margin-top:14px;padding-top:13px;
 border-top:1px solid color-mix(in srgb,var(--accent) 34%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:12px;color:var(--mid);background:var(--panel-2);
 border:1px solid var(--edge);border-radius:999px;padding:5px 11px}

/* ============================================================
   THE CLOUD. Every pill is the product's own figure: the ring carrying the
   reading, the number in a pill on the ring, and the name beside it. One
   component, the same one the address rows and the release list already
   use, instead of a second pill design living only on this page.

   The size channel is gone. The shipping pill scaled its font from 13 to 17
   and its padding from 6 to 11 by magnitude, which put a second magnitude
   channel on a component whose ring is already the magnitude channel, and
   made half the labels smaller than the other half for a reason nobody can
   read off the screen.
   ============================================================ */
.cl-scroll{max-height:none}
.cl-seat{display:flex;align-items:center;gap:10px;margin:16px 0 8px;
 padding-bottom:6px;border-bottom:1px solid var(--edge);color:var(--c);
 font-size:13px;font-weight:500;letter-spacing:.02em}
.cl-seat:first-child{margin-top:0}
.cloud{display:flex;flex-wrap:wrap;gap:7px}
.ip{min-height:var(--tap);display:inline-flex;align-items:center;gap:9px;
 background:var(--panel-2);border:1px solid var(--edge);border-radius:999px;
 padding:5px 15px 5px 5px;cursor:pointer;color:var(--ink);
 font-family:var(--sans);font-size:14px;font-weight:400;
 transition:border-color var(--t-micro) var(--ease-out),
  background var(--t-micro) var(--ease-out)}
.ip:hover{border-color:var(--c)}
.ip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--panel-2))}
.ip.ghost{border-style:dashed;border-color:var(--edge-2);color:var(--mid)}
.ip.ghost .crb-v{color:var(--mid)}
/* THE BADGE GEOMETRY IS ui/shell/head.html:1315, copied by value and not
   redrawn. content-box plus reserved padding at the lower right is what
   keeps the pill clear of the glyph it is qualifying; laid on the corner it
   covers the mark and a row of five reads as five smudges. */
.crb{position:relative;display:inline-block;flex:0 0 auto;box-sizing:content-box;
 width:34px;height:34px;padding:0 24px 8px 0}
.crb-a{display:block;transform:rotate(-90deg)}
.crb-g{position:absolute;left:0;top:0;width:34px;height:34px;display:grid;
 place-items:center;color:var(--c);pointer-events:none}
.crb-g svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round}
.crb-v{position:absolute;right:0;bottom:0;font-family:var(--num);font-weight:500;
 line-height:1;background:var(--panel-2);color:var(--ink);
 border:1px solid color-mix(in srgb,var(--c) 44%,transparent);
 border-radius:999px;padding:1.5px 6px;white-space:nowrap;font-size:11.5px;
 font-variant-numeric:tabular-nums}
.ip.on .crb-v{background:var(--panel)}

/* WHAT IS FILLED IN IS NOT AN IMPRINT, and the shipping panel counted it as
   one. Measured on the reference records: Sofia reads "Imprints, 49" with
   nothing held, Angela "Imprints, 33" with nothing held, and every one of
   those is an installed coherent opposite, which is what a release produces
   rather than what it removes. They keep a place on the page and they lose
   the word. Filled in is the product's own term for them: the Summary rail
   already prints "Filled in, 12 addresses". */
.fi{margin-top:18px;padding-top:14px;border-top:1px solid var(--edge)}
.fi .cloud{opacity:.72}
.fi .ip{cursor:default}

.empty{font-size:14.5px;color:var(--dim);line-height:1.72;font-weight:300;
 max-width:52ch}

@media (max-width:1100px){
 .st-wrap{grid-template-columns:1fr}
}
@media (max-width:640px){
 .st-wrap{padding:14px 16px 20px;gap:14px}
 /* RUN RELEASE STAYS ABOVE THE FOLD ON A PHONE TOO, which it cannot do if
    the journal takes the whole screen. The journal is still the first and
    the largest thing on the page; it stops short of the fold so the release
    card's controls are reached without a scroll. Measured at 390 by 844. */
 .st-col:first-child{min-height:0}
 .jr{min-height:auto}
 .jr-ta,.jr-hl{padding:44px 18px 88px;min-height:300px;max-height:44vh}
 .jr-ed{font-size:16px}
 .rl-run{width:100%}
 .pchrome{padding:10px 16px}
}
</style>
</head>
<body>

<div class="pchrome">
 <b>Story, rebuilt</b>
 <label class="eye" for="who">Record</label>
 <select id="who"></select>
 <button id="fill" type="button">Put a story in the box</button>
 <span class="note" id="pnote"></span>
</div>

<div class="st-wrap">

 <div class="st-col">
  <div class="jr" id="jr">
   <div class="jr-live"><span class="jr-lamp"></span>Listening</div>
   <div class="jr-ed">
    <div class="jr-hl" id="hl" aria-hidden="true"></div>
    <textarea id="ta" class="jr-ta" spellcheck="false"
     aria-label="Your story"
     placeholder="What happened. In your own words."></textarea>
   </div>
   <button class="jr-rec" id="rec" type="button"
    aria-pressed="false" title="Record what happened out loud."></button>
  </div>
  <div class="jr-foot">
   <span class="jr-note">Recording sends audio to your browser's speech service.
    Typing stays on this device.</span>
   <span class="jr-ct" id="ct">0 words</span>
   <button class="btn" id="clear" type="button">Clear</button>
   <button class="btn pri" id="commit" type="button" disabled>Commit</button>
  </div>
 </div>

 <div class="st-col rt">

  <div class="card" id="relcard">
   <div class="eyeline">
    <span class="eye">Release</span>
    <button class="lnk" id="toimp" type="button">Imprints
     <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </button>
   </div>
   <div class="rl-top">
    <button class="btn pri rl-run" id="run" type="button">Run release</button>
    <label class="rl-pace">Pace
     <input id="pace" type="number" min="0.4" max="12" step="0.1" value="1"
      inputmode="decimal" aria-label="Pace, seconds a line">
     seconds a line</label>
   </div>
   <div id="rl"></div>
  </div>

  <div class="card" id="selcard" hidden></div>

  <div class="card" id="cloudcard"></div>

 </div>
</div>

<!-- The engine is referenced, never copied. A copy goes stale in silence and
     the prototype then measures a build nobody ships. -->
<script src="../../engine.js"></script>
<script>
/* ============================================================
   STORY, REBUILT. Every figure on this page is read off engine.js at run
   time. Nothing here is a stored number and nothing here is a coefficient.

   engine.js is a separate classic script in this same document, so its top
   level const and let bindings live in the shared script scope and are
   reached by name rather than off window.
   ============================================================ */
var PEOPLE_L=PEOPLE, TEXT='', PARSED=null, PICK={}, LISTEN=false, REC=null;

/* seatCol and esc live in ui/component.js, which is the half this prototype
   is redesigning, so the two it needs are carried here by value. PAL is the
   engine's own table and is read, not copied. */
function seatCol(b){return PAL[b]||'var(--accent)';}
function esc(s){return String(s==null?'':s)
 .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* leaves() is ui/component.js:192, verbatim. It walks a saboteur, a complex
   or a hyper complex down to the addresses underneath it. */
function leaves(o){if(!o||!o.parts)return o?[o]:[];
 var a=[],sn={};(function dig(x){if(x.parts)x.parts.forEach(dig);
  else if(!sn[x.i]){sn[x.i]=1;a.push(x);}})(o);return a;}

/* ---- loading a reference record, the way proto/avatar already does it ---- */
function loadWho(nm){
 var p=null,i;
 for(i=0;i<PEOPLE_L.length;i++)if(PEOPLE_L[i].nm===nm)p=PEOPLE_L[i];
 if(!p)return;
 S.dom=p.dom; S.a1=p.a1; S.a2=p.a2; S.doms=[p.dom]; S.arcs=[p.a1,p.a2]; S.roots=[];
 buildSoul();
 CHARGES.forEach(function(c){
  S.charge[c]=(p.c&&p.c[c]!==undefined)?p.c[c]:0;
  S.replace[c]=(p.rep&&p.rep[c])||0;});
 var LS=LAWSET[nm]||{_:5.5};
 SINAMES.forEach(function(l){
  S.law[l]=(LS[l]!==undefined)?LS[l]:(LS._!==undefined?LS._:5.5);});
 PICK={}; paint();}
function loadBlank(){
 S.doms=[]; S.arcs=[]; S.roots=[]; buildSoul();
 CHARGES.forEach(function(c){S.charge[c]=0;S.replace[c]=0;});
 SINAMES.forEach(function(l){S.law[l]=6;});
 PICK={}; paint();}

/* ============================================================
   THE FIGURE. The ring carries the reading and the pill carries the number,
   which is crBadge in ui/component.js. Same geometry, same stroke, same
   overlap. The port reuses that function rather than this copy of it.
   ============================================================ */
function badge(band,pct,raw,dash){
 var r=13.5,w=3,box=34,C=2*Math.PI*r,off=C*(1-Math.max(0,Math.min(100,pct))/100);
 var glyph=SEATGLYPH[band]||SEATGLYPH._;
 return '<span class="crb" style="--c:'+seatCol(band)+'">'
  +'<svg class="crb-a" width="'+box+'" height="'+box+'" aria-hidden="true">'
  +'<circle cx="17" cy="17" r="'+r+'" fill="none" stroke="rgba(128,128,128,.22)" '
   +'stroke-width="'+w+'"/>'
  /* A PENDING READING IS DRAWN AS A BROKEN RING. Nothing has been committed,
     so the arc is not solid. It is the one state difference a person can see
     without reading a word, which is what the dot on the record control is
     for and what this is for. */
  +'<circle cx="17" cy="17" r="'+r+'" fill="none" stroke="'+seatCol(band)+'" '
   +'stroke-width="'+w+'" stroke-linecap="'+(dash?'butt':'round')+'" '
   +'stroke-dasharray="'+(dash?'3 3':C.toFixed(1))+'" '
   +'stroke-dashoffset="'+(dash?'0':off.toFixed(1))+'"/></svg>'
  +'<span class="crb-g"><svg viewBox="0 0 24 24" aria-hidden="true">'+glyph+'</svg></span>'
  +'<span class="crb-v">'+esc(raw)+'</span></span>';}

/* ============================================================
   HOW TWO IMPRINTS WORK THROUGH A PERSON, AND IT IS COMPUTED.

   The engine builds saboteurs out of addresses, complexes out of pairs of
   saboteurs, hyper complexes out of families of complexes and the superego
   above those. So the answer to "how do these two work together" is already
   in compute(): it is the rungs that contain both.

   This is the pattern ui/drills.js:192 and ui/mapshelf.js:95 already use to
   answer the one address version of the same question. Nothing new is
   computed and no coefficient is introduced. pairPath is a filter.
   ============================================================ */
function chainOf(r){return [].concat(r.sups,r.hys,r.cxs,r.sabs);}
function ownersOf(r,n){return chainOf(r).filter(function(o){
 return leaves(o).indexOf(n)>=0;});}
function pairPath(r,a,b){
 var A=ownersOf(r,a);
 return A.filter(function(o){return leaves(o).indexOf(b)>=0;});}

/* ---- the sentence that says it, in the product's own words ---- */
function pairLine(r,a,b){
 var sh=pairPath(r,a,b);
 if(!sh.length)
  return 'Nothing compounds these two. They fire on their own, and releasing '
   +'one leaves the other where it is.';
 function low(k){return sh.filter(function(o){return o.kind===k;})
  .sort(function(x,y){return y.w-x.w;})[0]||null;}
 var sab=low('sab'), cx=low('cx'), hy=low('hy'), sup=low('sup');
 var out=[];
 if(sab)out.push('Both feed <b>'+esc(sab.nm)+'</b>, at a weight of '
  +sab.w.toFixed(1)+'.');
 else out.push('They meet higher up than a single saboteur.');
 if(cx)out.push(esc(sab?sab.nm:'That')+' pairs into the complex <b>'
  +esc(cx.nm)+'</b>, at a weight of '+cx.w.toFixed(1)+'.');
 if(hy)out.push('Above that they compound into <b>'+esc(hy.nm)
  +'</b>, at a weight of '+hy.w.toFixed(1)+'.');
 if(sup)out.push('And <b>'+esc(sup.nm)+'</b> is running over the top of it, '
  +'at a weight of '+sup.w.toFixed(1)+'.');
 return out.join(' ');}

/* ---- one imprint, which is runNodeDrill's reading, cut to the page ---- */
function oneLine(r,n){
 var c=null,i;
 for(i=0;i<CHILD.length;i++)if(CHILD[i].nm===n.cf)c=CHILD[i];
 var s='Held at a weight of '+n.sq.toFixed(1)+'. ';
 if(c)s+='It sits on the <b>'+esc(c.nm)+' toward '+esc(c.opp)+'</b> axis, and '
  +((S.replace[c.nm]||0)>=4
    ? esc(c.opp)+' is already partly in.'
    : esc(c.opp)+' is what fills it once it is emptied.');
 else s+='A field address, with no poled axis under it.';
 return s;}

/* ============================================================
   THE CLOUD
   ============================================================ */
function liveHeld(){return W.filter(function(n){return n.sq>=4;})
 .sort(function(a,b){return b.sq-a.sq;});}
function liveFilled(){return W.filter(function(n){return n.sq<4&&n.pole>=4;})
 .sort(function(a,b){return b.pole-a.pole;});}
function ghosts(){
 if(!PARSED)return [];
 var out={},seen={};
 PARSED.imprints.forEach(function(im){
  if(seen[im.node])return; seen[im.node]=1;
  var n=BY[im.node]; if(!n||n.sq>=4)return;
  out[im.node]={node:n,amt:im.amt,inferred:!!im.inferred};});
 return Object.keys(out).map(function(k){return out[k];});}

function pill(n,val,pct,cls,lbl){
 return '<button type="button" class="ip'+(PICK[n.i]?' on':'')+(cls?' '+cls:'')
  +'" data-imp="'+n.i+'" style="--c:'+seatCol(n.b)+'">'
  +badge(n.b,pct,val,cls==='ghost')+esc(lbl||n.k)+'</button>';}

function paintCloud(){
 var host=document.getElementById('cloudcard');
 var held=liveHeld(), fill=liveFilled(), gh=ghosts();
 var h='<div class="eyeline"><span class="eye">Imprints</span></div>';
 if(!held.length&&!gh.length&&!fill.length){
  h+='<div class="empty">You have not written anything yet. Whatever you '
   +'write gets pulled apart and collected here.</div>';
  host.innerHTML=h; wireCloud(); return;}
 var gmap={},imap={};
 gh.forEach(function(x){gmap[x.node.i]=x.amt;imap[x.node.i]=x.inferred;});
 BANDS.forEach(function(b){
  var seg=held.filter(function(n){return n.b===b;});
  var gs=gh.filter(function(x){return x.node.b===b;});
  if(!seg.length&&!gs.length)return;
  /* THE SEAT ROW CARRIES THE SEAT AND NOTHING ELSE. It said "3 held, 16.1,
     1 installed" and "nothing held, 15 installed", which is a count against
     a sum with no unit, printed above a cloud a person can simply look at.
     His ruling: people can count how many patterns are under the third eye. */
  h+='<div class="cl-seat" style="--c:'+seatCol(b)+'">'+esc(b)+'</div><div class="cloud">';
  seg.forEach(function(n){h+=pill(n,n.sq.toFixed(1),n.sq*10,'');});
  gs.forEach(function(x){
   h+=pill(x.node,'+'+x.amt.toFixed(1),20,'ghost',
     x.inferred?(x.node.cf||x.node.b):x.node.k);});
  h+='</div>';});
 if(fill.length){
  h+='<div class="fi"><div class="eyeline"><span class="eye">Filled in</span></div>'
   +'<div class="cloud">';
  fill.forEach(function(n){h+=pill(n,n.pole.toFixed(1),n.pole*10,'');});
  h+='</div></div>';}
 host.innerHTML=h; wireCloud();}
function wireCloud(){
 document.querySelectorAll('[data-imp]').forEach(function(el){
  el.onclick=function(){var i=+el.dataset.imp; PICK[i]=!PICK[i];
   if(!PICK[i])delete PICK[i]; paint();};});}

/* ============================================================
   THE SELECTION. One imprint and it says what that one is. Two or more and
   it says what each is, and then how they work through a person together.
   ============================================================ */
function paintSel(){
 var card=document.getElementById('selcard');
 var ids=Object.keys(PICK).map(Number).filter(function(i){return !!BY[i];});
 if(!ids.length){card.hidden=true;card.innerHTML='';return;}
 card.hidden=false;
 var r=compute();
 var h='<div class="eyeline"><span class="eye">Selected</span>'
  +'<button class="lnk" id="unsel" type="button">Clear selection</button></div>';
 ids.slice(0,4).forEach(function(i){
  var n=BY[i];
  h+='<div class="sel-one"><div class="sel-hd">'
   +badge(n.b,(n.sq>=4?n.sq:n.pole)*10,(n.sq>=4?n.sq:n.pole).toFixed(1))
   +'<div><div class="sel-nm">'+esc(n.k)+'</div>'
   +'<div class="sel-sub">'+esc(n.b)+(n.n?', '+esc(n.n):'')+'</div></div></div>'
   +'<p class="sel-p">'+oneLine(r,n)+'</p>';
  var ow=ownersOf(r,n);
  if(ow.length)h+='<div class="chips">'+ow.slice(0,5).map(function(o){
    return '<span class="chip">'+esc(o.nm)+' '+o.w.toFixed(1)+'</span>';}).join('')
    +'</div>';
  h+='</div>';});
 if(ids.length>1){
  h+='<div class="sel-pair"><div class="eye" style="margin-bottom:8px">'
   +'How they run through you</div>';
  for(var a=0;a<ids.length&&a<4;a++)for(var b=a+1;b<ids.length&&b<4;b++){
   h+='<p class="sel-p" style="margin-bottom:9px"><b>'+esc(BY[ids[a]].k)
    +'</b> and <b>'+esc(BY[ids[b]].k)+'</b>. '+pairLine(r,BY[ids[a]],BY[ids[b]])
    +'</p>';}
  h+='</div>';}
 card.innerHTML=h;
 var u=document.getElementById('unsel');
 if(u)u.onclick=function(){PICK={};paint();};}

/* ============================================================
   THE RELEASE PANEL. Two controls: the pace a person types, and Run
   release. Everything the old panel asked with eight more buttons is
   answered by what is selected in the cloud, which had to exist anyway.

   Heaviest is a default rather than a selector, which is the ruling: "so
   heaviest in this story is meaningless because I can select the one I want
   to run, and select multiple."
   ============================================================ */
function runPool(){
 var ids=Object.keys(PICK).map(Number).filter(function(i){return !!BY[i];});
 if(ids.length)return ids.map(function(i){return BY[i];});
 var r=compute();
 return r.carrying.slice(0,1);}
function paintRel(){
 var e=document.getElementById('rl'), take=runPool();
 var picked=Object.keys(PICK).length>0;
 if(!take.length){
  e.innerHTML='<div class="rl-none">Nothing is carrying yet, so there is '
   +'nothing to release.</div>';
  document.getElementById('run').disabled=true; return;}
 document.getElementById('run').disabled=false;
 e.innerHTML=(picked?'':'<div class="rl-none" style="margin-bottom:9px">'
   +'The heaviest thing you are carrying, until you pick something else.</div>')
  +'<div class="rl-list">'+take.map(function(n){
   return '<div class="rl-row">'+badge(n.b,n.sq*10,n.sq.toFixed(1))
    +'<span class="rl-nm">'+esc(n.k)+'</span><em>'+esc(n.b)+'</em></div>';}).join('')+'</div>';}

/* ============================================================
   THE JOURNAL. Type and it reads. Press and it listens.
   ============================================================ */
function hlHtml(txt){
 var p=PARSED;
 if(!p||!p.hits.length)return esc(txt);
 var band={};
 p.hits.forEach(function(h){if(h.t&&h.band&&h.band!=='coherent')band[h.t]=h.band;});
 var words=Object.keys(band).sort(function(a,b){return b.length-a.length;});
 if(!words.length)return esc(txt);
 var rx;
 try{rx=new RegExp('\\b('+words.map(function(w){
  return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')\\b','gi');}
 catch(e){return esc(txt);}
 var out='',last=0,m;
 while((m=rx.exec(txt))!==null){
  out+=esc(txt.slice(last,m.index));
  var k=band[m[0].toLowerCase()]||band[m[0]];
  var bn=K2BAND[k]||k;
  out+='<mark class="jr-f" style="--c:'+(bn?seatCol(bn):'var(--accent)')+'">'
   +esc(m[0])+'</mark>';
  last=m.index+m[0].length;
  if(rx.lastIndex===m.index)rx.lastIndex++;}
 return out+esc(txt.slice(last));}

/* the lead colour is the seat of the heaviest thing the sniffer has found so
   far, and it is what the top edge of the box carries. */
function leadCol(){
 if(!PARSED||!PARSED.imprints.length)return '';
 var best=null;
 PARSED.imprints.forEach(function(im){
  var n=BY[im.node]; if(!n)return;
  if(!best||im.amt>best.amt)best={amt:im.amt,b:n.b};});
 return best?seatCol(best.b):'';}

var MIC_ON='<svg viewBox="0 0 24 24" aria-hidden="true">'
 +'<rect x="4" y="4" width="16" height="16" rx="3"/></svg>';
var MIC_OFF='<svg viewBox="0 0 24 24" aria-hidden="true">'
 +'<rect x="9" y="3" width="6" height="11" rx="3"/>'
 +'<path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>';

function paintJournal(){
 var ta=document.getElementById('ta');
 document.getElementById('hl').innerHTML=hlHtml(TEXT)+'\n';
 document.getElementById('ct').textContent=
  (TEXT.trim()?TEXT.trim().split(/\s+/).length:0)+' words';
 document.getElementById('commit').disabled=!(PARSED&&PARSED.imprints.length);
 var jr=document.getElementById('jr');
 jr.style.setProperty('--lead',leadCol()||'var(--edge-2)');
 jr.classList.toggle('live',LISTEN);
 var rec=document.getElementById('rec');
 rec.innerHTML=LISTEN?MIC_ON:MIC_OFF;
 rec.setAttribute('aria-pressed',LISTEN?'true':'false');
 rec.title=LISTEN?'Recording. Press to stop and keep what it heard.'
  :'Record what happened out loud.';
 if(ta.value!==TEXT)ta.value=TEXT;}

function paint(){paintJournal();paintRel();paintSel();paintCloud();note();}
function note(){
 var r=compute();
 document.getElementById('pnote').textContent=
  'Carrying '+r.carrying.length+' addresses. Held above the line, '
  +r.loaded.length+'. Filled in, '+liveFilled().length+'.';}

/* ---- wiring ---- */
(function(){
 var sel=document.getElementById('who');
 sel.innerHTML='<option value="">Nothing entered</option>'
  +['Sofia','Diane','Marcus','Angela','Derek','James'].map(function(n){
   return '<option>'+n+'</option>';}).join('');
 sel.onchange=function(){sel.value?loadWho(sel.value):loadBlank();};

 var ta=document.getElementById('ta');
 ta.oninput=function(){TEXT=ta.value;
  PARSED=TEXT.trim()?parseStory(TEXT):null; paint();
  try{ta.focus();}catch(e){}};
 ta.onscroll=function(){var hl=document.getElementById('hl');
  hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;};

 document.getElementById('clear').onclick=function(){
  TEXT='';PARSED=null;ta.value='';paint();ta.focus();};
 document.getElementById('commit').onclick=function(){
  if(!PARSED||!PARSED.imprints.length)return;
  applyStory(TEXT); TEXT='';PARSED=null;ta.value='';paint();};

 document.getElementById('fill').onclick=function(){
  TEXT='I said yes to the board again and my jaw was tight the whole call. '
   +'I keep waiting for somebody to tell me I am doing enough. Afterwards I '
   +'sat in the car for twenty minutes before I could drive. I am angry at '
   +'myself for not saying what I actually thought, and ashamed that I care '
   +'this much what they think of me.';
  ta.value=TEXT; PARSED=parseStory(TEXT); paint();};

 document.getElementById('pace').oninput=function(){/* the run reads it */};

 document.getElementById('toimp').onclick=function(){
  alert('The full imprints page. Out of scope for this prototype and it is '
   +'a surface that already exists.');};

 document.getElementById('run').onclick=function(){
  var take=runPool(), pace=+document.getElementById('pace').value||1;
  alert('Run release. '+take.length+(take.length===1?' address':' addresses')
   +', at '+pace+(pace===1?' second':' seconds')+' a line. The runner states '
   +'what it costs on its first frame, which is where that belongs.');};

 /* RECORDING. The failure paths report rather than un-pressing the button,
    which is the rule the shipping file already keeps and the reason the
    control looked broken before it kept it. */
 document.getElementById('rec').onclick=function(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){LISTEN=false;paint();
   alert('This browser has no speech recognition. Typing works.');return;}
  if(typeof isSecureContext!=='undefined'&&!isSecureContext){
   LISTEN=false;paint();
   alert('Recording needs a secure page. Opened from a file, the browser '
    +'will not turn the microphone on. Typing works.');return;}
  if(REC&&LISTEN){REC.stop();LISTEN=false;paint();return;}
  REC=new SR(); REC.continuous=true; REC.interimResults=true; REC.lang='en-US';
  var base=TEXT;
  REC.onresult=function(e){var s='';
   for(var i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;
   TEXT=(base+' '+s).trim(); PARSED=TEXT?parseStory(TEXT):null; paint();};
  REC.onend=function(){LISTEN=false;paint();};
  REC.onerror=function(){LISTEN=false;paint();};
  try{REC.start();LISTEN=true;paint();}
  catch(err){LISTEN=false;paint();}};

 loadBlank();
})();
</script>
