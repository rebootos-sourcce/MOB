     One file. No dependency, no request, no framework. Every number and every
     string of the person's own words in here was dumped out of the real engine
     by proto/game/gen.js: engine.js driven headless, Diane loaded off the
     roster, compute() run, ledgerRead, streakRead and ladderRead called, and
     the content chain run through proto/game/chain.js, stem.js and frames.js.
     Nothing on this page was authored by hand except the example entry, and
     every reading of that entry is computed from it.

     THE HOUSE RULES THIS PAGE IS BUILT UNDER, because a prototype that breaks
     them is not a prototype of this product.
       Never a count against a total. The earned marks are shown and the next
       one is named. The ones past it are not enumerated, so nobody is invited
       to finish their own nervous system.
       The streak is drawn and never printed as a number.
       Icons are ring, not fill.
       Sentence case in the body, and no soft wellness language.
       Seat colour means the same thing it means everywhere else.
     ============================================================ -->

var st=D.record, days=st.days, lastDay=days[days.length-1];
var cells='';
for(var back=13;back>=0;back--){
 var on=days.indexOf(back)>=0;
 cells+='<span class="'+(on?'on':'gap')+(back===0?' today':'')+'"></span>';}
var cRun='<div class="card"><p class="eye">Flow · the run</p>'
 +'<h2>Fourteen days, as they happened</h2>'
 +'<p class="note">Drawn and never printed as a number. A gap of one day carries '
 +'through. Two is the grace day. Three or more halves what was standing and it '
 +'never reaches zero.</p>'
 +'<div class="days">'+cells+'</div>'
 +'<div class="dlab"><span>two weeks ago</span><span>today</span></div>'
 +'<div class="led">'
 +'<div><b>'+st.ledger.done+'</b><span>rituals done</span></div>'
 +'<div><b>'+st.ledger.minutes+'</b><span>minutes practised</span></div>'
 +'<div><b>'+st.ledger.ground+'</b><span>addresses opened</span></div>'
 +'<div><b>'+st.ledger.clear+'</b><span>held at the far pole</span></div>'
 +'</div>'
 +'<p class="src">Every one of those four is a count of something that happened. '
 +'None of them is against a total.</p></div>';

var c3='';
var got=D.marks.all.filter(function(m){return D.marks.earned.indexOf(m.k)>=0;});
var nx=D.marks.all.filter(function(m){return m.k===D.marks.next;})[0];
c3+='<div class="card"><p class="eye">Flow · the marks</p>'
 +'<h2>What she has earned</h2>'
 +'<p class="note">A mark is a test against the record, so it is a fact with a '
 +'date rather than a prize. Three families, and the family colour is the seat '
 +'colour it means everywhere else.</p>'
 +'<div class="marks">'+got.map(function(m){
   return '<div class="mk" style="--c:'+col(m.b)+'">'+ic(m.ic,24)
    +'<div class="n">'+esc(m.nm)+'</div><div class="fam">'+esc(m.fam)+'</div></div>';}).join('')
 +'</div>'
 +(nx?'<div class="next">'+ic(nx.ic,24)+'<div><div class="n">Next, '+esc(nx.nm)+'</div>'
   +'<div class="d">'+esc(nx.d)+'</div></div></div>':'')
 +'<p class="src">One next mark, and the ones past it are deliberately not '
 +'enumerated. A list of a person’s unfinished self is a completion bar on a '
 +'nervous system.</p></div>';

c3+='<div class="card"><p class="eye">Body · the awards</p>'
 +'<h2>What changed in her</h2>'
 +'<p class="note">A mark counts what she did. An award records what moved. '
 +'Three families, and the third exists because of a measurement.</p>'
 +D.awards.map(function(w){
  return '<div class="aw'+(w.reach?'':' shut')+'" style="--c:'+col(w.b)+'">'
   +'<div class="t"><span class="nm">'+esc(w.nm)+'</span>'
   +'<span class="fam">'+esc(w.fam)+(w.got?' · earned':'')+'</span></div>'
   +'<div class="d">'+esc(w.d)+'</div>'
   +'<div class="nd">Needs '+esc(w.needs)+(w.reach?'':'. Shut, for this reading')+'</div>'
   +'</div>';}).join('')
 +'<p class="src">Measured off engine/ladder.js and the sq ≥ 4 release '
 +'threshold: four of the sixteen marks can never be earned by the 465 of 1000 '
 +'who reach a complete reading with nothing above the release line. The Held '
 +'family is the answer to that, and it needs a reading and nothing else.</p></div>';

c3+='<div class="card"><p class="eye">The reward</p>'
 +'<h2>The bank</h2>'
 +'<div class="bank">'+ic('M12 3a9 9 0 100 18 9 9 0 100-18 M12 7v10 M8.5 10.5h7 M8.5 13.5h7',44)
 +'<div><div class="big">'+D.bank.earned+'</div>'
 +'<div class="sub">patterns earned, on top of the '+D.bank.granted+' she was given</div></div></div>'
 +'<div class="rows">'
 +'<div><span>A ritual done</span><span>'+D.bank.rates.ritual+'</span></div>'
 +'<div><span>An entry that produced an imprint</span><span>'+D.bank.rates.journal+'</span></div>'
 +'<div><span>A mark earned</span><span>'+D.bank.rates.mark+'</span></div>'
 +'<div><span>An award conferred</span><span>'+D.bank.rates.award+'</span></div>'
 +'<div><span>A season finished</span><span>'+D.bank.rates.season+'</span></div>'
 +'<div><span>One address across the four channels</span><span>−'+D.bank.spentFloor+'</span></div>'
 +'<div><span>A release run at the cap</span><span>−'+D.bank.runCap+'</span></div>'
 +'</div>'
 +'<p class="src">Paid for the record after the fact and never promised in advance '
 +'for the act. Announcing it in advance measured 3.2 points of 1000 worse at day '
 +'thirty: Deci, Koestner and Ryan 1999, 128 studies, d −0.40. Daily practice '
 +'earns '+D.bank.weekDaily+' a week against a free allowance of '+D.bank.allowance
 +' that banks, so a run at the cap every week and a bit without paying anything.</p></div>';

/* ---------- the avatar, which is another seat's ---------- */
var c4='<div class="slot"><p class="eye">The centrepiece, and it is not mine</p>'
 +'<div class="box">The avatar goes here. DESIGN-avatar.md owns it. This is the '
 +'shape the loop needs, not a proposal about what it looks like.</div>'
 +'<ol><li><b>One frame that changes when a release lands,</b> visible without '
 +'leaving the surface the release happened on. The loop pays out here or it does '
 +'not pay out.</li>'
 +'<li><b>Seven regions that map to the seven seats,</b> so an award at the solar '
 +'changes the solar and nothing else. The seat colours are already fixed.</li>'
 +'<li><b>A state that can only be read, never scored.</b> No bar, no percentage, '
 +'no level. It may look better and it may not say how much better.</li>'
 +'<li><b>A still frame for the 465 of 1000 who cannot release,</b> which shows '
 +'holding rather than clearing, or half the panel watches an avatar that never moves.</li></ol>'
 +'<div class="pts">'
 +'<div class="pt"><b>8.9</b><span>points of 1000 at day thirty, the build today</span></div>'
 +'<div class="pt"><b>19.9</b><span>points with this loop, measured</span></div>'
 +'<div class="pt"><b>+11.0</b><span>points, against a target of ten</span></div>'
 +'</div></div>';

/* THE RUN CARD GOES IN COLUMN ONE, and this is a layout note rather than a
   design one. The first cut put the journal and the imprints alone on the left
   and six cards on the right, and at 1600 it left a third of the left column
   empty under two short cards while the right ran past the fold. Columns are
   balanced by what is in them, not by how many cards they hold. */
document.getElementById('g').innerHTML=
 '<div>'+c1+cRun+'</div><div>'+c2+c4+'</div><div>'+c3+'</div>';
</script></body></html>
