<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story, the bench</title>
<script>
/* THE PAGE'S OWN REQUEST LOG. Nothing here is ever expected to fire. */
window.__REQ=[];
(function(){var f=window.fetch;
 window.fetch=function(u){window.__REQ.push('fetch '+u);
  return f?f.apply(window,arguments):Promise.reject(new Error('no network'));};
 var X=window.XMLHttpRequest;
 if(X&&X.prototype&&X.prototype.open){var o=X.prototype.open;
  X.prototype.open=function(m,u){window.__REQ.push('xhr '+u);
   return o.apply(this,arguments);};}})();
</script>
<style>
/* ============================================================
   DESIGN FOUR. THE BENCH.

   THE BELIEF: a story is stock, and this page is the bench where it is cut
   into parts and the parts are worked.

   What this design does with the live lighting that the others do not: it
   makes it a filter rather than a decoration. Pick a part up and the story
   goes quiet except the words that produced it. The lighting stops saying
   "this word was read" and starts saying "these are the words this release
   is about", which is the question a person actually has at the moment they
   are choosing what to run.

   And it is a two way link. The part knows which words it came from, because
   parseStory already routes a word to a seat and an imprint to that seat, so
   the join is the band and not a lookup table somebody has to maintain.

   NO CARDS. Three zones, hairline separated, each with one heading. A card is
   a thing you read; a zone is a place you work. That is the whole visual
   argument and it is the reason this design does not look like the other
   three even before anything is in it.

   TOKENS are copied by value from atuned_src/shell/head.html.
   ============================================================ */
:root{
 --bg:#0C0D12; --panel:#1A1D26; --panel-2:#252833; --sunk:#090A0E;
 --edge:rgba(255,255,255,.09); --edge-2:rgba(255,255,255,.14);
 --ink:#EFEDE8; --mid:#B4B0A8; --dim:#94908A;
 --root:#D6524C; --sacral:#D8924E; --solar:#DABF6A;
 --heart:#5FD5A6; --throat:#5EBBDB; --eye:#7D93E0; --crown:#A77EDB;
 --alarm:#FF2E1F; --alarm-soft:rgba(255,46,31,.16);
 --accent:#7EB8D4; --on-accent:#0B1418;
 --sans:'Inter','Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
 --num:'Inter','Inter Tight',system-ui,-apple-system,sans-serif;
 --r:16px; --r-s:11px; --r-xs:8px; --tap:44px;
 --t-micro:.12s; --t-element:.22s; --ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
 font-weight:300;-webkit-font-smoothing:antialiased}
.pchrome{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
 padding:12px 22px;border-bottom:1px solid var(--edge);background:var(--panel)}
.pchrome b{font-weight:500;font-size:13px;color:var(--mid);letter-spacing:.06em;
 text-transform:uppercase}
.pchrome select,.pchrome button{min-height:var(--tap);background:var(--panel-2);
 color:var(--ink);border:1px solid var(--edge);border-radius:var(--r-xs);
 padding:8px 14px;font-family:var(--sans);font-size:13.5px;cursor:pointer}
.pchrome .note{font-size:12.5px;color:var(--dim);flex:1 1 220px;min-width:0}
.btn{min-height:var(--tap);display:inline-flex;align-items:center;
 justify-content:center;gap:7px;background:var(--panel-2);
 border:1px solid var(--edge);color:var(--mid);border-radius:var(--r-xs);
 padding:9px 17px;font-family:var(--sans);font-size:13.5px;cursor:pointer;
 transition:color var(--t-micro) var(--ease-out),
  border-color var(--t-micro) var(--ease-out)}
.btn:hover:not(:disabled){color:var(--ink);border-color:var(--edge-2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);border-color:var(--accent);
 color:var(--on-accent);font-weight:500}
.btn:disabled{opacity:.42;cursor:default}
.lnk{min-height:var(--tap);display:inline-flex;align-items:center;gap:7px;
 background:transparent;border:1px solid var(--edge);color:var(--mid);
 border-radius:var(--r-xs);padding:8px 14px;font-family:var(--sans);
 font-size:13px;cursor:pointer}
.lnk:hover{color:var(--ink);border-color:var(--accent)}
.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   THE BENCH. Three zones and two hairlines.
   ============================================================ */
.bench{display:grid;grid-template-columns:minmax(0,1fr) 330px 360px;
 align-items:stretch;min-height:calc(100vh - 69px)}
.zone{min-width:0;padding:16px 20px 24px;border-left:1px solid var(--edge)}
.zone:first-child{border-left:0;padding:16px 22px 24px}
.zhead{display:flex;align-items:center;justify-content:space-between;gap:12px;
 min-height:var(--tap);margin-bottom:12px}
.eye{font-family:var(--num);font-size:11.5px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--dim)}

/* the writing. It rises onto --panel, inherited, and it takes the whole zone
   rather than sitting in a card inside it. */
.jr{position:relative;background:var(--panel);border:1px solid var(--edge);
 border-radius:var(--r-xs);overflow:hidden;min-height:540px;
 transition:border-color var(--t-element) var(--ease-out)}
.jr:focus-within{border-color:var(--edge-2)}
.jr-ed{position:relative;display:flex;font-family:var(--sans);font-size:17px;
 line-height:1.8;font-weight:300}
/* THE MEASURE IS CENTRED IN THE BOX RATHER THAN LEFT IN IT. Held to the left
   edge, a 62 character measure inside a 900 pixel zone leaves a third of the
   box empty on the right of every line a person writes, and the record button
   sits alone out in it. */
.jr-ed{width:100%;max-width:calc(62ch + 60px);margin:0 auto}
.jr-ta,.jr-hl{flex:1 1 auto;min-height:540px;border:0;margin:0;
 padding:38px 30px 96px;
 font-family:inherit;font-size:inherit;line-height:inherit;font-weight:inherit;
 white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word}
.jr-hl{position:absolute;inset:0;overflow:hidden;pointer-events:none;
 color:var(--ink);z-index:0;transition:color var(--t-element) var(--ease-out)}
.jr-ta{position:relative;z-index:1;resize:none;background:transparent;
 color:transparent;caret-color:var(--accent);outline:none;overflow:auto}
.jr-ta::selection{background:color-mix(in srgb,var(--accent) 34%,transparent)}
.jr-ta::placeholder{color:var(--dim)}
/* AT REST EVERY READ WORD CARRIES A TICK IN ITS OWN SEAT COLOUR. */
mark.mk{background:transparent;color:inherit;
 border-bottom:1px dotted color-mix(in srgb,var(--c) 70%,transparent)}
mark.mk.coh{border-bottom-style:solid;
 border-bottom-color:color-mix(in srgb,var(--dim) 60%,transparent)}
/* AND WHEN A PART IS IN THE VICE THE STOCK GOES QUIET EXCEPT WHERE IT WAS CUT
   FROM. This is the whole design in two rules. */
.jr-hl.spot{color:rgba(239,237,232,.26)}
.jr-hl.spot mark.mk{border-bottom-color:transparent}
.jr-hl.spot mark.mk.hit{color:var(--ink);
 background:color-mix(in srgb,var(--c) 16%,transparent);border-radius:3px;
 border-bottom-color:var(--c)}

.jr-live{position:absolute;left:20px;top:13px;z-index:4;display:none;
 align-items:center;gap:9px;font-family:var(--num);font-size:12.5px;
 letter-spacing:.07em;text-transform:uppercase;color:var(--alarm)}
.jr.live .jr-live{display:inline-flex}
.jr-lamp{width:11px;height:11px;border-radius:50%;background:var(--alarm);
 box-shadow:0 0 0 4px var(--alarm-soft);animation:lamp 1.5s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:1}50%{opacity:.38}}
@media (prefers-reduced-motion:reduce){.jr-lamp{animation:none}}
.jr.live{border-color:color-mix(in srgb,var(--alarm) 42%,transparent)}
.jr-rec{position:absolute;right:20px;bottom:20px;z-index:4;width:56px;height:56px;
 border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
 cursor:pointer;background:var(--panel-2);border:1px solid var(--edge-2);
 color:var(--mid);transition:color var(--t-micro) var(--ease-out),
  border-color var(--t-micro) var(--ease-out)}
.jr-rec:hover{color:var(--ink);border-color:var(--accent)}
.jr-rec:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.jr-rec svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;
 stroke-linejoin:round;width:22px;height:22px}
.jr.live .jr-rec{color:var(--alarm);border-color:var(--alarm)}
.jr.live .jr-rec svg{fill:var(--alarm);stroke:var(--alarm)}
.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:13px}
.note{flex:1 1 240px;min-width:0;font-size:13px;line-height:1.55;color:var(--dim)}

/* ============================================================
   THE RACK. One part per row rather than a wrapped cloud, because a rack is
   read down and a cloud is read around, and this zone is a list of things
   that can be picked up. The row is the whole tap target.
   ============================================================ */
.rack{display:flex;flex-direction:column}
.rk{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;
 padding:5px 8px 5px 5px;background:transparent;border:0;border-bottom:1px solid var(--edge);
 border-left:2px solid transparent;cursor:pointer;color:var(--ink);text-align:left;
 font-family:var(--sans);font-size:14px;
 transition:background var(--t-micro) var(--ease-out),
  border-left-color var(--t-micro) var(--ease-out)}
.rk:hover{background:color-mix(in srgb,var(--c) 8%,transparent);
 border-left-color:var(--c)}
.rk:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* A NAME WRAPS RATHER THAN TRUNCATES. "Manipulation Through Emotion" came
   back as "Manipulation Throug..." in a rack a person is choosing from, and a
   name a person cannot read is a control they cannot use. */
.rk .nm{flex:1 1 auto;min-width:0;line-height:1.25;white-space:normal}
.rk .st{font-size:12px;color:var(--dim);flex:0 0 auto}
.rk.cut{border-left-color:color-mix(in srgb,var(--c) 60%,transparent)}
/* WHAT THIS STORY IS FEEDING, WHILE IT IS BEING WRITTEN. A part already held
   at a seat the words are reaching is not new stock and it is not untouched
   either, and the rack is where that is visible. */
.rk.fed{background:color-mix(in srgb,var(--c) 7%,transparent);
 border-left-color:color-mix(in srgb,var(--c) 55%,transparent)}
.rk .nm em{font-style:normal;color:var(--dim);font-size:12px}
.rksec{margin:18px 0 6px;font-size:12px;color:var(--dim);
 font-family:var(--num);letter-spacing:.13em;text-transform:uppercase}
.rksec:first-child{margin-top:0}
.empty{font-size:14.5px;color:var(--dim);line-height:1.72;max-width:44ch}

/* the vice */
.vice{display:flex;flex-direction:column;gap:12px}
.rl-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rl-pace{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--mid)}
.rl-pace input{width:76px;min-height:var(--tap);background:var(--panel-2);
 border:1px solid var(--edge);border-radius:var(--r-xs);color:var(--ink);
 font-family:var(--num);font-size:15px;font-variant-numeric:tabular-nums;
 padding:9px 11px;text-align:center}
.rl-pace input:focus{outline:2px solid var(--accent);outline-offset:1px}
.rl-run{flex:1 1 auto;min-height:48px}
.rl-none{font-size:13.5px;color:var(--dim);line-height:1.65}
.clamp{display:flex;flex-direction:column;border-top:1px solid var(--edge)}
.sel-one{padding:13px 0;border-bottom:1px solid var(--edge)}
.sel-hd{display:flex;align-items:center;gap:11px;margin-bottom:7px}
.sel-nm{font-size:16px;font-weight:500;color:var(--ink);line-height:1.25}
.sel-sub{font-size:12px;color:var(--dim)}
.sel-p{font-size:14px;line-height:1.68;color:var(--mid);margin:0;max-width:56ch}
.sel-p b{color:var(--ink);font-weight:500}
.sel-pair{margin-top:14px;padding-top:13px;
 border-top:1px solid color-mix(in srgb,var(--accent) 34%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:12px;color:var(--mid);background:var(--panel-2);
 border:1px solid var(--edge);border-radius:999px;padding:5px 11px}
.crb{position:relative;display:inline-block;flex:0 0 auto;box-sizing:content-box;
 width:34px;height:34px;padding:0 24px 8px 0}
.crb-a{display:block;transform:rotate(-90deg)}
.crb-g{position:absolute;left:0;top:0;width:34px;height:34px;display:grid;
 place-items:center;color:var(--c);pointer-events:none}
.crb-g svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round}
.crb-v{position:absolute;right:0;bottom:0;font-family:var(--num);font-weight:500;
 line-height:1;background:var(--panel-2);color:var(--ink);
 border:1px solid color-mix(in srgb,var(--c) 44%,transparent);
 border-radius:999px;padding:1.5px 6px;white-space:nowrap;font-size:11.5px;
 font-variant-numeric:tabular-nums}

@media (max-width:1180px){
 .bench{grid-template-columns:minmax(0,1fr) 320px}
 .zone.vicez{grid-column:1 / -1;border-left:0;border-top:1px solid var(--edge)}
}
@media (max-width:720px){
 /* THE ZONES STACK IN THE ORDER OF THE WORK. Stock, then what came off it,
    then what gets clamped. Measured at 390 by 844. */
 /* AND THE VICE COMES SECOND, NOT THIRD. Stacked in work order the release
    control landed 2505px down a 844px screen, which is the exact defect the
    last pass measured at two pixels and fixed. The ruling is that the control
    is above the fold, so on a phone the clamp sits under the writing and the
    rack goes last. */
 .bench{grid-template-columns:1fr;min-height:0;display:flex;flex-direction:column}
 .zone{border-left:0;border-top:1px solid var(--edge);padding:14px 16px 20px;
  order:3}
 .zone:first-child{order:1}
 .zone.vicez{order:2}
 .zone:first-child{padding:14px 16px 20px}
 .zone.vicez{grid-column:auto}
 .jr{min-height:0}
 .jr-ta,.jr-hl{padding:32px 18px 88px;min-height:0;height:38vh;font-size:16px}
 .jr-ed{font-size:16px}
 .rl-run{width:100%}
 /* the two controls share a row and the sentence goes under them, rather
    than the sentence taking the first row and pushing Commit onto a third. */
 .foot{gap:8px}
 .note{flex:1 1 100%;font-size:12.5px;order:2}
 .foot .btn{order:1}
 .pchrome{padding:10px 16px}
}
</style>
</head>
<body>

<div class="pchrome">
 <b>Four, the bench</b>
 <label class="eye" for="who">Record</label>
 <select id="who"></select>
 <button id="fill" type="button">Put a story in the box</button>
 <span class="note" id="pnote"></span>
</div>

<div class="bench">

 <div class="zone">
  <div class="zhead"><span class="eye">Story</span></div>
  <div class="jr" id="jr">
   <div class="jr-live"><span class="jr-lamp"></span>Listening</div>
   <div class="jr-ed">
    <div class="jr-hl" id="hl" aria-hidden="true"></div>
    <textarea id="ta" class="jr-ta" spellcheck="false" aria-label="Your story"
     placeholder="What happened. In your own words."></textarea>
   </div>
   <button class="jr-rec" id="rec" type="button" aria-pressed="false"
    title="Record what happened out loud."></button>
  </div>
  <div class="foot">
   <span class="note">Recording sends audio to your browser's speech service.
    Typing stays on this device.</span>
   <button class="btn" id="clear" type="button">Clear</button>
   <button class="btn pri" id="commit" type="button" disabled>Commit</button>
  </div>
 </div>

 <div class="zone">
  <div class="zhead"><span class="eye">Imprints</span></div>
  <div id="rack"></div>
 </div>

 <div class="zone vicez">
  <div class="zhead"><span class="eye">Release</span>
   <button class="lnk" id="toimp" type="button">Imprints
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
   </button></div>
  <div class="vice">
   <div class="rl-top">
    <button class="btn pri rl-run" id="run" type="button">Run release</button>
    <label class="rl-pace">Pace
     <input id="pace" type="number" min="0.4" max="12" step="0.1" value="1"
      inputmode="decimal" aria-label="Pace, seconds a line"> seconds a line</label>
   </div>
   <div id="rl"></div>
   <div id="selcard"></div>
  </div>
 </div>
</div>

<!-- The engine is referenced, never copied. -->
<script src="../../engine.js"></script>
<script>
var TEXT='', PARSED=null, PICK={}, LISTEN=false, REC=null, MARKS=[], FR=[];
function seatCol(b){return PAL[b]||'var(--accent)';}
function esc(s){return String(s==null?'':s)
 .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* leaves() is ui/component.js:192, verbatim. */
function leaves(o){if(!o||!o.parts)return o?[o]:[];
 var a=[],sn={};(function dig(x){if(x.parts)x.parts.forEach(dig);
  else if(!sn[x.i]){sn[x.i]=1;a.push(x);}})(o);return a;}
function chainOf(r){return [].concat(r.sups,r.hys,r.cxs,r.sabs);}
function ownersOf(r,n){return chainOf(r).filter(function(o){
 return leaves(o).indexOf(n)>=0;});}
/* pairPath is the one address version at ui/drills.js:192 intersected. It
   computes nothing new. */
function pairPath(r,a,b){return ownersOf(r,a).filter(function(o){
 return leaves(o).indexOf(b)>=0;});}
function pairLine(r,a,b){
 var sh=pairPath(r,a,b);
 if(!sh.length)return 'Nothing compounds these two. They fire on their own, '
  +'and releasing one leaves the other where it is.';
 function low(k){return sh.filter(function(o){return o.kind===k;})
  .sort(function(x,y){return y.w-x.w;})[0]||null;}
 var sab=low('sab'), cx=low('cx'), hy=low('hy'), sup=low('sup'), out=[];
 if(sab)out.push('Both feed <b>'+esc(sab.nm)+'</b>, at a weight of '+sab.w.toFixed(1)+'.');
 else out.push('They meet higher up than a single saboteur.');
 if(cx)out.push(esc(sab?sab.nm:'That')+' pairs into the complex <b>'+esc(cx.nm)
  +'</b>, at a weight of '+cx.w.toFixed(1)+'.');
 if(hy)out.push('Above that they compound into <b>'+esc(hy.nm)+'</b>, at a weight of '
  +hy.w.toFixed(1)+'.');
 if(sup)out.push('And <b>'+esc(sup.nm)+'</b> is running over the top of it, at a weight of '
  +sup.w.toFixed(1)+'.');
 return out.join(' ');}
/* PENDING IS NOT HELD, AND THE READING SAID IT WAS. A place this story has
   put charge on but has not committed reads n.sq below the line, so the one
   line reading printed "Held at a weight of 2.1" about something that is not
   held at all. The pending amount is in the parse and is said as what it is. */
function pendingOn(n){
 if(!PARSED)return 0;
 var a=0;
 PARSED.imprints.forEach(function(im){if(im.node===n.i)a+=im.amt;});
 return a;}
function oneLine(r,n){
 var c=null,i;
 for(i=0;i<CHILD.length;i++)if(CHILD[i].nm===n.cf)c=CHILD[i];
 var pend=pendingOn(n);
 var s=(n.sq>=4)?('Held at a weight of '+n.sq.toFixed(1)+'. ')
  :(pend?('Not held yet. This story puts '+pend.toFixed(1)+' on it, and Commit '
    +'is what lands it. '):('Under the line, at a weight of '+n.sq.toFixed(1)+'. '));
 if(c)s+='It sits on the <b>'+esc(c.nm)+' toward '+esc(c.opp)+'</b> axis, and '
  +((S.replace[c.nm]||0)>=4?esc(c.opp)+' is already partly in.'
   :esc(c.opp)+' is what fills it once it is emptied.');
 else s+='A field place, with no poled axis under it.';
 return s;}

function badge(band,pct,raw,dash){
 var r=13.5,w=3,box=34,C=2*Math.PI*r,off=C*(1-Math.max(0,Math.min(100,pct))/100);
 var glyph=SEATGLYPH[band]||SEATGLYPH._;
 return '<span class="crb" style="--c:'+seatCol(band)+'">'
  +'<svg class="crb-a" width="'+box+'" height="'+box+'" aria-hidden="true">'
  +'<circle cx="17" cy="17" r="'+r+'" fill="none" stroke="rgba(128,128,128,.22)" stroke-width="'+w+'"/>'
  +'<circle cx="17" cy="17" r="'+r+'" fill="none" stroke="'+seatCol(band)+'" stroke-width="'+w
   +'" stroke-linecap="'+(dash?'butt':'round')+'" stroke-dasharray="'+(dash?'3 3':C.toFixed(1))
   +'" stroke-dashoffset="'+(dash?'0':off.toFixed(1))+'"/></svg>'
  +'<span class="crb-g"><svg viewBox="0 0 24 24" aria-hidden="true">'+glyph+'</svg></span>'
  +'<span class="crb-v">'+esc(raw)+'</span></span>';}

/* ---- loading a reference record, the way proto/avatar already does it ---- */
function loadWho(nm){
 var p=null,i;
 for(i=0;i<PEOPLE.length;i++)if(PEOPLE[i].nm===nm)p=PEOPLE[i];
 if(!p)return;
 S.dom=p.dom; S.a1=p.a1; S.a2=p.a2; S.doms=[p.dom]; S.arcs=[p.a1,p.a2]; S.roots=[];
 buildSoul();
 CHARGES.forEach(function(c){
  S.charge[c]=(p.c&&p.c[c]!==undefined)?p.c[c]:0;
  S.replace[c]=(p.rep&&p.rep[c])||0;});
 var LS=LAWSET[nm]||{_:5.5};
 SINAMES.forEach(function(l){S.law[l]=(LS[l]!==undefined)?LS[l]:(LS._!==undefined?LS._:5.5);});
 PICK={}; paint();}
function loadBlank(){
 S.doms=[]; S.arcs=[]; S.roots=[]; buildSoul();
 CHARGES.forEach(function(c){S.charge[c]=0;S.replace[c]=0;});
 SINAMES.forEach(function(l){S.law[l]=6;});
 PICK={}; paint();}

/* ============================================================
   THE MARKS, AND WHY THEY ARE NOT A SECOND REGEX.

   scanStory normalises the text before it scans: lowercase, every character
   that is not a letter, an apostrophe or a space becomes a space, and runs of
   space collapse to one. hit.at is an offset into THAT string, and the engine
   has been carrying it all along.

   The shipping highlighter throws the offsets away and runs its own global
   regex over the raw text instead, which is a second reading of the same
   sentence by a different rule. Measured on five stories: it lights 12 terms
   where the scanner recorded 25 hits, it cannot light a phrase as one unit
   because it rebuilds the pattern out of single words, and it cannot light a
   coherent word at all, so the words that take charge OFF a person are
   invisible on the one surface whose whole job is to show the reading.

   normMap rebuilds the engine's own normalisation and keeps the original
   index of every character it keeps, so a mark lands on exactly the letters
   the scanner scored.
   ============================================================ */
function normMap(t){
 var body='',bm=[],i,c;
 for(i=0;i<t.length;i++){
  c=t.charAt(i).toLowerCase();
  if(!/[a-z' ]/.test(c))c=' ';
  body+=c; bm.push(i);}
 var s=' ', map=[0], prev=true;
 for(i=0;i<body.length;i++){
  var sp=body.charAt(i)===' ';
  if(sp&&prev)continue;
  s+=body.charAt(i); map.push(bm[i]); prev=sp;}
 s+=' '; map.push(t.length);
 return {s:s,map:map};}

function marksOf(t,p){
 if(!p||!p.hits.length)return [];
 var nm=normMap(t), raw=[];
 p.hits.forEach(function(h){
  if(h.at==null)return;
  var a=h.at+1, b=h.at+String(h.t).length;
  if(a>=nm.map.length||b>=nm.map.length)return;
  raw.push({s:nm.map[a], e:nm.map[b]+1, kind:h.kind, band:h.band||null,
   amt:(h.amt==null?null:h.amt), label:h.label||null, charge:h.charge||null,
   fet:h.fet||null, coh:h.band==='coherent'});});
 raw.sort(function(a,b){return a.s-b.s||(b.e-b.s)-(a.e-a.s);});
 /* one mark per stretch of text. A phrase outranks the words inside it, which
    is the scanner's own rule, and an adjective sitting on the same word as a
    placed term merges into it rather than drawing twice. */
 var keep=[], last=-1;
 raw.forEach(function(m){
  if(m.s<last){var pv=keep[keep.length-1];
   if(pv&&m.charge&&!pv.charge)pv.charge=m.charge;
   if(pv&&m.fet&&!pv.fet)pv.fet=m.fet;
   if(pv&&m.band&&!pv.band){pv.band=m.band;pv.coh=m.coh;}
   if(pv&&m.amt!=null&&pv.amt==null)pv.amt=m.amt;
   return;}
  m.seat=(m.band&&m.band!=='coherent')?m.band:null;
  m.bn=m.seat?K2BAND[m.seat]:null;
  keep.push(m); last=m.e;});
 keep.forEach(function(m,i){m.i=i;});
 return keep;}

/* ============================================================
   THE CLOUD, THE SELECTION AND THE RELEASE PANEL.

   Inherited from the pass this design is not re-solving. What is filled in is
   not an imprint: impLive returned sq>=4 OR pole>=4 and the panel printed the
   length of that as a headline, so three of the six reference people were
   told they carried between eight and forty nine imprints while holding
   nothing. Held is the cloud. Filled in keeps its place and loses the word.
   ============================================================ */
var SHOW_FILLED=true, BAND_FILTER='';
function liveHeld(){return W.filter(function(n){return n.sq>=4;})
 .sort(function(a,b){return b.sq-a.sq;});}
function liveFilled(){return W.filter(function(n){return n.sq<4&&n.pole>=4;})
 .sort(function(a,b){return b.pole-a.pole;});}
function ghosts(){
 if(!PARSED)return [];
 var out={},seen={};
 PARSED.imprints.forEach(function(im){
  if(seen[im.node])return; seen[im.node]=1;
  var n=BY[im.node]; if(!n||n.sq>=4)return;
  out[im.node]={node:n,amt:im.amt,inferred:!!im.inferred};});
 return Object.keys(out).map(function(k){return out[k];});}
function pill(n,val,pct,cls,lbl){
 return '<button type="button" class="ip'+(PICK[n.i]?' on':'')+(cls?' '+cls:'')
  +'" data-imp="'+n.i+'" style="--c:'+seatCol(n.b)+'">'
  +badge(n.b,pct,val,cls==='ghost')+esc(lbl||n.k)+'</button>';}
function paintCloud(){
 var host=document.getElementById('cloudcard');
 var held=liveHeld(), fill=liveFilled(), gh=ghosts();
 var h='<div class="eyeline"><span class="eye">Imprints'
  +(BAND_FILTER?', '+esc(BAND_FILTER):'')+'</span></div>';
 if(BAND_FILTER){
  held=held.filter(function(n){return n.b===BAND_FILTER;});
  gh=gh.filter(function(x){return x.node.b===BAND_FILTER;});
  fill=fill.filter(function(n){return n.b===BAND_FILTER;});
  if(!held.length&&!gh.length&&!fill.length){
   /* A SEAT WITH NOTHING IN IT IS AN ANSWER. The panel used to render an
      empty cloud, which is indistinguishable from a panel that failed. */
   h+='<div class="empty">Nothing is held at the '+esc(String(BAND_FILTER).toLowerCase())
    +'. Press it again to see everything.</div>';
   host.innerHTML=h; wireCloud(); return;}}
 if(!held.length&&!gh.length&&!fill.length){
  h+='<div class="empty">You have not written anything yet. Whatever you write '
   +'gets pulled apart and collected here.</div>';
  host.innerHTML=h; wireCloud(); return;}
 BANDS.forEach(function(b){
  var seg=held.filter(function(n){return n.b===b;});
  var gs=gh.filter(function(x){return x.node.b===b;});
  if(!seg.length&&!gs.length)return;
  h+='<div class="cl-seat" style="--c:'+seatCol(b)+'">'+esc(b)+'</div><div class="cloud">';
  seg.forEach(function(n){h+=pill(n,n.sq.toFixed(1),n.sq*10,'');});
  gs.forEach(function(x){h+=pill(x.node,'+'+x.amt.toFixed(1),20,'ghost',
   x.inferred?(x.node.cf||x.node.b):x.node.k);});
  h+='</div>';});
 /* FILLED IN IS NOT RELEASABLE, so whether it belongs on this surface at all
    is a design question and not a shared one. The instrument keeps it, because
    a readout that hides half of what it knows is not a readout. The mirror
    sends it to the imprints page, because the mirror shows what the story is
    about and nothing else. */
 if(fill.length&&SHOW_FILLED){
  h+='<div class="fi"><div class="eyeline"><span class="eye">Filled in</span></div>'
   +'<div class="cloud">';
  fill.forEach(function(n){h+=pill(n,n.pole.toFixed(1),n.pole*10,'');});
  h+='</div></div>';}
 host.innerHTML=h; wireCloud();}
function wireCloud(){
 document.querySelectorAll('[data-imp]').forEach(function(el){
  el.onclick=function(){var i=+el.dataset.imp; PICK[i]=!PICK[i];
   if(!PICK[i])delete PICK[i]; paint();};});}


/* ============================================================
   THE RACK. What came off this story, in the order it was cut, and then what
   was already held. A part in the vice leaves the rack, because a part cannot
   be in two places and a list that shows it in both is a drawing of a state
   that does not exist.
   ============================================================ */
function cutParts(){
 if(!PARSED)return [];
 var seen={},out=[];
 PARSED.imprints.forEach(function(im){
  if(seen[im.node])return; seen[im.node]=1;
  var n=BY[im.node]; if(!n||n.sq>=4)return;
  out.push({node:n,amt:im.amt,inferred:!!im.inferred});});
 return out;}
function free(n){return !PICK[n.i];}
function rkRow(n,val,pct,dash,lbl,cls,tail){
 return '<button type="button" class="rk'+(cls||'')+'" data-imp="'+n.i
  +'" style="--c:'+seatCol(n.b)+'">'+badge(n.b,pct,val,dash)
  +'<span class="nm">'+esc(lbl||n.k)+'</span><span class="st">'
  +esc(tail||n.b)+'</span></button>';}
/* the seats this story is reaching, off parseStory's own per seat totals */
function storyBands(){
 var o={};
 if(PARSED&&PARSED.bands)Object.keys(PARSED.bands).forEach(function(k){
  var bn=K2BAND[k]; if(bn)o[bn]=1;});
 return o;}
function paintRack(){
 var host=document.getElementById('rack');
 var cut=cutParts().filter(function(x){return free(x.node);});
 var sb=storyBands();
 /* what the story is feeding rises to the top of the rack. The order is fed
    first and weight second, so the list is about the story while there is one
    and about the load when there is not. */
 var held=liveHeld().filter(free).sort(function(a,b){
  var d=(sb[b.b]?1:0)-(sb[a.b]?1:0); return d||(b.sq-a.sq);});
 var fill=liveFilled().filter(free);
 if(!cut.length&&!held.length&&!fill.length){
  host.innerHTML='<div class="empty">You have not written anything yet. '
   +'Whatever you write gets pulled apart and collected here.</div>';
  wireRack(); return;}
 var h='';
 if(cut.length){
  h+='<div class="rksec">Cut from this story</div><div class="rack">'
   +cut.map(function(x){
    /* an inferred imprint is named by its seat and its fetter, never by the
       address, which is the engine's own instruction at parseStory. */
    return rkRow(x.node,'+'+x.amt.toFixed(1),20,true,
     x.inferred?(x.node.cf||x.node.b):x.node.k,' cut');}).join('')+'</div>';}
 if(held.length){
  h+='<div class="rksec">Held</div><div class="rack">'
   +held.map(function(n){
    return rkRow(n,n.sq.toFixed(1),n.sq*10,false,null,sb[n.b]?' fed':'');
    }).join('')+'</div>';}
 if(fill.length){
  h+='<div class="rksec">Filled in</div><div class="rack" style="opacity:.72">'
   +fill.map(function(n){return rkRow(n,n.pole.toFixed(1),n.pole*10);}).join('')
   +'</div>';}
 host.innerHTML=h; wireRack();}
function wireRack(){
 Array.prototype.forEach.call(document.querySelectorAll('[data-imp]'),function(el){
  el.onclick=function(){var i=+el.dataset.imp; PICK[i]=1; paint();};});
 Array.prototype.forEach.call(document.querySelectorAll('[data-un]'),function(el){
  el.onclick=function(){delete PICK[+el.dataset.un]; paint();};});}

/* ============================================================
   THE VICE. What is clamped, what it costs to take back out, and the reading
   of what is in there.
   ============================================================ */
function runPool(){
 var ids=Object.keys(PICK).map(Number).filter(function(i){return !!BY[i];});
 if(ids.length)return ids.map(function(i){return BY[i];});
 return compute().carrying.slice(0,1);}
function paintRel(){
 var e=document.getElementById('rl'), take=runPool();
 var picked=Object.keys(PICK).length>0, run=document.getElementById('run');
 if(!take.length){
  e.innerHTML='<div class="rl-none">Nothing is carrying yet, so there is '
   +'nothing to release.</div>';
  run.disabled=true; return;}
 run.disabled=false;
 e.innerHTML=(picked?'':'<div class="rl-none">The heaviest thing you are '
   +'carrying, until you pick something else.</div>')
  +'<div class="clamp">'+take.map(function(n){
   if(!picked)return '<div class="rk" style="--c:'+seatCol(n.b)+';cursor:default">'
    +badge(n.b,n.sq*10,n.sq.toFixed(1))+'<span class="nm">'+esc(n.k)
    +'</span><span class="st">'+esc(n.b)+'</span></div>';
   var v=(n.sq>=4?n.sq:n.pole);
   return '<button type="button" class="rk" data-un="'+n.i+'" style="--c:'
    +seatCol(n.b)+'" title="Take it back out of the release.">'
    +badge(n.b,v*10,v.toFixed(1))+'<span class="nm">'+esc(n.k)
    +'</span><span class="st">Remove</span></button>';}).join('')+'</div>';
 if(Object.keys(PICK).length&&!spotHits(spotBands()))
  e.innerHTML+='<div class="rl-none" style="margin-top:10px">Nothing in this '
   +'story reaches these. They are held from before.</div>';
 wireRack();}

/* the reading of what is clamped. No badge and no name repeated: they are in
   the vice two rows up, and a panel that prints the same pill twice is a
   panel that has not decided which one is the control. */
function paintSel(){
 var card=document.getElementById('selcard');
 var ids=Object.keys(PICK).map(Number).filter(function(i){return !!BY[i];});
 if(!ids.length){card.innerHTML='';return;}
 var r=compute(), h='';
 ids.slice(0,4).forEach(function(i){
  var n=BY[i];
  h+='<div class="sel-one"><div class="sel-hd"><div class="sel-nm">'+esc(n.k)
   +'</div><div class="sel-sub">'+esc(n.b)+(n.n?', '+esc(n.n):'')+'</div></div>'
   +'<p class="sel-p">'+oneLine(r,n)+'</p>';
  var ow=ownersOf(r,n);
  if(ow.length)h+='<div class="chips">'+ow.slice(0,5).map(function(o){
   return '<span class="chip">'+esc(o.nm)+' '+o.w.toFixed(1)+'</span>';}).join('')
   +'</div>';
  h+='</div>';});
 if(ids.length>1){
  h+='<div class="sel-pair"><div class="eye" style="margin-bottom:8px">'
   +'How they run through you</div>';
  for(var a=0;a<ids.length&&a<4;a++)for(var b=a+1;b<ids.length&&b<4;b++)
   h+='<p class="sel-p" style="margin-bottom:9px"><b>'+esc(BY[ids[a]].k)+'</b> and <b>'
    +esc(BY[ids[b]].k)+'</b>. '+pairLine(r,BY[ids[a]],BY[ids[b]])+'</p>';
  h+='</div>';}
 card.innerHTML=h;}

/* ============================================================
   THE SPOTLIGHT. What is in the vice decides what the story shows. A part
   carries its seat and a word carries its seat, so the join is the band the
   engine already put on both.
   ============================================================ */
function spotBands(){
 var o={},k,n;
 for(k in PICK){n=BY[k]; if(n)o[n.b]=1;}
 return o;}
/* AND IT ONLY FIRES WHEN THERE IS SOMETHING TO LIGHT. Clamping a part the
   story never reaches dimmed the whole page and lit nothing, which reads as a
   fault rather than as an answer. The stock stays lit and the vice says why. */
function spotHits(sp){
 var n=0;
 MARKS.forEach(function(m){if(m.bn&&sp[m.bn])n++;});
 return n;}

var MIC_ON='<svg viewBox="0 0 24 24" aria-hidden="true">'
 +'<rect x="4" y="4" width="16" height="16" rx="3"/></svg>';
var MIC_OFF='<svg viewBox="0 0 24 24" aria-hidden="true">'
 +'<rect x="9" y="3" width="6" height="11" rx="3"/>'
 +'<path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>';

function hlHtml(t,sp){
 if(!MARKS.length)return esc(t);
 var out='',last=0;
 MARKS.forEach(function(m){
  out+=esc(t.slice(last,m.s))
   +'<mark class="mk'+(m.coh?' coh':'')+(m.bn&&sp[m.bn]?' hit':'')+'" data-mk="'
   +m.i+'" style="--c:'+(m.bn?seatCol(m.bn):'var(--dim)')+'">'
   +esc(t.slice(m.s,m.e))+'</mark>';
  last=m.e;});
 return out+esc(t.slice(last));}

function paintJournal(){
 var ta=document.getElementById('ta'), hl=document.getElementById('hl');
 var sp=spotBands();
 hl.className='jr-hl'+(spotHits(sp)?' spot':'');
 hl.innerHTML=hlHtml(TEXT,sp)+'\n';
 document.getElementById('commit').disabled=!(PARSED&&PARSED.imprints.length);
 var jr=document.getElementById('jr');
 jr.classList.toggle('live',LISTEN);
 var rec=document.getElementById('rec');
 rec.innerHTML=LISTEN?MIC_ON:MIC_OFF;
 rec.setAttribute('aria-pressed',LISTEN?'true':'false');
 rec.title=LISTEN?'Recording. Press to stop and keep what it heard.'
  :'Record what happened out loud.';
 if(ta.value!==TEXT)ta.value=TEXT;}

function paint(){
 var t0=performance.now();
 MARKS=marksOf(TEXT,PARSED);
 paintJournal(); paintRack(); paintRel(); paintSel(); note();
 FR.push(performance.now()-t0); if(FR.length>400)FR.shift();}
function note(){
 var r=compute();
 document.getElementById('pnote').textContent='Carrying '+r.carrying.length
  +' places. Held above the line, '+r.loaded.length+'. Filled in, '
  +liveFilled().length+'.';}

(function(){
 var sel=document.getElementById('who');
 sel.innerHTML='<option value="">Nothing entered</option>'
  +['Sofia','Diane','Marcus','Angela','Derek','James'].map(function(n){
   return '<option>'+n+'</option>';}).join('');
 sel.onchange=function(){sel.value?loadWho(sel.value):loadBlank();};
 var ta=document.getElementById('ta');
 ta.oninput=function(){TEXT=ta.value; PARSED=TEXT.trim()?parseStory(TEXT):null; paint();};
 ta.onscroll=function(){var hl=document.getElementById('hl');
  hl.scrollTop=ta.scrollTop; hl.scrollLeft=ta.scrollLeft;};
 document.getElementById('clear').onclick=function(){
  TEXT='';PARSED=null;ta.value='';paint();ta.focus();};
 document.getElementById('commit').onclick=function(){
  if(!PARSED||!PARSED.imprints.length)return;
  applyStory(TEXT); TEXT='';PARSED=null;ta.value='';paint();};
 document.getElementById('fill').onclick=function(){
  TEXT=SAMPLE; ta.value=TEXT; PARSED=parseStory(TEXT); paint();};
 document.getElementById('toimp').onclick=function(){
  alert('The full imprints page. Out of scope for this prototype and it is a '
   +'surface that already exists.');};
 document.getElementById('run').onclick=function(){
  var take=runPool(), pace=+document.getElementById('pace').value||1;
  alert('Run release. '+take.map(function(n){return n.k;}).join(', ')+', at '+pace
   +(pace===1?' second':' seconds')+' a line. The runner states what it costs on '
   +'its first frame, which is where that belongs.');};
 document.getElementById('rec').onclick=function(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){LISTEN=false;paint();
   alert('This browser has no speech recognition. Typing works.');return;}
  if(typeof isSecureContext!=='undefined'&&!isSecureContext){LISTEN=false;paint();
   alert('Recording needs a secure page. Opened from a file, the browser will not '
    +'turn the microphone on. Typing works.');return;}
  if(REC&&LISTEN){REC.stop();LISTEN=false;paint();return;}
  REC=new SR(); REC.continuous=true; REC.interimResults=true; REC.lang='en-US';
  var base=TEXT;
  REC.onresult=function(e){var s='',i;
   for(i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;
   TEXT=(base+' '+s).trim(); PARSED=TEXT?parseStory(TEXT):null; paint();};
  REC.onend=function(){LISTEN=false;paint();};
  REC.onerror=function(){LISTEN=false;paint();};
  try{REC.start();LISTEN=true;paint();}catch(err){LISTEN=false;paint();}};
 loadBlank();
})();
var SAMPLE='I said yes to the board again and my jaw was tight the whole call. '
 +'I stayed quiet when he took the credit. I keep waiting for somebody to tell '
 +'me I am doing enough. Afterwards I sat in the car for twenty minutes before '
 +'I could drive. I am angry at myself for not saying what I actually thought, '
 +'and ashamed that I care this much what they think of me. I slept well '
 +'though, and I was grateful walking back from the beach on Sunday.';
</script>
