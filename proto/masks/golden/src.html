<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golden masks prototype</title>
<!--FONT-->
<style>
/* ============================================================
   GOLDEN MASKS. Round IT in TASKS.md. A prototype, not the app.

   Tokens are the product's own Dark values (shell/head.html, and the seat PAL
   in engine/data/canon.js), copied rather than invented.
   ============================================================ */
:root{
 --bg:#0C0D12; --panel:#1A1D26; --panel-2:#252833; --sunk:#090A0E;
 --edge:rgba(255,255,255,.09); --edge-2:rgba(255,255,255,.14);
 --ink:#EFEDE8; --mid:#B4B0A8; --dim:#94908A;
 --accent:#7EB8D4; --on-accent:#0B1418; --au:#C2A063;
 --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
 --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
 font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.pb{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
 padding:10px 16px;background:#2A2410;color:#F3E3B5;border-bottom:1px solid #5A4A1C;font-size:13.5px}
.pb b{font-weight:600}
.pb .sp{flex:1}
.pb .who{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge-2);border-radius:999px;
 padding:5px 11px;font-size:13px;background:var(--panel);cursor:pointer;min-height:32px}
.pb .chip{background:#3A3216;border-color:#6A5822;color:#F3E3B5}
.pb .chip.on{background:#F3E3B5;color:#2A2410;border-color:#F3E3B5;font-weight:600}
.wrap{max-width:1360px;margin:0 auto;padding:18px 16px 64px}
.hd h1{font-size:26px;font-weight:600;margin:4px 0 6px;letter-spacing:-.01em}
.eyebrow{font-size:12.5px;color:var(--dim)}
.muted{color:var(--mid)} .dim{color:var(--dim)} .small{font-size:13px}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--edge-2);border-radius:999px;background:var(--sunk);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:999px;cursor:pointer;min-height:40px;color:var(--mid);font-size:14px}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:16px}
.wn{border-left:2px solid var(--au);padding:4px 0 4px 12px;font-size:13.5px;color:var(--mid);margin:10px 0}
.wn .eyebrow{color:var(--au)}
h2{font-size:19px;font-weight:600;margin:0 0 4px}

/* the reversal view: the mask is the light source of the page, everything
   else sits back from it */
.rev{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:16px;margin-top:14px;align-items:start}
.stage{background:var(--sunk);border:1px solid var(--edge);border-radius:var(--r);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.stage svg.big{width:100%;max-width:330px;height:auto}
.stage .when{font-size:28px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stage .ro{font-size:13.5px;color:var(--mid);text-align:center;font-variant-numeric:tabular-nums;min-height:44px}
svg rect.cell{transition:transform .6s cubic-bezier(.5,0,.2,1),fill .45s,stroke .45s}
.playing svg rect.cell{transition:none}
.pick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pick button{background:var(--sunk);border:1px solid var(--edge);border-radius:10px;padding:6px 4px 4px;cursor:pointer;
 display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;font-size:12px;color:var(--mid)}
.pick button.on{border-color:var(--accent);color:var(--ink)}
.pick svg{width:100%;max-width:54px;height:auto}
.ctl{display:flex;flex-direction:column;gap:10px}
.ctl input[type=range]{width:100%;accent-color:var(--accent);min-height:36px;margin:0}
.stops{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stops button{border:1px solid var(--edge-2);background:var(--panel-2);border-radius:10px;min-height:44px;cursor:pointer;font-size:13px;padding:4px}
.stops button.on{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--edge-2);background:var(--panel-2);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;font-size:14px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:14px}
.strip .f{background:var(--sunk);border:1px solid var(--edge);border-radius:10px;padding:8px 6px;text-align:center;font-size:12.5px;color:var(--mid);font-variant-numeric:tabular-nums}
.strip .f b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.strip svg{width:100%;max-width:120px;height:auto}
.chart>svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mid)}
.legend span{display:inline-flex;align-items:center;gap:6px}

.six{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.six .m{background:var(--sunk);border:1px solid var(--edge);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:118px 118px minmax(0,1fr);gap:12px;align-items:start}
.six .m svg{width:100%;height:auto}
.six .m .t{font-size:12px;color:var(--dim);text-align:center}
.six .m h3{margin:0 0 2px;font-size:16px;font-weight:600}
.six .m .v{font-size:13px;color:var(--mid);margin-bottom:8px}
.six .m ul{margin:0;padding-left:16px;font-size:13px;color:var(--mid)}
.six .m li{margin:2px 0}

.build{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
.build svg{width:100%;height:auto}
table.ms{border-collapse:collapse;width:100%;font-size:13.5px}
.ms th,.ms td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--edge);vertical-align:top}
.ms th{color:var(--dim);font-weight:500;font-size:12.5px}
.ms td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.was{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.was .f{background:var(--sunk);border:1px solid var(--edge);border-radius:10px;padding:12px;text-align:center;font-size:13px;color:var(--mid)}
.was svg{width:100%;max-width:190px;height:auto}
/* the mosaic, round JP. the six masks as a strip, then one large with its
   ledger of patterns beside it */
.mz6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:14px}
.mz6 button{background:var(--sunk);border:1px solid var(--edge);border-radius:12px;padding:8px 6px 6px;cursor:pointer;
 display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;font-size:13px;color:var(--mid)}
.mz6 button.on{border-color:var(--accent);color:var(--ink)}
.mz6 button b{font-weight:600;color:var(--ink);font-size:13px}
.mz6 button span{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.mz6 svg{width:100%;max-width:120px;height:auto}
.mz{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:16px;margin-top:14px;align-items:start}
.mz .stage{flex-direction:row;justify-content:center;align-items:flex-end;gap:18px;flex-wrap:wrap}
.mz .stage .pair{display:flex;flex-direction:column;align-items:center;gap:6px}
.mz .stage svg.big{max-width:340px}
.mz .stage svg.ref{width:120px;height:auto}
.mz .stage .t{font-size:12.5px;color:var(--dim);text-align:center}
svg rect.cell.fade,svg path.fade{opacity:.16}
.led{display:flex;flex-direction:column;gap:6px}
.led .grp{font-size:12.5px;color:var(--dim);margin:8px 0 2px}
.led button.u{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;
 background:var(--sunk);border:1px solid var(--edge);border-radius:10px;padding:8px 10px;cursor:pointer;min-height:44px}
.led button.u.on{border-color:var(--accent)}
.led .u .nm{font-size:14px;color:var(--ink);font-weight:500;line-height:1.3}
.led .u .sub{font-size:12.5px;color:var(--mid);line-height:1.35}
.led .u .w{font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;white-space:nowrap}
.led .u .w small{display:block;font-size:12px;color:var(--dim)}
.led .u svg{width:28px;height:28px}
.key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin-top:10px}
.key .k{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;font-size:13px;color:var(--mid)}
.key .k svg{width:44px;height:44px}
.fams{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--mid)}
.fams span{display:inline-flex;align-items:center;gap:6px}
.fams svg{width:20px;height:20px}
@media (max-width:1100px){.mz{grid-template-columns:1fr}}
@media (max-width:760px){.mz6{grid-template-columns:repeat(3,minmax(0,1fr))}.key{grid-template-columns:1fr}}
@media (max-width:1100px){.rev,.build{grid-template-columns:1fr}.six{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.six{grid-template-columns:1fr}}
@media (max-width:520px){.pb{position:static}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}
 .stops{grid-template-columns:repeat(3,minmax(0,1fr))}.pick{grid-template-columns:repeat(3,minmax(0,1fr))}
 .six .m{grid-template-columns:1fr 1fr}.six .m>div:last-child{grid-column:span 2}.hd h1{font-size:22px}}
</style></head><body>
<div class="wrap">
 <div class="hd">
  <div class="eyebrow">Round IT. The six masks, redrawn on the golden ratio, with the reversal on a time slider. Round JP adds the mosaic: each mask read as the saboteurs, complexes and hyper complexes running through it.</div>
  <h1>Golden masks</h1>
 </div>
 <div id="mode"></div>
 <div id="view"></div>
</div>
<!--DATA-->
<script>
/* ============================================================
   THE FACE, CONSTRUCTED. Every measurement is a Fibonacci number, and
   consecutive Fibonacci numbers are the golden ratio in whole cells:
   34/21 = 1.619, 21/13 = 1.615, 13/8 = 1.625, 8/5 = 1.6. So the ratio is
   not a mood here, it is the grid.

     grid          21 wide by 34 tall          34 : 21, height to width
     eye line      13 down, 21 above the chin  the height cut at phi
     mouth line    8 above the chin            chin to eye, 21, cut at phi
     brow line     3 above the eye line
     nose line     8 below the eye line        eye to mouth, 13, cut at phi
     jaw           13 wide at the mouth line   21 / phi
     chin          8 wide                      13 / phi
     eyes          centres 8 apart, 3 wide     8 = 21 / phi^2, 3 = 8 / phi^2
     mouth         5 wide                      8 / phi
   ============================================================ */
var PHI=(1+Math.sqrt(5))/2;
var COLS=21, ROWS=34, CX=10.5, U=10;
var G={eye:13, brow:10, nose:21, mouth:26, chin:34, jaw:13, chinW:8, eyeGap:8, eyeW:3, mouthW:5};
function cub(p0,p1,p2,p3,n){var o=[];for(var i=1;i<=n;i++){var t=i/n,u=1-t;
 o.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]);}return o;}
/* the outline as a closed polygon: a half ellipse over the eye line, then the
   cheek falling to the jaw corner, then the jaw falling to the chin */
function facePoly(){
 var pts=[], chx=CX+G.chinW/2;
 for(var i=0;i<=48;i++){var a=Math.PI+Math.PI*i/48;pts.push([CX+CX*Math.cos(a),G.eye+G.eye*Math.sin(a)]);}
 /* ONE CONVEX CURVE FROM THE CHEEK TO THE CHIN. The straight chord from full
    width at the eye line to the chin crosses the mouth line 12.96 cells wide,
    which is 21 over phi, so the jaw measure is carried by the chord and the
    cheek bows just outside it. The first cut forced the curve through a jaw
    corner at 13 and the cheek went concave under it, which read as a light
    bulb. Measured: the pixels land 15 wide at the mouth line, 13 two rows
    lower. */
 pts=pts.concat(cub([21,G.eye],[21,G.eye+4],[chx+1.5,G.chin],[chx,G.chin],40));
 var right=pts.slice(49), left=right.map(function(p){return [2*CX-p[0],p[1]];}).reverse();
 return pts.concat(left);}
var POLY=facePoly();
function inPoly(x,y){var c=false;for(var i=0,j=POLY.length-1;i<POLY.length;j=i++){var a=POLY[i],b=POLY[j];
 if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
var FACE=[];for(var r=0;r<ROWS;r++){FACE.push([]);for(var c=0;c<COLS;c++)FACE[r].push(inPoly(c+.5,r+.5));}
function smoothPath(){return 'M'+POLY.map(function(p){return (p[0]*U).toFixed(1)+' '+(p[1]*U).toFixed(1);}).join('L')+'Z';}

/* ============================================================
   THE MARKS. One face, six masks, and every mark is cut out of the face, so
   it is negative space and never a new colour. Each mark is read off the
   mask's own line in engine/data/canon.js, which is quoted beside it.

   The tie holes at the temples are the family trait: they are what makes a
   face a mask, a thing that is put on and can be taken off.
   ============================================================ */
function mir(list){return list.concat(list.map(function(p){return [p[0],20-p[1]];}));}
function box(r0,r1,c0,c1){var o=[];for(var r=r0;r<=r1;r++)for(var c=c0;c<=c1;c++)o.push([r,c]);return o;}
function minus(a,b){var k={};b.forEach(function(p){k[p+'']=1;});return a.filter(function(p){return !k[p+''];});}
var TIES=[[G.eye,1],[G.eye,19]];
var MARKS={
 Child:{cut:mir(minus(box(11,13,5,7),[[11,6]])).concat([[25,10],[26,10],[0,10],[1,10],[2,10]]),
  read:['Eyes wide and turned up, the pupil at the top of each: looking up at the bigger body that decides.',
   'A mouth one pixel wide: the voice kept small.',
   'The crown left open, the way a skull is before it closes.']},
 Preteen:{cut:mir(box(9,9,5,7)).concat(box(12,13,6,7),box(12,13,14,15),box(25,26,8,8),box(25,26,10,10),box(25,26,12,12)),
  read:['Both eyes glance the same way, off to the side: checking the room.',
   'Brows raised and watching.',
   'The mouth stitched in three places: the thing is held until the room is safe.']},
 Teen:{cut:mir([[9,4],[9,5],[10,6],[10,7],[11,8],[12,5],[13,6],[13,7]]).concat([[25,8],[26,9],[25,10],[26,11],[25,12]]),
  read:['Brows cut down into a V, and the eyes narrowed under them: aimed at a person.',
   'The mouth jagged, bared rather than open.']},
 Adult:{cut:mir(box(13,13,5,7)).concat(box(25,25,8,12),box(16,19,3,3),box(16,19,5,5),box(16,19,7,7)),
  read:['Eyes level and lidded: it handles it.',
   'A flat line of a mouth.',
   'Three tally marks on the cheek: what it cost, filed where nobody reads it.']},
 Professional:{cut:mir(box(12,13,5,7)).concat(box(G.nose,G.nose,2,18),[[24,7],[25,8],[25,9],[25,10],[25,11],[25,12],[24,13]]),
  read:['Eyes open and steady.',
   'A seam across the face at the nose line: the lower half is a plate fitted over it.',
   'The smile is on the plate, not on the face. It is worn until the feeling passes.']},
 Ideological:{cut:mir([[12,5],[13,6],[12,7]]).concat([[7,10],[8,9],[8,11],[9,10]],box(25,25,9,11)),
  read:['Both eyes shut: the moment in front of it is not being looked at.',
   'One eye open in the brow, fixed: it sees from the position.',
   'A short closed mouth: the answer was ready before the question.']}};
Object.keys(MARKS).forEach(function(k){MARKS[k].cut=MARKS[k].cut.concat(TIES);});

/* the old sprite, kept only so the construction view can show what changed */
var OLD=['.....######.....','...##########...','..############..','.##############.','.##############.',
 '################','################','################','################','.##############.',
 '.##############.','..############..','..############..','...##########...','....########....',
 '.....######.....','......####......'];

var T=DATA.tables, PAL=T.PAL, NODE={};
T.NODES.forEach(function(n){NODE[n.i]=n;});
var WHOS=Object.keys(DATA.people), WHO=DATA.people.Derek?'Derek':WHOS[0], PICK='Child', MODE='rev';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hx(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(a,b,t){var A=hx(a),B=hx(b);return '#'+A.map(function(v,i){var x=Math.round(B[i]+(v-B[i])*t);return (x<16?'0':'')+x.toString(16);}).join('');}
function hash(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function rng(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
function maskOf(nm){return T.MASKS.filter(function(m){return m.nm===nm;})[0];}
function lum(h){return hx(h).map(function(x){x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4);}).reduce(function(a,v,i){return a+v*[.2126,.7152,.0722][i];},0);}
function cr(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}

/* ============================================================
   THE OUTLINE, FIFTY PER CENT LESS INTENSE. His words. Intensity is read as
   the light the line adds over its ground, so the new line carries half the
   luminance the old one added over --sunk, solved rather than eyeballed.
   The old line was #5E6068 at 3.16 to 1. The measured result prints in the
   construction view.
   ============================================================ */
var GROUND='#090A0E', OLDLINE='#5E6068';
var LINE=(function(){var goal=lum(GROUND)+(lum(OLDLINE)-lum(GROUND))/2, lo=0, hi=1;
 for(var k=0;k<30;k++){var m=(lo+hi)/2;if(lum(mix(OLDLINE,GROUND,m))<goal)lo=m;else hi=m;}return mix(OLDLINE,GROUND,hi);})();
var FREE='#24262D';

/* the charge ladder, carried over from round GG unchanged: step one is solved
   to 3 to 1 against the ground for each seat, and the four steps are spaced
   evenly from there to the full seat colour */
var STEPS=[2,4,6,10], LADDER={};
function ladder(seat){if(LADDER[seat])return LADDER[seat];var lo=0,hi=1;
 for(var k=0;k<24;k++){var m=(lo+hi)/2;if(cr(mix(PAL[seat],GROUND,m),GROUND)<3)lo=m;else hi=m;}
 return LADDER[seat]=[0,1,2,3].map(function(i){return hi+(1-hi)*i/3;});}
function stepOf(q){for(var i=0;i<STEPS.length;i++)if(q<=STEPS[i])return i;return 3;}
function tone(seat,q){return mix(PAL[seat],GROUND,ladder(seat)[stepOf(q)]);}

function cutSet(nm){var k={};(nm?MARKS[nm].cut:[]).forEach(function(p){k[p[0]+','+p[1]]=1;});return k;}
function on(cut,r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS&&FACE[r][c]&&!cut[r+','+c];}
function cellsOf(nm){var cut=cutSet(nm),o=[];for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(on(cut,r,c))o.push([r,c]);return o;}
function outline(nm){var cut=cutSet(nm),d='';
 for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){if(!on(cut,r,c))continue;var x=c*U,y=r*U;
  if(!on(cut,r-1,c))d+='M'+x+' '+y+'h'+U;if(!on(cut,r+1,c))d+='M'+x+' '+(y+U)+'h'+U;
  if(!on(cut,r,c-1))d+='M'+x+' '+y+'v'+U;if(!on(cut,r,c+1))d+='M'+(x+U)+' '+y+'v'+U;}
 return d;}

/* ============================================================
   THE LAYOUT, carried from round GG: every address at the mask's seats is one
   belief and owns an equal share of the face in address order. Charge breaks
   a belief into pieces and throws them from home, so as charge falls the
   pieces come home on their own. That is the reversal, drawn: the slider
   lowers the charge and the face defragments.
   ============================================================ */
function layout(who,nm,q,had){
 var m=maskOf(nm), cells=cellsOf(nm);
 var bel=T.NODES.filter(function(n){return m.b.indexOf(n.b)>=0;});
 var n=bel.length, C=cells.length, base=Math.floor(C/n), extra=C%n, frags=[], home=0, seedBase=who+'|'+m.b.join('+');
 bel.forEach(function(b,j){
  var blocks=base+(j<extra?1:0), v=q[b.i]||0;
  var st=v>0.05?'chg':had[b.i]?'rel':'free';
  var f=st==='chg'?Math.max(1,Math.round(blocks*v/10)):1, at=home;
  for(var k=0;k<f;k++){
   var size=Math.floor(blocks/f)+(k<blocks%f?1:0), R=rng(hash(seedBase+'|'+b.i+'|'+k));

/* ============================================================
   THE MOSAIC. Round JP. His words: "the masks should look like a mosaic of
   the hypercomplexes, complexes, saboteurs. And the more intense, the more
   the pixel. The heavier the weight of that cluster."

   The data is compute()'s own, read by extract.js: r.sabs, r.cxs, r.hys.
   A saboteur is a set of addresses with a weight w on the engine's 0 to 10.
   A complex is two saboteurs of one family, w their mean. A hyper complex
   is a family that compounded on two complexes, or one at 6.5 or more, w the
   mean of its complexes. Nothing below re-derives any of it.

   Same face, same cells, same rule from round GG that every address at the
   mask's seats owns an equal share of the face. What changes is who the
   share is handed to.

   1. AN ADDRESS HANDS ITS SHARE TO EVERY SABOTEUR RUNNING THROUGH IT, in
      equal tiles. One address in five saboteurs gives five tiles. This is
      the network: the same address shows up in more than one pattern.
   2. A SABOTEUR'S TILES JOIN THE HIGHEST PATTERN IT REACHED. Inside a hyper
      complex if it compounded that far, else inside its complex, else on its
      own. That unit is one region of the mosaic, bounded by a thick seam, and
      a thin seam divides it into the saboteurs it was built from.
   3. HUE IS THE FAMILY. Each of the six families has a seat in HCX_LIB and is
      drawn in that seat's colour. A family's overshot pole (FAM_POLE) keeps
      the family's colour and each lit tile takes a slash: the same axis,
      pushed past the far end.
   4. LIT SHARE IS WEIGHT. A saboteur at w 6 lights 6 in 10 of its tiles, and
      the lit tiles take the step of the round GG charge ladder for 6. So a
      heavy pattern is both more pixels and brighter ones. Which tiles light
      is an ordered dither, the way a VGA screen rendered a level with a
      short palette, so the lit share spreads evenly and never clumps.
   5. CHARGE IN NO PATTERN is grey, lit by its own charge. It has no family,
      so it gets no family's colour. An address with nothing is an empty ring.

   The regions run along a space filling curve (a generalised Hilbert curve
   over the 21 by 34 grid), heaviest first, so a run of tiles in order is a
   compact patch of the face and not a stripe across it.

function gilbert(width,height){var out=[];function sg(x){return x<0?-1:x>0?1:0;}

  if(w===1){for(i=0;i<h;i++){out.push([x,y]);x+=dbx;y+=dby;}return;}

  (function step(now){var s=Math.min(1000,s0+(now-t0)/dur*(1000-s0));TNOW=toT(s);refreshRev();
   if(s<1000)PLAY=requestAnimationFrame(step);else stop();})(t0);};}
