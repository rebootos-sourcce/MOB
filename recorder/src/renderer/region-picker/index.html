<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Select region</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; cursor: crosshair; }
    #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.25); }
    #sel {
      position: fixed;
      border: 2px solid #4f8cff;
      background: rgba(79, 140, 255, 0.15);
      display: none;
      box-sizing: border-box;
    }
    #hint {
      position: fixed;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 26, 0.85);
      color: #e6e9f0;
      font: 12.5px -apple-system, "Segoe UI", sans-serif;
      padding: 6px 14px;
      border-radius: 6px;
      pointer-events: none;
    }
    #size {
      position: fixed;
      display: none;
      background: #4f8cff;
      color: #fff;
      font: 11px ui-monospace, monospace;
      padding: 2px 6px;
      border-radius: 4px;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="size"></div>
  <div id="hint">Drag to select a region · Esc or right-click to cancel</div>
  <script src="region-picker.js"></script>
</body>
</html>
