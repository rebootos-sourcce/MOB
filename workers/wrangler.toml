name            = "mob-recorder"
main            = "src/index.js"
compatibility_date = "2024-11-01"

# ── R2 bucket ────────────────────────────────────────────────────────────────
[[r2_buckets]]
binding            = "MOB_BUCKET"
bucket_name        = "mob-recordings"
preview_bucket_name = "mob-recordings-preview"

# ── Durable Objects ──────────────────────────────────────────────────────────
[[durable_objects.bindings]]
name       = "COORDINATOR"
class_name = "DistributionCoordinator"

[[migrations]]
tag         = "v1"
new_classes = ["DistributionCoordinator"]

# Task #61: ADR-004 (Queues + Durable Objects over KV) already decided this
# binding shouldn't exist — nothing in src/ ever referenced MOB_KV, and its
# REPLACE_WITH_KV_ID/REPLACE_WITH_KV_PREVIEW_ID placeholders blocked
# `wrangler deploy` until someone filled in IDs for a KV namespace the code
# never reads or writes. Removed rather than filled in.

# ── Non-secret config ────────────────────────────────────────────────────────
[vars]
ENVIRONMENT    = "production"
# UPLOAD_TOKEN_TTL_SECONDS: how long a presigned upload URL stays valid
UPLOAD_TOKEN_TTL_SECONDS = "3600"

# ── Secrets (set via `wrangler secret put <NAME>`) ───────────────────────────
# JWT_SIGNING_SECRET    — HS256 signing key for device-scoped auth tokens
#                         (ADR-003, workers/src/auth.js). Shared across this
#                         device's own token lifecycle today, same as the
#                         CLOUDFLARE_API_TOKEN it replaces — see auth.js's own
#                         top comment for the real, honest limit that remains.
# UPLOAD_SIGNING_SECRET  — HMAC key for time-limited upload URLs
