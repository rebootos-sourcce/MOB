name            = "mob-recorder"
main            = "src/index.js"
compatibility_date = "2024-11-01"

# ── R2 bucket ────────────────────────────────────────────────────────────────
[[r2_buckets]]
binding            = "MOB_BUCKET"
bucket_name        = "mob-recordings"
preview_bucket_name = "mob-recordings-preview"

# ── Durable Objects ──────────────────────────────────────────────────────────
[[durable_objects.bindings]]
name       = "COORDINATOR"
class_name = "DistributionCoordinator"

[[migrations]]
tag         = "v1"
new_classes = ["DistributionCoordinator"]

# ── KV (job metadata / dedup) ────────────────────────────────────────────────
[[kv_namespaces]]
binding  = "MOB_KV"
id       = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

# ── Non-secret config ────────────────────────────────────────────────────────
[vars]
ENVIRONMENT    = "production"
# UPLOAD_TOKEN_TTL_SECONDS: how long a presigned upload URL stays valid
UPLOAD_TOKEN_TTL_SECONDS = "3600"

# ── Secrets (set via `wrangler secret put <NAME>`) ───────────────────────────
# CLOUDFLARE_API_TOKEN   — shared secret; desktop app sends as Bearer token
# UPLOAD_SIGNING_SECRET  — HMAC key for time-limited upload URLs
