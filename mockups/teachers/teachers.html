<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher panel</title>
<!-- MOCKUP, NOT THE BUILD. Round OT. The numbers are Derek's reading, computed on the built
     engine with the alignment proposed in DESIGN-teachers.md, and drawn on a real-record layout.
     #empty swaps in Marcus, whose reading has nothing carrying at the opposite's addresses.
     Ring icons, seat colours and surfaces are the app's own tokens (shell/head.html). -->
<style>
:root{
 --bg:#0C0D12; --panel:#1A1D26; --panel-2:#252833; --sunk:#090A0E;
 --edge:rgba(255,255,255,.09); --edge-2:rgba(255,255,255,.14);
 --ink:#EFEDE8; --mid:#B4B0A8; --dim:#94908A;
 --root:#D6524C; --sacral:#D8924E; --solar:#DABF6A; --heart:#5FD5A6; --throat:#5EBBDB; --eye:#7D93E0; --crown:#A77EDB;
 --accent:#7EB8D4; --on-accent:#0B1418; --good:#68CBA4; --bad:#D4736D;
 --sans:'Inter','Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
 --r:14px; --r-s:9px; --tap:44px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit}
.wrap{max-width:1600px;margin:0 auto;padding:10px 16px 28px}

/* top bar and second tier, as the app draws them */
.top{display:flex;align-items:center;gap:18px;padding:10px 18px;border:1px solid var(--edge);border-radius:var(--r);background:linear-gradient(#171922,#12141b)}
.mark{font-weight:300;font-size:21px;letter-spacing:.02em}
.mark small{display:block;font-size:8px;letter-spacing:.3em;color:var(--dim);margin-top:-3px}
.secs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.sec{display:flex;align-items:center;gap:8px;padding:0 12px;min-height:var(--tap);color:var(--mid);font-size:13px}
.sec svg{width:18px;height:18px}
.sec.on{color:var(--ink);font-weight:500}
.sec.on svg{color:#9FC56E}
.chip{display:flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 14px;border:1px solid var(--edge-2);border-radius:var(--r-s);background:var(--panel);font-size:13px}
.chip small{color:var(--dim);font-size:11px}
.sub{display:flex;gap:4px;padding:2px 18px 0 86px;border-bottom:1px solid var(--edge);margin:0 0 12px}
.tab{display:flex;align-items:center;gap:7px;min-height:var(--tap);padding:0 12px;font-size:12px;color:var(--dim);border-bottom:2px solid transparent}
.tab svg{width:15px;height:15px}
.tab.on{color:var(--ink);font-weight:500;border-color:var(--accent)}

/* the two panels */
.frame{display:grid;grid-template-columns:372px 1fr;gap:14px;align-items:start}
.panel{border:1px solid var(--edge);border-radius:var(--r);background:var(--panel)}
.list{padding:16px 14px 18px}
.hd{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 3px}
.list h2{font-size:17px;font-weight:600;margin:0 0 3px}
.list .lede{font-size:12.5px;color:var(--mid);margin:0 0 14px}
.grp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:16px 4px 6px}
.grp i{font-style:normal;text-transform:none;letter-spacing:0;color:var(--dim);font-size:11px;margin-left:6px}

.row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;width:100%;text-align:left;
 background:transparent;border:0;border-radius:var(--r-s);padding:6px 8px;min-height:var(--tap);cursor:pointer}
.row:hover{background:rgba(255,255,255,.03)}
.row.on{background:var(--panel-2);box-shadow:inset 2px 0 0 var(--c)}
.row .q{font-size:11px;color:var(--dim);display:block}
.row .nm{font-size:14.5px;font-weight:600;color:var(--c);display:block}
.row .op{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.row .op svg{width:13px;height:13px}
.row .nm em,.row .op em,em.pill{font-style:normal;font-size:10px;letter-spacing:.04em;color:var(--on-accent);background:var(--accent);border-radius:20px;padding:1px 7px;margin-left:8px;font-weight:600;vertical-align:2px;white-space:nowrap}
.dh h1 em.pill,.opp b em.pill{font-size:11px;vertical-align:6px}
.step b em.pill{vertical-align:1px}
.pair{border-radius:var(--r-s);padding:2px 0}
.pair .row{padding-top:4px;padding-bottom:4px}
.pair .who{display:flex;gap:10px;align-items:center;padding:6px 8px 0}
.pair .who b{font-size:14.5px;color:var(--c)}
.pair .who span{font-size:11px;color:var(--dim)}

/* ring badge: the app's own figure object, icon inside a ring with a pill */
.rg{position:relative;width:48px;height:48px;flex:0 0 auto}
.rg svg.ring{position:absolute;inset:0;width:48px;height:48px;stroke:none}
.rg .ic{position:absolute;left:12px;top:12px;width:24px;height:24px;color:var(--c)}
.rg .n{position:absolute;right:-3px;bottom:-2px;min-width:22px;height:17px;padding:0 5px;border-radius:9px;background:#2a2d38;border:1px solid var(--edge-2);
 font-size:10.5px;line-height:15px;text-align:center;font-weight:600;color:var(--ink)}
.rg.sm{width:22px;height:22px}
.rg.big{width:72px;height:72px}
.rg.big svg.ring{width:72px;height:72px}
.rg.big .ic{left:18px;top:18px;width:36px;height:36px}
.rg.big .n{min-width:30px;height:22px;font-size:13px;line-height:20px;border-radius:11px}

/* the dossier */
.dos{padding:22px 26px 26px}
.dh{display:flex;gap:18px;align-items:center;margin-bottom:6px}
.dh h1{font-size:30px;font-weight:600;margin:0;color:var(--c);letter-spacing:-.01em}
.dh .sub2{color:var(--mid);font-size:13px}
.dh .sw{margin-left:auto;display:flex;gap:6px}
.sw button{min-height:var(--tap);padding:0 14px;border-radius:var(--r-s);border:1px solid var(--edge-2);background:transparent;color:var(--mid);font-size:12.5px;cursor:pointer}
.sw button.on{background:var(--panel-2);color:var(--ink);border-color:var(--edge-2)}
.read{color:var(--mid);font-size:13px;margin:4px 0 0}
.read b{color:var(--ink);font-weight:600}
.sect{margin-top:24px}
.sect>.hd{margin-bottom:8px}
p{margin:0 0 8px}
.q2{border-left:2px solid var(--c);padding:2px 0 2px 12px;color:var(--ink);margin:10px 0 0}
.src{font-size:12px;color:var(--dim)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col{border:1px solid var(--edge);border-radius:var(--r-s);padding:14px 16px;background:var(--sunk)}
.col h3{font-size:12px;margin:0 0 8px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:8px}
.col.up h3{color:var(--c)}
.col.dn h3{color:var(--bad)}
.col h3 svg{width:18px;height:18px}
.col ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.col li{padding-left:14px;position:relative;font-size:13.5px}
.col li:before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;border:1.4px solid currentColor;color:var(--dim)}
.opp{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start;padding:14px 16px;border:1px dashed var(--edge-2);border-radius:var(--r-s)}
.opp b{font-size:16px;display:block;margin-bottom:2px;color:var(--bad)}
.ring-dash circle{stroke-dasharray:2 3.4}

.laws{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.law{display:flex;align-items:center;gap:8px;border:1px solid var(--edge);border-radius:var(--r-s);padding:6px 10px;font-size:12.5px;background:var(--sunk)}
.law svg{width:16px;height:16px;color:var(--c)}
.law b{font-weight:600}
.law.thin{border-color:var(--c)}
.law.thin:after{content:"thinnest";font-size:10.5px;color:var(--c);margin-left:2px}

.adr{display:grid;gap:7px;margin-top:6px}
.a{display:grid;grid-template-columns:1fr 150px 52px;gap:12px;align-items:center;font-size:13px}
.a .t{height:7px;border-radius:5px;background:var(--panel-2);position:relative}
.a .t i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--dim)}
.a.hot .t i{background:var(--c)}
.a .t:after{content:"";position:absolute;left:40%;top:-3px;bottom:-3px;width:1px;background:var(--edge-2)}
.a .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mid)}
.a.hot .v{color:var(--ink);font-weight:600}
.a.hot span:first-child{font-weight:600}
.note{font-size:12.5px;color:var(--dim);margin-top:8px}
.lock{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 14px;border:1px solid var(--edge);border-radius:var(--r-s);color:var(--mid);font-size:12.5px;background:var(--sunk)}
.lock svg{width:20px;height:20px;color:var(--dim);flex:0 0 auto}

/* the library lanes */
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lane{border:1px solid var(--edge);border-radius:var(--r);padding:16px 18px 18px;background:var(--panel-2)}
.lane h3{font-size:15px;font-weight:600;margin:0 0 2px}
.lane .tag{font-size:12px;color:var(--dim);margin-bottom:12px}
.step{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--edge)}
.step:first-of-type{border-top:0}
.step b{font-size:13.5px}
.step small{color:var(--dim);font-size:12px;white-space:nowrap}
.step p{font-size:12.5px;color:var(--mid);margin:2px 0 0}
.why{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.why span{font-size:11.5px;color:var(--mid);border:1px solid var(--edge-2);border-radius:20px;padding:2px 10px}
.why span.y{color:var(--ink);border-color:var(--c)}
.cost{font-size:12.5px;color:var(--mid);margin:12px 0 0}
.cost b{color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{min-height:var(--tap);padding:0 18px;border-radius:var(--r-s);border:1px solid var(--edge-2);background:transparent;color:var(--ink);font-size:13px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.empty{padding:10px 0 2px;color:var(--mid);font-size:13px}
.empty b{color:var(--ink)}
.shelf{margin-top:14px;padding-top:12px;border-top:1px solid var(--edge);font-size:12.5px;color:var(--mid)}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--edge);font-size:12.5px;color:var(--dim)}

/* phone: the list becomes a wrapped grid of rings, never a hidden scroller */
.strip{display:none}
@media (max-width:720px){
 .wrap{padding:8px 16px 24px}
 .top{padding:8px 12px;gap:8px;flex-wrap:wrap}
 .secs{order:3;flex-basis:100%;justify-content:space-between}
 .sec{padding:0 6px;font-size:12px}
 .sec span{display:none}
 .sec.on span{display:inline}
 .chip{margin-left:auto}
 .chip.th{display:none}
 .sub{padding-left:0;overflow:hidden}
 .tab{padding:0 9px}
 .frame{grid-template-columns:1fr}
 .list{display:none}
 .strip{display:block;padding:14px 12px 12px;margin-bottom:12px}
 .strip .hd{margin-left:4px}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
 .gi{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:0;border-radius:var(--r-s);padding:8px 2px 6px;min-height:var(--tap);cursor:pointer}
 .gi.on{background:var(--panel-2);box-shadow:inset 0 -2px 0 var(--c)}
 .gi span{font-size:11px;color:var(--mid);line-height:1.2;text-align:center}
 .gi.on span{color:var(--ink)}
 .dos{padding:18px 16px 20px}
 .dh{flex-wrap:wrap;gap:12px}
 .dh h1{font-size:25px}
 .dh .sw{margin-left:0;flex-basis:100%}
 .sw button{flex:1}
 .cols,.lanes{grid-template-columns:1fr}
 .a{grid-template-columns:1fr 84px 40px;gap:8px}
 .step{flex-direction:column;gap:2px}
 .acts .btn{flex:1;padding:0 10px}
}
</style></head>
<body>
<div class="wrap">

<div class="top">
 <div class="mark">atüned<small>SOURCE OS</small></div>
 <div class="secs">
  <div class="sec"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.6-6 9.5-6 9.5 6 9.5 6-3.6 6-9.5 6-9.5-6-9.5-6zM12 9.4a2.6 2.6 0 110 5.2 2.6 2.6 0 010-5.2"/></svg><span>Discover</span></div>
  <div class="sec on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg><span>Play</span></div>
  <div class="sec"><svg viewBox="0 0 24 24"><path d="M3 10c3-4 6 4 9 0s6-4 9 0M3 16c3-4 6 4 9 0s6-4 9 0"/></svg><span>Flow</span></div>
  <div class="sec"><svg viewBox="0 0 24 24"><path d="M12 4v6M6 8l6 4 6-4M8 20l4-8 4 8"/></svg><span>Embody</span></div>
 </div>
 <div class="chip th"><small>Profile</small> <span id="who">Derek</span></div>
 <div class="chip">Dark</div>
</div>
<div class="sub">
 <div class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Field</div>
 <div class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 8v7M8 11h8M10 21l2-6 2 6"/></svg>Body</div>
 <div class="tab on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M15 9l-2 6-4 0 2-6z"/></svg>Compass</div>
 <div class="tab"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v6c0 4-3.5 7-8 8-4.5-1-8-4-8-8V7z"/></svg>Character</div>
</div>

<div class="strip panel" id="strip"></div>
<div class="frame">
 <aside class="panel list" id="list"></aside>
 <section class="panel dos" id="dos"></section>
</div>
</div>

<script>
/* ---------- what the panel draws. Teachers, opposites, icons and the codex lines are read off
   engine/data/compass.js. Behaviours, the five marks per opposite, the twelfth teacher and the opposites
   marked proposed are DRAFTS for the owner. The readings are computed on the built engine. ---------- */
var SEAT={Root:'#D6524C',Sacral:'#D8924E',Solar:'#DABF6A',Heart:'#5FD5A6',Throat:'#5EBBDB','3rd Eye':'#7D93E0',Crown:'#A77EDB'};
var ACC='#7EB8D4';
var IC={
 jesus:'M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1M12 8a4 4 0 110 8 4 4 0 010-8',
 lucifer:'M12 4l2.4 5.2 5.6.6-4.2 3.8 1.2 5.6L12 16.4 6.99 19.2l1.2-5.6L4 9.8l5.6-.6z',
 furies:'M4 5h16v12H4zM8 9h8M8 13h5',
 ramak:'M12 20s-7-4.4-7-9.4A4 4 0 0112 8a4 4 0 017 2.6c0 5-7 9.4-7 9.4z',
 asmo:'M4 9h16l-2.2 10.4a1 1 0 01-1 .6H7.2a1 1 0 01-1-.6zM9 9V6a3 3 0 016 0v3',
 moses:'M4 6h16M4 12h16M4 18h11M19 16.5v3.6M17.4 18.3h3.2',
 set:'M4.6 5.4l14.8 13.2M19.4 5.4L4.6 18.6M12 4v16',
 musashi:'M6.5 17.5L17 7M15 5l4 4M6 18l-1.6 1.6M4.5 15.5l4 4',
 moloch:'M5 20V9l7-5 7 5v11M9 20v-5h6v5M9.5 11.5h5',
 buddha:'M2.5 12s3.6-6 9.5-6 9.5 6 9.5 6-3.6 6-9.5 6-9.5-6-9.5-6zM12 9.4a2.6 2.6 0 110 5.2 2.6 2.6 0 010-5.2',
 geryon:'M2.5 12s3.6-6 9.5-6 9.5 6 9.5 6-3.6 6-9.5 6-9.5-6-9.5-6zM5 5l14 14',
 rumi:'M12 20.5S4.5 15.6 4.5 10.2A3.8 3.8 0 0112 8a3.8 3.8 0 017.5 2.2c0 5.4-7.5 10.3-7.5 10.3z',
 charon:'M4 17h16M6.4 17V9.6M17.6 17V9.6M4 9.6h16L12 4.6z',
 elijah:'M13 2.5L5.5 13.5H11L10 21.5l7.5-11H12z',
 phleg:'M12 3v8M12 15v6M6 9l-2.6-2.6M18 9l2.6-2.6M4 13.5h3.4M16.6 13.5H20',
 krishna:'M3 10c3-4 6 4 9 0s6-4 9 0M3 16c3-4 6 4 9 0s6-4 9 0',
 kaliya:'M3 11c2.4-3.4 4.8 3.4 7.2 0 1.3-1.8 3-2.8 5-2.8a3.6 3.6 0 010 7.2 2.2 2.2 0 010-4.4 1 1 0 010 2M3 19h18',
 rama:'M12 21V9.5M12 9.5L5 4M12 9.5L19 4M12 9.5V3M6.5 14.5h11',
 ravana:'M5 3.6a2.4 2.4 0 110 4.8 2.4 2.4 0 010-4.8M12 2.6a2.4 2.4 0 110 4.8 2.4 2.4 0 010-4.8M19 3.6a2.4 2.4 0 110 4.8 2.4 2.4 0 010-4.8M6.6 8L12 13.5M12 7.4v6.1M17.4 8L12 13.5M12 13.5v7M8 20.5h8',
 lao:'M3 8.5h18M3 14.5c3-3.2 6 3.2 9 0s6-3.2 9 0M3 19h18',
 shuhu:'M12 8.5a6 6 0 110 12 6 6 0 010-12M8.8 3v8.4M15.2 3v8.4M7 3h3.6M13.4 3h3.6',
 akh:'M12 3.5a3.5 3.5 0 110 7 3.5 3.5 0 010-7M9 11.5l-2.6 5.4M12 12v6.2M15 11.5l2.6 5.4M5.4 18.4h2M11 19.6h2M16.6 18.4h2',
 apep:'M6 12a6 6 0 1112 0 6 6 0 01-12 0M3 7.5c4 0 4 9 9 9s5-9 9-9',
 soc:'M4 11h16M4 11a8 8 0 0016 0',
 thras:'M4 10v4h4l7 4V6L8 10zM18 9c1.5 1 1.5 5 0 6',
 law:'M12 21V4 M8 8l4-4 4 4 M6 14h12',
 lock:'M7 11V8a5 5 0 0110 0v3M5 11h14v9H5z'
};
function icon(p,cls){return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" aria-hidden="true"><path d="'+p+'"/></svg>';}
function ring(p,col,num,o){
 o=o||{}; var cls='rg'+(o.big?' big':''), S=o.big?72:48, r=S/2-4, C=2*Math.PI*r;
 var has=(num!==null&&num!==undefined);
 var arc=has?Math.max(0,Math.min(100,+num))/100*C:0;
 var svg='<svg class="ring" viewBox="0 0 '+S+' '+S+'" aria-hidden="true">';
 if(o.dash)svg+='<circle cx="'+S/2+'" cy="'+S/2+'" r="'+r+'" stroke="'+col+'" stroke-opacity=".75" stroke-width="2" stroke-dasharray="2.4 3.6"/>';
 else{svg+='<circle cx="'+S/2+'" cy="'+S/2+'" r="'+r+'" stroke="rgba(255,255,255,.12)" stroke-width="2.4"/>';
  if(arc)svg+='<circle cx="'+S/2+'" cy="'+S/2+'" r="'+r+'" stroke="'+col+'" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="'+arc.toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 '+S/2+' '+S/2+')"/>';}
 svg+='</svg>';
 return '<span class="'+cls+'" style="--c:'+col+'">'+svg+icon(p)+(has?'<span class="n">'+num+'</span>':'')+'</span>';}

/* ---------- the roster. k is the pole key: identity, persisted, never renamed. Order here is display only. ---------- */
var T=[
 {k:'IL',nm:'Jesus',q:'Light',seat:'Heart',ic:IC.jesus,op:'Lucifer',oic:IC.lucifer},
 {k:'RE',nm:'Jesus',q:'Revelation',seat:'Crown',ic:IC.jesus,op:'The Furies',oic:IC.furies},
 {k:'DE',nm:'Ramakrishna',q:'Desire and will',seat:'Sacral',ic:IC.ramak,op:'Asmodeus',oic:IC.asmo},
 {k:'OR',nm:'Moses',q:'Order',seat:'Throat',ic:IC.moses,op:'Set',oic:IC.set},
 {k:'PO',nm:'Musashi',q:'Power',seat:'Solar',ic:IC.musashi,op:'Moloch',oic:IC.moloch},
 {k:'PE',nm:'Buddha',q:'Perception',seat:'3rd Eye',ic:IC.buddha,op:'Geryon',oic:IC.geryon},
 {k:'TR',nm:'Rumi',q:'Trust',seat:'Heart',ic:IC.rumi,op:'Charon',oic:IC.charon},
 {k:'CH',nm:'Elijah',q:'Charge',seat:'Root',ic:IC.elijah,op:'Phlegyas',oic:IC.phleg},
 {k:'FL',nm:'Krishna',q:'Flow',seat:null,ic:IC.krishna,op:'Kaliya',oic:IC.kaliya},
 {k:'AL',nm:'Rama',q:'Alignment',seat:null,ic:IC.rama,op:'Ravana',oic:IC.ravana},

   ?'The '+t.seat+' seat carries <b>'+seat.hot+' of '+seat.tot+'</b> addresses and its integrity reads <b>'+seat.ig.toFixed(1)+'</b>. That puts you at <b>'+pos+'</b> on this axis.'
   :'This teacher stands at no one seat, so there is no position on an axis. What is read is how much of '+t.op+' is carrying: <b>'+carry+' of '+marks.length+'</b> addresses.')+'</p>';

 h+='<div class="sect" style="--c:'+col+'"><div class="hd">Who this is</div><p>'+d.who+'</p><p>'+d.who2+'</p><p class="src">'+d.src+' A behaviour a person runs. Nobody here is a person to become.</p></div>';

 h+='<div class="sect"><div class="hd">The opposite</div><div class="opp">'
  +ring(t.oic,'#D4736D',null,{dash:true})
  +'<div><b>'+t.op+(t.oprop?'<em class="pill">proposed</em>':'')+'</b><p style="margin:0">'+d.opd+'</p><p class="q2" style="margin-top:10px;--c:#D4736D">'+d.ask+'</p></div></div></div>';

 var lo=laws.reduce(function(a,x){return x[1]<a?x[1]:a;},99), many=laws.length>1;
 h+='<div class="sect" style="--c:'+col+'"><div class="hd">How the behaviour operates</div><div class="cols">'
  +'<div class="col up"><h3>'+icon(t.ic,'')+' Runs clean</h3><ul>'+d.up.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>'
  +'<div class="col dn"><h3>'+icon(t.oic,'')+' Runs as '+t.op+'</h3><ul>'+d.dn.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div></div>'
  +'<p style="margin-top:12px;color:var(--mid)">'+d.how+'</p>'
  +(laws.length?'<div class="laws">'+laws.map(function(l){
     var thin=many&&l[1]===lo&&laws.filter(function(x){return x[1]===lo;}).length===1;
     return '<span class="law'+(thin?' thin':'')+'">'+icon(IC.law,'')+'<b>'+l[0]+'</b> '+l[1].toFixed(1)+'</span>';}).join('')+'</div>':'<p class="note">No law is named for this teacher. Flow is read from how much is held at the seats.</p>')
  +'</div>';

 h+='<div class="sect" style="--c:'+col+'"><div class="hd">Where '+t.op+' shows up in your reading</div>'
  +'<p style="margin:0 0 4px;color:var(--mid)">'+marks.length+' addresses, chosen from what the codex says '+t.op+' does. An address counts as carrying at 4.</p>'
  +'<div class="adr">'+marks.slice().sort(function(a,b){return b[1]-a[1];}).map(function(m){
    return '<div class="a'+(m[1]>=4?' hot':'')+'"><span>'+m[0]+'</span><span class="t"><i style="width:'+(m[1]*10)+'%"></i></span><span class="v">'+m[1].toFixed(1)+'</span></div>';}).join('')+'</div>'
  +'<p class="note"><b style="color:var(--ink)">'+carry+' of '+marks.length+'</b> are carrying.'+(carry===0?' Nothing here is pushing against this teacher right now.':'')+'</p>'
  +'<div class="lock">'+icon(IC.lock,'')+'<span>Which saboteurs are running on these addresses opens at tier one. The addresses above are open on every plan.</span></div></div>';

 h+='<div class="sect" style="--c:'+col+'"><div class="hd">Protocols from your library</div>'
  +'<p style="margin:0 0 12px;color:var(--mid)">Matched on what is stored: the steps written for this teacher, the seat they are kept at, and the addresses that are carrying. The reason sits under each one.</p>'
  +'<div class="lanes">';
 var C=charges(marks);
 h+='<div class="lane"><h3>Release what '+t.op+' is running</h3>';
 if(C.top){
  var gr=C.g[C.top], n=gr.a.length;
  h+='<div class="tag">'+C.top+' protocol, '+R.addr[C.top]+'</div>'
   +'<div class="step"><div><b>'+listAnd(gr.a)+'</b><p>'+(n===1?'The address':'The '+n+' addresses')+' of '+t.op+'’s '+marks.length+' that '+(n===1?'is':'are')+' carrying on the '+C.top+' charge, which is the charge this card is written for.</p></div><small>4 channels each</small></div>'
   +'<div class="why"><span class="y">'+(n===1?'Carrying':'All carrying')+'</span><span class="y">Charge matches the card</span><span>New ground</span></div>'
   +(C.rest?'<p class="note">'+C.rest+' more carrying address'+(C.rest===1?' sits':'es sit')+' on another charge and waits for that charge’s own protocol.</p>':'')
   +'<p class="cost">Costs <b>'+(n*4)+' patterns of the '+GIFT+' you have left</b>. Anything you have already opened reruns for nothing.</p>'
   +'<div class="acts"><button class="btn pri">Run the protocol</button></div>';}
 else{
  h+='<div class="tag">Nothing carrying, so nothing offered</div>'
   +'<div class="empty"><b>Nothing to release here.</b> No address at '+t.op+'’s '+marks.length+' is carrying, so a run would be a ritual and not a protocol. It opens when one is.</div>'
   +'<div class="shelf">Ground you have opened: <b style="color:var(--ink)">none yet</b>. A rerun needs something open.</div>';}
 h+='</div>';
 var steps=(NEWSTEPS[t.k]||(RD.steps[t.k]||[]).map(function(s){return [s[0],s[1],s[2],s[4]];}));
 var prop=!!NEWSTEPS[t.k];
 h+='<div class="lane"><h3>Practise toward '+t.nm+'</h3><div class="tag">A ritual toward '+t.q.toLowerCase()+'.'+(t.seat?' Kept at the '+t.seat+' seat.':' Kept at the seat holding the most today.')+'</div>';
 steps.forEach(function(s,i){
  h+='<div class="step"><div><b>'+s[0]+(prop&&s[3]?'<em class="pill">draft</em>':'')+'</b><p>'+s[2]+'</p></div><small>'+s[1]+' min</small></div>';});
 h+='<div class="why">'+steps.map(function(s,i){return '<span class="y">'+(s[3]?'Written for '+t.nm:'Step '+(i+1)+' of '+t.nm+'’s ritual')+'</span>';}).join('')+'</div>'
  +'<p class="cost">At your charge every step is open. Free, and nothing is spent from the '+GIFT+'.</p>'
  +'<div class="acts"><button class="btn pri">Start for a week</button><button class="btn">Start for two weeks</button></div>'
  +'<div class="shelf">Your saved rituals: <b style="color:var(--ink)">none yet</b>. Starting this one saves it there.</div></div>';
 h+='</div></div>';

 h+='<div class="foot">These are behaviours a reading can place, not people. A reading shows where charge sits and does not say why. A protocol here supports the work and does not cause a change, and nothing on this page diagnoses or treats anything.</div>';
 return h;}

function draw(){
 document.getElementById('list').innerHTML=listHtml();
 document.getElementById('strip').innerHTML=stripHtml();
 document.getElementById('dos').innerHTML=dossier(BYK[CUR]);
 document.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){CUR=b.getAttribute('data-k');draw();};});}
draw();

</script>
</body></html>
