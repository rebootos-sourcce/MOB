<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal and avatar mockups</title>
<style>
@font-face{font-family:Onest;src:url(data:font/woff2;base64,__FONT__) format('woff2');font-weight:300 700;font-display:swap}
/* TOKENS. Primitive then semantic. Values are the shipped Dark tokens from
   atuned_src/shell/head.html, not the older hex list in the brief. */
:root{
 --bg:#0C0D12;--panel:#1A1D26;--panel-2:#252833;--sunk:#090A0E;
 --edge:rgba(255,255,255,.09);--edge-2:rgba(255,255,255,.14);
 --ink:#EFEDE8;--mid:#B4B0A8;--dim:#94908A;
 --root:#D6524C;--sacral:#D8924E;--solar:#DABF6A;--heart:#5FD5A6;--throat:#5EBBDB;--eye:#7D93E0;--crown:#A77EDB;
 --alarm:#FF2E1F;--accent:#7EB8D4;--on-accent:#0B1418;
 --discover:#D398C6;--play:#9FC56E;--flow:#52AA9C;--embody:#B87A68;
 --unlit:rgba(239,237,232,.42);
 --r1:4px;--r2:10px;--r3:16px;--rp:999px;
 --tap:44px;
 --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- mock chrome, outside the app ---------- */
.mock{position:sticky;top:0;z-index:20;background:rgba(12,13,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--edge);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.mock .t{font-size:13px;color:var(--mid);margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--edge-2);border-radius:var(--rp);padding:3px;gap:2px}
.seg button{min-height:38px;padding:0 14px;border:0;background:transparent;border-radius:var(--rp);font-size:13px;font-weight:500;color:var(--mid)}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--ink)}
.stage{padding:20px 0 60px;display:flex;justify-content:center}
.frame{container-type:inline-size;container-name:app;background:var(--bg);width:min(100%,1600px);border:1px solid var(--edge);border-radius:var(--r3);overflow:hidden}
.frame[data-w="390"]{width:min(100%,390px)}
body.shot .mock{display:none}body.shot .stage{padding:0}body.shot .frame{border:0;border-radius:0}

/* ---------- app chrome ---------- */
.top{display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.wm{font-size:20px;font-weight:500;letter-spacing:-.01em;color:var(--accent)}
.wm i{font-style:normal;position:relative}
.secs{display:flex;gap:4px;align-items:center}
.sec{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 12px;background:transparent;border:0;border-radius:var(--r2);color:var(--mid);font-size:13px;font-weight:500}
.sec .ic{color:var(--c)}
.sec[aria-current=true]{color:var(--ink);background:var(--panel)}
.subs{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.sub{min-height:var(--tap);padding:0 12px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mid);font-size:13px;font-weight:500;white-space:nowrap}
.sub[aria-current=true]{color:var(--accent);border-bottom-color:var(--accent)}
.top .ring-mini{width:44px;height:44px}
.top .tail{margin-left:auto;color:var(--dim);font-size:13px}
@container app (max-width:820px){
 .top{padding:10px 16px;gap:8px 12px}
 .top .ring-mini,.top .tail{display:none}
 .secs{order:3;width:100%;justify-content:space-between}
 .sec{min-width:var(--tap);flex-direction:column;gap:2px;padding:4px 6px;font-size:11px;min-height:var(--tap)}
 .subs{order:4;width:100%;margin:0}
}

/* ---------- shared parts ---------- */
.page{padding:24px}
@container app (max-width:820px){.page{padding:16px}}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r3);padding:16px 18px}
.sh{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sh .ic{margin-top:1px;color:var(--c,var(--accent))}
.sh b{font-size:16px;font-weight:600;display:block}
.sh span.m{display:block;font-size:13px;color:var(--mid);line-height:1.45;margin-top:1px}
.eb{font-size:13px;color:var(--dim);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:var(--tap);padding:0 14px;border:1px solid var(--edge-2);border-radius:var(--rp);display:inline-flex;align-items:center;gap:8px;background:transparent;font-size:13px;font-weight:500;color:var(--ink)}
.chip[aria-pressed=true]{border-color:var(--accent);background:rgba(126,184,212,.12)}
.chip[aria-pressed=true] .ic{color:var(--accent)}
.btn{min-height:var(--tap);padding:0 20px;border-radius:var(--rp);border:1px solid var(--edge-2);background:transparent;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
.seatdot{display:inline-flex;align-items:center;gap:6px}
.sr{width:12px;height:12px;border-radius:50%;border:1.6px solid var(--c);flex:0 0 auto;display:inline-block}
.sr.dash{border-style:dashed;border-color:var(--unlit)}
.hr{height:1px;background:var(--edge);margin:14px 0;border:0}
.note{font-size:13px;color:var(--mid);line-height:1.5}
.note b{color:var(--ink);font-weight:600}
.quiet{color:var(--dim);font-size:13px}

/* ================= JOURNAL ================= */
.jgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@container app (max-width:820px){.jgrid{grid-template-columns:minmax(0,1fr);gap:16px}}
.jleft,.jright{display:flex;flex-direction:column;gap:14px;min-width:0}
.q{font-size:28px;font-weight:600;letter-spacing:-.015em;margin:0;line-height:1.15}
.qs{font-size:16px;color:var(--mid);margin:6px 0 4px;max-width:52ch}
@container app (max-width:820px){.q{font-size:28px}}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@container app (max-width:1250px){.pair{grid-template-columns:minmax(0,1fr)}}
.where-body{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.pair .card{display:flex;flex-direction:column}
.where-body svg{width:96px;height:auto;display:block}
.zone{cursor:pointer}
.zone rect{fill:transparent;stroke:var(--unlit);stroke-width:1.2px;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;transition:all .2s var(--ease)}
.zone.on rect{stroke:var(--accent);stroke-dasharray:none;stroke-width:1.8px;fill:rgba(126,184,212,.1)}
.jr{padding:0;position:relative;overflow:hidden}
.jr::before{content:"";display:block;height:2px;background:var(--lead,var(--edge-2));transition:background .3s}
.jr .in{padding:16px 18px 18px}
.jr-text{font-size:20px;line-height:1.6;max-width:62ch;padding:4px 0 24px 0;min-height:168px;color:var(--ink);font-weight:400}
.jr-text .caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:-.15em;margin-left:1px;animation:blink 1.1s steps(2) infinite}
.jr-text.ph{color:var(--dim)}
@keyframes blink{50%{opacity:0}}
.mk{border-bottom:2px solid var(--c);padding-bottom:1px}
.mk.coh{border-bottom:2px dashed var(--mid)}
.jr-foot{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;margin-top:6px}
.jr-foot .priv{margin:10px 0 0}
.rec{flex:0 0 56px;width:56px;height:56px;border-radius:50%;border:1.6px solid var(--edge-2);background:var(--panel-2);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.rec .ic{width:24px;height:24px}
.jr-key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}
.jr-key span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mid)}
.jr-key i{display:inline-block;width:18px;height:0;border-top:2px solid var(--c)}
.jr-key i.d{border-top-style:dashed;border-color:var(--mid)}
.priv{font-size:13px;color:var(--mid);margin:10px 0 0;max-width:62ch}
.mirror{border-color:var(--edge-2);background:var(--panel)}
.mirror .say{font-size:20px;line-height:1.5;margin:6px 0 14px;max-width:46ch;font-weight:400}
.quote{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 14px}
.quote span{display:inline-flex;align-items:center;gap:8px;font-size:16px}
.quote em{font-style:normal;font-size:13px;color:var(--mid)}
.quote .sr{width:14px;height:14px}
.fb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb-out{font-size:13px;color:var(--mid);margin-top:10px}
details.land{margin-top:12px;border-top:1px solid var(--edge);padding-top:10px}
details.land summary{min-height:var(--tap);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mid);cursor:pointer;list-style:none}
details.land summary::-webkit-details-marker{display:none}
details.land[open] .chev{transform:rotate(90deg)}
.chev{transition:transform .2s}
.landrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;font-size:13px;color:var(--mid)}
.landrow b{color:var(--ink);font-weight:500;min-width:96px;display:inline-flex;align-items:center;gap:8px}
.cta{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
/* where it goes */
.chain{position:relative;display:flex;flex-direction:column;gap:0}
.hop{display:grid;grid-template-columns:32px 1fr;gap:12px;position:relative;padding-bottom:16px}
.hop:last-child{padding-bottom:0}
.hop::before{content:"";position:absolute;left:15.5px;top:32px;bottom:0;border-left:1.6px solid var(--edge-2)}
.hop:last-child::before{display:none}
.hop.maybe::before{border-left-style:dashed}
.knot{width:32px;height:32px;border-radius:50%;border:1.6px solid var(--c);display:flex;align-items:center;justify-content:center;color:var(--c);background:var(--panel)}
.maybe .knot,.ghost .knot{border-style:dashed;border-color:var(--unlit);color:var(--mid)}
.hop h3{font-size:16px;font-weight:600;margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hop h3 small{font-size:13px;color:var(--dim);font-weight:500}
.hop p{margin:2px 0 0;font-size:13px;color:var(--mid);line-height:1.5}
.hop .val{margin-top:6px;font-size:16px;color:var(--ink);display:flex;flex-wrap:wrap;gap:6px 14px}
.hop .val span{display:inline-flex;align-items:center;gap:8px}
.hop .val .sr{width:12px;height:12px}
.hop .val .blk{display:block}.hop .val .blk em{display:block}
.hop .val em{font-style:normal;color:var(--mid);font-size:13px}
s.hedge{color:var(--dim);text-decoration-thickness:1.5px}
ins.hedge{text-decoration:none;color:var(--accent);font-weight:500}
.ent{padding:14px 0;border-top:1px solid var(--edge)}
.ent:first-of-type{border-top:0;padding-top:0}
.ent .d{font-size:13px;color:var(--dim);display:flex;gap:8px;align-items:center}
.ent .l{font-size:16px;margin:4px 0 10px;max-width:56ch}
.dest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@container app (max-width:1100px){.dest{grid-template-columns:minmax(0,1fr)}}
.dst{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:10px 12px;border:1px solid var(--edge);border-radius:var(--r2);background:var(--panel-2)}
.dst .ic{color:var(--c);margin-top:1px}
.dst b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.dst span{display:block;font-size:13px;color:var(--mid);line-height:1.4}
.dst.none{background:transparent;border-style:dashed}
.dst.none .ic{color:var(--dim)}
.dst.none b{color:var(--dim);font-weight:500}
.new{border-color:rgba(126,184,212,.5)}
.toast{font-size:13px;color:var(--accent);display:flex;gap:8px;align-items:center;min-height:24px}

/* ================= AVATAR ================= */
.agrid{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:24px;align-items:start}
.agrid>*{min-width:0}
@container app (max-width:1180px){.agrid{grid-template-columns:260px minmax(0,1fr) 280px;gap:16px}}
@container app (max-width:820px){.agrid{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "moved" "becoming";gap:16px}.agrid .hero{grid-area:hero}.agrid .moved{grid-area:moved}.agrid .becoming{grid-area:becoming}}
.hero{display:flex;flex-direction:column;align-items:center}
.herosvg{width:100%;max-width:760px;height:auto;display:block}
.hero .ttl{text-align:center;margin:0 0 4px}
.hero .ttl h1{font-size:28px;font-weight:600;letter-spacing:-.015em;margin:0;line-height:1.15}
.hero .ttl p{margin:4px auto 0;color:var(--mid);font-size:16px;max-width:44ch}
.lgd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;margin-top:6px}
@container app (max-width:820px){.lgd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.lgi{padding:10px 12px;border:1px solid var(--edge);border-radius:var(--r2);background:var(--panel);display:grid;grid-template-columns:20px 1fr;gap:4px 8px}
.lgi .ic{color:var(--c)}
.lgi b{font-size:13px;font-weight:600;color:var(--ink)}
.lgi span{grid-column:2;font-size:13px;color:var(--mid);line-height:1.4}
.lgi.off{border-style:dashed;background:transparent}
.lgi.off .ic{color:var(--dim)}
.keyline{font-size:13px;color:var(--mid);text-align:center;max-width:70ch;margin:12px auto 0}
.keyline b{color:var(--ink);font-weight:500}
.svg-lbl{font-family:Onest,system-ui,sans-serif}
@container app (max-width:820px){.svg-lbl{display:none}}
.seatlist{display:none}
@container app (max-width:820px){.seatlist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 12px;width:100%;margin-top:10px}.seatlist div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mid)}.seatlist div b{color:var(--ink);font-weight:500}}
.moved h2,.becoming h2,.sec-h{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.mv{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--edge)}
.mv:first-of-type{border-top:0}
.mv .ic{color:var(--c);margin-top:2px}
.mv p{margin:0;font-size:16px;line-height:1.45}
.mv small{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.mv .u{font-size:13px;color:var(--mid);display:block;margin-top:2px}
.becoming{display:flex;flex-direction:column;gap:12px}
.bec{padding:14px 16px}
.bec .t{font-size:20px;line-height:1.4;margin:6px 0 0;font-weight:400}
.bec .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sewn{margin-top:28px}
.sewn .sec-h{margin-bottom:4px}
.thread{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
.thread::before{content:"";position:absolute;top:22px;left:10%;right:10%;border-top:1.6px solid var(--edge-2)}
.node{position:relative;display:flex;flex-direction:column;gap:8px}
.node .kn{width:44px;height:44px;border-radius:50%;border:1.6px solid var(--c);display:flex;align-items:center;justify-content:center;color:var(--c);background:var(--bg);margin:0 auto}
.node .cd{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r2);padding:12px;flex:1}
.node .cd b{display:block;font-size:16px;font-weight:600}
.node .cd .m{font-size:13px;color:var(--dim);margin:2px 0 8px}
.node .cd p{margin:0;font-size:13px;color:var(--mid);line-height:1.45}
.node .cd p strong{color:var(--ink);font-weight:500}
.retarc{width:100%;height:36px;display:block;margin-top:-2px}
.retline{font-size:13px;color:var(--mid);text-align:center;margin-top:2px}
@container app (max-width:820px){
 .thread{grid-template-columns:minmax(0,1fr);gap:0}
 .thread::before{top:22px;bottom:22px;left:21.5px;right:auto;border-top:0;border-left:1.6px solid var(--edge-2)}
 .node{display:grid;grid-template-columns:44px 1fr;gap:12px;padding-bottom:12px}
 .node .kn{margin:0}
 .retarc{display:none}
}
.states{margin-top:28px}
.stwrap{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:12px;align-items:stretch;margin-top:12px}
.stcard{padding:14px 16px;display:grid;grid-template-columns:120px 1fr;gap:16px}
.stcard.later{border-color:rgba(126,184,212,.4)}
.stcard svg{width:120px;height:auto;display:block}
.stcard h3{font-size:16px;font-weight:600;margin:0}
.stcard .dt{font-size:13px;color:var(--dim)}
.stcard ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.stcard li{font-size:13px;color:var(--mid);line-height:1.45;display:grid;grid-template-columns:16px 1fr;gap:8px}
.stcard li .ic{color:var(--c);margin-top:1px}
.stcard li b{color:var(--ink);font-weight:500}
.arrowc{display:flex;align-items:center;justify-content:center;color:var(--mid)}
@container app (max-width:1180px){.stcard{grid-template-columns:100px 1fr}.stcard svg{width:100px}}
@container app (max-width:820px){
 .stwrap{grid-template-columns:minmax(0,1fr)}
 .arrowc{display:none}
 .stcard{grid-template-columns:96px 1fr;gap:12px}.stcard svg{width:96px}
}
.cause{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@container app (max-width:820px){.cause{grid-template-columns:minmax(0,1fr)}}
.cause .card{padding:14px 16px}
.cause h4{margin:0 0 6px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.cause h4 .ic{color:var(--c)}
.cause div.r{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:13px;color:var(--mid);padding:5px 0;line-height:1.45}
.cause div.r time{color:var(--dim)}
.cause div.r b{color:var(--ink);font-weight:500}
.masks{margin-top:28px}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:12px}
@container app (max-width:1180px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container app (max-width:820px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mk2{border:1px dashed var(--edge-2);border-radius:var(--r2);padding:12px;display:flex;flex-direction:column;gap:6px;background:transparent}
.mk2 .h{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.mk2 .h .ic{color:var(--mid)}
.mk2 p{margin:0;font-size:13px;color:var(--mid);line-height:1.45}
.mk2 .pl{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim);margin-top:auto}
.seal{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding:12px 16px;border:1.6px dashed var(--edge-2);border-radius:var(--r2)}
.seal .ic{color:var(--mid)}
.seal p{margin:0;font-size:13px;color:var(--mid);flex:1;min-width:200px}
.seal p b{color:var(--ink);font-weight:600}
.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
@container app (max-width:820px){.doors{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.door{padding:12px;border:1px solid var(--edge);background:var(--panel);border-radius:var(--r2);display:grid;grid-template-columns:20px 1fr;gap:4px 10px;text-align:left;min-height:var(--tap)}
.door .ic{color:var(--c)}.door b{font-size:13px;font-weight:600}.door span{grid-column:2;font-size:13px;color:var(--mid);line-height:1.4}
.unread-hero{text-align:center;margin:8px auto 0;max-width:46ch}
.unread-hero h1{font-size:28px;margin:0 0 8px;line-height:1.2;font-weight:600;letter-spacing:-.015em}
.unread-hero p{margin:0 0 14px;color:var(--mid)}
/* motion: one verb, breathe, 4.2 s. Pulse marks the newest dated act. */
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
.fig .glow{animation:breathe 4.2s ease-in-out infinite}

<script>
(function(){
"use strict";

var SEATS=[{k:'crown',n:'Crown',y:4.98},{k:'eye',n:'Third eye',y:10.57},{k:'throat',n:'Throat',y:20.91},{k:'heart',n:'Heart',y:30.51},{k:'solar',n:'Solar plexus',y:40.21},{k:'sacral',n:'Sacral',y:47.02},{k:'root',n:'Root',y:53.55}];

var BODY='M45.8 15.5 L45.6 19.6 C41 20.6 36 21.8 33.5 24.2 C31.8 26 31 30 30.2 36 L28.8 46 L27.4 55 L29.8 55.6 L31.8 46.5 L33.8 38 C34.8 34.5 35.5 33 36 32.2 L36 47 C36 50 36.8 53 37.4 56 L38.4 77 L38 98 L37.4 99.6 L44.8 99.6 L45 98 L47.2 78 L48.6 62 L49.2 57.6 L50.8 57.6 L51.4 62 L52.8 78 L55 98 L55.2 99.6 L62.6 99.6 L62 98 L61.6 77 L62.6 56 C63.2 53 64 50 64 47 L64 32.2 C64.5 33 65.2 34.5 66.2 38 L68.2 46.5 L70.2 55.6 L72.6 55 L71.2 46 L69.8 36 C69 30 68.2 26 66.5 24.2 C64 21.8 59 20.6 54.4 19.6 L54.2 15.5';
function figG(o){
 var id=o.id||'f', lit=o.lit||[], opa=o.pencil?.38:(o.early?.55:.85);
 var g='<g class="fig">';
 g+='<defs><radialGradient id="'+id+'fl"><stop offset="0" stop-color="#D8924E" stop-opacity=".16"/><stop offset="1" stop-color="#D8924E" stop-opacity="0"/></radialGradient>';
 SEATS.forEach(function(s){g+='<radialGradient id="'+id+s.k+'"><stop offset="0" stop-color="var(--'+s.k+')" stop-opacity=".75"/><stop offset="1" stop-color="var(--'+s.k+')" stop-opacity="0"/></radialGradient>';});
 g+='</defs>';
 g+='<ellipse cx="50" cy="100" rx="24" ry="2.6" fill="url(#'+id+'fl)"/>';
 g+='<ellipse cx="50" cy="8.5" rx="6.4" ry="7.6" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-opacity="'+opa+'"'+(o.pencil?' stroke-dasharray="3 4"':'')+'/>';
 g+='<path d="'+BODY+'" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-opacity="'+opa+'" stroke-linejoin="round" stroke-linecap="round"'+(o.pencil?' stroke-dasharray="3 4"':'')+'/>';
 /* the thread: a segment is solid only where both seats it joins are lit */
 if(o.thread!==false){
  var pts=SEATS.slice().reverse(),i,d,a,b,x1,x2,on;
  for(i=0;i<pts.length-1;i++){
   a=pts[i];b=pts[i+1];x1=50+(i%2?-3.4:3.4);x2=50+((i+1)%2?-3.4:3.4);
   on=lit.indexOf(a.k)>=0&&lit.indexOf(b.k)>=0;
   d='M'+x1+' '+a.y+' C'+(x1+(i%2?-4:4))+' '+(a.y-2.3)+' '+(x2+(i%2?-4:4))+' '+(b.y+2.3)+' '+x2+' '+b.y;
   g+='<path d="'+d+'" fill="none" stroke="'+(on?'var(--ink)':'var(--unlit)')+'" stroke-width="'+(on?1.6:1)+'" stroke-opacity="'+(on?.75:.7)+'"'+(on?'':' stroke-dasharray="2 4"')+' stroke-linecap="round"/>';
  }
 }
 SEATS.forEach(function(s){
  var on=lit.indexOf(s.k)>=0,r=(s.k==='heart'?3:2.7);
  if(on){
   g+='<circle class="glow" cx="50" cy="'+s.y+'" r="11" fill="url(#'+id+s.k+')"/>';
   g+='<circle cx="50" cy="'+s.y+'" r="'+r+'" fill="var(--bg)" stroke="var(--'+s.k+')" stroke-width="1.8"/>';
   g+='<circle cx="50" cy="'+s.y+'" r="'+(r-1.5)+'" fill="none" stroke="var(--'+s.k+')" stroke-width="1.2" stroke-opacity=".8"/>';
   if(o.newest===s.k)g+='<circle class="pulse" cx="50" cy="'+s.y+'" r="'+r+'" fill="none" stroke="var(--'+s.k+')" stroke-width="1.4"/>';
  }else{
   g+='<circle cx="50" cy="'+s.y+'" r="'+r+'" fill="var(--bg)" stroke="var(--unlit)" stroke-width="1.2" stroke-dasharray="2 2.4"/>';
  }
 });
 return g+'</g>';

/* ---------------- the ring: four arcs, a return arrow. A quarter is lit by its newest dated act. ---------------- */
var LOOP=[{k:'discover',n:'Discover',ic:'eye'},{k:'play',n:'Play',ic:'play'},{k:'flow',n:'Flow',ic:'flow'},{k:'embody',n:'Embody',ic:'embody'}];
function pol(cx,cy,r,deg){var a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,r,a0,a1){var p=pol(cx,cy,r,a0),q=pol(cx,cy,r,a1);return 'M'+p[0].toFixed(1)+' '+p[1].toFixed(1)+' A'+r+' '+r+' 0 0 1 '+q[0].toFixed(1)+' '+q[1].toFixed(1);}
function ringG(o){
 var cx=o.cx,cy=o.cy,r=o.r,sw=o.sw,g='';
 LOOP.forEach(function(L,q){
  var a0=-90+q*90+7,a1=a0+76,on=o.lit&&o.lit[q];
  g+='<path d="'+arcPath(cx,cy,r,a0,a1)+'" fill="none" stroke="'+(on?'var(--'+L.k+')':'var(--unlit)')+'" stroke-width="'+(on?sw:sw*.55)+'" stroke-linecap="round"'+(on?'':' stroke-dasharray="'+(sw*1.4)+' '+(sw*2.6)+'"')+'/>';
  if(on&&o.newest===q){var m=pol(cx,cy,r,(a0+a1)/2);g+='<circle class="pulse" cx="'+m[0]+'" cy="'+m[1]+'" r="'+(sw*1.1)+'" fill="none" stroke="var(--'+L.k+')" stroke-width="1.5"/><circle cx="'+m[0]+'" cy="'+m[1]+'" r="'+(sw*.9)+'" fill="var(--bg)" stroke="var(--'+L.k+')" stroke-width="1.6"/>';}
 });
 var t=pol(cx,cy,r,-90),s=o.sw*1.5;
 g+='<path d="M'+(t[0]-s)+' '+(t[1]-s*.9)+' L'+(t[0]+s*.5)+' '+t[1]+' L'+(t[0]-s)+' '+(t[1]+s*.9)+'" fill="none" stroke="var(--mid)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
 return '<g class="fig">'+g+'</g>';
}
function ringMini(lit,newest){return '<svg class="ring-mini" viewBox="0 0 44 44" role="img" aria-label="The loop: discover, play, flow, embody, then back to discover">'+ringG({cx:22,cy:22,r:17,sw:3,lit:lit,newest:newest})+'</svg>';}

var FEELS=['Overwhelmed','Heavy','Angry','Ashamed','Afraid','Sad','Numb'];
var STORY_HTML='I told my team the launch was fine. It was not fine. I <span class="mk" style="--c:var(--throat)">stayed quiet</span> in the meeting while he took the credit, and my chest went <span class="mk" style="--c:var(--heart)">tight</span>. I am <span class="mk" style="--c:var(--solar)">furious</span> and I feel <span class="mk" style="--c:var(--solar)">ashamed</span> that I <span class="mk coh">let it go</span>. I work until the work is done and the work is never done. Rest feels like a moral failure.';

function stepFeel(){
 var h='<article class="card" id="s-feel"><div class="sh" style="--c:var(--accent)">'+ic('feel')+'<div><b>Feel</b><span class="m">Ring with a wave: the word closest to what is here right now. Pick one or two.</span></div></div><div class="chips" role="group" aria-label="Feeling">';

 var zs=[['head','Head',0,0,100,18],['upper','Upper torso',0,18,100,28],['lower','Lower torso',0,46,100,14]];
 var svg='<svg viewBox="20 -3 60 78" aria-label="Body, three parts">'+figG({id:'w',lit:[],thread:false,pencil:false,early:true});

 svg+='</svg>';
 var h='<article class="card" id="s-where"><div class="sh" style="--c:var(--accent)">'+ic('where')+'<div><b>Where</b><span class="m">Pin: where in the body you notice it. Tap a part.</span></div></div><div class="where-body">'+svg+'<div><div class="chips" role="group" aria-label="Where in the body">';

 h+='</div><p class="note" style="margin:10px 0 0">'+(z?'You said: <b>'+zs.filter(function(q){return q[0]===z})[0][1].toLowerCase()+'</b>. Say it again in your own words below if you want.':'Nothing picked yet. You can skip this and just write.')+'</p></div></div></article>';
 return h;
}
function stepStory(){
 var loaded=S.st==='loaded', lead=loaded?'var(--solar)':'var(--edge-2)';
 var txt=loaded?(S.committed?STORY_HTML:STORY_HTML+'<span class="caret"></span>'):'<span class="ph">What happened. In your own words.</span><span class="caret"></span>';
 var h='<article class="card jr" id="s-story" style="--lead:'+lead+'"><div class="in"><div class="sh" style="--c:var(--accent)">'+ic('story')+'<div><b>Story</b><span class="m">Page: what was happening. Your own words, as you would say it out loud.</span></div></div>';

 if(loaded)h+='<div class="jr-key"><span><i style="--c:var(--throat)"></i><i style="--c:var(--heart)"></i><i style="--c:var(--solar)"></i>Underline colour: the place in the body the word landed.</span><span><i class="d"></i>Dashed grey: a word that eases the pull.</span></div>';

}
function mirrorCard(){
 if(S.st!=='loaded')return '<article class="card mirror" style="border-style:dashed;background:transparent"><div class="sh" style="--c:var(--mid)">'+ic('eye')+'<div><b>Here is what I heard</b><span class="m">When you have written a few lines, I say back what I heard, in plain words. You tell me if it is right.</span></div></div></article>';
 var fb=S.mirror==='yes'?'Kept. These words now count as read.':S.mirror==='no'?'Thank you. Tell me what is off in your own words and I will read it again.':'';
 var h='<article class="card mirror"><div class="sh" style="--c:var(--accent)">'+ic('eye')+'<div><b>Here is what I heard</b><span class="m">Eye: what I read in your words. You decide if it is right.</span></div></div>';

 h+='<div class="fb"><button class="btn'+(S.mirror==='yes'?' pri':' ghost')+'" data-mir="yes">'+ic('check','sm')+'That is me</button><button class="btn" data-mir="no">'+ic('x','sm')+'Not quite</button></div>';
 if(fb)h+='<p class="fb-out">'+fb+'</p>';
 h+='<details class="land"><summary>'+ic('chev','sm chev')+'Show where it landed</summary>';
 h+='<div class="landrow"><b>'+sr('throat')+'Throat</b><span>Self-Silencing, People Pleasing, Speaking To Be Right, Interrupting</span></div>';
 h+='<div class="landrow"><b>'+sr('heart')+'Heart</b><span>Blame, Manipulative Kindness, Hatred, Resentment</span></div>';
 h+='<div class="landrow"><b>'+sr('solar')+'Solar plexus</b><span>Anger, Judgment, Entitlement, Rebellion</span></div></details></article>';

}
function whereGoes(){
 var loaded=S.st==='loaded';
 if(!loaded){
  var g='<article class="card"><div class="sh" style="--c:var(--accent)">'+ic('arrow')+'<div><b>Where your words go</b><span class="m">Everything you write is read, then it can become four things. Nothing is lost.</span></div></div><div class="chain ghost">';
  [['imprint','Imprints','Always','Your words are added to the patterns your body is still holding. An imprint is one of those patterns.','var(--mid)'],
   ['release','Release','Part of it','A pattern you want out becomes a story to release. It waits in your release queue.','var(--mid)'],
   ['ritual','Ritual','Part of it','A pattern becomes a short daily practice, built from your own words.','var(--mid)'],
   ['affirm','Statement','Sometimes','If you wrote something absolute about yourself, you get it back as a statement to test.','var(--mid)']].forEach(function(r,i){
    g+='<div class="hop'+(i===3?' maybe':'')+'" style="--c:'+r[4]+'"><div class="knot">'+ic(r[0])+'</div><div><h3>'+r[1]+' <small>'+r[2]+'</small></h3><p>'+r[3]+'</p></div></div>';});
  return g+'</div></article>';
 }
 var done=S.committed, tag=done?'Done':'On commit';
 var h='<article class="card'+(done?' new':'')+'"><div class="sh" style="--c:var(--accent)">'+ic('arrow')+'<div><b>'+(done?'Where this entry went':'Where this entry will go')+'</b><span class="m">Arrow: the road from your words to your body, your release queue and your ritual.</span></div></div>';
 h+='<div class="chain">';
 h+='<div class="hop" style="--c:var(--accent)"><div class="knot">'+ic('imprint')+'</div><div><h3>Imprints <small>Always. '+tag+'.</small></h3><p>Ring in a ring: patterns your body is still holding. Your words are added to them.</p><div class="val"><span>'+sr('throat')+'Throat</span><span>'+sr('heart')+'Heart</span><span>'+sr('solar')+'Solar plexus</span><em>Self-Silencing, Anger and 10 more</em></div></div></div>';
 h+='<div class="hop" style="--c:var(--accent)"><div class="knot">'+ic('release')+'</div><div><h3>Release <small>Part of it. '+tag+'.</small></h3><p>Open ring with an arrow out: a pattern you can let go of. It waits in your release queue.</p><div class="val"><span class="blk"><span class="seatdot">'+sr('throat')+'Self-Silencing</span><em>Queued first. It sits in your throat.</em></span></div></div></div>';
 h+='<div class="hop" style="--c:var(--accent)"><div class="knot">'+ic('ritual')+'</div><div><h3>Ritual <small>Part of it. '+tag+'.</small></h3><p>Two arrows in a loop: a daily practice built from your own words.</p><div class="val"><span class="blk">Somatic truth check, 2 minutes<em>Hold “stayed quiet” against the body.</em></span></div></div></div>';
 h+='<div class="hop maybe"><div class="knot">'+ic('affirm')+'</div><div><h3>Statement <small>Sometimes. Not this time.</small></h3><p>Speech ring: a sentence to test, only when you write something absolute about yourself. Nothing here said never or always, so nothing was made.</p></div></div>';
 h+='</div><hr class="hr"><p class="note">I find, cut and mark your words. I do not write them.</p></article>';

}
function entries(){

/* ================= AVATAR ================= */
function hero(){
 var loaded=S.st==='loaded';
 var lit=loaded?['sacral','solar','throat']:[];
 var ringLit=loaded?[1,1,1,0]:[0,0,0,0];
 var CX=380,CY=336,R=268,SC=4.5,FX=CX-50*SC,FY=CY-225; /* figure: 100 units = 450 px */
 var svg='<svg class="herosvg" viewBox="0 0 760 656" role="img" aria-label="Your avatar inside the loop ring">';
 svg+=ringG({cx:CX,cy:CY,r:R,sw:7,lit:ringLit,newest:loaded?0:-1});
 svg+='<g transform="translate('+FX+' '+FY+') scale('+SC+')">'+figG({id:'h',lit:lit,newest:loaded?'throat':'',pencil:!loaded})+'</g>';
 /* ring labels, outside the arcs */
 var dates=loaded?['Wrote Fri 2 Oct','Released Thu 1 Oct','Kept ritual Thu 1 Oct','Read again: not yet']:['Not yet','Not yet','Not yet','Not yet'];
 var angs=[-45,45,135,225];
 LOOP.forEach(function(L,q){var p=pol(CX,CY,R+26,angs[q]),right=q<2,on=ringLit[q];
  svg+='<g class="svg-lbl" transform="translate('+p[0]+' '+p[1]+')" text-anchor="'+(right?'start':'end')+'"><text x="'+(right?4:-4)+'" y="-2" font-size="16" font-weight="600" fill="var(--'+(on?L.k:'dim')+')">'+L.n+'</text><text x="'+(right?4:-4)+'" y="16" font-size="13" fill="var(--mid)">'+dates[q]+'</text></g>';});
 /* seat labels, only when the figure is read */
 SEATS.forEach(function(s){var on=lit.indexOf(s.k)>=0,y=FY+s.y*SC,x=CX+LABELX[s.k]*0.9;
  svg+='<g class="svg-lbl"><line x1="'+(CX+18)+'" y1="'+y+'" x2="'+(x-6)+'" y2="'+y+'" stroke="var(--ink)" stroke-opacity="'+(on?.3:.14)+'" stroke-width="1"/><circle cx="'+(x+6)+'" cy="'+y+'" r="5.5" fill="none" stroke="'+(on?'var(--'+s.k+')':'var(--unlit)')+'" stroke-width="1.6"'+(on?'':' stroke-dasharray="2 2.4"')+'/><text x="'+(x+18)+'" y="'+(y+4.5)+'" font-size="13" fill="'+(on?'var(--ink)':'var(--dim)')+'">'+s.n+'</text></g>';});
 svg+='</svg>';
 var h='<section class="hero"><div class="ttl"><h1>'+(loaded?'Your avatar':'There is more running you than you can see.')+'</h1><p>'+(loaded?'The part of you the work has reached. Light means a release reached that place.':'Your avatar starts as an outline. It fills in as you write, release and keep a practice.')+'</p></div>'+svg;
 /* narrow screens: the legend does the labelling */
 h+='<div class="seatlist">';SEATS.forEach(function(s){h+='<div>'+sr(s.k,lit.indexOf(s.k)<0)+'<b>'+s.n+'</b>'+(lit.indexOf(s.k)>=0?'lit':'not yet')+'</div>';});h+='</div>';
 if(loaded){
  h+='<div class="lgd">';
  var L4=[['Discover','eye','Solid arc: you did it, with a date. Newest act has the glowing dot.','Wrote on Fri 2 Oct',1],['Play','play','','Released Self-Silencing on Thu 1 Oct',1],['Flow','flow','','Kept the Somatic truth check on Thu 1 Oct',1],['Embody','embody','','Dashed arc: not yet. Read yourself again after a release and it lights.',0]];
  L4.forEach(function(r,i){h+='<div class="lgi'+(r[4]?'':' off')+'" style="--c:var(--'+LOOP[i].k+')">'+ic(r[1])+'<b>'+r[0]+'</b><span>'+r[3]+'</span></div>';});
  h+='</div><p class="keyline"><b>Ring:</b> the loop. The arrow at the top means that after embody you start again at discover. <b>Figure rings:</b> a lit ring means a release reached that place. A dashed ring means it has not yet. <b>Thread:</b> solid where two lit places join, dashed where it stops.</p>';
 }else{
  h+='<div class="doors">';
  [['Discover','eye','Write one sentence.'],['Play','play','Release what it found.'],['Flow','flow','Keep a short daily practice.'],['Embody','embody','Read yourself again.']].forEach(function(r,i){h+='<button class="door" style="--c:var(--'+LOOP[i].k+')">'+ic(r[1])+'<b>'+r[0]+'</b><span>'+r[2]+'</span></button>';});
  h+='</div><p class="keyline">Dashed means not yet. Nothing here can go down. The avatar only adds.</p>';
 }
 return h+'</section>';
}

 var h='<section class="moved"><h2>Since your last visit</h2><p class="note" style="margin:0 0 6px">Wed 30 Sep, 18:10. Only things you did, with dates.</p>';

 return h+'</section>';
}

  ['ritual','Ritual','The practice that trains it','<strong>Somatic truth check</strong>, 2 minutes, today.','--flow'],

 var h='<section class="sewn"><h2 class="sec-h">The layers, sewn</h2><p class="note" style="margin:0">One thread runs through all five. Press any one to open it.</p><div class="thread">';
 N.forEach(function(n,i){h+='<div class="node" style="--c:var('+n[4]+')"><div class="kn">'+ic(n[0],'lg')+'</div><div class="cd"><b>'+n[1]+'</b><div class="m">'+n[2]+'</div><p>'+(l?n[3]:'<span class="quiet">Fills in as you write.</span>')+'</p></div></div>';});
 h+='</div><svg class="retarc" viewBox="0 0 1000 36" preserveAspectRatio="none" aria-hidden="true"><path d="M900 2 C900 34 100 34 100 2" fill="none" stroke="var(--edge-2)" stroke-width="1.6" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/><path d="M93 10 L100 1 L108 9" fill="none" stroke="var(--mid)" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
 h+='<p class="retline">Your story tells the avatar who to become. Then the loop runs again.</p></section>';

function states(){
 var h='<section class="states"><h2 class="sec-h">How the avatar improves</h2><p class="note" style="margin:0;max-width:70ch">Same person, two dates. The figure is built from things that happened, with dates. It only adds. A hard week does not dim it.</p><div class="stwrap">';
 h+='<article class="card stcard">'+figSvg({id:'e',lit:['solar'],newest:'',pencil:true,label:'Early figure, one place lit'})+'<div><h3>Early</h3><div class="dt">Sun 13 Sep</div><ul>';
 h+='<li style="--c:var(--solar)">'+sr('solar')+'<span><b>Solar plexus lit.</b> First release: Anger.</span></li>';
 h+='<li style="--c:var(--discover)">'+ic('eye','sm')+'<span>Ring: discover and play are lit.</span></li>';

 h+='<div class="arrowc">'+ic('arrow','lg')+'</div>';
 h+='<article class="card stcard later">'+figSvg({id:'l',lit:['sacral','solar','throat'],newest:'throat',label:'Later figure, three places lit'})+'<div><h3>Now</h3><div class="dt">Fri 2 Oct</div><ul>';
 h+='<li>'+sr('throat')+'<span><b>Throat lit.</b> Self-Silencing released Thu 1 Oct.</span></li>';
 h+='<li>'+sr('sacral')+'<span><b>Sacral lit.</b> Co-Dependency released Thu 24 Sep.</span></li>';
 h+='<li style="--c:var(--mid)">'+ic('where','sm')+'<span>Thread: solid from sacral to solar plexus. It stops before the heart. That is the next place.</span></li><li style="--c:var(--discover)">'+ic('eye','sm')+'<span>Ring: discover, play and flow are lit. Embody is next.</span></li></ul></div></article></div>';
 h+='<div class="cause"><article class="card"><h4 style="--c:var(--play)">'+ic('release')+'What changed it: releases</h4>';
 [['13 Sep','Anger','solar plexus'],['18 Sep','Judgment','solar plexus'],['24 Sep','Co-Dependency','sacral'],['1 Oct','Self-Silencing','throat']].forEach(function(r){h+='<div class="r"><time>'+r[0]+'</time><span><b>'+r[1]+'</b>, '+r[2]+'</span></div>';});
 h+='</article><article class="card"><h4 style="--c:var(--flow)">'+ic('ritual')+'What changed it: practices</h4>';
 [['21 Sep','Slow exhale, 3 minutes. Kept.'],['24 Sep','Slow exhale, 3 minutes. Kept.'],['1 Oct','Somatic truth check, 2 minutes. Kept.'],['2 Oct','Somatic truth check, 2 minutes. Kept.']].forEach(function(r){h+='<div class="r"><time>'+r[0]+'</time><span><b>'+r[1].split('.')[0]+'.</b>'+r[1].slice(r[1].indexOf('.')+1)+'</span></div>';});
 return h+'</article></div></section>';

function masks(){
 var M=[['Child','Gets small so somebody else decides.',['root','sacral']],['Preteen','Checks the room before it says the thing.',['solar','throat']],['Teen','Pushes back on the person, not the problem.',['throat']],['Adult','Handles it, and files what it cost.',['sacral','solar']],['Professional','Performs competence until the feeling passes.',['solar','throat']],['Ideological','Answers from the position instead of the moment.',['eye']]];
 var h='<section class="masks"><h2 class="sec-h">Masks</h2><p class="note" style="margin:0;max-width:70ch">Ring with a face: a mask is a way of protecting yourself that you learned at an age. Below each, the places it protects.</p><div class="mgrid">';
 M.forEach(function(m){h+='<div class="mk2"><div class="h">'+ic('mask')+m[0]+'</div><p>'+m[1]+'</p><div class="pl">'+m[2].map(function(s){return sr(s)}).join('')+'<span>'+m[2].map(function(s){return SEATN[s].n}).join(', ')+'</span></div></div>';});
 h+='</div><div class="seal">'+ic('lock','lg')+'<p><b>Opens on tier three.</b> Lock: the masks are drawn on your figure and lit by what you wrote. Until then you see their names and what each one does.</p><button class="btn ghost">See tiers</button></div></section>';
 return h;
}
function avatar(){
 var l=S.st==='loaded';
 var h='<div class="page"><div class="agrid">'+moved()+hero()+becoming()+'</div>';
 if(l)h+=sewn()+states();
 else h+='<section class="sewn"><h2 class="sec-h">The layers, sewn</h2><p class="note" style="margin:0;max-width:70ch">Avatar, ritual, psyche, body, story. One thread. It fills in after your first entry.</p></section>';
 h+=masks()+'</div>';
 return h;
}

/* ---------------- shell ---------------- */
function render(){
 document.getElementById('app').innerHTML=chrome()+(S.page==='journal'?journal():avatar());
 document.getElementById('frame').setAttribute('data-w',S.w);
 [].forEach.call(document.querySelectorAll('.mock [data-page]'),function(b){b.setAttribute('aria-pressed',b.dataset.page===S.page)});
 [].forEach.call(document.querySelectorAll('.mock [data-st]'),function(b){b.setAttribute('aria-pressed',b.dataset.st===S.st)});
 [].forEach.call(document.querySelectorAll('.mock [data-w]'),function(b){b.setAttribute('aria-pressed',b.dataset.w===S.w)});
}
document.addEventListener('click',function(e){
 var t=e.target.closest('button,.zone,summary');if(!t)return;
 if(t.dataset.page){S.page=t.dataset.page;render();}
 else if(t.dataset.st){S.st=t.dataset.st;S.committed=false;S.mirror='';render();}
 else if(t.dataset.w&&t.closest('.mock')){S.w=t.dataset.w;render();}
 else if(t.dataset.go&&(t.dataset.go==='journal'||t.dataset.go==='avatar')){S.page=t.dataset.go;render();}
 else if(t.dataset.feel&&S.st==='loaded'){S.feel[t.dataset.feel]=S.feel[t.dataset.feel]?0:1;render();}
 else if(t.dataset.zone){S.zone=t.dataset.zone;render();}
 else if(t.closest&&t.closest('.zone')){S.zone=t.closest('.zone').dataset.zone;render();}
 else if(t.dataset.mir){S.mirror=t.dataset.mir;render();var d=document.querySelector('details.land');}
 else if(t.dataset.commit){S.committed=true;render();}
});
document.addEventListener('click',function(e){var z=e.target.closest&&e.target.closest('.zone');if(z){S.zone=z.dataset.zone;render();}});
var q=location.search;
if(/shot/.test(q))document.body.classList.add('shot');
if(/page=avatar/.test(q))S.page='avatar';
if(/st=empty/.test(q))S.st='empty';
if(/w=390/.test(q))S.w='390';
if(/commit/.test(q))S.committed=true;
render();
})();
