button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* the stage is the viewport and nothing scrolls inside the first screen */
.stage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.fieldbg{position:absolute;inset:0;pointer-events:none}
.fieldbg svg{width:100%;height:100%}

/* wordmark. The umlaut sits on the bar, as ruled. */
.mark{display:inline-block;color:var(--accent);line-height:0}
.mark svg{display:block;width:100%;height:auto;overflow:visible}
.mark .wm-d{fill:#fff}

/* type. Five sizes, one face, weight and value do the hierarchy. */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--dim)}
.display{font-size:44px;line-height:1.08;font-weight:500;letter-spacing:-.025em;margin:0}
.h1{font-size:32px;line-height:1.14;font-weight:500;letter-spacing:-.02em;margin:0}
.lead{font-size:18px;line-height:1.5;color:var(--mid);margin:0}
.small{font-size:13px;line-height:1.45;color:var(--mid)}
.dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums}

/* buttons. Ring, not fill, except the one primary per screen. */
.btn{min-height:var(--tap);padding:0 22px;border-radius:999px;border:1.5px solid var(--ctl);
 background:transparent;color:var(--ink);font-size:15px;font-weight:500;display:inline-flex;
 align-items:center;justify-content:center;gap:10px;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--mid)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.pri:hover{background:#93c6de}
.btn.ghost{border-color:transparent;color:var(--mid)}
.btn.ghost:hover{color:var(--ink);border-color:var(--edge)}
.btn:focus-visible,.fld input:focus-visible,.chip:focus-visible,.pick:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* icons are ring, not fill */
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* chip: a pressable word with an icon */
.chip{min-height:var(--tap);padding:0 16px 0 12px;border-radius:999px;border:1.5px solid var(--ctl);
 background:transparent;display:inline-flex;align-items:center;gap:10px;font-size:15px;color:var(--mid)}
.chip svg{width:24px;height:24px}
.chip[aria-pressed=true]{border-color:var(--c,var(--accent));color:var(--ink)}
.chip[aria-pressed=true] svg{color:var(--c,var(--accent))}

/* trust tiers. Fact, observation, hypothesis are drawn differently, never only
   labelled differently: a rule for what was said, a ring for what was noticed,
   a dashed edge for what is still to test. */
.t-said{border-left:2px solid var(--ink);padding-left:16px}
.t-noticed{border:1.5px solid var(--accent);border-radius:16px}
.t-test{border:1.5px dashed var(--edge-2);border-radius:16px}

/* corner controls */
.leave{position:absolute;left:var(--gut);bottom:14px;z-index:5;font-size:13px;color:var(--dim);
 background:none;border:0;min-height:44px;padding:0 8px;display:flex;align-items:center;gap:8px}
.leave:hover{color:var(--ink)}
.leave svg{width:16px;height:16px}
.trace{position:absolute;top:20px;right:28px;z-index:5;display:flex;align-items:center;gap:0}
.trace svg{width:auto;height:24px;overflow:visible}

/* the six node states, drawn as one path with six stops, never a ring: the
   ring is reserved for the loop */
.states{display:flex;align-items:flex-start;justify-content:center;gap:0;width:100%}

/* animation vocabulary. Each keyframe names the state it means. */
@media (prefers-reduced-motion:no-preference){
 .breathe{animation:breathe 9s ease-in-out infinite}
 @keyframes breathe{0%,100%{opacity:.55}50%{opacity:.95}}
 .draw{stroke-dasharray:var(--len,1000);stroke-dashoffset:var(--len,1000);animation:draw var(--dur,1.6s) ease-out forwards;animation-delay:var(--del,0s)}
 @keyframes draw{to{stroke-dashoffset:0}}
 .appear{opacity:0;animation:appear .6s ease-out forwards;animation-delay:var(--del,0s)}
 @keyframes appear{to{opacity:1}}
 .pulse-r{transform-box:fill-box;transform-origin:center;animation:pulse-r 4.2s ease-in-out infinite}
 @keyframes pulse-r{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
}

.seg{display:inline-flex;gap:4px;padding:4px;border:1.5px solid var(--edge);border-radius:999px;align-self:flex-start}
.seg button{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;background:none;color:var(--mid);font-size:14px;font-weight:500}
.seg button[aria-pressed=true]{border-color:var(--accent);color:var(--ink)}
/* flow.css. Onboarding frames. Desktop first, then 390. */
.ui{position:absolute;inset:0;z-index:2}
.topl{position:absolute;left:28px;top:18px;z-index:6}
.trace{position:absolute;top:24px;right:28px;z-index:6}
.eyebrow.acc{color:var(--accent)}
.c{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hd.c{position:absolute;left:0;right:0;top:52px;text-align:center;z-index:3}
.hd.c .display{font-size:42px}

/* starting points, desktop: a ring of twelve */
.pick{position:absolute;width:124px;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;color:var(--mid);z-index:3;padding:0;transition:opacity .3s}
.pc{width:68px;height:68px;border-radius:50%;border:1.8px solid color-mix(in srgb,var(--c) 58%,transparent);display:flex;align-items:center;justify-content:center;color:var(--c);background:rgba(12,13,18,.92);transition:transform .25s,border-color .25s}
.pick:hover .pc{border-color:var(--c)}
.pl{font-size:14px;font-weight:500}
.pick.on .pc{border-width:2.8px;border-color:var(--c);transform:scale(1.16)}
.pick.on .pl{color:var(--ink);font-weight:600}
.pick.q{opacity:.75}
.cread{position:absolute;width:340px;text-align:center;z-index:3}
.rd{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:240px;justify-content:center}
.rbig{display:block}.rbig.dim{color:var(--dim)}
.gift{margin:0;color:var(--mid);font-size:15px}
.dim{color:var(--dim)}
.focus-note{font-size:13px;color:var(--dim)}

/* starting points, 390: a ring above a grid */
.hd.c.m{top:62px;padding:0 20px}
.hd.c.m .h1{font-size:26px}
.cread.m{width:120px;text-align:center}
.tiles{position:absolute;left:12px;right:12px;top:300px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;z-index:3}
.tile{min-height:78px;border-radius:16px;border:1.5px solid var(--edge);background:rgba(18,20,28,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--mid);font-size:12.5px;padding:6px 2px}
.tile svg{color:var(--c)}
.tile.on{border-color:var(--c);border-width:2.4px;color:var(--ink)}
.tile.q{opacity:.75}
.dock{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;z-index:4}
.dock .btn{height:56px}

/* columns */
.col{position:absolute;z-index:3;display:flex;flex-direction:column;gap:18px}
.col.narrow{left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 40px))}
.col.mid{left:max(64px,7vw);top:50%;transform:translateY(-50%);width:min(620px,48vw)}
.col.story{left:max(64px,6vw);top:50%;transform:translateY(-50%);width:min(660px,50vw)}
.display{font-size:44px;line-height:1.08;font-weight:500;letter-spacing:-.025em;margin:0}
.h1{font-size:32px;line-height:1.14;font-weight:500;letter-spacing:-.02em;margin:0}
.ta{border:1.5px solid var(--ctl);border-radius:20px;background:rgba(9,10,14,.74);padding:18px 22px}
.ta.one{min-height:78px;display:flex;align-items:center}
.ta.big{min-height:232px}
.tx{font-size:21px;line-height:1.55;color:var(--ink)}
.sg{text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:2.6px;text-underline-offset:7px}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--accent);vertical-align:text-bottom;margin-left:3px}
.interim{color:var(--dim)}
.ask2{opacity:.8}
.ask2 .lead{margin-top:2px;color:var(--mid)}
.chip.on{border-color:var(--accent)}
.chip.on,.chip[aria-pressed=true]{color:var(--ink)}
.col.narrow .chip:first-child{align-self:flex-start}
.chipcol{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.chipcol.row2{flex-direction:row;flex-wrap:wrap}
.dotc{width:14px;height:14px;border-radius:50%;border:2.2px solid var(--c)}
.rightcol{position:absolute;right:max(36px,3.5vw);top:50%;transform:translateY(-50%);z-index:2}
.rightcol.low{top:54%}
.sfield>svg{width:100%;height:auto}
.wave{margin-top:14px;height:48px}.wave svg{width:100%;height:100%}
.listen{display:flex;align-items:center;gap:14px}
.listen b{display:block;font-size:16px}
.micring{width:60px;height:60px;border-radius:50%;border:2.4px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.micring::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.listen .btn{margin-left:auto}
.was{padding:2px 0 2px 16px}
.was p{margin:2px 0 0}

/* forming */
.stagecenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;z-index:3;padding-top:34px}
.formbox>svg{width:100%;height:auto;display:block}
.fcap{text-align:center;margin-top:-6px}
.fcap .h1{margin:4px 0 2px}.fcap .lead{font-size:16px}
.dots{display:flex;gap:10px;justify-content:center;margin-top:12px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.8px solid rgba(255,255,255,.34)}
.dots i.on{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 2.4px,transparent 3px)}

/* mirror */
.mr{position:absolute;left:56px;right:56px;top:86px;bottom:56px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.35fr) minmax(0,.95fr);gap:44px;align-items:center;z-index:3}
.said .quote,.held .quote,.rtext .quote{font-size:30px;line-height:1.22;font-weight:500;letter-spacing:-.012em;margin:10px 0 20px}
.said{padding:2px 0 2px 20px}
.chips2{display:flex;flex-wrap:wrap}
.sgc{display:inline-flex;align-items:center;gap:9px;border:1.5px solid var(--ctl);border-radius:999px;padding:6px 14px 6px 11px;font-size:14px;margin:0 8px 8px 0;color:var(--mid)}
.sgc i{width:11px;height:11px;border-radius:50%;border:2.2px solid var(--c)}
.noticed{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;min-width:0}
.tag{font-size:42px;font-weight:500;letter-spacing:-.028em;margin:0;line-height:1.1}
.art2{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.bodybox svg{height:min(350px,38vh);width:auto}
.clbox svg{height:min(330px,36vh);width:auto}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:10px 26px;justify-content:center;text-align:left}
.sl{display:block;font-size:12px;color:var(--dim);font-weight:600;margin-bottom:3px}
.sv{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500}
.si svg{display:block}
.irg{margin-left:2px}
.test{padding:26px 26px 24px;display:flex;flex-direction:column;gap:14px;background:rgba(12,13,18,.5)}
.hyp{font-size:18px;line-height:1.5;margin:0;color:var(--ink)}
.hyp b{font-weight:600;color:var(--mid)}
.test .q{font-size:23px;font-weight:500;margin:8px 0 2px;letter-spacing:-.01em}
.acc3{display:flex;flex-direction:column;gap:10px}
.ab{min-height:60px;border-radius:16px;border:1.5px solid var(--ctl);background:rgba(9,10,14,.6);display:flex;align-items:center;gap:14px;padding:0 20px;font-size:17px;font-weight:500;color:var(--ink);text-align:left}
.ab svg{color:var(--accent);flex:none;width:30px;height:30px}
.ab:first-child{border-color:var(--accent)}
.ab:hover{border-color:var(--accent)}
.forksvg{width:min(560px,100%);height:auto}
.held{padding:2px 0 2px 20px}

/* somatic */
.somL{position:absolute;left:max(150px,13vw);top:50%;transform:translateY(-50%);z-index:3}
.somL .bodybox svg{height:min(520px,62vh)}
.col.som{left:46%;top:50%;transform:translateY(-50%);width:min(620px,46vw);gap:16px}
.sens{display:grid;grid-template-columns:repeat(3,auto);gap:12px 28px;justify-content:start}
.sn{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink)}
.sn svg{color:var(--accent)}.sn.z svg{color:var(--mid)}

/* release */
.col.relL{left:max(64px,6vw);top:46%;transform:translateY(-50%);width:min(470px,40vw);gap:14px}
.state{font-size:68px;line-height:1;font-weight:500;letter-spacing:-.035em;margin:0}
.rtext{padding:2px 0 2px 20px;margin-top:10px}
.rtext .quote{font-size:24px;margin:0 0 8px}
.rtext .small{margin:0}
.relC{position:absolute;left:42%;right:0;top:0;bottom:130px;display:flex;align-items:center;justify-content:center;z-index:2}
.relbox>svg{width:100%;height:auto}
.relB{position:absolute;left:max(64px,6vw);right:max(64px,6vw);bottom:34px;display:flex;align-items:center;justify-content:space-between;gap:24px;z-index:4}
.relB #rtr{flex:1;max-width:620px}.track{width:100%;height:auto}
.relB .row{flex:none}

/* observe */
.obsL{position:absolute;left:6vw;top:50%;width:46%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2}
.ba{display:flex;gap:28px;font-size:14px;color:var(--mid);margin-top:14px}
.ba i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:-2px}
.ba .g{border:1.6px dotted var(--mid)}.ba .s{border:2px solid #DABF6A}
.col.obsR{left:56%;top:50%;transform:translateY(-50%);width:min(560px,38vw)}

/* handoff */
.col.hand{left:50%;top:50%;transform:translate(-50%,-50%);width:min(1260px,calc(100% - 100px));gap:26px}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative}
.five::before{content:'';position:absolute;top:12px;left:11px;right:calc(20% - 11px);height:2px;background:var(--accent)}
.fv{position:relative;padding:40px 18px 0 0}
.fv::before{content:'';position:absolute;top:2px;left:0;width:22px;height:22px;border-radius:50%;border:2.4px solid var(--accent);background:radial-gradient(circle,var(--accent) 0 4px,#0C0D12 4.5px)}
.fv p{margin:6px 0 0;font-size:17px;line-height:1.4;color:var(--ink)}
.fv .eyebrow{font-size:13px}
.fv.t-said{border:0}.fv.t-noticed{border:0;border-radius:0}.fv.t-test{border:0}
.fv.t-said p{font-weight:500}
.fv.t-test p{font-style:normal}
.hrow{display:flex;align-items:center;gap:40px;margin-top:6px}
.hact{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.hact .btn.pri{height:56px;padding:0 34px;font-size:16px}
.hact .lead{color:var(--ink);font-size:20px}

 .topl{left:18px;top:14px}.trace{top:19px;right:16px}.trace svg{height:20px;width:auto}

 /* mirror */

 .acc3{flex-direction:row;gap:8px}

 /* somatic */

 /* observe */

.rightcol .bodybox svg{height:min(560px,66vh)}

.hp>svg.hring{position:absolute;left:0;top:0}
.hp>.lpi{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.loop{overflow:visible}
/* flow2.css. Round PA additions on top of flow.css. Desktop first, 390 last. */
.il{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
a.il{display:inline-block;padding:14px 8px;margin:-14px -6px;min-width:44px;text-align:center}
.hint{font-size:13px;color:var(--dim);margin:0;line-height:1.4}
.subj{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2.6px;text-underline-offset:7px}
.dr{display:inline-block;width:11px;height:11px;border-radius:50%;border:2.2px solid var(--c);flex:none}

  +'<div class="sens">'+sens.map(function(s,i){return '<span class="sn'+(i===5?' z':'')+'">'+ico(s[0],26)+s[1]+'</span>';}).join('')+'</div>'
  +'<p class="small">You do not need to feel anything. Noticing nothing is information too.</p>'
  +'<div class="row"><button type="button" class="btn pri" data-go="release-open">Begin</button><button type="button" class="btn ghost">'+ico('stop',20)+'Stop</button></div></div>';
 if(!reduce){var alive=true;window.__stop=function(){alive=false;};var t0=null;(function lp(ts){if(!alive)return;if(t0===null)t0=ts;var k=(Math.sin((ts-t0)/1000*1.1)+1)/2;var bb=$('#bb');if(bb)bb.innerHTML=bodySVG({hi:2,pulse:k,labels:M?'hi':true});requestAnimationFrame(lp);})(0);}
};

/* ================= 8. THE RELEASE, as the software runs it ================= */
/* 8a. it opens on the recorded voice. one screen, written out as it is said. */
var Q=new URLSearchParams(location.search);
SCR.relopen=function(chars){
 var total=0;INTRO.forEach(function(l){total+=l.length;});total+=(STMT_REL+SUBJECT+'.').length;
 if(chars==null&&Q.get('c')!=null)chars=Math.min(total,+Q.get('c'));
 var full=chars==null||chars>=total;if(chars==null)chars=total;
 var cx=W/2,cy=M?HT*.7:HT*.5,r=M?112:Math.min(HT*.405,420);
 function bgdraw(t){bg.innerHTML='<svg viewBox="0 0 '+W+' '+HT+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g>'+voiceTicks(cx,cy,r,ampAt(t,1),M?8:12)+'</g></svg>';}
 bgdraw(1.2);
 ui.innerHTML=chrome(3,false)+'<div class="ropen" id="ro">'+relOpenHTML(chars,{nocaret:chars>=total})+'</div>'+relButtons({});
 if(Q.get('pulse'))document.body.classList.add('pulsepeak');
 if(!reduce){var alive=true;window.__stop=function(){alive=false;};var t0=null,written=chars;
  (function lp(ts){if(!alive)return;if(t0===null)t0=ts;var t=(ts-t0)/1000;bgdraw(t+1.2);
   var want=Math.min(total,Math.floor(t*17)+4);if(want!==written&&chars<total){written=want;$('#ro').innerHTML=relOpenHTML(want,{});}
   requestAnimationFrame(lp);})(0);
  }
};
/* 8b. the run: address by address, left and right, release and install */
SCR.relrun=function(i,p){
 i=i==null?(Q.get('i')!=null?+Q.get('i'):5):i;p=p==null?(Q.get('p')!=null?+Q.get('p'):.55):p;
 var cx=W/2,cy=M?HT*.42:HT*.47,r=M?150:Math.min(HT*.4,380);
 bg.innerHTML='';
 ui.innerHTML=chrome(3,false)+'<div class="rrun" id="rr">'+relRunHTML(M,i,p,{})+'</div>';
 if(!reduce){var alive=true;window.__stop=function(){alive=false;};var li=i,t0=null,pp=p;
  (function lp(ts){if(!alive)return;if(t0===null)t0=ts;pp+=.004;if(pp>=1){pp=0;li=(li+1)%12;}
   $('#rr').innerHTML=relRunHTML(M,li,pp,{});requestAnimationFrame(lp);})(0);}
};
/* 8c. the cooldown */
SCR.relcool=function(left){
 left=left==null?(Q.get('t')!=null?+Q.get('t'):106):left;
 var cx=M?W/2:W*.3,cy=M?158:HT*.5;
 setBg({cx:cx,cy:cy,r:M?112:Math.min(HT*.3,300),arcs:false,lit:[2],quiet:.4,tl:M?8:12},'');
 ui.innerHTML=chrome(3,false)+'<div class="rcool" id="rc">'+relCoolHTML(M,left,{})+'</div>';
 if(!reduce){var alive=true;window.__stop=function(){alive=false;};var s=left,t0=null,last=-1;
  (function lp(ts){if(!alive)return;if(t0===null)t0=ts;var n=Math.max(0,left-Math.floor((ts-t0)/1000));if(n!==last){last=n;$('#rc').innerHTML=relCoolHTML(M,n,{});}requestAnimationFrame(lp);})(0);}
};

/* ================= 9. AFTER THE RELEASE ================= */
SCR.observe=function(){
 setBg({cx:M?W/2:W*.29,cy:M?186:HT*.5,r:M?132:Math.min(HT*.34,310),arcs:false,lit:[2],tl:M?8:13},'');
 var opts=[['different','I feel different',0],['seeit','I see it differently',0],['moved','Something moved',1],['nothing','Nothing changed',0],['unsure','I’m not sure',0]];
 var s=Math.min(M?W*.62:HT*.58,520);
 ui.innerHTML=chrome(4)
  +'<div class="obsL"><div class="relbox" style="width:'+s+'px">'+relSVG(REL_P[5])+'</div>'
  +'<div class="ba"><span><i class="g"></i>Before</span><span><i class="s"></i>Now</span></div></div>'
  +'<div class="col obsR">'
  +'<span class="eyebrow acc">Three addresses, twelve lines</span><h1 class="'+(M?'h1':'display')+'">What is here now?</h1>'
  +'<div class="chipcol">'+opts.map(function(o){return '<button type="button" class="chip'+(o[2]?' on':'')+'" style="--c:'+ACC+'" aria-pressed="'+!!o[2]+'">'+ico(o[0],24)+o[1]+'</button>';}).join('')+'</div>'
  +'<p class="small">Recorded as what you noticed. Whether it changes what you do comes later.</p>'
  +'<div class="row"><button type="button" class="btn pri" data-go="handoff">Continue</button></div></div>';};

/* ================= 10. HANDOFF: what changed, or run it again ================= */
SCR.handoff=function(){
 setBg({cx:-999,cy:-999,r:10,arcs:false,ticks:false},'');
 var items=[['You said','“I keep taking care of everybody else.”','t-said'],['Atüned noticed','Over-responsibility, at the solar plexus','t-noticed'],['You tested','That’s it','t-test'],['You worked with it','12 lines, 3 addresses','t-w'],['You observed','Something moved','t-o']];
 var lz=M?150:230,hs=lz+(M?30:70);
 var ring='<div class="hp" style="width:'+hs+'px;height:'+hs+'px"><svg class="hring" width="'+hs+'" height="'+hs+'" viewBox="0 0 '+hs+' '+hs+'" aria-hidden="true">'+fieldRing({cx:hs/2,cy:hs/2,r:lz*.5+(M?16:30),arcs:false,quiet:.5,tl:M?7:11,sw:M?1.6:2})+'</svg><div class="lpi">'+loopRing(lz,{doneSet:[0,2],lit:1,labels:true})+'</div></div>';
 ui.innerHTML=chrome(5,true,true)
  +'<div class="col hand"><span class="eyebrow acc">What just happened</span><h1 class="'+(M?'h1':'display')+'">You did that.</h1>'
  +'<div class="five">'+items.map(function(it,i){return '<div class="fv '+it[2]+'">'+(M?'<i class="mn"></i>':'')+'<span class="eyebrow">'+it[0]+'</span><p>'+it[1]+'</p></div>';}).join('')+'</div>'
  +'<div class="hrow">'+ring
  +'<div class="hact"><p class="lead">Two stations closed. Play is next.</p>'
  +'<div class="hbtns"><button type="button" class="btn pri" data-go="tutorial">'+ico('seeit',20)+'See what changed</button>'
  +'<button type="button" class="btn" data-go="release-open">'+ico('rerun',20)+'Run it again</button></div>'
  +'<p class="small dim hnote">See what changed opens the Field with your three addresses, before and after. Running it again costs nothing.</p>'
  +'<button type="button" class="btn ghost" data-go="keep">'+ico('guest',20)+'Keep this</button></div></div></div>';};

/* ================= 11. KEEP WHAT YOU FOUND: the account, after the first release ================= */
SCR.keep=function(){
 setBg({cx:M?W/2:W*.74,cy:M?150:HT*.5,r:M?64:Math.min(HT*.34,320),arcs:false,lit:[0,2],quiet:.4,tl:M?7:12},'');
 var goes=[['The story you wrote'],['What Atüned read from it'],['The release you ran'],['Your answers']];
 var fl=function(id,label,dot,val,type,opt){return '<label class="kf"><span class="fl"><i class="dot" style="--c:'+dot+'"></i>'+label+(opt?' <span class="opt">optional</span>':'')+'</span><input id="'+id+'" type="'+type+'" value="'+val+'" autocomplete="off"></label>';};
 var ck=function(t,on){return '<label class="ck"><input type="checkbox"'+(on?' checked':'')+'><span class="bx">'+ico('tick',18)+'</span><span>'+t+'</span></label>';};
 var goesH='<div class="kgo t-noticed"><span class="eyebrow acc">Goes with you</span>'+goes.map(function(g){return '<p>'+ico('check',20)+g[0]+'</p>';}).join('')+'</div>'
  +'<div class="kstay t-test"><span class="eyebrow">Stays on this device</span><p>'+ico('lock',20)+'Your birth data</p></div>';
 ui.innerHTML=chrome(5,true,true)
  +'<div class="col keep"><span class="eyebrow acc">Account</span><h1 class="'+(M?'h1':'display')+'">Keep what you found.</h1>'
  +(M?'':'<p class="lead">Make a username and what you just did goes with it.</p>')
  +'<div class="kform">'+fl('ku','Username','var(--throat)','mika.salas','text')+fl('kp','Passphrase','var(--root)','••••••••••••••','password')
  +fl('ke','Recovery email','var(--heart)','mika@example.com','email',true)
  +'<span class="hint">Without one, a lost passphrase cannot be recovered.</span>'
  +ck('I am 18 or over.',true)+ck('I agree to the <a class="il" href="#terms">Terms</a> and the <a class="il" href="#privacy">Privacy policy</a>.',true)+'</div>'
  +'<div class="row"><button type="button" class="btn pri" data-go="tutorial">Keep it</button><button type="button" class="btn" data-go="handoff">Not now</button></div></div>'
  +'<div class="kside">'+goesH+'</div>';};

/* ================= routing ================= */
var ROUTE={'start':function(){SCR.start(-1);},'start-compare':function(){SCR.compare();},'start-picked':function(){SCR.start(0);},'feeling':function(){SCR.feeling();},
 'story':function(){SCR.story(false);},'story-voice':function(){SCR.story(true);},'forming':function(){SCR.forming();},
 'mirror':function(){SCR.mirror(false);},'mirror-wheel':function(){SCR.mwheel();},'mirror-notquite':function(){SCR.notquite(2);},'mirror-subject':function(){SCR.subject();},'mirror-second':function(){SCR.mirror(true);},'mirror-adjust':function(){SCR.adjust();},'mirror-empty':function(){SCR.empty();},
 'somatic':function(){SCR.somatic();},'release-open':function(){SCR.relopen();},'release-run':function(){SCR.relrun();},'release-cool':function(){SCR.relcool();},'observe':function(){SCR.observe();},'handoff':function(){SCR.handoff();},'keep':function(){SCR.keep();}};
function show(){clearT();var h=setHash()||'start-picked';(ROUTE[h]||ROUTE['start-picked'])();document.title='Onboarding, '+h;}
ui.addEventListener('click',function(e){
 var t=e.target.closest('[data-pick],[data-go]');if(!t)return;
 if(t.hasAttribute('data-pick')){clearT();SCR.start(+t.getAttribute('data-pick'));return;}
 var g=t.getAttribute('data-go');if(g==='tutorial'){location.href='tutorial.html#t0';return;}
 location.hash=g;});
addEventListener('hashchange',show);
show();
})();
