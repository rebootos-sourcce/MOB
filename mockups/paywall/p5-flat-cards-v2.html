 /* THE PICKED CARD. His phone example shows its chosen card as a lighter flat tone,
    and he said "I like flat color. Instead of lit." Punch already mixes a colour into
    --panel-2 for a filled control (.cr at 26 percent, .ip at 22). This is the same
    recipe with the product's accent, at the strongest share that still holds --ink at
    4.5 to 1 on top of it: 36 percent measures 6.2, 45 percent fell to 4.4. */
 --pick:color-mix(in srgb,var(--accent) 36%,var(--panel-2));
 /* a thing this tier opens, drawn flat: the accent itself, never a glow */
 --opens:var(--accent);
 /* the scrim over the app behind the sheet */
 --scrim:rgba(5,6,9,.78);
}
body.punch{
 --seat:#DFCC7E; --seat-w:0.3;
 --edge:transparent; --edge-2:transparent;
 --bg:color-mix(in srgb,var(--seat) calc(2% + var(--seat-w)*6%),#12131A);
 --panel:color-mix(in srgb,var(--seat) calc(3% + var(--seat-w)*4%),#171922);
 --panel-2:color-mix(in srgb,var(--seat) calc(4% + var(--seat-w)*4%),#20222D);
 --sunk:color-mix(in srgb,var(--seat) calc(2% + var(--seat-w)*5%),#12131B);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
a{color:inherit}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.ri{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- the demo bar. Not the product: it says so. One row of 44 at every width, and
   the controls drop over the page in a drawer, so the paywall's fold is measured with
   the bar on screen and nothing hidden behind it. ---- */
.demo{position:relative;z-index:30;height:44px;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;
 background:#050608;color:var(--mid);font-size:13px;border-bottom:1px solid rgba(255,255,255,.06)}
.demo .dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.demo .dl b{color:var(--ink);font-weight:500}
.demo .sp{flex:1}
.demo .dbtn{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:transparent;cursor:pointer;color:var(--ink);font-size:13px;white-space:nowrap}
.drawer{position:absolute;left:0;right:0;top:44px;z-index:29;background:#050608;border-bottom:1px solid rgba(255,255,255,.1);
 padding:12px 16px 16px;display:none;max-height:calc(100vh - 44px);overflow:auto;font-size:13px;color:var(--mid)}
.drawer.open{display:block}
.drawer .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:6px 0}
.drawer .lab{width:120px;color:#B4B0A8}
.drawer a,.drawer button{min-height:36px;display:inline-flex;align-items:center;padding:0 12px;border-radius:18px;border:1px solid rgba(255,255,255,.16);
 background:transparent;color:#B4B0A8;text-decoration:none;cursor:pointer;font-size:13px}
.drawer [aria-pressed="true"],.drawer [aria-current]{color:#EFEDE8;border-color:#B4B0A8}
.drawer button[disabled]{opacity:.45;cursor:default}
.drawer .note{margin:8px 0 0;color:#94908A;max-width:90ch}

/* ---- the stage: the app behind, scrimmed, and the sheet over it ---- */
.stage{position:relative;height:calc(100vh - 44px);overflow:hidden}
body.embed .stage{height:100vh}
.behind{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.behind svg{width:min(80vh,70vw);height:auto;opacity:.9}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border-radius:var(--r);
 width:min(1120px,calc(100vw - 48px));max-height:calc(100% - 32px);overflow:hidden;padding:28px 36px 22px}
body.dark .sheet{border:1px solid var(--edge-2)}
.status{min-height:0;margin:0;font-size:14px;color:var(--mid)}
.status:not(:empty){margin-top:8px}

/* the exit: a ring with a cross, the product's close, 44 by 44, top left like his example */
.x{position:absolute;top:14px;left:14px;width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:var(--mid);
 display:flex;align-items:center;justify-content:center;cursor:pointer}
.x:hover{color:var(--ink);background:var(--panel-2)}
.x svg{width:26px;height:26px}

/* three levels of type, by weight, space and value before size */
.t1{font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.012em;margin:0}
.lede{font-size:16px;color:var(--mid);margin:6px 0 0}
.small{font-size:14px;color:var(--mid)}

/* the one action */
.go{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:26px;border:0;
 background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600;cursor:pointer;width:100%}
.go:hover{background:color-mix(in srgb,var(--accent) 88%,#fff)}
/* not a button: a slot that says what is true. A control that takes a press and
   refuses is furniture, so a closed checkout prints its state and offers nothing. */
/* no pill, no fill: a pill says press. A closed slot is the words and a clock ring. */
.shut{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 12px;
 background:transparent;color:var(--mid);font-size:16px;font-weight:500;text-align:center}
.shut svg{width:20px;height:20px;flex:none}
.idle{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:26px;background:var(--panel-2);color:var(--mid);font-size:16px}

/* the refusal after a failed payment: neutral, never the alarm colour */
.fail{display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border-radius:var(--r-s);padding:10px 14px;font-size:14px;color:var(--ink)}
.fail svg{width:20px;height:20px;flex:none;margin-top:1px;color:var(--mid)}

/* ---- the foot: the way out sits where the price is ---- */
.foot{margin-top:14px;font-size:14px;color:var(--mid);text-align:center}
.foot p{margin:0}
.foot p+p{margin-top:2px}
.foot p,.four,.lede,.gq,.gl{text-wrap:balance}
.links{display:flex;justify-content:center;flex-wrap:wrap;gap:0 4px;margin-top:4px}
.links a,.links button{min-height:44px;display:inline-flex;align-items:center;padding:0 10px;color:var(--mid);text-decoration:underline;
 text-decoration-color:color-mix(in srgb,var(--mid) 45%,transparent);text-underline-offset:3px;background:none;border:0;cursor:pointer;font-size:14px}
.links a:hover,.links button:hover{color:var(--ink)}
.links .stop{color:var(--ink)}
.four{font-size:14px;color:var(--mid);margin:0}
.four b{color:var(--ink);font-weight:500}
.gl{font-size:14px;color:var(--mid);margin:0}
.term{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:help;text-decoration:underline dotted;text-decoration-color:var(--mid);text-underline-offset:3px;min-height:0;padding:12px 0;margin:-12px 0;display:inline}
.tipbox{position:fixed;z-index:50;display:none;background:var(--panel-2);color:var(--ink);font-size:14px;line-height:1.45;padding:10px 12px;border-radius:var(--r-xs);box-shadow:0 0 0 1px var(--edge-2)}
body.punch .tipbox{box-shadow:none;background:color-mix(in srgb,var(--panel-2) 70%,#3a3d4a)}
.tipbox.on{display:block}

/* the marks: a ring mark, and the small ring padlock a locked one carries */
.mk{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mk .lk{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:7px;background:var(--panel);color:var(--mid);padding:1.5px}
.mk .lk svg{width:11px;height:11px;stroke-width:1.7}

/* the picked marker: a ring with a dot. Ring, not fill, and it carries the state at
   better than 3 to 1, so the lighter flat tone is never the only sign. */
.pm{width:20px;height:20px;flex:none}
.pm circle{fill:none;stroke:currentColor;stroke-width:1.6}
.pm path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- the account step, inside the panel, never a detour to Settings ---- */
.acct{display:grid;gap:10px}
.acct .why{margin:0;font-size:14px;color:var(--mid)}
.acct label{display:grid;gap:4px;font-size:14px;color:var(--mid)}
.acct input{min-height:44px;border-radius:var(--r-xs);border:0;background:var(--sunk);padding:0 12px;color:var(--ink);font-size:16px}
.acct input:focus-visible{outline:none;box-shadow:inset 4px 0 0 var(--accent)}
.acct .alt{background:none;border:0;color:var(--mid);text-decoration:underline;text-underline-offset:3px;min-height:44px;cursor:pointer;font-size:14px;justify-self:center}

/* ---- the stop screen, the same family ---- */
.stopsheet{width:min(560px,calc(100vw - 48px))}
.stopsheet .t1{margin-top:28px}
.facts{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px}
.facts li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:var(--panel-2);border-radius:var(--r-s);padding:12px 14px}
.facts .k{display:block;font-size:13px;font-weight:600;color:var(--mid)}
.facts .v{display:block;font-size:16px;color:var(--ink)}
.facts svg{width:28px;height:28px;color:var(--ink)}
.stopsheet .acts{margin-top:16px;display:grid;gap:4px}
.stopsheet .back{min-height:44px;background:none;border:0;color:var(--mid);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}
.stopsheet .foot{margin-top:10px}

/* ---- the phone, inside a desktop browser: the same file in a 390 by 844 frame ---- */
.phone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050608}
.phone iframe{width:390px;height:844px;border:0;border-radius:28px;background:var(--bg);box-shadow:0 0 0 10px #15171C}

@media (max-width:760px){
 .sheet{left:0;top:0;transform:none;width:100%;height:100%;max-height:none;border-radius:0;padding:14px 16px 10px}
 body.dark .sheet{border:0}
 .behind,.scrim{display:none}
 .x{top:6px;left:6px}
 .t1{font-size:24px}
 .lede{font-size:15px;margin-top:4px}
 .go,.shut,.idle{min-height:50px}
 .foot{margin-top:8px;font-size:13px}
 .links a,.links button{font-size:13px;padding:0 8px}
 .four,.gl{font-size:13px}
 .stopsheet{width:100%}
 .stopsheet .t1{margin-top:44px}
 .demo .dl .long{display:none}
}

/* the failed payment, in the lede's place, neutral, never the alarm colour */
.failin{display:inline-flex;gap:8px;align-items:flex-start;color:var(--ink)}
.failin svg{width:20px;height:20px;flex:none;margin-top:1px;color:var(--mid)}

/* ---- the gift ---- */
.giftsheet{width:min(720px,calc(100vw - 48px))}
.giftsheet .t1{text-align:center;padding:0 48px}
.glayers{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gl-b{width:100%;min-height:60px;display:flex;gap:12px;align-items:center;text-align:left;border:0;border-radius:var(--r-s);background:var(--panel-2);color:var(--ink);padding:10px 14px;cursor:pointer}
.gl-b b{display:block;font-size:15px;font-weight:600}
.gl-b .m{display:block;font-size:13.5px;color:var(--mid)}
.gl-b>span:nth-child(2){flex:1}
.gl-b.on{background:var(--pick)}
.gl-b.on .m{color:var(--ink)}
.gq{text-align:center;margin:16px 0 14px;font-size:15px;color:var(--mid)}
@media (max-width:760px){
 .giftsheet{width:100%}
 .giftsheet .t1{text-align:left;padding:8px 0 0 46px;font-size:22px}
 .glayers{grid-template-columns:1fr;gap:6px;margin-top:14px}
 .gq{text-align:left}
}

/* P5, flat cards, second cut. Punch: no edges, no shadows, filled shapes.
   The sheet fills the stage; the cards fill the sheet. */
.sheet.p5{top:12px;left:12px;right:12px;bottom:12px;transform:none;width:auto;max-height:none;height:auto;
 display:flex;flex-direction:column;padding:16px 28px 4px}
.hd5{display:flex;align-items:center;gap:16px;min-height:44px;padding-left:52px}
.hd5 .t1{font-size:32px;flex:1}
.herechip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;background:var(--sunk);color:var(--ink);font-size:16px;font-weight:500}
.herechip svg{width:20px;height:20px;flex:none}
.herechip.quiet{background:var(--panel-2);color:var(--mid);font-weight:400}
.herechip.quiet b{color:var(--ink);font-weight:600}
.fail5{display:flex;gap:10px;align-items:center;margin:10px 0 0;padding:10px 14px;border-radius:var(--r-s);background:var(--panel-2);color:var(--ink);font-size:15px}
.fail5 svg{width:20px;height:20px;flex:none;color:var(--mid)}

/* ---- three cards, the height of the sheet ---- */
.cards5{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.c5{background:var(--panel-2);border-radius:var(--r);padding:28px 32px 28px;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.c5 .cn{font-size:20px;font-weight:600;color:var(--mid)}
/* level one: the patterns. A button, because the number carries its meaning. */
.hl{display:block;text-align:left;background:none;border:0;padding:0;margin:6px 0 0;cursor:help;color:var(--ink);border-radius:var(--r-xs)}
.hl .big{display:block;font-size:136px;line-height:.98;font-weight:600;letter-spacing:-.035em}
.hl .pl{display:block;font-size:24px;color:var(--mid);margin-top:6px}
.u{text-decoration:underline dotted;text-decoration-color:var(--mid);text-underline-offset:5px;text-decoration-thickness:2px}
.hl:hover .pl,.hl.tipped .pl{color:var(--ink)}
/* level two: the price */
.c5 .pr{display:flex;align-items:baseline;gap:10px}
.c5 .pr .num{font-size:60px;font-weight:600;letter-spacing:-.025em;line-height:1;color:var(--ink)}
.c5 .per{font-size:20px;color:var(--mid)}
/* THE RINGS, the hero. Six columns, the same six on every card. */
.rgs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:22px}
/* on a desktop the six sit three by two, at twice the size, the same places on
   every card, so the card's spare height goes to the hero and not to air */
@media (min-width:761px){
 .c5 .rgs{grid-template-columns:repeat(3,1fr);gap:clamp(12px,2.2vh,24px) clamp(16px,2vw,36px);margin-top:clamp(14px,2.6vh,28px);
  width:min(100%,calc((100vh - 560px) * 1.62))}
 .c5 .rg5.came::after{bottom:-12px;height:5px;left:32%;right:32%}
}
.rg5{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;min-width:44px;min-height:44px;padding:0;border:0;background:none;cursor:help;border-radius:50%}
.rg5 .dk{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;
 box-shadow:inset 0 0 0 2px var(--dim);color:var(--dim);transition:transform var(--t-micro) var(--ease-out)}
.rg5 .dk svg{width:54%;height:54%}
.rg5.on .dk{background:var(--accent);box-shadow:none;color:var(--on-accent)}
.rg5.on .dk .ri{stroke-width:1.8}
.rg5:hover .dk,.rg5.tipped .dk{transform:scale(1.06)}
.rg5.tipped .dk{box-shadow:inset 0 0 0 2px var(--ink)}
.rg5.on.tipped .dk{box-shadow:0 0 0 3px var(--panel-2),0 0 0 5px var(--ink)}
/* the ring that brought them in: a bar under its column, on every card */
.rg5.came::after{content:'';position:absolute;left:24%;right:24%;bottom:-11px;height:4px;border-radius:2px;background:var(--ink)}
.c5 .act{margin-top:30px;min-height:60px;display:flex}
.c5 .act>*{flex:1}
.c5 .go{min-height:60px;font-size:19px;border-radius:30px}
.c5 .go .sh{display:none}
.c5 .go.quiet{background:var(--sunk);color:var(--ink);font-weight:500}
.c5 .go.quiet:hover{background:color-mix(in srgb,var(--sunk) 70%,var(--panel))}
.c5 .shut{min-height:60px;font-size:18px;color:var(--mid)}
/* where the person is: a mark and words, never a pill, because a pill says press */
.c5 .herechip{justify-content:center;font-size:18px;background:transparent;min-height:60px}

/* ---- Practitioner: one slim row, under the three ---- */
.pr5{display:flex;align-items:center;gap:16px;margin-top:12px;min-height:60px;padding:0 20px 0 14px;border-radius:var(--r-s);background:var(--sunk);color:var(--mid);font-size:16px}
.pdk{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px var(--dim);color:var(--dim);flex:none}
.pdk svg{width:24px;height:24px}
.pn{background:none;border:0;padding:0 2px;min-height:44px;font-size:17px;font-weight:600;color:var(--ink);cursor:help}
.pp{color:var(--ink)}
.pp .num{font-weight:600}
.pw{flex:1}
.pr5 .shut{min-height:44px;font-size:16px;padding:0}

/* ---- the foot: one line ---- */
.ft5{display:flex;align-items:center;justify-content:center;gap:4px 14px;flex-wrap:wrap;font-size:14px;color:var(--mid);margin-top:2px}
.ft5 p{margin:0}
.ft5 .rf5{flex-basis:100%;text-align:center;margin-top:6px}
.ft5 .links{margin:0}

/* ---- signed out: the chosen card beside the account step ---- */
.step5{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:14px;align-items:stretch}
.step5 .acct{align-content:center;max-width:460px}
.step5 .acct .why b{color:var(--ink);font-weight:600;font-size:22px}
.step5 .act[hidden]{display:none}

/* ---- the tooltip ---- */
.tip5{position:fixed;z-index:60;display:none;background:#3A3D4A;color:var(--ink);border-radius:var(--r-s);padding:12px 14px;font-size:14.5px;line-height:1.4;pointer-events:none}
.tip5.on{display:grid;gap:4px}
/* the pointer, so the card reads as belonging to the ring under it */
.tip5::after{content:'';position:absolute;left:calc(var(--cx,50%) - 8px);width:16px;height:8px;background:#3A3D4A}
.tip5.up::after{bottom:-8px;clip-path:polygon(0 0,100% 0,50% 100%)}
.tip5.dn::after{top:-8px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.tip5 b{font-size:16px;font-weight:600}
.tip5 .m{color:var(--ink)}
.tip5 .tl{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;margin-top:2px}
.tip5 .tl svg{width:18px;height:18px;flex:none}

/* ---- the gift: six lit rings, nothing to buy ---- */
.sheet.gift5{align-items:center;justify-content:center;gap:0;text-align:center}
.gift5 .t1{font-size:48px}
.giftrgs{width:min(1240px,100%);gap:28px;margin-top:48px}
.gift5 .gq{font-size:20px;color:var(--mid);margin:44px 0 28px}
.gift5 .go{width:min(360px,100%)}

/* ---- stop, the same family ---- */
.p5stop .facts .v{font-size:18px}

/* ---- the phone ---- */
@media (max-width:760px){
 .sheet.p5{top:0;left:0;right:0;bottom:0;padding:6px 16px 0;border-radius:0}
 .hd5{flex-wrap:wrap;gap:4px 8px;padding-left:46px;min-height:44px}
 .hd5 .t1{font-size:21px;flex-basis:100%;padding-top:4px}
 .hd5 .herechip.quiet{margin-left:-46px;min-height:32px;padding:0 12px;font-size:14px;margin-top:6px}
 .herechip svg{width:16px;height:16px}
 .fail5{font-size:14px;padding:8px 12px;margin-top:6px}
 .cards5{grid-template-columns:1fr;grid-auto-rows:1fr;gap:8px;margin-top:8px}
 .c5{display:grid;grid-template-columns:1fr auto;grid-template-areas:"top pr" "rg rg" "act act";align-content:space-between;padding:10px 12px 10px 14px;border-radius:var(--r-s);row-gap:4px}
 .c5 .top{grid-area:top}
 .c5 .low{display:contents}
 .c5 .cn{font-size:14px}
 .hl{margin:0;min-height:44px}
 .hl .big{font-size:40px;line-height:1;display:inline}
 .hl .pl{display:inline;font-size:14px;margin-left:6px}
 .u{text-underline-offset:3px;text-decoration-thickness:1.5px}
 .c5 .pr{grid-area:pr;flex-direction:column;align-items:flex-end;gap:0;align-self:start}
 .c5 .pr .num{font-size:30px}
 .c5 .per{font-size:12.5px}
 .rgs{grid-area:rg;gap:6px;margin-top:2px}
 .rg5{aspect-ratio:auto;height:44px}
 .rg5 .dk{width:40px;height:40px;flex:none}
 .rg5.came::after{bottom:-5px;height:3px;left:30%;right:30%}
 .c5 .act{grid-area:act;margin-top:6px;min-height:44px}
 .c5 .go,.c5 .shut,.c5 .herechip{min-height:44px;font-size:15px;border-radius:22px}
 .c5 .go .lg{display:none}
 .c5 .go .sh{display:inline}
 .c5 .shut svg{width:16px;height:16px}
 .pr5{margin-top:8px;min-height:48px;gap:8px;padding:0 10px 0 6px;font-size:13px;flex-wrap:nowrap}
 .pdk{width:34px;height:34px}
 .pdk svg{width:20px;height:20px}
 .pn{font-size:14px;padding:0}
 .pw{display:none}
 .pp{flex:1}

let STATUS=()=>{};
/* WIRED ONCE. The stage outlives every redraw, so a listener added on each draw
   stacked up and a toggle fired twice and undid itself (caught by the play check). */
function wireCommon(root){
 if(root.dataset.wired){const x=$('#x',root);if(x)x.onclick=()=>STATUS('Demo: closes and goes back to where you were. Esc does the same.');return;}
 root.dataset.wired='1';
 root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='terms'||a==='privacy'){e.preventDefault();STATUS('Demo: opens the '+(a==='terms'?'terms':'privacy')+' page.');return;}
  if(a==='restore'){STATUS('Demo: opens sign in. '+W.restoreMeans);return;}
  if(a==='stop'){if(ON!=='one'){STATUS('Demo: on a paid tier this opens the stop screen. There is no plan to stop on free.');return;}location.search=qs({s:'stop',done:null});return;}
  if(a==='change'){location.search=qs({s:'one',done:null});return;}
  if(a==='stopgo'){STATE.stopped=true;draw();return;}
  if(a==='undo'){STATE.stopped=false;draw();STATUS('Demo: tier one carries on and renews on 14 November.');return;}
  if(a==='close'||b.id==='x'){STATUS('Demo: closes and goes back to where you were.');return;}
  if(a==='acctswap'){STATE.acctOld=!STATE.acctOld;draw();return;}
  if(a==='pay'){STATUS(W.nextAcct);return;}
  if(a==='buy'){const t=TIER(b.dataset.t);
   if(!SIGNED){STATE.go=true;STATE.pick=t.k;draw();return;}
   STATUS(W.next(t));return;}
  if(a==='pick'){STATE.pick=b.dataset.t;STATE.go=false;draw();return;}
  if(a==='layer'){$$('.gl-b',root).forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',String(on));const p=x.querySelector('.pm');if(p)p.remove();if(on)x.insertAdjacentHTML('beforeend',pickSvg(true));});STATUS('Demo: draws '+ROW(b.dataset.k).nm+' on your Field.');return;}
  if(a==='all'){STATE.all=!STATE.all;draw();return;}});
 const x=$('#x',root);if(x)x.onclick=()=>STATUS('Demo: closes and goes back to where you were. Esc does the same.');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const d=$('#drawer');if(d&&d.classList.contains('open')){d.classList.remove('open');$('#dtog').setAttribute('aria-expanded','false');}else STATUS('Demo: Esc closes and goes back to where you were.');}});

/* ============================================================

   graded C minus: "It's not maximizing the space. There's too much text at
   the bottom ... More visual, more show, less tell. Icons, I can hover over
   the icons and get information on what features I may be missing."

   WHAT CHANGED FROM P1, AND WHO CALLED IT.
   - Petra: the sheet fills the stage. Three cards take the height, and the
     six rings under each price are the hero, in the same six columns on every
     card, so the eye reads across them like a table with no lines.
   - Sol: a ring a tier opens is a solid disc of the accent with its mark in
     line on top (the mark stays a ring, the house rule; the disc is the flat
     fill he asked for). A ring a tier does not open is a grey outline. Solid
     against outline is a change of form, so colour is never the only sign.

     hue.

   one thing typed here is the fifth rung's NAME: the owner ruled on 17 October

   +'<li>'+endsSvg+'<span><span class="k">'+W.stop.ends+'</span><span class="v">'+W5.stop.ends+'</span></span></li>'
   +'<li>'+afterSvg+'<span><span class="k">'+W.stop.after+'</span><span class="v">'+W5.stop.after+'</span></span></li></ul>')
  +'<div class="acts">'+(done
    ?'<button class="go" type="button" data-act="close">'+W.close+'</button><button class="back" type="button" data-act="undo">'+W.stop.undo+'</button>'
    :'<button class="go" type="button" data-act="stopgo">'+W.stop.go+'</button><button class="back" type="button" data-act="change">'+W.stop.change+'</button>')
  +'</div>'+(REFUND?'<div class="foot"><p>'+W.foot2+'</p></div>':'')
  +'<p class="status" role="status" aria-live="polite" id="st"></p></div>';}

/* ---- the tooltip: hover, keyboard focus, or a tap. One box, reused. ---- */
let TIP=null,TIPON=null,TIPPIN=false;
function tipBox(){if(!TIP){TIP=document.createElement('div');TIP.className='tip5';TIP.setAttribute('role','tooltip');TIP.id='tip5';document.body.appendChild(TIP);}return TIP;}
function tipShow(el,pin){
 const b=tipBox();
 if(el.classList.contains('rg5')){const k=el.dataset.k;
  b.innerHTML='<b>'+WORD[k]+'</b><span class="m">'+MEAN[k]+'</span><span class="tl">'
   +(el.dataset.tl===W5.seeNow||el.dataset.tl==='Open on your gift'?staysSvg:lockSvg())+'<span>'+el.dataset.tl+'</span></span>';}
 else b.innerHTML='<span class="m">'+document.getElementById(el.dataset.tip5).textContent+'</span>';
 b.classList.add('on');TIPON=el;TIPPIN=!!pin;
 const r=el.getBoundingClientRect(),w=Math.min(300,innerWidth-24);b.style.width=w+'px';
 const L=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2));b.style.left=L+'px';
 const h=b.offsetHeight;let T=r.top-h-12,up=true;if(T<52){T=r.bottom+12;up=false;}b.style.top=T+'px';
 b.classList.toggle('up',up);b.classList.toggle('dn',!up);b.style.setProperty('--cx',Math.round(Math.max(18,Math.min(w-18,r.left+r.width/2-L)))+'px');
 $$('.rg5.tipped,.hl.tipped,.pn.tipped').forEach(x=>x.classList.remove('tipped'));el.classList.add('tipped');}
function tipHide(){if(TIP)TIP.classList.remove('on');if(TIPON)TIPON.classList.remove('tipped');TIPON=null;TIPPIN=false;}
let WIRED5=false;
function wire(root){
 tipHide();
 $$('.rg5,[data-tip5]',root).forEach(el=>{
  el.addEventListener('mouseenter',()=>{if(!TIPPIN)tipShow(el,false);});
  el.addEventListener('mouseleave',()=>{if(!TIPPIN&&TIPON===el)tipHide();});
  el.addEventListener('focus',()=>tipShow(el,false));
  el.addEventListener('blur',()=>{if(TIPON===el&&!TIPPIN)tipHide();});
  el.addEventListener('click',e=>{if(el.dataset.act)return;e.stopPropagation();
   if(TIPON===el&&TIPPIN)tipHide();else tipShow(el,true);});});
 if(WIRED5)return;WIRED5=true;
 document.addEventListener('click',e=>{if(TIPON&&!e.target.closest('.rg5,[data-tip5],.tip5'))tipHide();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&TIPON)tipHide();});
 window.addEventListener('resize',tipHide);}

</script>
