<!-- ============================================================
     THE BOOT GUARD, IN A SCRIPT BLOCK OF ITS OWN.

     It was written inside the main block, which made it useless against the
     failure it was written for. The whole instrument is ONE script tag: a
     syntax error anywhere in it stops the browser parsing the entire block,
     so nothing in that block runs, including a guard sitting at the top of
     it. The app would be dead and the guard would be dead with it, which is
     exactly what the owner kept seeing.

     A separate tag is parsed and run independently. A parse error in the main
     block now leaves this one alive to say so.

     And <noscript> does not help here. It fires when scripts are turned OFF.
     With scripts on and a block that will not parse, the browser runs nothing
     and shows no notice, which is the silent version of the failure.
     ============================================================ -->
<script>
/* ============================================================
   THE BOOT GUARD. First thing in the script, before any data.

   The owner reported a build where the top navigation was gone, the centre
   did not render, and the left rail was there. That is the exact signature of
   a script that started and then threw: the rail is static markup in the
   document, and the tab bar and every surface are built by code.

   It could not be reproduced here. Seven viewport sizes, five shapes of
   stored profile including garbage, and scripts disabled: all of them either
   boot correctly or show the noscript notice. So the cause is something about
   his machine that this container does not have, and guessing at it is how
   two hours get spent on the wrong thing.

   What is wrong regardless of the cause is that the failure was SILENT. A
   half built shell looks like a product with missing features rather than
   like a crash, and a person cannot report what they cannot see. Every write
   that can fail reports through status(); a boot that fails has to report
   too, and it cannot use status() because status() may not exist yet.

   So: catch the first error, show it, and say what to send back. The message
   is plain DOM built by hand, with no dependency on anything this file loads
   after it, because everything after it is what might be broken.
   ============================================================ */
(function(){
 var BOOTED=false, SHOWN=false, AT='nothing had loaded yet';
 /* EVERY MODULE SAYS IT FINISHED. BUILD.sh writes one call to this after each
    file, so when the script stops the guard can name the module it stopped
    after instead of saying it stopped somewhere. */
 window.__at=function(f){AT=f;};
 /* the app calls this at the end of its own init, and hands over anything
    that failed along the way. */
 window.__bootOk=function(failed){
  BOOTED=true;
  /* A PARTIAL START UP IS NOT A DEAD APP AND MUST NOT BE SHOUTED AT LIKE ONE.
     The start up runs in guarded steps now, so it can lose the rail sections
     and still put a working instrument on screen. A full screen message would
     be the wrong answer to that. It goes in the console and on a quiet line
     the person can press, and the product stays usable. */
  if(failed&&failed.length)quiet(failed);};
 /* the quiet version. one line, bottom of the screen, dismissible. */
 function quiet(failed){
  try{
   var d=document.createElement('button');
   d.type='button';
   d.textContent=failed.length+' part'+(failed.length>1?'s':'')
    +' of this build did not start. Press to see which.';
   d.style.cssText='position:fixed;left:50%;bottom:14px;transform:translateX(-50%);'
    +'z-index:9998;background:#2A1F0B;color:#E8C36A;border:1px solid #5A4415;'
    +'border-radius:8px;padding:7px 13px;font:12px/1.4 system-ui,sans-serif;'
    +'cursor:pointer;max-width:92vw';
   d.onclick=function(){show(failed.join('  |  '),'after '+AT);};
   (document.body||document.documentElement).appendChild(d);
  }catch(e){}}
 function show(what,where){
  if(SHOWN)return; SHOWN=true;
  /* WAIT FOR THE DOCUMENT BEFORE JUDGING IT. An error inside the script block
     fires while the parser is still inside that block, so everything after it,
     including the end of file marker, does not exist yet. Checking then
     reported every syntax error as a truncated download, which is a guard
     lying about the thing it exists to identify, and that is worse than no
     guard at all.

     The message is not lost, it is held until the parser has finished, which
     is what readyState says. A second and a half is the ceiling in case the
     document never completes, because a person who cannot see the app should
     not also be made to wait for it. */
  if(document.readyState==='loading'){
   var fired=false;
   var go=function(){ if(fired)return; fired=true; paint(what,where); };
   document.addEventListener('DOMContentLoaded',go);
   setTimeout(go,1500);
   return;}
  paint(what,where);}
 function paint(what,where){
  try{
   var d=document.createElement('div');
   d.setAttribute('role','alert');
   d.style.cssText='position:fixed;inset:0;z-index:99999;background:#0E0E0F;'
    +'color:#E6E7EA;font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;'
    +'display:flex;align-items:center;justify-content:center;padding:32px;'
    +'-webkit-font-smoothing:antialiased';
   var box=document.createElement('div');
   box.style.cssText='max-width:62ch';
   var h=document.createElement('h1');
   h.textContent='This build stopped while it was starting up.';
   h.style.cssText='font-size:22px;margin:0 0 10px;font-weight:600;letter-spacing:-.01em';
   var p1=document.createElement('p');
   p1.textContent='The instrument is built in the browser, so when the script '
    +'stops early you are left looking at the frame: the left rail is in the '
    +'document, and the navigation and every surface are not. Nothing you have '
    +'entered is lost. It is still in this browser.';
   p1.style.cssText='margin:0 0 14px;color:#C9CBD2';
   var p2=document.createElement('p');
   p2.textContent='Send these lines back. They name the cause exactly, and the '
    +'first one says which build this actually is.';
   p2.style.cssText='margin:0 0 8px;color:#8A8C94;font-size:13.5px';
   var pre=document.createElement('pre');
   /* THE BUILD STAMP GOES FIRST. Two fixes went out and the same failure came
      back both times, and there was no way to tell whether the file being
      opened was the file that was sent. */
   var stamp='build unknown';
   try{var v=document.documentElement.getAttribute('data-build');
     if(v)stamp='build '+v;}catch(e){}
   /* WHAT ARRIVED AGAINST WHAT WAS SENT. A file that is cut short and a script
      that stopped running look identical from the inside: the instrument is
      not there and nothing threw. The end of file marker is the last element
      in the document, so if it is missing the file itself is short, which is a
      different problem with a different fix. */
   var eof=null, arrived='unknown';
   try{ eof=document.getElementById('eof');
     arrived=eof?('whole file, '+eof.getAttribute('data-len')+' bytes')
                :'THE FILE IS SHORT. The end of it never arrived.'; }catch(e){}
   pre.textContent=stamp+'\n'+arrived+'\nstopped after '+AT
    +'\n'+what+'\n'+where+'\n'+navigator.userAgent;
   pre.style.cssText='margin:0;padding:14px 16px;background:#141518;'
    +'border:1px solid #26282E;border-radius:10px;white-space:pre-wrap;'
    +'word-break:break-word;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;'
    +'color:#D6A93B;-webkit-user-select:text;user-select:text';
   /* AND SAY WHAT TO DO. The message named the failure precisely and then left
      the person holding it with nothing to try. The two causes have different
      answers and the guard already knows which one it is looking at, so it
      can give the right one instead of a general apology. */
   var p0=document.createElement('p');
   p0.textContent=eof
    ? 'Reload the page. The file itself is whole, so this is something that '
      +'happened while it was starting, and a second run often clears it.'
    : 'The file did not finish arriving, so there is nothing wrong with the '
      +'build. Save it to your machine and open it from there. A large file '
      +'viewed inside a preview pane is the usual way this happens.';
   p0.style.cssText='margin:0 0 14px;color:#E6E7EA;font-weight:500';
   box.appendChild(h);box.appendChild(p0);box.appendChild(p1);
   box.appendChild(p2);box.appendChild(pre);
   d.appendChild(box);
   (document.body||document.documentElement).appendChild(d);
   /* the boot sheet fades on a CSS animation whether or not scripts ran, so it
      has to be taken off by hand or it uncovers this and then covers it again */
   var bt=document.getElementById('boot'); if(bt)bt.style.display='none';
  }catch(e){
   /* if even that fails, the document is beyond help and the console is all
      that is left. Saying nothing is still not an option. */
   try{document.title='Atuned failed to start: '+what;}catch(e2){}}}
 window.addEventListener('error',function(e){
  if(BOOTED)return;                 /* after boot, a throw is not a dead app */
  show(String((e&&e.message)||'unknown error'),
       String((e&&e.filename)||'')+' line '+((e&&e.lineno)||'?'));});
 window.addEventListener('unhandledrejection',function(e){
  if(BOOTED)return;
  show('unhandled promise rejection: '+String((e&&e.reason&&e.reason.message)||e.reason||''),'');});
 /* AND A THROW IS NOT THE ONLY WAY TO FAIL. A script that is truncated, or
    that a browser refuses to parse past some point, never reaches the end and
    never throws at run time either. So the guard also checks, once, that the
    app said it finished. Eight seconds is past the boot sheet's own five and
    a bit, on a machine slower than any this has been measured on. */
 setTimeout(function(){
  if(BOOTED)return;
  var tb=document.getElementById('tabbar');
  show('the script never reached the end of its own start up',
       'navigation present: '+(tb&&tb.children.length?tb.children.length+' tabs':'none'));},8000);
})();

</script>
<script>
