<body>
<canvas id="bgaura" aria-hidden="true"></canvas>
<div class="app">
 <div class="glass top">
  <div class="brand">At&uuml;ned</div>
  <div id="tabbar" style="display:flex;gap:5px;flex-wrap:wrap"></div>
  <!-- One status region for the whole app. Polite so it does not interrupt,
       and it carries the message rather than a button lying about it. -->
  <div id="status" role="status" aria-live="polite"></div>
  <div class="spacer"></div>
  <label for="psel" class="toplab">Whose field</label>
  <select id="psel"></select>
  <div class="seg" id="themes"></div>
  <button class="vt" id="legible" type="button" aria-pressed="false"
   title="Atkinson Hyperlegible. Maximum character distinction.">Aa</button>
  <!-- Density. The owner found that the whole interface reads better scaled
       down in the browser, which is a real finding about this product and not
       about his monitor: there is more on screen than the type size assumes.
       Three steps rather than a slider, because three is a choice and a slider
       is a chore. Comfortable is what shipped. -->
  <div class="seg" id="density" role="group" aria-label="Density"></div>
  <button class="vt" id="profbtn" type="button" title="Your profile and settings">
   <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
    <circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg></button>
  <button class="vt" id="helpbtn" type="button" title="How to read this, and what everything means">
   <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
    <circle cx="12" cy="12" r="9.2"/><path d="M9.4 9.2a2.7 2.7 0 1 1 3.4 2.6c-.6.2-.9.7-.9 1.3v.7"/>
    <circle cx="12" cy="17.4" r="1"/></svg></button>
 </div>
 <div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheet-card"></div></div>
 <div class="glass subbar" id="subbar"><div id="vbar" style="display:flex;gap:5px"></div>
  <span class="zoomnote" id="zoomnote" style="display:none"></span></div>
 <div class="mid">

  <!-- ============ LEFT RAIL ============ -->
  <div class="col"><div class="glass card sc">
   <div class="lsec open" data-sec="soul">
    <button class="lsec-hd" type="button"><span>Awareness</span><i></i></button>
    <div class="lsec-bd">
     <!-- The subtitles came out on the owner's ruling. Every one of them was
          a definition sitting permanently under a heading a person reads once,
          and the definition belongs in the tooltip and the drill, where it is
          asked for. What is left is the name and the thing itself. -->
     <div class="tier1">0 &middot; Balance</div>
     <div class="polbar" id="polbar"></div>
     <div class="tier1" style="margin-top:18px">1 &middot; Root domains</div>
     <div style="display:flex;gap:5px;margin-bottom:14px" id="roots"></div>
     <div class="tier1">2 &middot; Blueprint domains</div>
     <div class="gdom" id="doms"></div><div class="cap" id="capD"></div>
     <div class="tier1" style="margin-top:18px">3 &middot; Primary</div>
     <div class="g6" id="ar1"></div>
     <div class="sub" style="margin-top:16px">Secondary</div>
     <div class="g6" id="ar2"></div><div class="cap" id="capA"></div>
    </div>
   </div>
   <div class="lsec" data-sec="fetters">
    <button class="lsec-hd" type="button"><span>Child fetters</span><i></i></button>
    <div class="lsec-bd">
     <div class="tier1">4 &middot; Child fetters <span>nine poled axes, held state then coherent opposite</span></div>
     <div class="bulk"><label for="allCh">held</label><input type="range" id="allCh" min="0" max="10" step="0.5" value="3"></div>
     <div class="bulk"><label for="allRep">opposite</label><input type="range" id="allRep" min="0" max="10" step="0.5" value="0"></div>
     <div id="chg"></div>
    </div>
   </div>
   <div class="lsec" data-sec="spirit">
    <button class="lsec-hd" type="button"><span>Spiritual states</span><i></i></button>
    <div class="lsec-bd"><div id="spirit"></div></div>
   </div>
   <div class="lsec" data-sec="matrix">
    <button class="lsec-hd" type="button"><span>The matrix</span><i></i></button>
    <div class="lsec-bd">
     <div class="lbl">19 domains &times; 9 child fetters</div>
     <div class="mx" id="mx"></div>
     <div class="mxk" id="mxk"></div>
    </div>
   </div>
  </div></div>

  <!-- ============ STAGE ============ -->
  <div class="glass stage" id="stage">
   <!-- the key comes first in flow so it sits above the canvas -->
   <div class="key" id="key" aria-label="What you are looking at"></div>
   <canvas id="cv" role="img" aria-label="The field wheel. Every element is also listed in the panels either side."></canvas>
   <div id="emap" class="emap"></div>
   <div id="iq" class="iq"></div>
   <div id="know" class="iq"></div>
   <div id="games" class="iq"></div>
   <div id="deck" class="rel"></div>
   <div id="story" class="iq"></div>
   <div id="sum" class="iq"></div>
   <div id="ana" class="iq"></div>
   <div id="rel" class="rel"></div>
   <div id="rit" class="rel"></div>
   <div class="tl"><b id="tier">-</b><div id="pol"></div></div>
   <div class="probe" id="probe"></div>
   <div class="howto" id="howto"></div>
   <button class="bal" id="bal" aria-label="Balance. Which way the field discharges. Opens the reading."></button>
   <div class="acc" id="acc"></div>
   <button class="pol2" id="pol2" aria-label="The compass. Where coherence sits and how far it swings. Opens the reading."></button>
  </div>

  <!-- ============ RIGHT RAIL ============ -->
  <!-- The rail was nine blocks in one scroll with no labels and nothing that
       folded. The reading alone was 860px pinned above an 826px viewport, so
       clicking a node put the answer 668px down and mostly below the fold,
       with nothing on screen saying anything had happened.

       One line stays pinned and is always true. Everything with detail is a
       named section that folds, one open at a time. Selection unfolds itself
       when the wheel is clicked. -->
  <div class="col"><div class="glass card sc">
   <div id="railtop" class="railtop"></div>

   <div class="lsec open" data-rail="right" data-sec="you">
    <button class="lsec-hd" type="button"><span>The reading</span><i></i></button>
    <div class="lsec-bd">
     <div class="person" id="person"></div>
     <div class="stack" id="stack"></div>
     <div class="rows" id="rows"></div>
    </div>
   </div>

   <div class="lsec" data-rail="right" data-sec="sel">
    <button class="lsec-hd" type="button"><span>Selection</span><i></i></button>
    <div class="lsec-bd">
     <div id="rdrill" style="display:none"></div>
     <div id="rdrill-none" class="rel-note">Nothing selected. Click an address, a law, a saboteur or the core.</div>
    </div>
   </div>

   <div class="lsec" data-rail="right" data-sec="flow">
    <button class="lsec-hd" type="button"><span>Flow through</span><i></i></button>
    <!-- the energy shelf. the original computed this every frame and then
         dropped it on the floor, because no element with this id existed. -->
    <div class="lsec-bd"><div id="eshelf"></div><div id="run"></div></div>
   </div>

   <div class="lsec" data-rail="right" data-sec="running">
    <button class="lsec-hd" type="button"><span>What is running</span><i></i></button>
    <div class="lsec-bd"><div id="fire"></div></div>
   </div>

   <div class="lsec" data-rail="right" data-sec="laws">
    <button class="lsec-hd" type="button"><span>21 laws of integrity</span><i></i></button>
    <div class="lsec-bd">
     <div class="bulk"><label for="allLaw">all</label><input type="range" id="allLaw" min="0" max="10" step="0.5" value="6"></div>
     <div id="laws"></div>
    </div>
   </div>

   <div style="display:flex;gap:7px;margin-top:14px"><button class="btn pri" id="bRel">Run a release</button></div>
  </div></div>
 </div>
</div>
<script>
