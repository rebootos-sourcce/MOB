<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atuned test</title>
<meta name="description" content="A hundred questions, one at a time, scored against the 21 laws of integrity.">
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
 font-family:var(--sans);-webkit-text-size-adjust:100%}
body{font-size:17px;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 56px}

/* ---- the bar. It fills. It never states a count, because a count is a
   number to dread and the ruling on the onboarding was one button forward. ---- */
.top{position:sticky;top:0;background:var(--bg);padding:14px 0 12px;z-index:5}
.wm{font-size:14px;letter-spacing:.02em;color:var(--dim);font-weight:600}
.wm .um{position:relative;display:inline-block}
.wm .um::before,.wm .um::after{content:'';position:absolute;top:-.5em;
 width:.14em;height:.14em;border-radius:50%;background:var(--dim)}
.wm .um::before{left:.05em}
.wm .um::after{left:.36em}
/* THE TRACK WAS INVISIBLE. --sunk against --bg is a fifth of a stop, so on
   the first screen the bar had no frame and the fill had nothing to fill.
   Measured on the shot, not read off the sheet. */
.bar{height:4px;background:var(--panel-2);border-radius:2px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;
 transition:width .22s ease}

/* ---- one question per screen ---- */
.card{min-height:58vh;display:flex;flex-direction:column;justify-content:center;
 padding:26px 0 8px}
.q{font-size:27px;line-height:1.32;letter-spacing:-.015em;margin:0 0 26px;font-weight:500}
.opts{display:grid;gap:9px}
button.opt{display:block;width:100%;text-align:left;min-height:54px;
 background:var(--panel);color:var(--ink);border:1px solid var(--edge);
 border-radius:9px;padding:14px 18px;font:inherit;font-size:17px;cursor:pointer}
button.opt:hover{background:var(--panel-2);border-color:var(--edge-2)}
button.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.opt.on{border-color:var(--accent);background:var(--panel-2)}
button.opt.on::after{content:'';float:right;width:9px;height:9px;border-radius:50%;
 background:var(--accent);margin-top:5px}
.under{display:flex;gap:18px;align-items:center;margin-top:22px;
 font-size:14px;color:var(--dim);flex-wrap:wrap}
button.lnk,a.lnk{background:none;border:0;color:var(--mid);font:inherit;font-size:14px;
 text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 0;
 min-height:36px}
button.lnk:hover,a.lnk:hover{color:var(--ink)}
.fail{margin-top:10px;font-size:14px;color:var(--bad)}

/* ---- the opening ---- */
.open h1{font-size:34px;line-height:1.12;letter-spacing:-.02em;margin:34px 0 0;font-weight:600}
.open p{color:var(--mid);margin:16px 0 0}
.open .lead{color:var(--ink);font-size:20px;line-height:1.45}
.pri{display:inline-block;background:var(--accent);color:var(--on-accent);
 border:0;border-radius:9px;padding:16px 32px;font:inherit;font-size:18px;
 font-weight:600;min-height:54px;cursor:pointer;text-decoration:none;margin-top:26px}
.pri:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.eye{display:block;font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;
 color:var(--accent);margin:0 0 10px}

/* ---- the reading ---- */
.read h1{font-size:30px;line-height:1.16;letter-spacing:-.02em;margin:0;font-weight:600}
.read h2{font-size:22px;margin:0;letter-spacing:-.015em;font-weight:600}
.read section{margin-top:44px;padding-top:26px;border-top:1px solid var(--edge)}
.read p{margin:14px 0 0}
.cq{display:flex;align-items:baseline;gap:14px;margin-top:22px}
.cq b{font-family:var(--num);font-size:68px;line-height:.9;letter-spacing:-.03em;
 font-weight:600}
.cq span{font-size:19px;font-weight:600}
.tierbox{margin-top:18px;border:1px solid var(--edge-2);border-radius:10px;
 background:var(--panel);padding:16px 18px}
.tierbox dl{margin:0}
.tierbox dt{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
 color:var(--dim);margin-top:12px}
.tierbox dt:first-child{margin-top:0}
.tierbox dd{margin:4px 0 0}
.seats{list-style:none;margin:22px 0 0;padding:0}
.seats li{display:flex;align-items:center;gap:10px;padding:6px 0}
.seats li b{flex:0 0 74px;font-size:13px;font-weight:600;color:var(--mid)}
.seats li .tr{flex:1 1 auto;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.seats li .tr i{display:block;height:100%;border-radius:4px}
.seats li em{flex:0 0 40px;text-align:right;font-family:var(--num);font-size:13px;
 font-style:normal;color:var(--mid)}
.laws{list-style:none;margin:20px 0 0;padding:0}
.laws li{display:flex;align-items:center;gap:10px;padding:8px 0;
 border-bottom:1px solid var(--edge)}
.laws li b{flex:0 0 132px;font-weight:600;font-size:15px}
.laws li .tr{flex:1 1 auto;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.laws li .tr i{display:block;height:100%;border-radius:4px}
.laws li em{flex:0 0 34px;text-align:right;font-family:var(--num);font-size:13px;
 font-style:normal;color:var(--mid)}
.sab{margin-top:20px;border:1px solid var(--edge);border-radius:10px;
 background:var(--panel);padding:16px 18px}
.sab h3{margin:0;font-size:18px;font-weight:600}
.sab .fam{font-size:13px;color:var(--dim);margin-top:3px}
.sab p{margin:10px 0 0;color:var(--mid);font-size:16px}
.sab .said{margin-top:12px;padding-left:12px;border-left:2px solid var(--edge-2);
 color:var(--ink);font-style:italic}
.sab .addr{margin-top:12px;font-size:14px;color:var(--dim)}
.sab .addr b{color:var(--mid);font-weight:600}
.sab .out{margin-top:12px;font-size:15px;color:var(--mid)}
.sab .out b{color:var(--ink);font-weight:600}
.scope{margin-top:22px;border:1px solid var(--edge);border-radius:10px;
 padding:14px 16px;font-size:15px;color:var(--mid)}
.scope b{color:var(--ink)}
.door{margin-top:44px;padding:22px 18px 24px;border:1px solid var(--accent);
 border-radius:10px;background:var(--panel)}
.door h2{margin-bottom:0}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
button.act{background:var(--panel-2);color:var(--ink);border:1px solid var(--edge-2);
 border-radius:9px;padding:14px 20px;font:inherit;font-weight:600;min-height:52px;cursor:pointer}
button.act.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.act:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.note{margin-top:12px;font-size:14px;color:var(--dim)}
.close{margin-top:44px;padding-top:26px;border-top:1px solid var(--edge-2)}
.close p{font-size:23px;line-height:1.38;margin:0;letter-spacing:-.01em}
.close .last{color:var(--accent)}
.foot{margin-top:40px;font-size:13px;color:var(--dim)}
@media(max-width:400px){
 .q{font-size:22px} .read h1{font-size:25px} .cq b{font-size:54px}
 .laws li b{flex-basis:104px} .close p{font-size:19px}
 .seats li b{flex-basis:64px}
}
</style></head><body>
<div class="wrap">
 <div class="top">
  <div class="wm">At<span class="um">u</span>ned</div>
  <div class="bar"><i id="fill" style="width:0"></i></div>
 </div>
 <div id="app"></div>
</div>

<!-- THE ENGINE IS REFERENCED, NOT COPIED. engine.js is the DOM free half of
     the product and a build product of atuned_src. A copy pasted into this
     page is correct on the day it is pasted and silently wrong afterwards,
     which is the defect this repository has been bitten by seven times. It is
     a local sibling of the funnel directory, so nothing is fetched off the
     machine this page is opened on. -->
<script src="../engine.js"></script>
<script src="questions.js"></script>
<script>
/* ============================================================
   THE TEST. Three states: the opening, one question, the reading.
   Nothing here computes a reading of its own. The hundred answers
   become 21 law values and 9 charge values, and the engine does the
   rest, because a second arithmetic that agrees with the first on
   the day it is written is a second arithmetic that drifts.
   ============================================================ */
var el=document.getElementById('app'), fill=document.getElementById('fill');
var esc=function(s){return String(s==null?'':s)
 .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};

/* ---- THE LOAD IS CHECKED OUT LOUD. A missing engine or a missing question
   table must look like a failure and not like an empty page. ---- */
var MISSING=[];
if(typeof SINAMES==='undefined'||typeof read!=='function')MISSING.push('engine.js');
if(typeof QQ==='undefined')MISSING.push('questions.js');
/* A law named in the questions that the engine does not carry would be scored
   on fewer points than this page claims. It is refused by name. */
var UNKNOWN=[];
if(!MISSING.length){
 QQ.forEach(function(q){ if(SINAMES.indexOf(q.l)<0&&UNKNOWN.indexOf(q.l)<0)UNKNOWN.push(q.l);
  if(!CHILD.some(function(c){return c.nm===q.c;})&&UNKNOWN.indexOf(q.c)<0)UNKNOWN.push(q.c); });}

/* ---- THE ORDER. Grouped by law in the file so a reviewer can read a law's
   whole set together, served one law at a time so nobody answers five
   questions about the same thing in a row and starts pattern matching. The
   first sweep touches every law, which is what makes a reading available to
   somebody who stops early. ---- */
function serveOrder(){
 var byLaw={};
 QQ.forEach(function(q,i){ (byLaw[q.l]=byLaw[q.l]||[]).push(i); });
 var out=[],p=0,more=true;
 while(more){ more=false;
  SINAMES.forEach(function(l){ var g=byLaw[l]||[];
   if(g[p]!=null){ out.push(g[p]); more=true; } });
  p++; }
 return out;}

var ORDER=MISSING.length?[]:serveOrder();
var KEY='atuned.quiz.v2';
var A={};              /* question index -> 0..4 */
var AT=0;              /* position in ORDER */
var STATE='open';
var SAVE_FAIL='';

function save(){
 try{ localStorage.setItem(KEY,JSON.stringify({a:A})); SAVE_FAIL=''; }
 catch(e){ SAVE_FAIL='This browser will not keep your answers. Finish in one sitting.'; }}
function load(){
 try{ var r=localStorage.getItem(KEY); if(r){ var o=JSON.parse(r)||{}; A=o.a||{}; } }
 catch(e){ A={}; }}
function answered(){ var n=0; for(var k in A)if(A[k]!=null)n++; return n; }
function firstOpen(){
 for(var i=0;i<ORDER.length;i++)if(A[ORDER[i]]==null)return i;
 return ORDER.length; }

/* ============================================================
   SCORING. A hundred points, each one a law and a charge axis.
   Never is the law closed and nothing held. Always is the law
   open and the axis loaded. The map is linear across the five,
   because a five step scale has no honest curve in it.
   ============================================================ */
function scored(){
 var lawSum={},lawN={},chgSum={},chgN={},n=0;
 QQ.forEach(function(q,i){
  var a=A[i]; if(a==null)return; n++;
  lawSum[q.l]=(lawSum[q.l]||0)+(10-a*2.5); lawN[q.l]=(lawN[q.l]||0)+1;
  chgSum[q.c]=(chgSum[q.c]||0)+(a*2.5);    chgN[q.c]=(chgN[q.c]||0)+1;});
 var p=blankProfile('test');
 var laws=[];
 SINAMES.forEach(function(l){
  if(!lawN[l])return;                    /* not yet touched stays null, not zero */
  var v=Math.round(lawSum[l]/lawN[l]*10)/10;
  p.laws[l]=v;
  laws.push({nm:l,v:v,n:lawN[l],b:(SI.filter(function(x){return x.nm===l;})[0]||{}).b});});
 CHILD.forEach(function(c){
  p.axes[c.nm]={held: chgN[c.nm]?Math.round(chgSum[c.nm]/chgN[c.nm]*10)/10:0, opp:0};});
 return {p:p, laws:laws, answered:n};}

/* THE SAME SABOTEUR ARCHITECTURE CAN BE REPORTED UNDER TWO NAMES WHEN IT SITS
   ON THE SAME ADDRESSES AND THE SAME WEIGHT, which measured as two identical
   cards side by side on a flat field. One card per set of addresses. */
function topSabs(r,max){
 var seen={},out=[];
 r.sabs.forEach(function(s){
  if(out.length>=max)return;
  var sig=s.parts.map(function(n){return n.i;}).sort().join(',')+'|'+s.w.toFixed(2);
  if(seen[sig])return; seen[sig]=1; out.push(s);});
 return out;}

/* ============================================================
   VIEWS
   ============================================================ */
function viewRefusal(){
 return '<div class="open"><h1>This page did not load completely.</h1>'
  +'<p>Missing: '+esc((MISSING.concat(UNKNOWN)).join(', '))+'. '
  +'The test cannot be scored without it and will not guess. '
  +'Serve this page from the funnel directory beside the engine.</p></div>';}

function viewOpen(){
 var done=answered();
 return '<div class="open">'
 +'<span class="eye">The test</span>'
 +'<h1>A hundred questions about how you actually live.</h1>'
 +'<p class="lead">One at a time. They are scored against the 21 laws of '
 +'integrity, which is the same table the instrument itself runs on.</p>'
 +'<p>Some of them will be uncomfortable to answer honestly, because they are '
 +'about things that happened rather than about the kind of person you are. '
 +'Answer them the way your week actually went.</p>'
 +'<p>At the end you get your coherence, the laws that are thinnest, the '
 +'saboteurs that are running, and where in the body the load is sitting.</p>'
 +'<button class="pri" id="go">'+(done?'Carry on':'Start')+'</button>'
 +(done?'<div class="under"><button class="lnk" id="restart">Start again from the top</button></div>':'')
 +'<p class="foot">Nothing you answer leaves this browser. This page makes no '
 +'request of any kind.</p></div>';}

function viewQ(){
 var qi=ORDER[AT], q=QQ[qi], cur=A[qi];
 var h='<div class="card"><p class="q">'+esc(q.q)+'</p><div class="opts">';
 QSCALE.forEach(function(lab,v){
  h+='<button class="opt'+(cur===v?' on':'')+'" data-v="'+v+'">'+esc(lab)+'</button>';});
 h+='</div><div class="under">';
 if(AT>0)h+='<button class="lnk" id="back">Change the one before</button>';
 if(answered()>=SINAMES.length)h+='<button class="lnk" id="stop">Read it from here</button>';
 h+='</div>'+(SAVE_FAIL?'<p class="fail">'+esc(SAVE_FAIL)+'</p>':'')+'</div>';
 return h;}

function viewRead(){
 var s=scored(), out=read(s.p), r=out.reading;
 var laws=s.laws.slice().sort(function(a,b){return a.v-b.v;});
 var thin=laws.slice(0,5), held=laws.slice(-3).reverse();
 var t=TIER_BY?TIER_BY[r.tier]:null;
 if(!t)t=TIERDEF.filter(function(x){return x.nm===r.tier;})[0]||{};
 var sabs=topSabs(r,4);
 var seatvar={'Root':'--root','Sacral':'--sacral','Solar':'--solar','Heart':'--heart',
  'Throat':'--throat','3rd Eye':'--eye','Crown':'--crown'};
 var cv=function(b){return 'var('+(seatvar[b]||'--accent')+')';};

 /* THE BAND STRIP. Mean load per seat, off the same field the engine read.
    This is the proof, not a decoration: it is the instrument's own arithmetic
    printed before anybody has paid for anything. */
 var bandload=BANDS.map(function(b){
  var g=W.filter(function(n){return n.b===b;});
  return {b:b, v:g.reduce(function(a,n){return a+n.sq;},0)/g.length};});

 var h='<div class="read">'

 /* ---- 1. THE SNAPSHOT OF IMPACT ---- */
 +'<span class="eye">The snapshot</span>'
 +'<h1>This is what the hundred read.</h1>'
 +'<div class="cq"><b>'+Math.round(r.CQ)+'</b><span>'+esc(r.tier)+'</span></div>'
 +'<p>That is your coherence. One hundred is every law closed with nothing held '
 +'in the body. Coherence is the alignment between what arrives, how you read it, '
 +'what you intend, and what you then do.</p>'
 +'<p>When it is low the circuit leaks, and the leak is what promotes mental, '
 +'physical and spiritual disease. That is the mechanism, and it is the reason '
 +'this instrument exists.</p>'
 +'<div class="tierbox"><dl>'
 +'<dt>What '+esc(r.tier)+' means</dt><dd>'+esc(t.def||'')+'</dd>'
 +'<dt>What it does to a day</dt><dd>'+esc(t.energy||'')+'</dd>'
 +'<dt>'+towardLabel(t.toward)+'</dt><dd>'+esc(t.toward||'')+'</dd>'
 +'</dl></div>'

 /* ---- 2. WHAT THE ISSUES ARE ---- */
 +'<section><span class="eye">The issues</span>'
 +'<h2>Where it is thinnest.</h2>'
 +'<p>Each law is scored on its own points. These are the ones carrying the least, '
 +'and they are where the leak is.</p>'
 +'<ul class="laws">'+thin.map(lawRow).join('')+'</ul>'
 +'<p>Holding best: '+held.map(function(l){return esc(l.nm);}).join(', ')+'.</p>'
 +'<h2 style="margin-top:34px">Where the load is sitting.</h2>'
 +'<p>The nine charges from your answers land on the 112 addresses, each one '
 +'seated at a named plexus or nerve. This is the mean load per seat.</p>'
 +'<ul class="seats">'+bandload.map(function(x){
   return '<li><b>'+esc(x.b)+'</b><span class="tr"><i style="width:'
    +(Math.min(100,x.v*10))+'%;background:'+cv(x.b)+'"></i></span><em>'
    +x.v.toFixed(1)+'</em></li>';}).join('')+'</ul>'
 +'<p>'+esc(r.darkB)+' is carrying the most. '
 +(r.heaviest?('The heaviest single address is '+esc(r.heaviest.k)+', at the '
   +esc(r.heaviest.n||'field')+'. '):'')
 +r.carrying.length+' addresses are carrying something, and '+r.loaded.length
 +' of them are above the line where it starts to cost.</p>'
 +'</section>'

 /* ---- 3. WHICH SABOTEURS ARE RUNNING ---- */
 +'<section><span class="eye">What is running</span>'
 +'<h2>'+(sabs.length?'The saboteurs your answers have lit.':'No saboteur is firing hard enough to name.')+'</h2>'
 +(sabs.length
   ?'<p>A saboteur is a contraction of several addresses acting together. These '
    +'are the ones running hardest, with the addresses each one runs on.</p>'
    +sabs.map(sabCard).join('')
    +(r.sabs.length>sabs.length
      ?'<p>'+(r.sabs.length-sabs.length)+' more are firing under these, and they '
       +'compound into '+r.cxs.length+' complexes. The instrument names all of '
       +'them and works out the order to take them apart in.</p>':'')
   :'<p>Charge is present and no cluster has reached the weight where the '
    +'instrument will name one. That is a real result and not an empty one.</p>')
 +'</section>'

 /* ---- THE SCOPE. What this read and what it did not. ---- */
 +'<div class="scope"><b>What this is.</b> A hundred points on the 21 laws, and '
 +'the nine charges those points imply. It has not read a story in your own words, '
 +'which is where the instrument gets its resolution, so the body locations above '
 +'are where this kind of load sits rather than a reading of your tissue. It reads '
 +'self report. A clinician reads a person, and those are different jobs.</div>'

 /* ---- 4. THE DOOR ---- */
 +'<div class="door"><span class="eye">The door</span>'
 +'<h2>Take the record with you.</h2>'
 +'<p>There is no account and no server, so nothing here can be fetched later by '
 +'anybody, including us. Save the record, open Atuned, and the reading carries on '
 +'from where this stopped: your story, the ritual, the body map, the avatar, and '
 +'every table this page just used.</p>'
 +'<div class="acts">'
  +'<button class="act go" id="dl">Save my record</button>'
  +'<button class="act" id="copy">Copy it instead</button>'
  +'<button class="act" id="again">Change an answer</button>'
 +'</div><p class="note" id="dlnote"></p></div>'

 +'<div class="close">'
 +'<p>No one is coming to save you.</p><p>Do it yourself.</p>'
 +'<p>The software is the key and the roadmap.</p>'
 +'<p class="last">You are the door.</p></div>'

 +'<p class="foot">Answered: '+s.answered+' of the hundred points.</p>'
 +'</div>';
 return h;

 /* the ladder name is data, so whether `toward` begins with one is asked of the
    data and not guessed from the sentence. */
 function towardLabel(txt){
  var lead=TIERDEF.some(function(x){return String(txt||'').indexOf(x.nm)===0;});
  return lead?'The next reading up, and how it is reached':'The direction out';}
 function lawRow(l){
  return '<li><b>'+esc(l.nm)+'</b><span class="tr"><i style="width:'+(l.v*10)
   +'%;background:'+cv(l.b)+'"></i></span><em>'+l.v.toFixed(1)+'</em></li>';}

 /* EVERY NAME THIS PAGE PUTS ON A PERSON CARRIES A DEFINITION, THE BEHAVIOUR IT
    PRODUCES AND THE DIRECTION OUT. A word like Catastrophizer with nothing
    attached is a judgement. The family line and the addresses are always
    available; the sentence it says and the way out come from the engine's own
    saboteur table when it carries an entry for that name. */
 function sabCard(s){
  var d=(typeof SABDEF!=='undefined'&&SABDEF)?SABDEF[s.nm.toLowerCase()]:null;
  var fam=HCX_LIB.filter(function(x){return x.nm===s.hcx;})[0];
  var famline=fam?fam.d:(FAM_POLE_NOTE(s));
  var h='<div class="sab"><h3>'+esc(s.nm)+'</h3>'
   +'<div class="fam">'+esc(s.hcx)+': '+esc(famline)+'</div>';
  if(d&&d.d)h+='<p>'+esc(firstSentences(d.d,2))+'</p>';
  if(d&&d.q)h+='<div class="said">'+esc(d.q.split(' / ')[0])+'</div>';
  h+='<div class="addr"><b>It runs on:</b> '+s.parts.slice(0,4).map(function(n){
   return esc(n.k)+(n.n?' at the '+esc(n.n):'');}).join('. ')+'.</div>';
  if(d&&d.t)h+='<div class="out"><b>It fires when:</b> '+esc(firstSentences(d.t,1))+'</div>';
  h+='<div class="out"><b>The way out:</b> '
   +(d&&d.i?esc(firstSentences(d.i,2))
          :'The addresses above, one at a time. The instrument has a direction '
           +'for each one and an order to take them in.')+'</div>';
  return h+'</div>';}
 function FAM_POLE_NOTE(s){ return 'the cure for this, done past the point where it helps'; }
 /* NO LOOKBEHIND. It is unsupported in enough shipped browsers that a
    saboteur card would throw instead of printing, and a card that throws
    takes the whole reading with it. */
 function firstSentences(txt,n){
  var t=String(txt), out=[], start=0, count=0;
  for(var i=0;i<t.length&&count<n;i++){
   if(t.charAt(i)==='.'){ out.push(t.slice(start,i+1)); start=i+1; count++;
    while(t.charAt(start)===' ')start++; i=start-1; } }
  return (out.length?out.join(' '):t).trim();}}

/* the record a person carries out. It is a profile the app's own boundary
   accepts, so nothing has to be translated on the way in. */
function recordJSON(){ return JSON.stringify(saveProfile(scored().p),null,1); }

/* ============================================================
   RENDER
   ============================================================ */
function render(){
 if(MISSING.length||UNKNOWN.length){ el.innerHTML=viewRefusal(); fill.style.width='0'; return; }
 el.innerHTML = STATE==='open'?viewOpen() : STATE==='q'?viewQ() : viewRead();
 fill.style.width = (STATE==='read'?100:(answered()/QQ.length*100))+'%';
 var b;
 if((b=document.getElementById('go')))b.onclick=function(){
  AT=firstOpen();
  if(AT>=ORDER.length){STATE='read';}else{STATE='q';}
  render(); scrollTo(0,0);};
 if((b=document.getElementById('restart')))b.onclick=function(){
  A={}; save(); AT=0; STATE='q'; render(); scrollTo(0,0);};
 if((b=document.getElementById('back')))b.onclick=function(){
  AT=Math.max(0,AT-1); render(); scrollTo(0,0);};
 if((b=document.getElementById('stop')))b.onclick=function(){
  STATE='read'; render(); scrollTo(0,0);};
 if((b=document.getElementById('again')))b.onclick=function(){
  AT=0; STATE='q'; render(); scrollTo(0,0);};
 if((b=document.getElementById('dl')))b.onclick=function(){
  var note=document.getElementById('dlnote');
  try{
   var blob=new Blob([recordJSON()],{type:'application/json'});
   var u=URL.createObjectURL(blob), a=document.createElement('a');
   a.href=u; a.download='atuned-record.json'; document.body.appendChild(a); a.click();
   a.remove(); setTimeout(function(){URL.revokeObjectURL(u);},1000);
   note.textContent='Saved as atuned-record.json. Open Atuned and load it from Settings.';
  }catch(e){ note.textContent='This browser would not save the file. Use copy instead.'; }};
 if((b=document.getElementById('copy')))b.onclick=function(){
  var note=document.getElementById('dlnote'), txt=recordJSON();
  var ok=function(){note.textContent='Copied. Paste it into Atuned under Settings.';};
  var no=function(){note.textContent='This browser would not copy it. Use save instead.';};
  try{ if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(txt).then(ok,no);
       else no(); }catch(e){ no(); }};
 /* ONE TAP IS THE ANSWER AND THE STEP FORWARD. There is no second button to
    press, which is the ruling on the onboarding: one button to move forward. */
 Array.prototype.forEach.call(el.querySelectorAll('.opt'),function(n){
  n.onclick=function(){
   A[ORDER[AT]]=+n.dataset.v; save();
   if(AT+1>=ORDER.length){ STATE='read'; }else{ AT++; }
   render(); scrollTo(0,0);};});}

load(); render();
</script></body></html>
